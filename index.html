<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#05030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#160b27;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --muted:#a999b0;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(138,77,255,.35),
      transparent 36%
    ),
    radial-gradient(
      circle at 0 45%,
      rgba(255,22,216,.13),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 55%,
      rgba(25,234,255,.10),
      transparent 30%
    ),
    #05030b;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    14px;

  background:rgba(5,3,11,.94);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border-bottom:
    1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-style:italic;

  font-size:
    clamp(65px,18vw,115px);

  line-height:.78;

  letter-spacing:7px;

  transform:skewX(-7deg);

  color:#fff;

  text-shadow:
    0 0 4px #fff,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;

  text-align:center;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:4px;

  text-shadow:0 0 10px var(--cyan);
}

/* =========================
   SEARCH
========================= */

.searchbar{
  display:flex;
  gap:8px;

  max-width:900px;

  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;

  padding:14px;

  border-radius:8px;

  background:#0c0715;

  color:white;

  border:
    1px solid rgba(138,77,255,.45);

  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 18px rgba(255,22,216,.18);
}

.searchbar button{
  padding:0 18px;

  border:0;
  border-radius:8px;

  color:white;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );
}

/* =========================
   MAIN
========================= */

main{
  width:100%;
  max-width:1400px;

  margin:auto;

  padding:16px 16px 105px;
}

.hero{
  position:relative;

  min-height:
    clamp(390px,58vh,600px);

  overflow:hidden;

  display:flex;
  align-items:flex-end;

  padding:
    clamp(25px,5vw,60px);

  border-radius:18px;

  border:
    1px solid rgba(255,22,216,.25);

  background:
    radial-gradient(
      circle at 75% 35%,
      rgba(25,234,255,.13),
      transparent 25%
    ),
    radial-gradient(
      circle at 70% 75%,
      rgba(255,22,216,.20),
      transparent 32%
    ),
    linear-gradient(
      110deg,
      #090511,
      #190c2e,
      #07121e
    );
}

.hero:before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(5,3,11,.98),
      rgba(5,3,11,.72) 50%,
      rgba(5,3,11,.05)
    );
}

.hero:after{
  content:"";

  position:absolute;
  inset:0;

  opacity:.10;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.18) 4px
    );
}

.hero-content{
  position:relative;
  z-index:3;

  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);

  font-size:10px;

  font-weight:900;

  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:
    clamp(46px,9vw,95px);

  line-height:.85;

  text-transform:uppercase;

  text-shadow:
    0 0 20px rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;

  line-height:1.6;

  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;

  gap:10px;

  margin-top:20px;
}

.primary,
.secondary{
  padding:13px 18px;

  border-radius:8px;

  font-weight:900;
}

.primary{
  border:0;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    0 0 18px rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);

  background:
    rgba(25,234,255,.04);

  border:
    1px solid rgba(25,234,255,.38);
}

/* =========================
   SECTIONS
========================= */

section{
  margin:32px 0;
}

.heading{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:15px;
  padding-bottom:10px;

  border-bottom:
    1px solid rgba(255,22,216,.18);
}

.heading h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:25px;

  letter-spacing:1px;
}

.heading span{
  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;
}

.empty{
  padding:28px 5px;

  color:var(--muted);

  font-size:13px;
}

.notice{
  padding:16px;

  border-radius:9px;

  background:
    rgba(255,22,216,.045);

  border:
    1px solid rgba(255,22,216,.17);

  color:#c8bacf;

  line-height:1.6;

  font-size:12px;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:13px;
}

.card{
  padding:0;

  overflow:hidden;

  text-align:left;

  color:white;

  background:
    linear-gradient(
      180deg,
      #170d27,
      #0d0717
    );

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:10px;
}

.card:hover{
  border-color:
    rgba(255,22,216,.55);

  box-shadow:
    0 0 18px rgba(255,22,216,.12);
}

.poster{
  display:block;

  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;

  background:#171027;
}

.card-info{
  padding:11px;
}

.card-title{
  font-size:14px;

  font-weight:850;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.card-sub{
  margin-top:5px;

  color:var(--muted);

  font-size:10px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.86);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:95vh;

  overflow:auto;

  padding:
    20px
    18px
    calc(30px + env(safe-area-inset-bottom));

  border-radius:
    22px 22px 0 0;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(138,77,255,.18),
      transparent 40%
    ),
    #0c0718;

  border-top:
    1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:27px;
}

.close{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#170d27;

  color:var(--cyan);

  border:
    1px solid rgba(25,234,255,.3);

  font-size:22px;
}

/* =========================
   DETAILS
========================= */

.details{
  display:grid;

  grid-template-columns:
    105px 1fr;

  gap:16px;
}

.details img{
  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;
}

.details p{
  color:#c3b5cb;

  line-height:1.55;

  font-size:13px;
}

.meta{
  color:var(--cyan);

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:7px;
}

/* =========================
   EPISODES
========================= */

.season-title{
  margin-top:24px;
  margin-bottom:10px;

  color:var(--pink);

  font-family:Impact, sans-serif;

  font-size:20px;
}

.episode{
  width:100%;

  display:flex;

  align-items:center;

  gap:12px;

  padding:13px;

  margin-bottom:8px;

  text-align:left;

  color:#fff;

  background:
    linear-gradient(
      100deg,
      #160b27,
      #0b0714
    );

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:9px;
}

.episode:hover{
  border-color:var(--cyan);

  box-shadow:
    0 0 15px rgba(25,234,255,.10);
}

.episode-number{
  min-width:42px;

  color:var(--cyan);

  font-weight:900;

  font-size:12px;
}

.episode-title{
  font-weight:850;

  font-size:13px;
}

.episode-meta{
  margin-top:4px;

  color:#8f8397;

  font-size:10px;
}

/* =========================
   SOURCES
========================= */

.source{
  width:100%;

  margin-top:9px;

  padding:14px;

  text-align:left;

  color:white;

  border-radius:10px;

  background:
    linear-gradient(
      100deg,
      #150c29,
      #0d0819
    );

  border:
    1px solid rgba(25,234,255,.15);

  transition:.18s;
}

.source:hover{
  border-color:var(--cyan);

  box-shadow:
    0 0 16px rgba(25,234,255,.14);
}

.source-top{
  display:flex;

  align-items:center;

  gap:12px;
}

.source-icon{
  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-shrink:0;

  border-radius:50%;

  color:var(--cyan);

  background:
    rgba(25,234,255,.08);

  font-weight:900;
}

.source-name{
  font-weight:900;

  font-size:13px;
}

.provider{
  margin-top:4px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;
}

/* =========================
   BADGES
========================= */

.badges{
  display:flex;

  flex-wrap:wrap;

  gap:6px;

  margin-top:10px;
}

.badge{
  display:inline-flex;

  align-items:center;

  min-height:22px;

  padding:3px 7px;

  border-radius:5px;

  background:
    rgba(255,255,255,.07);

  border:
    1px solid rgba(255,255,255,.10);

  color:white;

  font-size:8px;

  font-weight:900;

  letter-spacing:.4px;

  overflow:hidden;
}

.badge img{
  display:block;

  max-width:72px;
  max-height:22px;

  object-fit:contain;
}

.badge.text-only{
  color:#ddd;
}

.badge.warning{
  color:var(--yellow);

  border-color:
    rgba(255,212,90,.25);
}

.badge.ready{
  color:var(--green);

  border-color:
    rgba(66,255,176,.25);
}

.source-desc{
  margin-top:9px;

  color:#91859b;

  font-size:10px;

  line-height:1.5;
}

/* =========================
   STREAM INFO
========================= */

.stream-info{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:6px;

  margin-top:10px;
}

.stream-info-item{
  padding:7px 8px;

  border-radius:6px;

  background:
    rgba(255,255,255,.035);

  color:#a99cad;

  font-size:9px;
}

.stream-info-item strong{
  color:#fff;
}

/* =========================
   PLAYER
========================= */

.player-shell{
  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#000;

  border:
    1px solid rgba(25,234,255,.25);

  box-shadow:
    0 0 30px rgba(25,234,255,.08);
}

video{
  display:block;

  width:100%;

  max-height:70vh;

  background:#000;
}

iframe{
  display:block;

  width:100%;
  height:100%;

  border:0;

  background:#000;
}

.iframe-player{
  width:100%;

  aspect-ratio:16/9;

  background:#000;
}

.player-status{
  padding:11px 13px;

  background:#0e0818;

  border-top:
    1px solid rgba(255,255,255,.07);

  color:#aaa;

  font-size:11px;
}

.player-status.ready{
  color:var(--green);
}

.player-status.error{
  color:var(--red);
}

.player-controls{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:12px;
}

.player-button{
  padding:10px 13px;

  border-radius:7px;

  color:white;

  background:#170d27;

  border:
    1px solid rgba(255,255,255,.1);

  font-weight:800;

  font-size:11px;
}

.player-button.primary{
  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  border:0;
}

/* =========================
   SETTINGS
========================= */

.field{
  margin:18px 0;
}

.field label{
  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;

  text-transform:uppercase;
}

.field input{
  width:100%;

  padding:13px;

  border-radius:7px;

  background:#080510;

  color:white;

  border:
    1px solid rgba(138,77,255,.3);

  outline:none;
}

/* =========================
   NAV
========================= */

.nav{
  position:fixed;

  z-index:400;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  padding-bottom:
    env(safe-area-inset-bottom);

  display:flex;

  align-items:center;

  justify-content:space-around;

  background:
    rgba(8,5,17,.96);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-top:
    1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;

  background:none;

  color:#766a80;

  font-size:9px;

  letter-spacing:1px;
}

.nav button span{
  display:block;

  font-size:22px;

  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);

  text-shadow:
    0 0 10px var(--pink);
}

@media(min-width:700px){

  .grid{
    grid-template-columns:
      repeat(5,minmax(0,1fr));
  }

  .details{
    grid-template-columns:
      190px 1fr;
  }

  .details img{
    width:190px;
  }

  .stream-info{
    grid-template-columns:
      repeat(4,minmax(0,1fr));
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    SAUVE
  </div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>


<main id="main">

  <div class="hero">

    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Discover movies and television,
        explore episodes, compare sources,
        and attempt compatible playback
        directly inside SAUVE.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button
          class="secondary"
          onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>

    </div>

  </div>


  <section>

    <div class="heading">

      <h2>
        DISCOVER
      </h2>

      <span>
        SAUVE
      </span>

    </div>

    <div
      id="homeResults"
      class="empty">

      Loading…

    </div>

  </section>

</main>


<nav class="nav">

  <button
    class="active"
    onclick="goHome()">

    <span>⌂</span>
    HOME

  </button>

  <button
    onclick="focusSearch()">

    <span>⌕</span>
    SEARCH

  </button>

  <button
    onclick="openSettings()">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>


<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>


<script>

/* ============================================================
   CONFIG
============================================================ */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";


const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    ""

};


let currentStreams = [];

let currentPlayableStreams = [];

let currentPlayerIndex = 0;

let currentTitleType = "";

let currentTitleId = "";


/* ============================================================
   FUSION BADGES
   Based on the badge configuration supplied
============================================================ */

const FUSION_BADGES = [

  {
    name:"Remux",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/mono-remux.png",
    regex:/\bremux\b/i
  },

  {
    name:"BluRay",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/mono-bluray.png",
    regex:/\bblu[\s._-]?ray\b/i
  },

  {
    name:"WebDL",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/mono-webdl.png",
    regex:/\b(?:web[\s._-]?dl|webdl|webrip|web[\s._-]?rip)\b/i
  },

  {
    name:"SeaDex",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/mono-SeaDex.png",
    regex:/\b(?:seadex|best[\s._-]?release|alt[\s._-]?(?:best[\s._-]?)?release)\b/i
  },

  {
    name:"4K",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/4k.png",
    regex:/(?:2160p?|4k|uhd)/i
  },

  {
    name:"1080p",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/1080p.png",
    regex:/\b1080p?\b/i
  },

  {
    name:"720p",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/720p.png",
    regex:/\b720p?\b/i
  },

  {
    name:"DTS:X",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/dtsx.png",
    regex:/\bdts[\s._:-]?x\b/i
  },

  {
    name:"DTS-HD MA",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/dtshdma.png",
    regex:/\bdts[\s._-]?hd[\s._-]?ma\b/i
  },

  {
    name:"DTS-HD",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/dtshd.png",
    regex:/\bdts[\s._-]?hd\b/i
  },

  {
    name:"DTS",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/dts.png",
    regex:/\bdts\b/i
  },

  {
    name:"HDR10+",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/HDR10Plus.png",
    regex:/\bhdr[\s._-]?10[\s._-]?(?:\+|plus|p)\b/i
  },

  {
    name:"HDR10",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/HDR10.png",
    regex:/\bhdr[\s._-]?10\b/i
  },

  {
    name:"HDR",
    image:"https://raw.githubusercontent.com/9mousaa/BetterFormatter/main/images/HDR.png",
    regex:/\bhdr\b/i
  },

/* ============================================================
   HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}


function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}


function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(
      /\/manifest\.json\/?$/i,
      ""
    );

}


function addonRoot(url){

  return normalizeManifest(url) + "/";
}


async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  return response.json();

}


/* ============================================================
   BADGES
============================================================ */

function streamSearchText(stream){

  return [
    stream?.name,
    stream?.title,
    stream?.description,
    stream?.filename,
    stream?.fileName,
    stream?.url,
    stream?.quality,
    stream?.resolution,
    stream?.videoHash,
    stream?.behaviorHints?.filename
  ]
  .filter(Boolean)
  .join(" ");

}


function getFusionBadges(stream){

  const text =
    streamSearchText(stream);


  return FUSION_BADGES
    .filter(
      badge =>
        badge.regex.test(text)
    )
    .slice(0,12);

}


function renderBadges(stream){

  const badges =
    getFusionBadges(stream);


  if(!badges.length){

    return `
      <span class="badge text-only">
        SOURCE
      </span>
    `;

  }


  return badges
    .map(
      badge => `

        <span
          class="badge"
          title="${escapeHTML(
            badge.name
          )}">

          <img
            src="${escapeHTML(
              badge.image
            )}"
            alt="${escapeHTML(
              badge.name
            )}"
            loading="lazy"
            onerror="
              this.parentElement.innerHTML='${escapeHTML(
                badge.name
              )}'
            ">

        </span>

      `
    )
    .join("");

}


/* ============================================================
   METADATA
============================================================ */

async function getManifest(){

  return fetchJSON(
    state.metadata
  );

}


function supportsExtra(
  catalog,
  name
){

  return Array.isArray(
    catalog.extra
  )
  &&
  catalog.extra.some(
    extra =>
      typeof extra === "string"
        ? extra === name
        : extra &&
          extra.name === name
  );

}


function getSearchCatalogs(
  manifest
){

  const catalogs =
    Array.isArray(
      manifest.catalogs
    )
      ? manifest.catalogs
      : [];


  return catalogs.filter(
    catalog =>
      catalog &&
      catalog.id &&
      catalog.type &&
      supportsExtra(
        catalog,
        "search"
      )
  );

}


function makeExtraProps(
  values
){

  return Object.entries(
    values
  )
  .filter(
    ([,value]) =>
      value !== undefined &&
      value !== null &&
      String(value).length
  )
  .map(
    ([key,value]) =>
      key +
      "=" +
      encodeURIComponent(
        String(value)
      )
  )
  .join("&");

}


function buildCatalogURL(
  catalog,
  extra={}
){

  let url =
    addonRoot(
      state.metadata
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );


  const props =
    makeExtraProps(
      extra
    );


  if(props){

    url +=
      "/" +
      props;

  }


  return url + ".json";

}


/* ============================================================
   HOME
============================================================ */

async function loadHome(){

  const box =
    $("homeResults");


  try{

    const manifest =
      await getManifest();


    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];


    const selected = [];


    ["movie","series"]
      .forEach(
        type => {

          const catalog =
            catalogs.find(
              c =>
                c &&
                c.type === type
            );


          if(catalog){

            selected.push(
              catalog
            );

          }

        }
      );


    if(!selected.length){

      box.innerHTML = `

        <div class="notice">
          No movie or television catalogs
          were advertised by the metadata addon.
        </div>

      `;

      return;

    }


    const responses =
      await Promise.allSettled(
        selected.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog
              )
            )
        )
      );


    const metas = [];


    responses.forEach(
      result => {

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );


    box.innerHTML =
      renderGrid(
        dedupeMetas(
          metas
        )
      );

  }
  catch(error){

    box.innerHTML = `

      <div class="notice">

        <strong>
          METADATA ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}

   SEARCH

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();


  if(!query){

    focusSearch();

    return;

  }


  $("main").innerHTML = `

    <section>

      <div class="heading">

        <h2>
          SEARCH
        </h2>

        <span>
          ${escapeHTML(query)}
        </span>

      </div>

      <div
        id="searchResults"
        class="empty">

        Searching…

      </div>

    </section>

  `;


  try{

    const manifest =
      await getManifest();


    const catalogs =
      getSearchCatalogs(
        manifest
      );


    if(!catalogs.length){

      throw new Error(
        "No searchable catalogs were advertised by the metadata manifest."
      );

    }


    const responses =
      await Promise.allSettled(
        catalogs.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog,
                {
                  search:query
                }
              )
            )
        )
      );


    const metas = [];


    responses.forEach(
      result => {

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );


    const results =
      dedupeMetas(
        metas
      );


    $("searchResults")
      .innerHTML =
      results.length
        ? renderGrid(results)
        : `

          <div class="notice">

            No results found for
            <strong>
              ${escapeHTML(query)}
            </strong>.

          </div>

        `;

  }
  catch(error){

    $("searchResults")
      .innerHTML = `

        <div class="notice">

          <strong>
            SEARCH FAILED
          </strong>

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

  }

}


/* ============================================================
   GRID
============================================================ */

function dedupeMetas(
  metas
){

  const seen =
    new Set();


  return metas.filter(
    item => {

      const key =
        String(
          item.type || ""
        ) +
        "|" +
        String(
          item.id || ""
        );


      if(
        seen.has(key)
      ){

        return false;

      }


      seen.add(key);

      return true;

    }
  );

}


function renderGrid(
  metas
){

  if(
    !metas ||
    !metas.length
  ){

    return `
      <div class="empty">
        No results.
      </div>
    `;

  }


  return `

    <div class="grid">

      ${metas.map(
        item => {

          const type =
            encodeURIComponent(
              item.type ||
              "movie"
            );


          const id =
            encodeURIComponent(
              item.id ||
              ""
            );


          return `

            <button
              class="card"
              onclick="
                openTitle(
                  '${type}',
                  '${id}'
                )
              ">

              <img
                class="poster"
                src="${escapeHTML(
                  item.poster ||
                  item.logo ||
                  ""
                )}"
                loading="lazy"
                onerror="
                  this.style.opacity='0'
                ">


              <div class="card-info">

                <div class="card-title">

                  ${escapeHTML(
                    item.name ||
                    "Untitled"
                  )}

                </div>


                <div class="card-sub">

                  ${
                    item.type === "series"
                      ? "TELEVISION"
                      : "MOVIE"
                  }

                  ${
                    item.releaseInfo ||
                    item.year
                      ? " • " +
                        escapeHTML(
                          item.releaseInfo ||
                          item.year
                        )
                      : ""
                  }

                </div>

              </div>

            </button>

          `;

        }
      ).join("")}

    </div>

  `;

}

async function openTitle(

){

  const type =
    decodeURIComponent(
      encodedType
    );


  const id =
    decodeURIComponent(
      encodedId
    );


  currentTitleType =
    type;

  currentTitleId =
    id;


  openModal(`

    <div class="sheet-header">

      <h2>
        LOADING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="empty">
      Loading title…
    </div>

  `);


  try{

    const url =
      addonRoot(
        state.metadata
      ) +
      "meta/" +
      encodeURIComponent(
        type
      ) +
      "/" +
      encodeURIComponent(
        id
      ) +
      ".json";


    const data =
      await fetchJSON(
        url
      );


    const meta =
      data.meta ||

      of trying to request streams for the
      series root ID.

  catch(error){

          ERROR

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>


      <div class="notice">

        ${escapeHTML(
          error.message
        )}

      </div>

    `);

  }

}

/* ============================================================
   STREAM INFORMATION
============================================================ */

function getStreamURL(
  stream
){

  return String(
    stream?.url ||
    ""
  ).trim();

}


function streamType(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();


  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();


  if(
    type.includes("mpegurl") ||
    type.includes("m3u8") ||
    url.includes(".m3u8")
  ){

    return "HLS";

  }


  if(
    type.includes("mp4") ||
    url.includes(".mp4")
  ){

    return "MP4";

  }


  if(
    type.includes("webm") ||
    url.includes(".webm")
  ){

    return "WEBM";

  }


  if(
    stream?.playerFrameUrl
  ){

    return "PLAYER";

  }


  return "SOURCE";

}


function isExternal(
  stream
){

  return Boolean(
    stream?.externalUrl
  );

}


function isPlayerFrame(
  stream
){

  return Boolean(
    stream?.playerFrameUrl
  );

}


function isNotWebReady(
  stream
){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}


/*
 IMPORTANT:

 We intentionally DO NOT use a strict
 "playable" filter anymore.

 Every returned source is displayed.
*/

function compatibilityScore(
  stream
){

  let score = 0;


  if(
    streamType(stream) ===
    "MP4"
  ){

    score += 90;

  }


  if(
    streamType(stream) ===
    "HLS"
  ){

    score += 85;

  }


  if(
    streamType(stream) ===
    "WEBM"
  ){

    score += 80;

  }


  if(
    isPlayerFrame(stream)
  ){

    score += 75;

  }


  if(
    isNotWebReady(stream)
  ){

    score += 1;

  }


  return score;

}

  if(quality){

  if(stream.audioCodec){

      )
    });

  }


  if(stream.audio){

    info.push({

      )
    });

  }


  if(stream.language){

    info.push({

      )
    });

  if(stream.size){

              ? "NOT WEB READY"
              : "AVAILABLE"
          }

        </span>


        <span class="badge">

          ${format}

        </span>

      </div>


      ${renderStreamInfo(
        stream
      )}


      <div class="source-desc">

        ${
          external

            ? "External destination returned by provider. SAUVE will not treat it as a normal direct media file."

            :

          isPlayerFrame(stream)

            ? "Provider player detected. Tap to open the embedded player."

            :

          warning

            ? "Provider marked this source not web-ready. SAUVE will still let you attempt it."

            :

          "Tap to attempt playback."

        }

      </div>

    </button>

  `;

}


/* ============================================================
   PROVIDER
============================================================ */

function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();


  const providers = [
    "2peckle",
    "pengu",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"
  ];


  for(
    const name of providers
  ){

    if(
      text.includes(name)
    ){

      return name;

    }

  }


  return "stream source";

}


/* ============================================================
   FIND MOVIE SOURCES
============================================================ */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }


  $("sources").innerHTML = `

    <div class="empty">

      Loading stream sources…

    </div>

  `;


  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );


    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];


    if(
      !currentStreams.length
    ){

      $("sources").innerHTML = `

        <div class="notice">

          No stream sources were returned
          for this title.

        </div>

      `;

      return;

    }


    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );


    /*
      EVERYTHING returned by the addon
      remains visible.
    */

    currentPlayableStreams =
      currentStreams.slice();


    $("sources").innerHTML = `

      <div class="heading">

        <h2>
          SOURCES
        </h2>

        <span>
          ${currentStreams.length}
        </span>

      </div>


      <div class="notice">

        <strong>
          ${currentStreams.length}
        </strong>
        source(s) returned.

        <br><br>

        Sources are no longer automatically
        disabled because of
        <strong>NOT WEB READY</strong>.
        Tap any source to attempt playback.

      </div>


      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    $("sources").innerHTML = `

      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* ============================================================
   FIND EPISODE SOURCES
============================================================ */

    </div>

  `);

  }


  try{

    const data =

          "series",

        )
      );


    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];

    if(!currentStreams.length){

        </div>

        </h2>

        </span>

      </div>


      <div class="notice">

  catch(error){

/* ============================================================
   PLAY SOURCE
============================================================ */

function playSource(
  index
){

  const stream =
    currentStreams[index];


  if(!stream){

    return;

  }


  currentPlayerIndex =
    index;


  /*
    Provider player gets priority.
  */

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;

  }


  /*
    Direct URL gets sent to the
    browser video element.
  */

  playDirectStream(
    stream
  );

}


/* ============================================================
   DIRECT PLAYBACK
============================================================ */

function playDirectStream(
  stream
){

  const url =
    getStreamURL(
      stream
    );


  if(!url){

    openModal(`

      <div class="sheet-header">

        <h2>
          SOURCE
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>


      <div class="notice">

        This source did not provide a
        direct media URL.

      </div>

    `);

    return;

  }


  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>


      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>


      <div
        id="playerStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>


    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>


      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);


  const video =
    $("sauveVideo");


  const status =
    $("playerStatus");


  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {
      once:true
    }
  );


  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );


  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );


  video.addEventListener(
    "error",
    () => {

      status.textContent =
        "Safari could not decode or access this source.";

      status.className =
        "player-status error";

    }
  );


  video.src =
    url;


  video.load();

}


/* ============================================================
   EMBEDDED PLAYER
============================================================ */

function openEmbeddedPlayer(
  stream
){

  const url =
    String(
      stream.playerFrameUrl ||
      ""
    ).trim();


  if(!url){

    return;

  }


  openModal(`

    <div class="sheet-header">

      <h2>
        ${escapeHTML(
          stream.name ||
          "PLAYER"
        )}
      </h2>


      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="player-shell">

      <div class="iframe-player">

        <iframe
          src="${escapeHTML(url)}"
          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "
          allowfullscreen>
        </iframe>

      </div>


      <div
        class="player-status ready">

        Provider player loaded inside SAUVE.

      </div>

    </div>


    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        TRY NEXT SOURCE

      </button>


      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

}


/* ============================================================
   NEXT SOURCE
============================================================ */

function tryNextSource(){

  if(
    !currentStreams.length
  ){

    return;

  }


  let next =
    currentPlayerIndex + 1;


  if(
    next >= currentStreams.length
  ){

    next = 0;

  }


  currentPlayerIndex =
    next;


  playSource(
    next
  );

}


/* ============================================================
   SOURCES AGAIN
============================================================ */

function showSourcesAgain(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SOURCES
      </h2>


      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div
      class="notice">

      All sources returned by the
      stream addon are shown below.

    </div>


    ${
      currentStreams.length

        ?

        currentStreams
          .map(
            renderSource
          )
          .join("")

        :

        `
          <div class="empty">
            No sources available.
          </div>
        `
    }

  `);

}


/* ============================================================
   SETTINGS
============================================================ */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>


      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>


      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>


    <div class="field">

      <label>
        Stream Manifest
      </label>


      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"
        placeholder="Paste your stream manifest">

    </div>


    <div class="notice">

      Your manifest addresses are stored
      locally in this browser.

      <br><br>

      SAUVE now displays all sources returned
      by the stream addon instead of
      automatically removing sources marked
      NOT WEB READY.

    </div>


    <br>


    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);

}


function saveSettings(){

  const metadata =
    $("metadataURL")
      .value
      .trim();


  const stream =
    $("streamURL")
      .value
      .trim();


  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;

  }


  state.metadata =
    metadata;


  state.stream =
    stream;


  localStorage.setItem(
    "sauve_metadata",
    metadata
  );


  localStorage.setItem(
    "sauve_stream",
    stream
  );


  closeModal();

  location.reload();

}


/* ============================================================
   UI
============================================================ */

function focusSearch(){

  $("searchInput")
    .focus();

}


function goHome(){

  location.reload();

}


function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* ============================================================
   START
============================================================ */

loadHome();

</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="theme-color" content="#05030b">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>SAUVE Cinema Television</title>

<style>

:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#150b25;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --text:#fff;
  --muted:#9d91a6;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#05030b;
}

body{
  color:white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
  overflow-x:hidden;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(138,77,255,.38),
      transparent 35%
    ),
    radial-gradient(
      circle at 0 30%,
      rgba(255,22,216,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 50%,
      rgba(25,234,255,.10),
      transparent 30%
    ),
    #05030b;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

header{
  position:sticky;
  top:0;
  z-index:100;
  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    14px;
  background:rgba(5,3,11,.94);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-bottom:1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;
  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;
  font-style:italic;
  font-size:clamp(68px,19vw,120px);
  line-height:.78;
  letter-spacing:7px;
  transform:skewX(-7deg);
  color:white;

  text-shadow:
    0 0 4px white,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;
  text-align:center;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:8px;
  background:#0c0715;
  color:white;
  border:1px solid rgba(138,77,255,.45);
  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);
  box-shadow:0 0 18px rgba(255,22,216,.18);
}

.searchbar button{
  padding:0 18px;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:900;
  background:linear-gradient(
    135deg,
    var(--pink),
    var(--purple)
  );
}

main{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:16px 16px 110px;
}

.hero{
  position:relative;
  min-height:clamp(400px,58vh,620px);
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  padding:clamp(25px,5vw,60px);
  border-radius:18px;
  border:1px solid rgba(255,22,216,.25);

  background:
    radial-gradient(
      circle at 75% 30%,
      rgba(25,234,255,.18),
      transparent 25%
    ),
    radial-gradient(
      circle at 75% 75%,
      rgba(255,22,216,.25),
      transparent 35%
    ),
    linear-gradient(
      110deg,
      #090511,
      #190c2e,
      #07121e
    );
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(5,3,11,.98),
      rgba(5,3,11,.72) 48%,
      rgba(5,3,11,.05)
    );
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.08;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.18) 4px
    );
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;
  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;
  font-size:clamp(46px,9vw,95px);
  line-height:.85;
  text-transform:uppercase;
  text-shadow:0 0 20px rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;
  line-height:1.6;
  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,
.secondary{
  padding:13px 18px;
  border-radius:8px;
  font-weight:900;
}

.primary{
  border:0;
  color:white;
  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );
  box-shadow:0 0 18px rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);
  background:rgba(25,234,255,.04);
  border:1px solid rgba(25,234,255,.38);
}

.catalog-section{
  margin:30px 0 0;
}

.catalog-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:9px;
  border-bottom:1px solid rgba(255,22,216,.15);
}

.catalog-title{
  margin:0;
  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;
  font-size:25px;
  letter-spacing:1px;
}

.catalog-label{
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.row{
  display:flex;
  gap:13px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 1px 12px;
  scroll-snap-type:x proximity;
  scrollbar-width:none;
}

.row::-webkit-scrollbar{
  display:none;
}

.poster-card{
  position:relative;
  flex:0 0 145px;
  overflow:hidden;
  border:0;
  padding:0;
  text-align:left;
  color:white;
  background:#10091c;
  border-radius:8px;
  scroll-snap-align:start;
  box-shadow:0 7px 22px rgba(0,0,0,.32);
  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.poster-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 30px rgba(255,22,216,.20);
}

.poster-card img{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#171027;
}

.poster-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:38px 9px 9px;
  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.94)
    );
}

.poster-name{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.poster-year{
  margin-top:3px;
  color:#bdb0c6;
  font-size:9px;
}

.poster-type{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,.72);
  color:var(--cyan);
  font-size:7px;
  font-weight:900;
  letter-spacing:1px;
}

.empty{
  padding:28px 5px;
  color:var(--muted);
  font-size:13px;
}

.notice{
  padding:16px;
  border-radius:9px;
  background:rgba(255,22,216,.045);
  border:1px solid rgba(255,22,216,.17);
  color:#c8bacf;
  line-height:1.6;
  font-size:12px;
}

.loading{
  padding:25px;
  text-align:center;
  color:#bcaec5;
}

.spinner{
  width:28px;
  height:28px;
  margin:0 auto 12px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.12);
  border-top-color:var(--pink);
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:95vh;
  overflow:auto;
  padding:
    20px
    18px
    calc(30px + env(safe-area-inset-bottom));

  border-radius:22px 22px 0 0;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(138,77,255,.18),
      transparent 40%
    ),
    #0c0718;

  border-top:1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;
  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;
  font-size:27px;
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#170d27;
  color:var(--cyan);
  border:1px solid rgba(25,234,255,.3);
  font-size:22px;
}

.details{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:16px;
}

.details img{
  width:105px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:8px;
}

.details p{
  color:#c3b5cb;
  line-height:1.55;
  font-size:13px;
}

.meta{
  color:var(--cyan);
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:7px;
}

.section-title{
  margin:
    25px 0 10px;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:22px;
}

.season-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}

.season-tabs::-webkit-scrollbar{
  display:none;
}

.season-button{
  flex:none;
  padding:9px 13px;
  border-radius:7px;
  border:1px solid rgba(138,77,255,.3);
  background:#140b23;
  color:#bfb1c8;
  font-size:10px;
  font-weight:900;
}

.season-button.active{
  color:white;
  border-color:var(--pink);
  background:
    linear-gradient(
      135deg,
      rgba(255,22,216,.35),
      rgba(138,77,255,.35)
    );
}

.episode-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.episode{
  width:100%;
  display:grid;
  grid-template-columns:80px 1fr;
  gap:12px;
  padding:8px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.07);
  background:#120a20;
  color:white;
  text-align:left;
}

.episode:hover{
  border-color:var(--pink);
}

.episode img{
  width:80px;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:5px;
  background:#08050d;
}

.episode-number{
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
}

.episode-name{
  margin-top:4px;
  font-weight:900;
  font-size:12px;
}

.episode-desc{
  margin-top:5px;
  color:#8f8499;
  font-size:9px;
  line-height:1.4;
}

.source{
  width:100%;
  margin-top:9px;
  padding:14px;
  text-align:left;
  color:white;
  border-radius:9px;
  background:
    linear-gradient(
      100deg,
      #150c29,
      #0d0819
    );
  border:1px solid rgba(25,234,255,.15);
}

.source:hover{
  border-color:var(--cyan);
  box-shadow:0 0 16px rgba(25,234,255,.14);
}

.source-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border-radius:50%;
  color:var(--cyan);
  background:rgba(25,234,255,.08);
}

.source-name{
  font-weight:900;
}

.provider{
  margin-top:4px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.badges{
  margin-top:8px;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  margin-right:5px;
  margin-bottom:4px;
  border-radius:5px;
  background:rgba(255,22,216,.10);
  color:#ff7be4;
  font-size:8px;
  font-weight:900;
  letter-spacing:.7px;
}

.badge.good{
  background:rgba(66,255,176,.10);
  color:var(--green);
}

.badge.warning{
  background:rgba(255,212,90,.10);
  color:var(--yellow);
}

.badge.blue{
  background:rgba(25,234,255,.10);
  color:var(--cyan);
}

.source-desc{
  margin-top:7px;
  color:#91859b;
  font-size:10px;
}

.player-shell{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:12px;
  background:#000;
  border:1px solid rgba(25,234,255,.25);
  box-shadow:0 0 30px rgba(25,234,255,.08);
}

video{
  display:block;
  width:100%;
  max-height:70vh;
  background:#000;
}

.iframe-player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

.player-status{
  padding:11px 13px;
  background:#0e0818;
  border-top:1px solid rgba(255,255,255,.07);
  color:#aaa;
  font-size:11px;
}

.player-status.ready{
  color:var(--green);
}

.player-status.error{
  color:var(--red);
}

.player-controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.player-button{
  padding:10px 13px;
  border-radius:7px;
  color:white;
  background:#170d27;
  border:1px solid rgba(255,255,255,.1);
  font-weight:800;
  font-size:11px;
}

.player-button.primary{
  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );
  border:0;
}

.field{
  margin:18px 0;
}

.field label{
  display:block;
  margin-bottom:8px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.field input{
  width:100%;
  padding:13px;
  border-radius:7px;
  background:#080510;
  color:white;
  border:1px solid rgba(138,77,255,.3);
  outline:none;
}

.addon-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  margin-bottom:8px;
  border-radius:8px;
  background:#10091c;
  border:1px solid rgba(138,77,255,.2);
}

.addon-info{
  flex:1;
  min-width:0;
}

.addon-name{
  font-weight:900;
  font-size:12px;
}

.addon-url{
  margin-top:4px;
  color:#80748b;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.remove-addon{
  flex:none;
  padding:7px 9px;
  border-radius:6px;
  border:1px solid rgba(255,85,119,.3);
  color:var(--red);
  background:rgba(255,85,119,.06);
  font-size:9px;
  font-weight:900;
}

.nav{
  position:fixed;
  z-index:400;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(8,5,17,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;
  background:none;
  color:#766a80;
  font-size:9px;
  letter-spacing:1px;
}

.nav button span{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);
  text-shadow:0 0 10px var(--pink);
}

@media(min-width:700px){

  .poster-card{
    flex-basis:180px;
  }

  .details{
    grid-template-columns:190px 1fr;
  }

  .details img{
    width:190px;
  }

  .hero{
    min-height:580px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    SAUVE
  </div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>


<main id="main">

  <div class="hero">

    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Browse your Stremio catalogs,
        MDBList collections and television.
        Select a show, choose a season and
        pick an individual episode to find
        its available sources.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button
          class="secondary"
          onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>

    </div>

  </div>

  <div id="catalogContainer">

    <div class="loading">

      <div class="spinner"></div>

      Loading SAUVE…

    </div>

  </div>

</main>


<nav class="nav">

  <button
    class="active"
    onclick="goHome()">

    <span>⌂</span>
    HOME

  </button>

  <button
    onclick="focusSearch()">

    <span>⌕</span>
    SEARCH

  </button>

  <button
    onclick="openSettings()">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>


<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

/*
  Your working MDBList Stremio addon can be added
  through Settings.

  Example:

  stremio://931ea03c081b-mdblist-stremio.baby-beamup.club/unified/latest-movies-digital-release/userapi-snoak-12rh0aihjpmyvra4f4x5od8tb/MDBList/manifest.json

  The application converts stremio:// to https://
  automatically.
*/

const DEFAULT_ADDON =
"";


const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    "",

  addons:
    loadJSON(
      "sauve_addons",
      []
    )

};


let currentStreams = [];

let currentPlayableStreams = [];

let currentPlayerIndex = 0;

let currentTitle = null;

let currentSeriesId = "";

let currentSelectedSeason = 1;


/* =========================================================
   STORAGE
========================================================= */

function loadJSON(
  key,
  fallback
){

  try{

    const value =
      localStorage.getItem(key);

    if(!value){

      return fallback;

    }

    return JSON.parse(value);

  }
  catch(e){

    return fallback;

  }

}


function saveState(){

  localStorage.setItem(
    "sauve_metadata",
    state.metadata
  );

  localStorage.setItem(
    "sauve_stream",
    state.stream
  );

  localStorage.setItem(
    "sauve_addons",
    JSON.stringify(
      state.addons
    )
  );

}


/* =========================================================
   HELPERS
========================================================= */

function $(id){

  return document.getElementById(id);

}


function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}


function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(
      /\/manifest\.json\/?$/i,
      ""
    );

}


function toHTTP(url){

  let value =
    String(url || "")
      .trim();

  if(
    value.startsWith(
      "stremio://"
    )
  ){

    value =
      "https://" +
      value.substring(
        "stremio://".length
      );

  }

  return value;

}


function addonRoot(url){

  return normalizeManifest(
    toHTTP(url)
  ) + "/";
}


async function fetchJSON(url){

  const response =
    await fetch(
      toHTTP(url),
      {
        method:"GET",
        headers:{
          Accept:
            "application/json"
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  return response.json();

}


/* =========================================================
   CATALOG URL
========================================================= */

function makeExtraProps(
  values
){

  return Object.entries(
    values
  )
  .filter(
    ([,value]) =>
      value !== undefined &&
      value !== null &&
      String(value).length
  )
  .map(
    ([key,value]) =>
      key +
      "=" +
      encodeURIComponent(
        String(value)
      )
  )
  .join("&");

}


function buildCatalogURL(
  addon,
  catalog,
  extra={}
){

  let url =
    addonRoot(
      addon
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );

  const props =
    makeExtraProps(
      extra
    );

  if(props){

    url +=
      "/" +
      props;

  }

  return url +
    ".json";

}


/* =========================================================
   META URL
========================================================= */

function buildMetaURL(
  addon,
  type,
  id
){

  return (
    addonRoot(addon) +
    "meta/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}


/* =========================================================
   STREAM URL
========================================================= */

function buildStreamURL(
  type,
  id
){

  if(!state.stream){

    return "";

  }

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}


/*
  IMPORTANT TV FIX

  Stremio stream addons normally expect:

  series/<series-id>:<season>:<episode>

  instead of simply:

  series/<series-id>

  So this function builds the correct
  episode-specific ID.
*/

function buildEpisodeStreamURL(
  seriesId,
  season,
  episode
){

  if(!state.stream){

    return "";

  }

  const episodeId =
    seriesId +
    ":" +
    season +
    ":" +
    episode;

  return (
    addonRoot(
      state.stream
    ) +
    "stream/series/" +
    encodeURIComponent(
      episodeId
    ) +
    ".json"
  );

}


/* =========================================================
   CATALOG NAME
========================================================= */

function prettyCatalogName(
  catalog
){

  const raw =
    String(
      catalog.name ||
      catalog.id ||
      "CATALOG"
    );

  const lower =
    raw.toLowerCase();

  const mappings = [

    ["netflix","NETFLIX"],

    ["disney+","DISNEY+"],

    ["disney","DISNEY+"],

    ["apple tv","APPLE TV+"],

    ["apple","APPLE TV+"],

    ["hbo","HBO"],

    ["max","MAX"],

    ["hulu","HULU"],

    ["prime","PRIME VIDEO"],

    ["amazon","PRIME VIDEO"],

    ["paramount","PARAMOUNT+"],

    ["peacock","PEACOCK"],

    ["marvel","MARVEL"],

    ["dc","DC"],

    ["popular","POPULAR"],

    ["trending","TRENDING"],

    ["featured","FEATURED"],

    ["latest","LATEST"],

    ["digital","DIGITAL RELEASES"],

    ["top","TOP PICKS"],

    ["new","NEW RELEASES"]

  ];

  for(
    const [needle,label]
    of mappings
  ){

    if(
      lower.includes(
        needle
      )
    ){

      return label;

    }

  }

  return raw.toUpperCase();

}


/* =========================================================
   CATALOG PRIORITY
========================================================= */

function catalogPriority(
  catalog
){

  const name =
    String(
      catalog.name ||
      catalog.id ||
      ""
    ).toLowerCase();

  const priority = [

    "featured",

    "trending",

    "popular",

    "netflix",

    "disney",

    "apple",

    "hbo",

    "max",

    "hulu",

    "prime",

    "amazon",

    "paramount",

    "peacock",

    "marvel",

    "dc",

    "latest",

    "digital",

    "top",

    "new"

  ];

  const index =
    priority.findIndex(
      word =>
        name.includes(word)
    );

  return index < 0
    ? 999
    : index;

}


/* =========================================================
   ADDON MANIFEST
========================================================= */

async function loadAddonManifest(
  addon
){

  const manifestURL =
    normalizeManifest(
      toHTTP(addon)
    ) +
    "/manifest.json";

  return fetchJSON(
    manifestURL
  );

}


/* =========================================================
   LOAD ALL ADDON CATALOGS
========================================================= */

async function loadExternalAddons(){

  const addons =
    state.addons
      .filter(Boolean);

  if(!addons.length){

    return "";

  }

  let html = "";

  for(
    const addon
    of addons
  ){

    try{

      const manifest =
        await loadAddonManifest(
          addon
        );

      const catalogs =
        Array.isArray(
          manifest.catalogs
        )
          ? manifest.catalogs
          : [];

      for(
        const catalog
        of catalogs.slice(0,20)
      ){

        try{

          const data =
            await fetchJSON(
              buildCatalogURL(
                addon,
                catalog
              )
            );

          const metas =
            Array.isArray(
              data.metas
            )
              ? data.metas
              : [];

          if(!metas.length){

            continue;

          }

          html +=
            renderCatalogRow(
              catalog,
              metas
            );

        }
        catch(e){

          console.warn(
            "Catalog failed:",
            catalog,
            e
          );

        }

      }

    }
    catch(error){

      console.warn(
        "Addon failed:",
        addon,
        error
      );

    }

  }

  return html;

}


/* =========================================================
   LOAD HOME
========================================================= */

async function loadHome(){

  const container =
    $("catalogContainer");

  container.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Loading catalogs…

    </div>

  `;

  let mainHTML = "";

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    const usable =
      catalogs
        .filter(
          c =>
            c &&
            c.id &&
            c.type
        )
        .sort(
          (a,b) =>
            catalogPriority(a) -
            catalogPriority(b)
        );

    const selected =
      usable.slice(
        0,
        30
      );

    const results =
      await Promise.allSettled(
        selected.map(
          async catalog => {

            const data =
              await fetchJSON(
                buildCatalogURL(
                  state.metadata,
                  catalog
                )
              );

            return {
              catalog,
              metas:
                Array.isArray(
                  data.metas
                )
                  ? data.metas
                  : []
            };

          }
        )
      );

    results.forEach(
      result => {

        if(
          result.status !==
          "fulfilled"
        ){

          return;

        }

        if(
          !result.value.metas.length
        ){

          return;

        }

        mainHTML +=
          renderCatalogRow(
            result.value.catalog,
            result.value.metas
          );

      }
    );

  }
  catch(error){

    mainHTML += `

      <div class="notice">

        Metadata catalog error:

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }


  /*
    Now append the user's
    Stremio/MDBList addons.

    This restores the addon/list
    section that disappeared before.
  */

  try{

    const addonHTML =
      await loadExternalAddons();

    mainHTML +=
      addonHTML;

  }
  catch(error){

    console.warn(
      "External addons failed",
      error
    );

  }


  if(!mainHTML){

    mainHTML = `

      <div class="notice">

        No catalogs could be loaded.

        <br><br>

        Open Settings and verify your
        metadata addon or Stremio list.

      </div>

    `;

  }

  container.innerHTML =
    mainHTML;

}


/* =========================================================
   DEDUPE
========================================================= */

function dedupeMetas(
  metas
){

  const seen =
    new Set();

  return metas.filter(
    item => {

      const key =
        String(
          item.type || ""
        ) +
        "|" +
        String(
          item.id || ""
        );

      if(
        seen.has(key)
      ){

        return false;

      }

      seen.add(key);

      return true;

    }
  );

}

/* =========================================================
   OPEN TITLE
========================================================= */

async function openTitle(
  encodedType,
  encodedId
){

  const type =
    decodeURIComponent(
      encodedType
    );

  const id =
    decodeURIComponent(
      encodedId
    );

  currentSeriesId =
    id;

  openModal(`

    <div class="sheet-header">

      <h2>
        LOADING
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div class="loading">

      <div class="spinner"></div>

      Loading title…

    </div>

  `);


  try{

    const addons = [

      state.metadata,

      ...state.addons

    ]
    .filter(Boolean);


    let meta = null;


    /*
      Try metadata addon first,
      then user-added list addons.
    */

    for(
      const addon
      of addons
    ){

      try{

        const data =
          await fetchJSON(
            buildMetaURL(
              addon,
              type,
              id
            )
          );

        if(
          data &&
          (
            data.meta ||
            data.name
          )
        ){

          meta =
            data.meta ||
            data;

          break;

        }

      }
      catch(e){

        console.warn(
          "Metadata source failed",
          addon,
          e
        );

      }

    }


    if(!meta){

      throw new Error(
        "Unable to load title information."
      );

    }


    currentTitle =
      meta;


    /*
      MOVIE
    */

    if(
      type !== "series"
    ){

      renderMovieTitle(
        meta,
        type,
        id
      );

      return;

    }


    /*
      TV SERIES
    */

    renderSeriesTitle(
      meta,
      id
    );

  }
  catch(error){

    openModal(`

      <div class="sheet-header">

        <h2>
          ERROR
        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>

      <div class="notice">

        ${escapeHTML(
          error.message
        )}

      </div>

    `);

  }

}

/* =========================================================

========================================================= */

function renderSeriesTitle(
  meta,
  id
){

  const videos =
    Array.isArray(
      meta.videos
    )
      ? meta.videos
      : [];


  /*
    Some addons return videos as:

    season
    episode
    id
    title/name
    overview
    thumbnail

    We use those directly.
  */

  const seasons =
    getSeasons(
      videos
    );


  if(!seasons.length){

    /*
      If the addon has no episode
      metadata, we still provide a
      fallback message rather than
      making the show appear broken.
    */

    openModal(`

      <div class="sheet-header">

        <h2>

            meta.name ||
            "SERIES"
          )}

            ""
          )}">

        <div>

          </div>

          <p>

            ${escapeHTML(
              meta.description ||

            )}

          </p>

        </div>

        episode information for this series.

  );

/* =========================================================
   SEASONS
========================================================= */

function getSeasons(
  videos
){

  return [
    ...new Set(
      videos
        .map(
          v =>
            Number(
              v.season
            )
        )
        .filter(
          n =>
            Number.isFinite(n) &&
            n > 0
        )
    )
  ]
  .sort(
    (a,b) =>
      a-b
  );

}


/* =========================================================
   SERIES SEASON
========================================================= */

function renderSeriesSeason(
  meta,
  id,
  videos,
  season
){

  currentSelectedSeason =
    season;


  const seasons =
    getSeasons(
      videos
    );


  const episodes =
    videos
      .filter(
        video =>
          Number(
            video.season
          ) ===
          Number(
            season
          )
      )
      .sort(
        (a,b) =>
          Number(
            a.episode ||
            a.number ||
            0
          ) -
          Number(
            b.episode ||
            b.number ||
            0
          )
      );


  openModal(`

    <div class="sheet-header">

      <h2>

        ${escapeHTML(
          meta.name ||
          "SERIES"
        )}

      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="details">

      <img
        src="${escapeHTML(
          meta.poster ||
          meta.logo ||
          ""
        )}">

      <div>

        <div class="meta">

          TV SERIES

        </div>

        <p>

          ${escapeHTML(
            meta.description ||
            "Select a season and episode."
          )}

        </p>

      </div>

    </div>


    <div class="section-title">

      SEASONS

    </div>


    <div class="season-tabs">

      ${seasons
        .map(
          s => `

            <button
              class="
                season-button
                ${
                  Number(s) ===
                  Number(season)
                    ? "active"
                    : ""
                }
              "
              onclick="
                selectSeason(
                  ${Number(s)}
                )
              ">

              SEASON ${Number(s)}

            </button>

          `
        )
        .join("")}

    </div>


    <div class="section-title">

      EPISODES

    </div>


    <div class="episode-list">

      ${
        episodes.length

          ?

          episodes
            .map(
              renderEpisode
            )
            .join("")

          :

          `

            <div class="notice">

              No episodes were returned
              for this season.

            </div>

          `
      }

    </div>


    <div
      id="episodeSources"
      style="margin-top:25px">

    </div>

  `);

}


/* =========================================================
   EPISODE CARD
========================================================= */

function renderEpisode(
  episode
){

  const number =
    Number(
      episode.episode ||
      episode.number ||
      0
    );

  const title =
    episode.name ||
    episode.title ||
    (
      "Episode " +
      number
    );

  const image =
    episode.thumbnail ||
    episode.poster ||
    episode.image ||
    currentTitle?.poster ||
    "";

  const overview =
    episode.overview ||
    episode.description ||
    "";


  /*
    Important:

    We store the episode object
    safely in a temporary encoded
    index instead of putting arbitrary
    IDs directly into inline JS.
  */

  const key =
    "ep_" +
    Math.random()
      .toString(36)
      .slice(2);


  window[key] =
    episode;


  return `

    <button
      class="episode"
      onclick="
        selectEpisode(
          '${key}'
        )
      ">

      <img
        src="${escapeHTML(
          image
        )}"
        loading="lazy"
        onerror="
          this.style.opacity='.25'
        ">


      <div>

        <div class="episode-number">

          EPISODE ${number}

        </div>

        <div class="episode-name">

          ${escapeHTML(
            title
          )}

        </div>

        ${
          overview

            ?

            `

              <div class="episode-desc">

                ${escapeHTML(
                  overview
                )}

              </div>

            `

            :

            ""

        }

      </div>

    </button>

  `;

}


/* =========================================================
   SELECT SEASON
========================================================= */

function selectSeason(
  season
){

  if(!currentTitle){

    return;

  }

  renderSeriesSeason(
    currentTitle,
    currentSeriesId,
    currentTitle.videos || [],
    season
  );

}


/* =========================================================
   SELECT EPISODE
========================================================= */

async function selectEpisode(
  key
){

  const episode =
    window[key];


  if(!episode){

    return;

  }


  const season =
    Number(
      episode.season
    );


  const episodeNumber =
    Number(
      episode.episode ||
      episode.number
    );


  if(
    !season ||
    !episodeNumber
  ){

    alert(
      "This episode is missing its season or episode number."
    );

    return;

  }


  const sources =
    $("episodeSources");


  if(!sources){

    return;

  }


  sources.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Finding sources for

      <strong>

        ${escapeHTML(
          episode.name ||
          "Episode " +
          episodeNumber
        )}

      </strong>

      …

    </div>

  `;


  try{

    const url =
      buildEpisodeStreamURL(
        currentSeriesId,
        season,
        episodeNumber
      );


    if(!url){

      throw new Error(
        "No stream addon is configured."
      );

    }


    const data =
      await fetchJSON(
        url
      );


    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];


    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );


    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );


    if(
      !currentStreams.length
    ){

      sources.innerHTML = `

        <div class="notice">

          No sources were returned for

          <strong>

            ${escapeHTML(
              episode.name ||
              "Episode " +
              episodeNumber
            )}

          </strong>.

          <br><br>

          Stream addons normally require
          the episode ID in this format:

          <br><br>

          series:id:season:episode

        </div>

      `;

      return;

    }


    sources.innerHTML = `

      <div class="section-title">

        SOURCES

      </div>

      <div class="notice">

        ${currentStreams.length}
        source(s) found for

        <strong>

          S${season}E${episodeNumber}

        </strong>.

        <br><br>

        ${currentPlayableStreams.length}
        potentially browser-compatible.

      </div>


      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    sources.innerHTML = `

      <div class="notice">

        <strong>
          EPISODE SOURCE ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        Episode requested:

        <strong>

          ${escapeHTML(
            currentSeriesId
          )}:${season}:${episodeNumber}

        </strong>

      </div>

    `;

  }

}

        No stream addon is configured.

        <br><br>

        Open Settings and add your
        stream manifest.

      </div>

    `;

    return;

  }


  sources.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Finding sources…

    </div>

  `;


  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );


    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];


    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );


    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );


    if(
      !currentStreams.length
    ){

      sources.innerHTML = `

        <div class="notice">

          No stream sources were returned
          for this title.

        </div>

      `;

      return;

    }


    sources.innerHTML = `

      <div class="section-title">

        SOURCES

      </div>

      <div class="notice">

        ${currentStreams.length}
        source(s) found.

        <br><br>

        ${currentPlayableStreams.length}
        potentially compatible.

      </div>


      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    sources.innerHTML = `

      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================================
   STREAM DETECTION
========================================================= */

function getStreamURL(
  stream
){

  return String(
    stream?.url ||
    ""
  ).trim();

}


function isPlayerFrame(
  stream
){

  return Boolean(
    stream?.playerFrameUrl
  );

}


function isExternal(
  stream
){

  return Boolean(
    stream?.externalUrl
  );

}


function isNotWebReady(
  stream
){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}


function isHLS(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".m3u8") ||
    type.includes("m3u8") ||
    type.includes("mpegurl")
  );

}


function isMP4(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".mp4") ||
    type.includes("mp4")
  );

}


function isWebM(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".webm") ||
    type.includes("webm")
  );

}


function isPlayableCandidate(
  stream
){

  if(
    isPlayerFrame(
      stream
    )
  ){

    return true;

  }

  if(
    isExternal(
      stream
    )
  ){

    return false;

  }

  return (
    isMP4(stream) ||
    isHLS(stream) ||
    isWebM(stream)
  );

}


/* =========================================================
   PROVIDER
========================================================= */

function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();


  const providers = [

    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud",
    "torbox",
    "realdebrid",
    "debrid",
    "usenet"

  ];


  for(
    const name
    of providers
  ){

    if(
      text.includes(name)
    ){

      return name;

    }

  }


  return "stream source";

}


/* =========================================================
   BADGE PARSER
========================================================= */

function extractBadges(
  stream
){

  const values = [

    stream.name,

    stream.title,

    stream.description,

    stream.behaviorHints?.proxyHeaders
      ? "proxy"
      : "",

    stream.quality,

    stream.resolution,

    stream.type

  ]
  .filter(Boolean)
  .join(" ")
  .toLowerCase();


  const badges = [];


  const checks = [

    ["4k","4K","good"],

    ["2160","4K","good"],

    ["uhd","UHD","good"],

    ["1080","1080P","blue"],

    ["720","720P","blue"],

    ["hdr10+","HDR10+","good"],

    ["hdr10","HDR10","good"],

    [" dolby vision","DV","good"],

    ["dv ","DV","good"],

    ["atmos","ATMOS","good"],

    ["truehd","TRUEHD","good"],

    ["hevc","HEVC","blue"],

    ["h265","H265","blue"],

    ["h.265","H265","blue"],

    ["av1","AV1","blue"],

    ["web-dl","WEB-DL","blue"],

    ["webdl","WEB-DL","blue"],

    ["bluray","BLURAY","blue"],

    ["blu-ray","BLURAY","blue"],

    ["remux","REMUX","good"],

    ["aac","AAC","blue"],

    ["ac3","AC3","blue"],

    ["eac3","EAC3","blue"],

    ["dd+","DD+","blue"],

    ["7.1","7.1","blue"],

    ["5.1","5.1","blue"],

    ["multi","MULTI","blue"],

    ["dual","DUAL","blue"]

  ];


  for(
    const [
      needle,
      label,
      css
    ]
    of checks
  ){

    if(
      values.includes(
        needle
      )
    ){

      if(
        !badges.some(
          b =>
            b.label ===
            label
        )
      ){

        badges.push({
          label,
          css
        });

      }

    }

  }


  return badges;

}


/* =========================================================
   SOURCE UI
========================================================= */

function renderSource(
  stream,
  index
){

  const playable =
    isPlayableCandidate(
      stream
    );


  let format =
    "SOURCE";


  if(
    isMP4(stream)
  ){

    format =
      "MP4";

  }
  else if(
    isHLS(stream)
  ){

    format =
      "HLS";

  }
  else if(
    isWebM(stream)
  ){

    format =
      "WEBM";

  }
  else if(
    isPlayerFrame(stream)
  ){

    format =
      "PLAYER";

  }
  else if(
    isExternal(stream)
  ){

    format =
      "EXTERNAL";

  }


  const fusionBadges =
    extractBadges(
      stream
    );


  return `

    <button
      class="source"

      ${
        playable

          ?

          `onclick="playSource(${index})"`

          :

          `onclick="explainSource(${index})"`

      }>


      <div class="source-top">

        <div class="source-icon">

          ${
            playable
              ? "▶"
              : "!"
          }

        </div>


        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>


          <div class="provider">

            ${escapeHTML(
              providerName(
                stream
              )
            )}

          </div>

        </div>

      </div>


      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : "warning"}
        ">

          ${format}

        </span>


        ${
          isNotWebReady(stream)

            ?

            `
              <span
                class="badge warning">
                NOT WEB READY
              </span>
            `

            :

            `
              <span
                class="badge good">
                WEB READY
              </span>
            `
        }


        ${
          stream.quality

            ?

            `
              <span
                class="badge blue">

                ${escapeHTML(
                  stream.quality
                )}

              </span>
            `

            :

            ""
        }


        ${
          stream.resolution

            ?

            `
              <span
                class="badge blue">

                ${escapeHTML(
                  stream.resolution
                )}

              </span>
            `

            :

            ""
        }


        ${fusionBadges
          .map(
            badge => `

              <span
                class="badge ${badge.css}">

                ${escapeHTML(
                  badge.label
                )}

              </span>

            `
          )
          .join("")}

      </div>


      <div class="source-desc">

        ${
          isExternal(stream)

            ?

            "External destination."

            :

          isNotWebReady(stream)

            ?

            "Provider marked this source as not web-ready."

            :

          playable

            ?

            "Tap to attempt playback inside SAUVE."

            :

            "No browser-compatible media URL was detected."

        }

      </div>

    </button>

  `;

}


/* =========================================================
   SOURCE SCORE
========================================================= */

function compatibilityScore(
  stream
){

  let score = 0;


  if(
    isMP4(stream)
  ){

    score += 100;

  }


  if(
    isHLS(stream)
  ){

    score += 90;

  }


  if(
    isWebM(stream)
  ){

    score += 80;

  }


  if(
    isPlayerFrame(stream)
  ){

    score += 70;

  }


  if(
    isExternal(stream)
  ){

    score -= 100;

  }


  return score;

}


/* =========================================================
   PLAY SOURCE
========================================================= */

function playSource(
  index
){

  const stream =
    currentStreams[index];


  if(!stream){

    return;

  }


  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );


  if(
    currentPlayerIndex < 0
  ){

    currentPlayerIndex = 0;

  }


  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;

  }


  playDirectStream(
    stream
  );

}


/* =========================================================
   DIRECT PLAYER
========================================================= */

function playDirectStream(
  stream
){

  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>


      <div
        id="playerStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>


    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>


      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);


  const video =
    $("sauveVideo");


  const status =
    $("playerStatus");


  const url =
    getStreamURL(
      stream
    );


  if(!url){

    showPlayerError(
      "No direct media URL was returned."
    );

    return;

  }


  video.src =
    toHTTP(url);


  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {
      once:true
    }
  );


  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );


  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );


  video.addEventListener(
    "error",
    () => {

      showPlayerError(
        "Safari could not decode or access this video source."
      );

    }
  );


  video.load();

}


/* =========================================================
   EMBEDDED PLAYER
========================================================= */

function openEmbeddedPlayer(
  stream
){

  const url =
    String(
      stream.playerFrameUrl ||
      ""
    ).trim();


  if(!url){

    showPlayerError(
      "No player URL was returned."
    );

    return;

  }


  openModal(`

    <div class="sheet-header">

      <h2>

        ${escapeHTML(
          stream.name ||
          "PLAYER"
        )}

      </h2>


      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="player-shell">

      <div class="iframe-player">

        <iframe

          src="${escapeHTML(
            toHTTP(url)
          )}"

          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "

          allowfullscreen>

        </iframe>

      </div>


      <div
        class="player-status ready">

        Provider player loaded inside SAUVE.

      </div>

    </div>


    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        TRY NEXT SOURCE

      </button>


      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

}


/* =========================================================
   NEXT SOURCE
========================================================= */

function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;

  }


  let next =
    currentPlayerIndex + 1;


  if(
    next >=
    currentPlayableStreams.length
  ){

    next = 0;

  }


  currentPlayerIndex =
    next;


  const stream =
    currentPlayableStreams[
      next
    ];


  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }

}


/* =========================================================
   ERROR
========================================================= */

function showPlayerError(
  message
){

  const status =
    $("playerStatus");


  if(status){

    status.textContent =
      message;

    status.className =
      "player-status error";

  }

}


/* =========================================================
   EXPLAIN
========================================================= */

function explainSource(
  index
){

  const stream =
    currentStreams[index];


  if(!stream){

    return;

  }


  alert(
    isExternal(stream)

      ?

      "This source is an external destination rather than a direct media stream."

      :

      "SAUVE could not identify a browser-compatible video URL for this source."
  );

}


/* =========================================================
   SEARCH
========================================================= */

function supportsSearch(
  catalog
){

  if(
    !Array.isArray(
      catalog.extra
    )
  ){

    return false;

  }


  return catalog.extra.some(
    extra => {

      if(
        typeof extra ===
        "string"
      ){

        return (
          extra ===
          "search"
        );

      }


      return (
        extra &&
        (
          extra.name ===
          "search" ||
          extra.name ===
          "q"
        )
      );

    }
  );

}


async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();


  if(!query){

    focusSearch();

    return;

  }


  $("main").innerHTML = `

    <div class="hero">

      <div class="hero-content">

        <div class="hero-kicker">
          SAUVE SEARCH
        </div>

        <h1>
          ${escapeHTML(
            query
          )}
        </h1>

        <p>
          Searching movies and television…
        </p>

      </div>

    </div>

    <div
      id="searchResults"
      class="loading">

      <div class="spinner"></div>

      Searching…

    </div>

  `;


  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );


    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];


    const searchable =
      catalogs.filter(
        supportsSearch
      );


    const metas = [];


    const responses =
      await Promise.allSettled(

        searchable.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                state.metadata,
                catalog,
                {
                  search:
                    query
                }
              )
            )
        )

      );


    responses.forEach(
      result => {

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );


    /*
      Also search user-added
      Stremio/MDBList addons.
    */

    for(
      const addon
      of state.addons
    ){

      try{

        const addonManifest =
          await loadAddonManifest(
            addon
          );


        const addonCatalogs =
          Array.isArray(
            addonManifest.catalogs
          )
            ? addonManifest.catalogs
            : [];


        const addonSearchable =
          addonCatalogs.filter(
            supportsSearch
          );


        const addonResults =
          await Promise.allSettled(
            addonSearchable.map(
              catalog =>
                fetchJSON(
                  buildCatalogURL(
                    addon,
                    catalog,
                    {
                      search:
                        query
                    }
                  )
                )
            )
          );


        addonResults.forEach(
          result => {

            if(
              result.status ===
              "fulfilled"
            ){

              metas.push(
                ...(result.value.metas || [])
              );

            }

          }
        );

      }
      catch(e){

        console.warn(
          "Addon search failed",
          e
        );

      }

    }


    const results =
      dedupeMetas(
        metas
      );


    $("searchResults")
      .outerHTML =

      results.length

        ?

        `

          <section>

            <div
              class="catalog-heading">

              <h2
                class="catalog-title">

                RESULTS

              </h2>

              <span
                class="catalog-label">

                ${results.length}

              </span>

            </div>

            <div
              class="row">

              ${results
                .map(
                  renderPosterCard
                )
                .join("")}

            </div>

          </section>

        `

        :

        `

          <div class="notice">

            No results found for

            <strong>
              ${escapeHTML(query)}
            </strong>.

          </div>

        `;

  }
  catch(error){

    $("searchResults")
      .outerHTML = `

        <div class="notice">

          <strong>
            SEARCH FAILED
          </strong>

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

  }

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  const addonHTML =
    state.addons.length

      ?

      state.addons
        .map(
          (url,index) => `

            <div class="addon-item">

              <div class="addon-info">

                <div class="addon-name">

                  STREMIO LIST ${index + 1}

                </div>

                <div class="addon-url">

                  ${escapeHTML(
                    url
                  )}

                </div>

              </div>

              <button
                class="remove-addon"
                onclick="
                  removeAddon(${index})
                ">

                REMOVE

              </button>

            </div>

          `
        )
        .join("")

      :

      `

        <div class="empty">

          No Stremio lists have been added yet.

        </div>

      `;


  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="field">

      <label>
        Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>


    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"

        placeholder="Paste stream manifest">

    </div>


    <div
      class="section-title">

      STREMIO LISTS

    </div>


    <div class="notice">

      Add Stremio-compatible catalog
      manifests here.

      <br><br>

      Your MDBList Stremio URL can be
      pasted directly, including a
      <strong>stremio://</strong> URL.

    </div>


    <br>


    <div
      id="addonList">

      ${addonHTML}

    </div>


    <div class="field">

      <label>
        Add Stremio / MDBList URL
      </label>

      <input
        id="newAddonURL"
        placeholder="stremio://.../manifest.json">

    </div>


    <button
      class="secondary"
      onclick="addAddon()">

      + ADD STREMIO LIST

    </button>


    <br><br>


    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);

}


/* =========================================================
   ADD ADDON
========================================================= */

function addAddon(){

  const input =
    $("newAddonURL");


  if(!input){

    return;

  }


  const url =
    input.value.trim();


  if(!url){

    alert(
      "Paste a Stremio manifest URL first."
    );

    return;

  }


  if(
    !url.includes(
      "manifest.json"
    )
  ){

    alert(
      "The URL should point to a Stremio manifest.json."
    );

    return;

  }


  if(
    state.addons.includes(
      url
    )
  ){

    alert(
      "That list is already added."
    );

    return;

  }


  state.addons.push(
    url
  );


  saveState();

  openSettings();

}


/* =========================================================
   REMOVE ADDON
========================================================= */

function removeAddon(
  index
){

  state.addons.splice(
    index,
    1
  );


  saveState();

  openSettings();

}


/* =========================================================
   SAVE SETTINGS
========================================================= */

function saveSettings(){

  const metadata =
    $("metadataURL")
      ?.value
      .trim();


  const stream =
    $("streamURL")
      ?.value
      .trim();


  if(!metadata){

    alert(
      "Enter a metadata manifest."
    );

    return;

  }


  state.metadata =
    metadata;


  state.stream =
    stream ||
    "";


  saveState();


  closeModal();


  location.reload();

}


/* =========================================================
   UI
========================================================= */

function focusSearch(){

  $("searchInput")
    .focus();

}


function goHome(){

  location.reload();

}


function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* =========================================================
   START
========================================================= */

loadHome();

</script>

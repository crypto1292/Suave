<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#070510">

<title>SAUVE</title>

<style>
:root{
  --bg:#070510;
  --panel:#100a1c;
  --panel2:#171027;
  --pink:#ff20d5;
  --purple:#8b4dff;
  --cyan:#20eaff;
  --yellow:#ffd45a;
  --white:#fffaff;
  --muted:#a99bb5;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--white);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(139,77,255,.30),
      transparent 35%
    ),
    radial-gradient(
      circle at 0% 35%,
      rgba(255,32,213,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 55%,
      rgba(32,234,255,.10),
      transparent 30%
    ),
    #070510;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding-bottom:
    calc(80px + env(safe-area-inset-bottom));
}

/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    13px;

  background:
    rgba(7,5,16,.94);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border-bottom:
    1px solid rgba(255,32,213,.18);
}

.logo{
  text-align:center;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-style:italic;

  font-size:
    clamp(64px,18vw,112px);

  letter-spacing:7px;

  line-height:.8;

  transform:skewX(-7deg);

  color:white;

  text-shadow:
    0 0 4px white,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 40px var(--purple),
    5px 5px 0 rgba(32,234,255,.55);
}

.logo-sub{
  text-align:center;

  margin-top:12px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:4px;

  text-shadow:
    0 0 9px var(--cyan);
}

.searchbar{
  display:flex;

  gap:8px;

  max-width:900px;

  margin:18px auto 0;
}

.searchbar input{
  flex:1;

  min-width:0;

  padding:13px 14px;

  border-radius:8px;

  border:
    1px solid rgba(139,77,255,.35);

  background:#0f091b;

  color:white;

  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 16px rgba(255,32,213,.2);
}

.searchbar button{
  border:0;

  padding:0 18px;

  border-radius:8px;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  color:white;

  font-weight:900;

  box-shadow:
    0 0 15px rgba(255,32,213,.35);
}

/* =========================================================
   MAIN
========================================================= */

main{
  width:100%;
  max-width:1350px;

  margin:auto;

  padding:16px;
}

.hero{
  min-height:
    clamp(390px,58vh,600px);

  position:relative;

  overflow:hidden;

  border-radius:18px;

  display:flex;

  align-items:flex-end;

  padding:
    clamp(25px,5vw,55px);

  border:
    1px solid rgba(255,32,213,.25);

  background:
    radial-gradient(
      circle at 75% 35%,
      rgba(32,234,255,.14),
      transparent 25%
    ),
    radial-gradient(
      circle at 70% 70%,
      rgba(255,32,213,.18),
      transparent 30%
    ),
    linear-gradient(
      110deg,
      #090612,
      #190c30,
      #091326
    );
}

.hero:before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(7,5,16,.98),
      rgba(7,5,16,.70) 48%,
      rgba(7,5,16,.08)
    );
}

.hero-content{
  position:relative;
  z-index:2;

  max-width:700px;
}

.hero-kicker{
  color:var(--cyan);

  font-size:10px;

  letter-spacing:3px;

  font-weight:900;
}

.hero h1{
  margin:14px 0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:
    clamp(45px,9vw,95px);

  line-height:.86;

  text-transform:uppercase;

  text-shadow:
    0 0 20px rgba(255,32,213,.35);
}

.hero p{
  color:#c8bacf;

  line-height:1.6;

  font-size:14px;
}

.hero-buttons{
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:20px;
}

.primary,
.secondary{
  border-radius:8px;

  padding:13px 18px;

  font-weight:900;
}

.primary{
  border:0;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  color:white;
}

.secondary{
  background:
    rgba(32,234,255,.05);

  border:
    1px solid rgba(32,234,255,.4);

  color:var(--cyan);
}

/* =========================================================
   SECTION
========================================================= */

section{
  margin:32px 0;
}

.heading{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:15px;

  padding-bottom:10px;

  border-bottom:
    1px solid rgba(255,32,213,.18);
}

.heading h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:25px;

  letter-spacing:1px;
}

.heading span{
  color:var(--cyan);

  font-size:9px;

  letter-spacing:2px;

  font-weight:900;
}

/* =========================================================
   GRID
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:13px;
}

.card{
  border:
    1px solid rgba(255,255,255,.08);

  border-radius:10px;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #171027,
      #0e091b
    );

  color:white;

  padding:0;

  text-align:left;
}

.card:hover{
  border-color:
    rgba(255,32,213,.5);
}

.poster{
  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;

  display:block;

  background:#171027;
}

.card-info{
  padding:11px;
}

.card-title{
  font-weight:800;

  font-size:14px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.card-sub{
  margin-top:4px;

  color:var(--muted);

  font-size:10px;
}

.empty{
  padding:25px 5px;

  color:var(--muted);

  font-size:13px;
}

.notice{
  padding:15px;

  border-radius:9px;

  border:
    1px solid rgba(255,32,213,.16);

  background:
    rgba(255,32,213,.04);

  color:#c2b6c9;

  line-height:1.6;

  font-size:12px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.80);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:94vh;

  overflow:auto;

  padding:
    20px
    18px
    calc(30px + env(safe-area-inset-bottom));

  border-radius:
    22px 22px 0 0;

  border-top:
    1px solid rgba(255,32,213,.35);

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(139,77,255,.17),
      transparent 40%
    ),
    #0d081d;
}

.sheet-header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:27px;
}

.close{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#171027;

  color:var(--cyan);

  border:
    1px solid rgba(32,234,255,.3);

  font-size:22px;
}

/* =========================================================
   DETAILS
========================================================= */

.details{
  display:grid;

  grid-template-columns:
    105px 1fr;

  gap:16px;
}

.details img{
  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;
}

.details p{
  color:#c2b5cb;

  line-height:1.55;

  font-size:13px;
}

.meta{
  color:var(--cyan);

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:7px;
}

/* =========================================================
   SOURCES
========================================================= */

.source{
  width:100%;

  margin-top:9px;

  padding:14px;

  text-align:left;

  border-radius:9px;

  border:
    1px solid rgba(32,234,255,.15);

  background:
    linear-gradient(
      100deg,
      #140d29,
      #0d091b
    );

  color:white;
}

.source:hover{
  border-color:var(--cyan);

  box-shadow:
    0 0 15px rgba(32,234,255,.16);
}

.source-top{
  display:flex;

  align-items:center;

  gap:12px;
}

.source-icon{
  width:35px;
  height:35px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex:none;

  border-radius:50%;

  color:var(--cyan);

  background:
    rgba(32,234,255,.08);
}

.source-name{
  font-weight:900;
}

.provider{
  color:var(--cyan);

  text-transform:uppercase;

  font-size:9px;

  letter-spacing:1px;

  margin-top:4px;
}

.badges{
  margin-top:8px;
}

.badge{
  display:inline-block;

  padding:4px 7px;

  margin-right:5px;

  border-radius:5px;

  background:
    rgba(255,32,213,.10);

  color:#ff7ce4;

  font-size:8px;

  font-weight:900;

  letter-spacing:.7px;
}

.badge.ok{
  background:
    rgba(32,234,255,.10);

  color:var(--cyan);
}

.source-desc{
  margin-top:7px;

  color:#91859a;

  font-size:10px;
}

/* =========================================================
   PLAYER
========================================================= */

.player{
  width:100%;

  background:#000;

  border-radius:10px;

  overflow:hidden;

  border:
    1px solid rgba(32,234,255,.2);
}

video{
  width:100%;

  display:block;

  background:#000;

  max-height:70vh;
}

.player-info{
  padding:12px;

  background:#100a1e;
}

.player-info strong{
  display:block;
}

.player-info small{
  color:var(--muted);
}

/* =========================================================
   SETTINGS
========================================================= */

.field{
  margin:18px 0;
}

.field label{
  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;

  text-transform:uppercase;
}

.field input{
  width:100%;

  padding:13px;

  border-radius:7px;

  background:#080510;

  color:white;

  border:
    1px solid rgba(139,77,255,.3);

  outline:none;
}

/* =========================================================
   NAV
========================================================= */

.nav{
  position:fixed;

  z-index:400;

  bottom:0;

  left:0;
  right:0;

  height:76px;

  padding-bottom:
    env(safe-area-inset-bottom);

  display:flex;

  justify-content:space-around;

  align-items:center;

  background:
    rgba(8,5,17,.95);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-top:
    1px solid rgba(255,32,213,.18);
}

.nav button{
  border:0;

  background:none;

  color:#766a80;

  font-size:9px;

  letter-spacing:1px;
}

.nav button span{
  display:block;

  font-size:22px;

  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);

  text-shadow:
    0 0 10px var(--pink);
}

@media(min-width:700px){

  .grid{
    grid-template-columns:
      repeat(5,minmax(0,1fr));
  }

  .details{
    grid-template-columns:
      190px 1fr;
  }

  .details img{
    width:190px;
  }

}

</style>
</head>

<body>

<div class="app">

<header>

  <div class="logo">
    SAUVE
  </div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>


<main id="main">

  <div class="hero">

    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Your personal neon media interface.
        Connect your metadata and stream addon,
        then browse and play compatible sources.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="focusSearch()">

          ⌕ SEARCH

        </button>

        <button
          class="secondary"
          onclick="openSettings()">

          ⚙ SETTINGS

        </button>

      </div>

    </div>

  </div>


  <section>

    <div class="heading">

      <h2>
        TRENDING
      </h2>

      <span>
        AIO METADATA
      </span>

    </div>

    <div
      id="homeResults"
      class="empty">

      Loading…

    </div>

  </section>

</main>


<nav class="nav">

  <button
    class="active"
    onclick="goHome()">

    <span>⌂</span>
    HOME

  </button>

  <button
    onclick="focusSearch()">

    <span>⌕</span>
    SEARCH

  </button>

  <button
    onclick="openSettings()">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>

</div>


<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    ""

};


/* =========================================================
   BASIC HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char])
    );

}


function cleanManifest(url){

  return String(url || "")
    .trim()
    .replace(
      /\/manifest\.json\/?$/i,
      ""
    );

}


function addonRoot(url){

  return cleanManifest(url) + "/";
}


/* =========================================================
   FETCH
========================================================= */

async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          "Accept":
            "application/json"
        },
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  return response.json();

}


/* =========================================================
   MANIFEST
========================================================= */

async function getManifest(){

  return fetchJSON(
    state.metadata
  );

}


/* =========================================================
   CATALOG EXTRA
========================================================= */

function findSearchCatalog(
  manifest
){

  const catalogs =
    manifest.catalogs ||
    [];


  /*
    Prefer a movie catalog that
    advertises search.
  */

  let catalog =
    catalogs.find(
      c =>
        c.type === "movie" &&
        Array.isArray(c.extra) &&
        c.extra.some(
          x =>
            x.name === "search"
        )
    );


  if(catalog){
    return catalog;
  }


  /*
    Some manifests describe the
    search extra at the resource level.
  */

  const resource =
    (manifest.resources || [])
      .find(
        r =>
          typeof r === "object" &&
          r.name === "catalog"
      );


  if(resource){

    return {
      type:"movie",
      id:
        resource.idPrefixes
          ?.join("_") ||
        "movie",
      extra:[
        {name:"search"}
      ]
    };

  }


  return null;

}


/* =========================================================
   CATALOG REQUEST
========================================================= */

function catalogURL(
  manifestURL,
  catalog,
  search
){

  let url =
    addonRoot(
      manifestURL
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type ||
      "movie"
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );


  /*
    Catalog endpoints normally end
    in .json.
  */

  url += ".json";


  if(search){

    url +=
      "?search=" +
      encodeURIComponent(
        search
      );

  }


  return url;

}


/* =========================================================
   HOME
========================================================= */

async function loadHome(){

  const container =
    $("homeResults");


  container.innerHTML =
    `<div class="empty">
      Loading cinema…
    </div>`;


  try{

    const manifest =
      await getManifest();


    const catalogs =
      manifest.catalogs ||
      [];


    const catalog =
      catalogs.find(
        c =>
          c.type === "movie"
      );


    if(!catalog){

      container.innerHTML =
        `<div class="notice">
          Your metadata addon does not
          expose a movie catalog.
        </div>`;

      return;

    }


    const url =
      catalogURL(
        state.metadata,
        catalog,
        ""
      );


    const data =
      await fetchJSON(
        url
      );


    container.innerHTML =
      renderGrid(
        data.metas || []
      );


  }
  catch(error){

    container.innerHTML = `

      <div class="notice">

        <strong>
          METADATA CONNECTION FAILED
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        Check the metadata manifest
        in Settings.

      </div>

    `;

  }

}


/* =========================================================
   SEARCH
========================================================= */

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();


  if(!query){

    focusSearch();

    return;

  }


  $("main").innerHTML = `

    <section>

      <div class="heading">

        <h2>
          SEARCH
        </h2>

        <span>
          ${escapeHTML(
            query
          )}
        </span>

      </div>


      <div
        id="searchResults"
        class="empty">

        Searching…

      </div>

    </section>

  `;


  try{

    const manifest =
      await getManifest();


    const catalog =
      findSearchCatalog(
        manifest
      );


    if(!catalog){

      throw new Error(
        "Your metadata manifest does not advertise a searchable catalog."
      );

    }


    const url =
      catalogURL(
        state.metadata,
        catalog,
        query
      );


    const data =
      await fetchJSON(
        url
      );


    const results =
      data.metas ||
      [];


    $("searchResults")
      .innerHTML =
      renderGrid(
        results
      );


  }
  catch(error){

    $("searchResults")
      .innerHTML = `

        <div class="notice">

          <strong>
            SEARCH FAILED
          </strong>

          <br><br>

          ${escapeHTML(
            error.message
          )}

          <br><br>

          The search catalog may use a
          different resource or may not
          advertise search in its manifest.

        </div>

      `;

  }

}


/* =========================================================
   GRID
========================================================= */

function renderGrid(
  metas
){

  if(
    !metas ||
    !metas.length
  ){

    return `
      <div class="empty">
        No results found.
      </div>
    `;

  }


  return `

    <div class="grid">

      ${metas.map(
        item => `

          <button
            class="card"
            onclick="openTitle(
              '${encodeURIComponent(
                item.type ||
                "movie"
              )}',
              '${encodeURIComponent(
                item.id ||
                ""
              )}'
            )">

            <img
              class="poster"
              src="${escapeHTML(
                item.poster ||
                item.logo ||
                ""
              )}"
              loading="lazy"
              onerror="
                this.style.opacity='0'
              ">

            <div class="card-info">

              <div class="card-title">

                ${escapeHTML(
                  item.name ||
                  "Untitled"
                )}

              </div>

              <div class="card-sub">

                ${escapeHTML(
                  item.releaseInfo ||
                  item.year ||
                  ""
                )}

              </div>

            </div>

          </button>

        `
      ).join("")}

    </div>

  `;

}


/* =========================================================
   META
========================================================= */

async function openTitle(
  encodedType,
  encodedId
){

  const type =
    decodeURIComponent(
      encodedType
    );


  const id =
    decodeURIComponent(
      encodedId
    );


  openModal(`

    <div class="sheet-header">

      <h2>
        LOADING
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div class="empty">
      Loading title…
    </div>

  `);


  try{

    const url =
      addonRoot(
        state.metadata
      ) +
      "meta/" +
      encodeURIComponent(type) +
      "/" +
      encodeURIComponent(id) +
      ".json";


    const data =
      await fetchJSON(
        url
      );


    const meta =
      data.meta ||
      data;


    openModal(`

      <div class="sheet-header">

        <h2>

          ${escapeHTML(
            meta.name ||
            "TITLE"
          )}

        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>


      <div class="details">

        <img
          src="${escapeHTML(
            meta.poster ||
            meta.logo ||
            ""
          )}">


        <div>

          <div class="meta">

            ${escapeHTML(
              meta.releaseInfo ||
              meta.year ||
              ""
            )}

          </div>


          <p>

            ${escapeHTML(
              meta.description ||
              "No description available."
            )}

          </p>


          <button
            class="primary"
            id="sourceButton">

            ▶ FIND SOURCES

          </button>

        </div>

      </div>


      <div
        id="sources"
        style="margin-top:25px">

      </div>

    `);


    $("sourceButton")
      .onclick =
      () =>
        findSources(
          type,
          id
        );


  }
  catch(error){

    openModal(`

      <div class="sheet-header">

        <h2>
          ERROR
        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>


      <div class="notice">

        ${escapeHTML(
          error.message
        )}

      </div>

    `);

  }

}


/* =========================================================
   STREAM ENDPOINT
========================================================= */

function streamURL(
  manifestURL,
  type,
  id
){

  return (
    addonRoot(
      manifestURL
    ) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}


/* =========================================================
   SOURCE PROVIDER
========================================================= */

function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();


  const providers = [

    "2peckle",
    "4khdhub",
    "111477",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"

  ];


  for(
    const provider of providers
  ){

    if(
      text.includes(provider)
    ){

      return provider;

    }

  }


  return "unknown provider";

}


/* =========================================================
   FORMAT
========================================================= */

function formatName(
  stream
){

  const url =
    String(
      stream.url ||
      ""
    ).toLowerCase();


  const type =
    String(
      stream.type ||
      ""
    ).toLowerCase();


  if(
    type.includes("mpegurl") ||
    type.includes("m3u8") ||
    url.includes(".m3u8")
  ){

    return "HLS";

  }


  if(
    type.includes("mp4") ||
    url.includes(".mp4")
  ){

    return "MP4";

  }


  if(
    type.includes("webm") ||
    url.includes(".webm")
  ){

    return "WEBM";

  }


  return "HTTP";

}


/* =========================================================
   WEB READY
========================================================= */

function isNotWebReady(
  stream
){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}


/* =========================================================
   SOURCE DISPLAY
========================================================= */

function renderSource(
  stream,
  index
){

  const provider =
    providerName(
      stream
    );


  const format =
    formatName(
      stream
    );


  const external =
    Boolean(
      stream.externalUrl
    );


  const player =
    Boolean(
      stream.playerFrameUrl
    );


  const notReady =
    isNotWebReady(
      stream
    );


  let status =
    "AVAILABLE";


  if(player){

    status =
      "PLAYER AVAILABLE";

  }
  else if(external){

    status =
      "EXTERNAL PLAYER";

  }
  else if(notReady){

    status =
      "NOT WEB READY";

  }


  return `

    <button
      class="source"
      onclick="playSource(
        ${index}
      )">

      <div class="source-top">

        <div class="source-icon">
          ▶
        </div>

        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "STREAM"
            )}

          </div>

          <div class="provider">

            ${escapeHTML(
              provider
            )}

          </div>

        </div>

      </div>


      <div class="badges">

        <span class="badge ok">

          ${escapeHTML(
            format
          )}

        </span>


        <span class="badge">

          ${escapeHTML(
            status
          )}

        </span>


        ${
          stream.quality
          ?

          `<span class="badge">
            ${escapeHTML(
              stream.quality
            )}
          </span>`

          :

          ""
        }

      </div>


      <div class="source-desc">

        ${escapeHTML(
          stream.description ||
          "Source returned by stream addon."
        )}

      </div>

    </button>

  `;

}


/* =========================================================
   FIND SOURCES
========================================================= */

let currentStreams = [];


async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }


  $("sources").innerHTML = `

    <div class="empty">

      Scanning stream addon…

    </div>

  `;


  try{

    const data =
      await fetchJSON(
        streamURL(
          state.stream,
          type,
          id
        )
      );


    currentStreams =
      data.streams ||
      [];


    if(
      !currentStreams.length
    ){

      $("sources").innerHTML = `

        <div class="notice">

          The stream addon returned
          no sources for this title.

        </div>

      `;

      return;

    }


    /*
      Put likely browser-compatible
      formats first, but don't throw
      other sources away.
    */

    currentStreams.sort(
      (a,b) => {

        function score(s){

          let n = 0;


          if(
            s.playerFrameUrl
          ){

            n += 90;

          }


          if(
            s.externalUrl
          ){

            n += 80;

          }


          if(
            !isNotWebReady(s)
          ){

            n += 30;

          }


          const format =
            formatName(s);


          if(
            format === "MP4"
          ){

            n += 40;

          }

          else if(
            format === "HLS"
          ){

            n += 35;

          }

          else if(
            format === "WEBM"
          ){

            n += 30;

          }


          if(
            providerName(s)
            ===
            "2peckle"
          ){

            n += 10;

          }


          return n;

        }


        return score(b) -
               score(a);

      }
    );


    $("sources").innerHTML = `

      <div class="heading">

        <h2>
          SOURCES
        </h2>

        <span>
          ${currentStreams.length}
        </span>

      </div>


      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    $("sources").innerHTML = `

      <div class="notice">

        <strong>
          STREAM CONNECTION FAILED
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================================
   SOURCE PLAYBACK
========================================================= */

function playSource(
  index
){

  const stream =
    currentStreams[index];


  if(!stream){

    return;

  }


  /*
    1. Provider supplied an iframe/player.
  */

  if(
    stream.playerFrameUrl
  ){

    openPlayerFrame(
      stream
        .playerFrameUrl
    );

    return;

  }


  /*
    2. Provider supplied an external
       destination.
  */

  if(
    stream.externalUrl
  ){

    openExternal(
      stream.externalUrl
    );

    return;

  }


  /*
    3. No direct browser source.
  */

  if(
    stream.behaviorHints
      ?.notWebReady
  ){

    openModal(`

      <div class="sheet-header">

        <h2>
          SOURCE NOT WEB READY
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>


      <div class="notice">

        This provider returned a source
        that is specifically marked as
        not web-ready.

        <br><br>

        Safari cannot safely turn that
        into a playable browser stream
        without the provider's supported
        playback mechanism.

        <br><br>

        Try another source.

      </div>

    `);

    return;

  }


  /*
    4. Direct URL.
  */

  if(stream.url){

    playDirect(
      stream
    );

    return;

  }


  openModal(`

    <div class="sheet-header">

      <h2>
        UNSUPPORTED SOURCE
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="notice">

      This source does not contain a
      browser-playable URL, external
      URL, or player URL.

    </div>

  `);

}


/* =========================================================
   DIRECT PLAYER
========================================================= */

function playDirect(
  stream
){

  const url =
    stream.url;


  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="player">

      <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">

      </video>


      <div class="player-info">

        <strong>

          ${escapeHTML(
            stream.name ||
            stream.title ||
            "SAUVE"
          )}

        </strong>

        <small id="status">

          Loading source…

        </small>

      </div>

    </div>

  `);


  const video =
    $("video");


  const status =
    $("status");


  video.src =
    url;


  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready";

    },
    {
      once:true
    }
  );


  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

    }
  );


  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );


  video.addEventListener(
    "error",
    () => {

      status.textContent =
        "Safari could not play this direct source.";

    }
  );


  video.load();

}


/* =========================================================
   PLAYER FRAME
========================================================= */

function openPlayerFrame(
  url
){

  openModal(`

    <div class="sheet-header">

      <h2>
        PROVIDER PLAYER
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div
      style="
        position:relative;
        width:100%;
        aspect-ratio:16/9;
        background:#000;
        border-radius:10px;
        overflow:hidden;
      ">

      <iframe
        src="${escapeHTML(url)}"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        style="
          position:absolute;
          inset:0;
          width:100%;
          height:100%;
          border:0;
        ">
      </iframe>

    </div>

  `);

}


/* =========================================================
   EXTERNAL
========================================================= */

function openExternal(
  url
){

  openModal(`

    <div class="sheet-header">

      <h2>
        EXTERNAL PLAYER
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="notice">

      This source is supplied as an
      external destination rather than
      a browser video stream.

      <br><br>

      <button
        class="primary"
        onclick="
          window.open(
            ${JSON.stringify(url)},
            '_blank'
          )
        ">

        OPEN SOURCE

      </button>

    </div>

  `);

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>


    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        placeholder="Paste your stream manifest"
        value="${escapeHTML(
          state.stream
        )}">

    </div>


    <div class="notice">

      SAUVE stores only the manifest
      addresses locally.

      <br><br>

      It does not request or store
      your Real-Debrid API key.

    </div>


    <br>


    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);

}


function saveSettings(){

  const metadata =
    $("metadataURL")
      .value
      .trim();


  const stream =
    $("streamURL")
      .value
      .trim();


  if(!metadata){

    alert(
      "Metadata manifest required."
    );

    return;

  }


  state.metadata =
    metadata;


  state.stream =
    stream;


  localStorage.setItem(
    "sauve_metadata",
    metadata
  );


  localStorage.setItem(
    "sauve_stream",
    stream
  );


  closeModal();

  goHome();

}


/* =========================================================
   NAVIGATION
========================================================= */

function focusSearch(){

  $("searchInput")
    .focus();

}


function goHome(){

  location.reload();

}


function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* =========================================================
   START
========================================================= */

loadHome();

</script>

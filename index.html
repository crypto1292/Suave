<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#05030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#160b27;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --text:#fff;
  --muted:#a999b0;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  overflow-x:hidden;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(138,77,255,.38),
      transparent 34%
    ),
    radial-gradient(
      circle at 0 35%,
      rgba(255,22,216,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 50%,
      rgba(25,234,255,.10),
      transparent 30%
    ),
    #05030b;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
  color:inherit;
}

/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    14px;

  background:rgba(5,3,11,.91);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border-bottom:
    1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-style:italic;

  font-size:
    clamp(70px,19vw,125px);

  line-height:.78;

  letter-spacing:8px;

  transform:skewX(-7deg);

  color:#fff;

  text-shadow:
    0 0 4px #fff,
    0 0 10px var(--pink),
    0 0 24px var(--pink),
    0 0 48px var(--purple),
    7px 5px 0 rgba(25,234,255,.5);
}

.logo-sub{
  margin-top:14px;

  text-align:center;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:4px;

  text-shadow:0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;

  max-width:900px;

  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;

  padding:14px;

  border-radius:9px;

  background:#0c0715;

  color:#fff;

  border:
    1px solid rgba(138,77,255,.45);

  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 18px rgba(255,22,216,.2);
}

.searchbar button{
  padding:0 18px;

  border:0;
  border-radius:9px;

  color:#fff;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    0 0 18px rgba(255,22,216,.18);
}

/* =========================================================
   MAIN
========================================================= */

main{
  max-width:1500px;

  margin:auto;

  padding:
    14px
    14px
    105px;
}

/* =========================================================
   HERO
========================================================= */

.hero{
  position:relative;

  min-height:
    clamp(400px,62vh,650px);

  overflow:hidden;

  display:flex;
  align-items:flex-end;

  border-radius:18px;

  margin-bottom:30px;

  border:
    1px solid rgba(255,22,216,.25);

  background:
    radial-gradient(
      circle at 75% 30%,
      rgba(25,234,255,.18),
      transparent 28%
    ),
    radial-gradient(
      circle at 75% 80%,
      rgba(255,22,216,.25),
      transparent 35%
    ),
    linear-gradient(
      110deg,
      #08040f,
      #190a2c,
      #07131d
    );
}

.hero-image{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:.7;

  display:none;
}

.hero.has-image .hero-image{
  display:block;
}

.hero:before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(5,3,11,.98) 0%,
      rgba(5,3,11,.82) 35%,
      rgba(5,3,11,.3) 75%,
      rgba(5,3,11,.1)
    );

  z-index:1;
}

.hero:after{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      0deg,
      rgba(5,3,11,.98),
      transparent 55%
    );

  z-index:2;
}

.hero-content{
  position:relative;
  z-index:3;

  width:100%;

  max-width:700px;

  padding:
    clamp(25px,6vw,60px);
}

.hero-kicker{
  color:var(--cyan);

  font-size:10px;

  font-weight:900;

  letter-spacing:3px;

  text-shadow:
    0 0 12px var(--cyan);
}

.hero h1{
  margin:13px 0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:
    clamp(46px,10vw,100px);

  line-height:.84;

  text-transform:uppercase;

  text-shadow:
    0 0 20px rgba(255,22,216,.4);
}

.hero p{
  color:#d0c3d6;

  line-height:1.6;

  font-size:14px;

  max-width:620px;
}

.hero-buttons{
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:20px;
}

.primary,
.secondary{
  padding:13px 18px;

  border-radius:8px;

  font-weight:900;
}

.primary{
  border:0;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    0 0 20px rgba(255,22,216,.25);
}

.secondary{
  background:
    rgba(25,234,255,.05);

  border:
    1px solid rgba(25,234,255,.4);

  color:var(--cyan);
}

/* =========================================================
   ROWS
========================================================= */

.content-section{
  margin:
    28px 0
    34px;
}

.section-heading{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:12px;

  padding-bottom:9px;

  border-bottom:
    1px solid rgba(255,22,216,.15);
}

.section-heading h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:25px;

  letter-spacing:1px;
}

.section-heading span{
  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;
}

.row{
  display:flex;

  gap:12px;

  overflow-x:auto;

  overflow-y:hidden;

  padding:
    3px
    3px
    13px;

  scroll-snap-type:x proximity;

  scrollbar-width:none;
}

.row::-webkit-scrollbar{
  display:none;
}

.poster-card{
  flex:
    0 0
    145px;

  width:145px;

  border:0;

  padding:0;

  background:transparent;

  text-align:left;

  scroll-snap-align:start;
}

.poster-wrap{
  position:relative;

  width:100%;

  aspect-ratio:2/3;

  overflow:hidden;

  border-radius:9px;

  background:#150c24;

  border:
    1px solid rgba(255,255,255,.08);

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);
}

.poster-card:hover .poster-wrap,
.poster-card:active .poster-wrap{
  border-color:var(--pink);

  box-shadow:
    0 0 18px rgba(255,22,216,.25);
}

.poster{
  display:block;

  width:100%;
  height:100%;

  object-fit:cover;
}

.poster-fallback{
  display:flex;

  align-items:center;
  justify-content:center;

  width:100%;
  height:100%;

  padding:10px;

  text-align:center;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:18px;

  background:
    linear-gradient(
      135deg,
      #180a2b,
      #07131d
    );
}

.poster-gradient{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:35%;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.9)
    );
}

.poster-type{
  position:absolute;

  top:7px;
  left:7px;

  padding:4px 6px;

  border-radius:5px;

  background:
    rgba(0,0,0,.7);

  color:var(--cyan);

  font-size:7px;

  font-weight:900;

  letter-spacing:1px;
}

.poster-badges{
  position:absolute;

  left:6px;
  right:6px;
  bottom:7px;

  display:flex;

  flex-wrap:wrap;

  gap:4px;

  z-index:3;
}

.poster-badge{
  max-width:100%;

  padding:4px 6px;

  border-radius:4px;

  background:
    rgba(0,0,0,.78);

  border:
    1px solid rgba(255,255,255,.16);

  font-size:7px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.card-title{
  margin-top:8px;

  font-size:12px;

  font-weight:850;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.card-sub{
  margin-top:4px;

  color:var(--muted);

  font-size:9px;
}

/* =========================================================
   BADGES
========================================================= */

.fusion-badges{
  display:flex;

  flex-wrap:wrap;

  gap:5px;

  margin-top:8px;
}

.fusion-badge{
  display:inline-flex;

  align-items:center;

  max-width:130px;

  min-height:22px;

  overflow:hidden;

  border-radius:5px;

  background:
    rgba(255,255,255,.05);

  border:
    1px solid rgba(255,255,255,.12);
}

.fusion-badge img{
  display:block;

  max-width:120px;

  max-height:28px;

  object-fit:contain;
}

.fusion-badge span{
  padding:
    4px
    7px;

  font-size:8px;

  font-weight:900;
}

/* =========================================================
   NOTICE
========================================================= */

.notice{
  padding:15px;

  border-radius:9px;

  background:
    rgba(255,22,216,.045);

  border:
    1px solid rgba(255,22,216,.16);

  color:#c8bacf;

  line-height:1.6;

  font-size:12px;
}

.empty{
  padding:25px 5px;

  color:var(--muted);

  font-size:13px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.87);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:96vh;

  overflow:auto;

  padding:
    20px
    18px
    calc(30px + env(safe-area-inset-bottom));

  border-radius:
    22px
    22px
    0
    0;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(138,77,255,.2),
      transparent 40%
    ),
    #0c0718;

  border-top:
    1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:28px;
}

.close{
  width:40px;
  height:40px;

  flex:0 0 auto;

  border-radius:50%;

  background:#170d27;

  color:var(--cyan);

  border:
    1px solid rgba(25,234,255,.3);

  font-size:22px;
}

/* =========================================================
   DETAILS
========================================================= */

.details{
  display:grid;

  grid-template-columns:
    105px 1fr;

  gap:16px;
}

.details img{
  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;
}

.details p{
  color:#c3b5cb;

  line-height:1.55;

  font-size:13px;
}

.meta{
  color:var(--cyan);

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:7px;
}

/* =========================================================
   SOURCE LIST
========================================================= */

.source{
  width:100%;

  margin-top:9px;

  padding:14px;

  text-align:left;

  color:white;

  border-radius:9px;

  background:
    linear-gradient(
      100deg,
      #150c29,
      #0d0819
    );

  border:
    1px solid rgba(25,234,255,.15);
}

.source:not(:disabled):active{
  transform:scale(.985);
}

.source:disabled{
  opacity:.55;

  cursor:not-allowed;
}

.source-top{
  display:flex;

  align-items:center;

  gap:12px;
}

.source-icon{
  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  flex:0 0 auto;

  border-radius:50%;

  color:var(--cyan);

  background:
    rgba(25,234,255,.08);
}

.source-name{
  font-weight:900;

  word-break:break-word;
}

.provider{
  margin-top:4px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;
}

.badges{
  display:flex;

  flex-wrap:wrap;

  gap:5px;

  margin-top:9px;
}

.badge{
  display:inline-block;

  padding:4px 7px;

  border-radius:5px;

  background:
    rgba(255,22,216,.10);

  color:#ff7be4;

  font-size:8px;

  font-weight:900;

  letter-spacing:.7px;
}

.badge.good{
  background:
    rgba(66,255,176,.10);

  color:var(--green);
}

.badge.warning{
  background:
    rgba(255,212,90,.10);

  color:var(--yellow);
}

.source-desc{
  margin-top:8px;

  color:#91859b;

  font-size:10px;

  line-height:1.45;
}

/* =========================================================
   PLAYER
========================================================= */

.player-shell{
  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#000;

  border:
    1px solid rgba(25,234,255,.25);

  box-shadow:
    0 0 30px rgba(25,234,255,.08);
}

video{
  display:block;

  width:100%;

  max-height:70vh;

  background:#000;
}

iframe{
  display:block;

  width:100%;
  height:100%;

  border:0;

  background:#000;
}

.iframe-player{
  width:100%;

  aspect-ratio:16/9;

  background:#000;
}

.player-status{
  padding:11px 13px;

  background:#0e0818;

  border-top:
    1px solid rgba(255,255,255,.07);

  color:#aaa;

  font-size:11px;
}

.player-status.ready{
  color:var(--green);
}

.player-status.error{
  color:var(--red);
}

.player-controls{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:12px;
}

.player-button{
  padding:10px 13px;

  border-radius:7px;

  color:white;

  background:#170d27;

  border:
    1px solid rgba(255,255,255,.1);

  font-weight:800;

  font-size:11px;
}

.player-button.primary{
  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  border:0;
}

/* =========================================================
   SETTINGS
========================================================= */

.field{
  margin:18px 0;
}

.field label{
  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;

  text-transform:uppercase;
}

.field input{
  width:100%;

  padding:13px;

  border-radius:7px;

  background:#080510;

  color:white;

  border:
    1px solid rgba(138,77,255,.3);

  outline:none;
}

/* =========================================================
   NAV
========================================================= */

.nav{
  position:fixed;

  z-index:400;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  padding-bottom:
    env(safe-area-inset-bottom);

  display:flex;

  align-items:center;
  justify-content:space-around;

  background:
    rgba(8,5,17,.96);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-top:
    1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;

  background:none;

  color:#766a80;

  font-size:9px;

  letter-spacing:1px;
}

.nav button span{
  display:block;

  font-size:22px;

  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);

  text-shadow:
    0 0 10px var(--pink);
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  main{
    padding-left:28px;
    padding-right:28px;
  }

  .poster-card{
    flex-basis:180px;
    width:180px;
  }

  .details{
    grid-template-columns:
      190px 1fr;
  }

  .details img{
    width:190px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    SAUVE
  </div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>


<main id="main">

  <div
    id="hero"
    class="hero">

    <img
      id="heroImage"
      class="hero-image"
      alt="">

    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Your neon cinema for movies,
        television and streaming sources.
        Browse titles, explore categories
        and find available sources.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button
          class="secondary"
          onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>

    </div>

  </div>


  <div id="contentRows">

    <div class="empty">
      Loading SAUVE…
    </div>

  </div>

</main>


<nav class="nav">

  <button
    class="active"
    onclick="goHome()">

    <span>⌂</span>
    HOME

  </button>

  <button
    onclick="focusSearch()">

    <span>⌕</span>
    SEARCH

  </button>

  <button
    onclick="openSettings()">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>


<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";


const DEFAULT_BADGES =
"https://pastebin.com/raw/gyj0HUuE";


const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    "",

  badges:
    localStorage.getItem(
      "sauve_badges"
    ) ||
    DEFAULT_BADGES

};


let badgeData = {};

let currentStreams = [];

let currentPlayableStreams = [];

let currentPlayerIndex = 0;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}


function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(
      /\/manifest\.json\/?$/i,
      ""
    );

}


function addonRoot(url){

  return normalizeManifest(url) + "/";
}


async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:"application/json,text/plain,*/*"
        },
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  return response.json();

}


/* =========================================================
   BADGE LOADER
========================================================= */

async function loadBadges(){

  try{

    const response =
      await fetch(
        state.badges,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Badge feed returned HTTP " +
        response.status
      );

    }


    const text =
      await response.text();


    /*
      Accept several common Fusion
      badge-feed structures.
    */

    let parsed = null;


    try{

      parsed =
        JSON.parse(text);

    }
    catch{

      parsed = null;

    }


    if(parsed){

      if(Array.isArray(parsed)){

        badgeData =
          convertBadgeArray(parsed);

      }
      else if(parsed.badges){

        badgeData =
          convertBadgeArray(
            parsed.badges
          );

      }
      else{

        badgeData =
          parsed;

      }

    }
    else{

      badgeData =
        parseBadgeText(text);

    }

  }
  catch(error){

    console.warn(
      "Badge feed unavailable:",
      error
    );

    badgeData = {};

  }

}


function convertBadgeArray(
  list
){

  const output = {};

  list.forEach(
    item => {

      if(!item) return;


      const id =
        item.id ||
        item.imdb_id ||
        item.imdbId ||
        item.title ||
        item.name;


      if(!id) return;


      output[
        String(id)
      ] = item;

    }
  );


  return output;

}


function parseBadgeText(
  text
){

  const output = {};


  /*
    Basic support for lines such as:

    tt1234567|https://example.com/badge.png

    or

    tt1234567,https://example.com/badge.png
  */

  text
    .split(/\r?\n/)
    .forEach(
      line => {

        const clean =
          line.trim();


        if(!clean) return;


        const parts =
          clean.split(
            /[|,;]\s*/
          );


        if(parts.length >= 2){

          output[
            parts[0].trim()
          ] = {
            url:
              parts[1].trim()
          };

        }

      }
    );


  return output;

}


/* =========================================================
   BADGE LOOKUP
========================================================= */

function badgeCandidates(
  meta
){

  const values = [];


  [
    meta?.id,
    meta?.imdb_id,
    meta?.imdbId,
    meta?.tmdb_id,
    meta?.tmdbId
  ]
  .filter(Boolean)
  .forEach(
    value =>
      values.push(
        String(value)
      )
  );


  return values;

}


function findBadges(
  meta
){

  const candidates =
    badgeCandidates(
      meta
    );


  for(
    const id
    of candidates
  ){

    if(
      badgeData[id]
    ){

      return normalizeBadgeEntry(
        badgeData[id]
      );

    }

  }


  return [];

}


function normalizeBadgeEntry(
  entry
){

  if(!entry){

    return [];

  }


  if(typeof entry === "string"){

    return [
      {
        url:entry
      }
    ];

  }


  if(Array.isArray(entry)){

    return entry
      .map(
        item =>
          typeof item === "string"
            ? {url:item}
            : item
      )
      .filter(
        item =>
          item &&
          (
            item.url ||
            item.image ||
            item.src
          )
      );

  }


  const urls = [];


  [
    entry.url,
    entry.image,
    entry.src,
    entry.badge,
    entry.badgeUrl
  ]
  .filter(Boolean)
  .forEach(
    url =>
      urls.push({
        url
      })
  );


  if(Array.isArray(entry.badges)){

    entry.badges.forEach(
      badge => {

        if(
          typeof badge === "string"
        ){

          urls.push({
            url:badge
          });

        }
        else if(badge){

          urls.push(
            badge
          );

        }

      }
    );

  }


  return urls;

}


function renderFusionBadges(
  meta
){

  const badges =
    findBadges(
      meta
    );


  if(!badges.length){

    return "";

  }


  return `

    <div class="fusion-badges">

      ${badges
        .slice(0,5)
        .map(
          badge => {

            const url =
              badge.url ||
              badge.image ||
              badge.src ||
              "";


            if(!url){

              return "";

            }


            return `

              <div
                class="fusion-badge">

                <img
                  src="${escapeHTML(url)}"
                  alt=""
                  onerror="
                    this.parentElement.style.display='none'
                  ">

              </div>

            `;

          }
        )
        .join("")}

    </div>

  `;

}


/* =========================================================
   METADATA
========================================================= */

async function getManifest(){

  return fetchJSON(
    state.metadata
  );

}


function supportsExtra(
  catalog,
  name
){

  return Array.isArray(
    catalog.extra
  )
  &&
  catalog.extra.some(
    extra =>
      typeof extra === "string"
        ? extra === name
        : extra &&
          extra.name === name
  );

}


function getSearchCatalogs(
  manifest
){

  const catalogs =
    Array.isArray(
      manifest.catalogs
    )
      ? manifest.catalogs
      : [];


  return catalogs.filter(
    catalog =>
      catalog &&
      catalog.id &&
      catalog.type &&
      supportsExtra(
        catalog,
        "search"
      )
  );

}


function makeExtraProps(
  values
){

  return Object.entries(
    values
  )
  .filter(
    ([,value]) =>
      value !== undefined &&
      value !== null &&
      String(value).length
  )
  .map(
    ([key,value]) =>
      key +
      "=" +
      encodeURIComponent(
        String(value)
      )
  )
  .join("&");

}


function buildCatalogURL(
  catalog,
  extra={}
){

  let url =
    addonRoot(
      state.metadata
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );


  const props =
    makeExtraProps(
      extra
    );


  if(props){

    url +=
      "/" +
      props;

  }


  return url + ".json";

}


/* =========================================================
   TITLE KEYS
========================================================= */

function titleText(
  meta
){

  return String(
    [
      meta?.name,
      meta?.title,
      meta?.description,
      meta?.genres?.join?.(" "),
      meta?.genre?.join?.(" "),
      meta?.director?.join?.(" "),
      meta?.cast?.join?.(" "),
      meta?.network,
      meta?.studio
    ]
    .filter(Boolean)
    .join(" ")
  )
  .toLowerCase();

}


function containsAny(
  text,
  values
){

  return values.some(
    value =>
      text.includes(
        value
      )
  );

}


/* =========================================================
   CATEGORY CLASSIFICATION
========================================================= */

function classifyTitle(
  meta
){

  const text =
    titleText(
      meta
    );


  const rows = [];


  /*
    Provider/network metadata is used
    when available. This does not claim
    that a title is currently available
    from that service.
  */

  if(
    containsAny(
      text,
      [
        "netflix",
        "netflix original"
      ]
    )
  ){

    rows.push(
      "Netflix"
    );

  }


  if(
    containsAny(
      text,
      [
        "disney",
        "disney+",
        "disney plus",
        "pixar",
        "marvel",
        "star wars"
      ]
    )
  ){

    rows.push(
      "Disney+"
    );

  }


  if(
    containsAny(
      text,
      [
        "apple tv",
        "apple tv+",
        "apple original"
      ]
    )
  ){

    rows.push(
      "Apple TV+"
    );

  }


  if(
    containsAny(
      text,
      [
        "hbo",
        "max original",
        "hbo max"
      ]
    )
  ){

    rows.push(
      "HBO / Max"
    );

  }


  if(
    containsAny(
      text,
      [
        "amazon",
        "prime video",
        "amazon original"
      ]
    )
  ){

    rows.push(
      "Prime Video"
    );

  }


  return rows;

}


/* =========================================================
   DEDUPE
========================================================= */

function dedupeMetas(
  metas
){

  const seen =
    new Set();


  return metas.filter(
    item => {

      if(!item) return false;


      const key =
        String(
          item.type || ""
        ) +
        "|" +
        String(
          item.id || ""
        );


      if(
        seen.has(key)
      ){

        return false;

      }


      seen.add(key);

      return true;

    }
  );

}

){

  const type =
    encodeURIComponent(

      .slice(0,3)
      .map(

          return `

              <img
                src="${escapeHTML(url)}"
                style="

                  max-height:18px;

                alt=""
                onerror="
                  this.parentElement.style.display='none'

              alt="${escapeHTML(
                item.name || ""
              )}"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='flex';

            <div
              class="poster-fallback"

                item.name ||

            `

            :

            `

            <div
              class="poster-fallback">

              ${escapeHTML(
                item.name ||
                "SAUVE"
              )}

            </div>

            `

        <div class="poster-type">

            String(
              item.type ||
              ""
            ).toUpperCase()

        </div>


        ${
          badgeHTML

            ?

            `

            <div
              class="poster-badges">

            </div>

            `

/* =========================================================
   HOME
========================================================= */

async function loadHome(){

  const container =
    $("contentRows");


  try{

    await loadBadges();


    const manifest =
      await getManifest();


    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];


    const selected =
      catalogs.filter(
        catalog =>
          catalog &&
          (
            catalog.type ===
              "movie" ||

            catalog.type ===
              "series"
          )
      );


    if(!selected.length){

      container.innerHTML = `

        <div class="notice">

          No movie or television catalogs
          were advertised by your metadata
          addon.

        </div>

      `;

      return;

    }


    const responses =
      await Promise.allSettled(
        selected
          .slice(0,10)
          .map(
            catalog =>
              fetchJSON(
                buildCatalogURL(
                  catalog
                )
              )
          )
      );


    let metas = [];


    responses.forEach(
      result => {

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );


    metas =
      dedupeMetas(
        metas
      );


    if(!metas.length){

      container.innerHTML = `

        <div class="notice">

          Your metadata addon responded,
          but did not return titles for the
          homepage catalogs.

        </div>

      `;

      return;

    }


    const movies =
      metas.filter(
        item =>
          item.type === "movie"
      );


    const series =
      metas.filter(
        item =>
          item.type === "series"
      );


    const netflix = [];

    const disney = [];

    const apple = [];

    const hbo = [];

    const prime = [];


    metas.forEach(
      item => {

        const rows =
          classifyTitle(
            item
          );


        if(
          rows.includes(
            "Netflix"
          )
        ){

          netflix.push(
            item
          );

        }


        if(
          rows.includes(
            "Disney+"
          )
        ){

          disney.push(
            item
          );

        }


        if(
          rows.includes(
            "Apple TV+"
          )
        ){

          apple.push(
            item
          );

        }


        if(
          rows.includes(
            "HBO / Max"
          )
        ){

          hbo.push(
            item
          );

        }


        if(
          rows.includes(
            "Prime Video"
          )
        ){

          prime.push(
            item
          );

        }

      }
    );


    const featured =
      metas
        .slice()
        .sort(
          (a,b) =>
            (
              Number(
                b.imdbRating ||
                b.rating ||
                0
              )
            )
            -
            (
              Number(
                a.imdbRating ||
                a.rating ||
                0
              )
            )
        )
        .slice(
          0,
          12
        );


    const popularMovies =
      movies.slice(
        0,
        25
      );


    const popularSeries =
      series.slice(
        0,
        25
      );


    let html = "";


    html +=
      renderRow(
        "Featured",
        featured,
        "SAUVE"
      );


    if(
      netflix.length
    ){

      html +=
        renderRow(
          "Netflix",
          netflix,
          "NETFLIX"
        );

    }


    if(
      disney.length
    ){

      html +=
        renderRow(
          "Disney+",
          disney,
          "DISNEY"
        );

    }


    if(
      apple.length
    ){

      html +=
        renderRow(
          "Apple TV+",
          apple,
          "APPLE"
        );

    }


    if(
      hbo.length
    ){

      html +=
        renderRow(
          "HBO / Max",
          hbo,
          "MAX"
        );

    }


    if(
      prime.length
    ){

      html +=
        renderRow(
          "Prime Video",
          prime,
          "PRIME"
        );

    }


    html +=
      renderRow(
        "Popular Movies",
        popularMovies,
        "MOVIES"
      );


    html +=
      renderRow(
        "Popular Television",
        popularSeries,
        "SERIES"
      );


    /*
      Always give the user a useful
      Netflix-style row even when provider
      metadata isn't present.
    */

    if(
      !netflix.length &&
      !disney.length &&
      !apple.length &&
      !hbo.length &&
      !prime.length
    ){

      html =
        renderRow(
          "Movies",
          popularMovies,
          "MOVIES"
        ) +

        renderRow(
          "Television",
          popularSeries,
          "SERIES"
        );

    }


    container.innerHTML =
      html;


    setupHero(
      featured[0] ||
      metas[0]
    );

  }
  catch(error){

    container.innerHTML = `

      <div class="notice">

        <strong>
          SAUVE COULD NOT LOAD
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        Open Settings and verify your
        metadata manifest.

      </div>

    `;

  }

}

/* =========================================================
   SEARCH
========================================================= */

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();


  if(!query){

    focusSearch();

    return;

  }


  $("main").innerHTML = `

    <section>

      <div class="section-heading">

        <h2>
          SEARCH
        </h2>

        <span>
          ${escapeHTML(query)}
        </span>

      </div>


      <div
        id="searchResults"
        class="empty">

        Searching…

      </div>

    </section>

  `;


  try{

    await loadBadges();


    const manifest =
      await getManifest();


    const catalogs =
      getSearchCatalogs(
        manifest
      );


    if(!catalogs.length){

      throw new Error(
        "No searchable catalogs were advertised by the metadata manifest."
      );

    }


    const responses =
      await Promise.allSettled(
        catalogs.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog,
                {
                  search:query
                }
              )
            )
        )
      );


    let metas = [];


    responses.forEach(
      result => {

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );


    metas =
      dedupeMetas(
        metas
      );


    $("searchResults")
      .outerHTML =

      metas.length

        ?

        `

        <div
          id="searchResults">

          ${renderSearchRows(
            metas
          )}

        </div>

        `

        :

        `

        <div
          id="searchResults"
          class="notice">

          No results found for
          <strong>
            ${escapeHTML(query)}
          </strong>.

        </div>

        `;

  }
  catch(error){

    const results =
      $("searchResults");


    if(results){

      results.innerHTML = `

        <div class="notice">

          <strong>
            SEARCH FAILED
          </strong>

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

    }

  }

}


function renderSearchRows(
  metas
){

  const movies =
    metas.filter(
      item =>
        item.type === "movie"
    );


  const series =
    metas.filter(
      item =>
        item.type === "series"
    );


  let html = "";


  html +=
    renderRow(
      "Movies",
      movies,
      "SEARCH"
    );


  html +=
    renderRow(
      "Television",
      series,
      "SEARCH"
    );


  if(!html){

    html =

        "Results",

      );

  }


  return html;

}

function buildStreamURL(

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}


/* =========================================================
   STREAM HELPERS
========================================================= */

function getStreamURL(
  stream
){

  return String(
    stream?.url ||
    ""
  ).trim();

}


function isNotWebReady(
  stream
){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}


function isPlayerFrame(
  stream
){

  return Boolean(
    stream?.playerFrameUrl
  );

}


function isExternal(
  stream
){

  return Boolean(
    stream?.externalUrl
  );

}


function isHLS(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();


  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();


  return (
    type.includes("mpegurl") ||
    type.includes("m3u8") ||
    url.includes(".m3u8")
  );

}


function isMP4(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();


  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();


  return (
    type.includes("mp4") ||
    url.includes(".mp4")
  );

}


function isWebM(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();


  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();


  return (
    type.includes("webm") ||
    url.includes(".webm")
  );

}


function isPlayableCandidate(
  stream
){

  if(
    isPlayerFrame(stream)
  ){

    return true;

  }


  if(
    isExternal(stream)
  ){

    return false;

  }


  return (
    isHLS(stream) ||
    isMP4(stream) ||
    isWebM(stream)
  );

}


function compatibilityScore(
  stream
){

  let score = 0;


  if(
    isMP4(stream)
  ){

    score += 100;

  }


  if(
    isHLS(stream)
  ){

    score += 90;

  }


  if(
    isWebM(stream)
  ){

    score += 80;

  }


  if(
    isPlayerFrame(stream)
  ){

    score += 70;

  }


  if(
    isExternal(stream)
  ){

    score -= 100;

  }


  return score;

}


function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();


  const providers = [
    "2peckle",
    "pengu",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"
  ];


  for(
    const name
    of providers
  ){

    if(
      text.includes(name)
    ){

      return name;

    }

  }


  return "stream source";

}


/* =========================================================
   SOURCE UI
========================================================= */

function renderSource(
  stream,
  index
){

  const playable =
    isPlayableCandidate(
      stream
    );


  let format =
    "SOURCE";


  if(
    isMP4(stream)
  ){

    format =
      "MP4";

  }
  else if(
    isHLS(stream)
  ){

    format =
      "HLS";

  }
  else if(
    isWebM(stream)
  ){

    format =
      "WEBM";

  }
  else if(
    isPlayerFrame(stream)
  ){

    format =
      "PLAYER";

  }


  return `

    <button
      class="source"
      ${
        playable
          ?
          `onclick="playSource(${index})"`
          :
          `disabled`
      }>


      <div class="source-top">

        <div class="source-icon">

          ${
            playable
              ? "▶"
              : "×"
          }

        </div>


        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>


          <div class="provider">

            ${escapeHTML(
              providerName(
                stream
              )
            )}

          </div>

        </div>

      </div>


      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : ""}
        ">

          ${format}

        </span>


        ${
          isNotWebReady(stream)

            ?

            `
            <span class="badge warning">
              NOT WEB READY
            </span>
            `

            :

            `
            <span class="badge good">
              WEB READY
            </span>
            `
        }


        ${
          stream.quality

            ?

            `
            <span class="badge">
              ${escapeHTML(
                stream.quality
              )}
            </span>
            `

            :

            ""
        }


        ${
          stream.size

            ?

            `
            <span class="badge">
              ${escapeHTML(
                stream.size
              )}
            </span>
            `

            :

            ""
        }

      </div>


      <div class="source-desc">

        ${
          isExternal(stream)

            ?

            "External destination — not a direct media stream."

            :

          isPlayerFrame(stream)

            ?

            "Provider supplied an embedded player."

            :

          isNotWebReady(stream)

            ?

            "Provider marked this source not web-ready. Playback may still depend on browser compatibility."

            :

          playable

            ?

            "Compatible media source detected."

            :

            "No recognized browser media format."

        }

      </div>

    </button>

  `;

}


/* =========================================================
   FIND SOURCES
========================================================= */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }


  const box =
    $("sources");


  if(!box){

    return;

  }


  box.innerHTML = `

    <div class="empty">

      Loading stream sources…

    </div>

  `;


  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );


    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];


    if(
      !currentStreams.length
    ){

      box.innerHTML = `

        <div class="notice">

          No stream sources were returned
          for this title.

        </div>

      `;

      return;

    }


    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );


    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );


    box.innerHTML = `

      <div class="section-heading">

        <h2>
          SOURCES
        </h2>

        <span>
          ${currentStreams.length}
        </span>

      </div>


      <div class="notice">

        ${currentPlayableStreams.length}
        compatible source(s) detected.

        <br><br>

        MP4 and HLS sources are ranked
        ahead of less browser-friendly
        sources.

      </div>


      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    box.innerHTML = `

      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================================
   PLAY SOURCE
========================================================= */

function playSource(
  index
){

  const stream =
    currentStreams[index];


  if(!stream){

    return;

  }


  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );


  if(
    currentPlayerIndex < 0
  ){

    currentPlayerIndex = 0;

  }


  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;

  }


  playDirectStream(
    stream
  );

}


/* =========================================================
   DIRECT PLAYER
========================================================= */

function playDirectStream(
  stream
){

  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>


      <div
        id="playerStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>


    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>


      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);


  const video =
    $("sauveVideo");


  const status =
    $("playerStatus");


  const url =
    getStreamURL(
      stream
    );


  if(!url){

    showPlayerError(
      "No direct media URL was returned."
    );

    return;

  }


  video.src =
    url;


  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {
      once:true
    }
  );


  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );


  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );


  video.addEventListener(
    "error",
    () => {

      showPlayerError(
        "Safari could not decode or access this video source."
      );

    }
  );


  video.load();

}


/* =========================================================
   EMBEDDED PLAYER
========================================================= */

function openEmbeddedPlayer(
  stream
){

  const url =
    String(
      stream.playerFrameUrl ||
      ""
    ).trim();


  if(!url){

    showPlayerError(
      "No player URL was returned."
    );

    return;

  }


  openModal(`

    <div class="sheet-header">

      <h2>
        ${escapeHTML(
          stream.name ||
          "PLAYER"
        )}
      </h2>


      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="player-shell">

      <div class="iframe-player">

        <iframe
          src="${escapeHTML(url)}"
          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "
          allowfullscreen>
        </iframe>

      </div>


      <div
        class="player-status ready">

        Provider player loaded inside SAUVE.

      </div>

    </div>


    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        TRY NEXT SOURCE

      </button>


      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

}


/* =========================================================
   PLAYER ERROR
========================================================= */

function showPlayerError(
  message
){

  const status =
    $("playerStatus");


  if(status){

    status.textContent =
      message;

    status.className =
      "player-status error";

  }

}


/* =========================================================
   NEXT SOURCE
========================================================= */

function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;

  }


  let next =
    currentPlayerIndex + 1;


  if(
    next >=
    currentPlayableStreams.length
  ){

    next = 0;

  }


  currentPlayerIndex =
    next;


  const stream =
    currentPlayableStreams[
      next
    ];


  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }

}


/* =========================================================
   SOURCE LIST AGAIN
========================================================= */

function showSourcesAgain(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SOURCES
      </h2>


      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    ${
      currentStreams.length

        ?

        currentStreams
          .map(
            renderSource
          )
          .join("")

        :

        `
        <div class="empty">
          No sources available.
        </div>
        `
    }

  `);

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>


      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>


      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>


    <div class="field">

      <label>
        Stream Manifest
      </label>


      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"
        placeholder="Paste your stream manifest">

    </div>


    <div class="field">

      <label>
        Fusion Badge Feed
      </label>


      <input
        id="badgesURL"
        value="${escapeHTML(
          state.badges
        )}">

    </div>


    <div class="notice">

      Your manifest and badge addresses
      are stored locally in this browser.

      <br><br>

      SAUVE does not bypass DRM,
      authentication, CORS or provider
      restrictions.

    </div>


    <br>


    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);

}


function saveSettings(){

  const metadata =
    $("metadataURL")
      .value
      .trim();


  const stream =
    $("streamURL")
      .value
      .trim();


  const badges =
    $("badgesURL")
      .value
      .trim();


  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;

  }


  state.metadata =
    metadata;


  state.stream =
    stream;


  state.badges =
    badges;


  localStorage.setItem(
    "sauve_metadata",
    metadata
  );


  localStorage.setItem(
    "sauve_stream",
    stream
  );


  localStorage.setItem(
    "sauve_badges",
    badges
  );


  closeModal();

  location.reload();

}


/* =========================================================
   UI
========================================================= */

function focusSearch(){

  const input =
    $("searchInput");


  if(input){

    input.focus();

    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }

}


function goHome(){

  location.reload();

}


function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* =========================================================
   START
========================================================= */

loadHome();

</script>

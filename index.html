<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#150b25;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --text:#fff;
  --muted:#9d91a6;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#05030b;
}

body{
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -10%,rgba(138,77,255,.38),transparent 35%),
    radial-gradient(circle at 0 30%,rgba(255,22,216,.12),transparent 30%),
    radial-gradient(circle at 100% 50%,rgba(25,234,255,.10),transparent 30%),
    #05030b;
}

button,input{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}

header{
  position:sticky;
  top:0;
  z-index:100;
  padding:calc(10px + env(safe-area-inset-top)) 14px 14px;
  background:rgba(5,3,11,.94);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-bottom:1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-style:italic;
  font-size:clamp(68px,19vw,120px);
  line-height:.78;
  letter-spacing:7px;
  transform:skewX(-7deg);
  color:white;
  text-shadow:
    0 0 4px white,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;
  text-align:center;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:8px;
  background:#0c0715;
  color:white;
  border:1px solid rgba(138,77,255,.45);
  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);
  box-shadow:0 0 18px rgba(255,22,216,.18);
}

.searchbar button{
  padding:0 18px;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}

main{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:16px 16px 110px;
}

.hero{
  position:relative;
  min-height:clamp(400px,58vh,620px);
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  padding:clamp(25px,5vw,60px);
  border-radius:18px;
  border:1px solid rgba(255,22,216,.25);
  background:
    radial-gradient(circle at 75% 30%,rgba(25,234,255,.18),transparent 25%),
    radial-gradient(circle at 75% 75%,rgba(255,22,216,.25),transparent 35%),
    linear-gradient(110deg,#090511,#190c2e,#07121e);
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(5,3,11,.98),rgba(5,3,11,.72) 48%,rgba(5,3,11,.05));
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.08;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.18) 4px);
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:clamp(46px,9vw,95px);
  line-height:.85;
  text-transform:uppercase;
  text-shadow:0 0 20px rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;
  line-height:1.6;
  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,.secondary{
  padding:13px 18px;
  border-radius:8px;
  font-weight:900;
}

.primary{
  border:0;
  color:white;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:0 0 18px rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);
  background:rgba(25,234,255,.04);
  border:1px solid rgba(25,234,255,.38);
}

.catalog-section{
  margin:30px 0 0;
}

.catalog-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:9px;
  border-bottom:1px solid rgba(255,22,216,.15);
}

.catalog-title{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:25px;
  letter-spacing:1px;
}

.catalog-label{
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.row{
  display:flex;
  gap:13px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 1px 12px;
  scroll-snap-type:x proximity;
  scrollbar-width:none;
}

.row::-webkit-scrollbar{display:none}

.poster-card{
  position:relative;
  flex:0 0 145px;
  overflow:hidden;
  border:0;
  padding:0;
  text-align:left;
  color:white;
  background:#10091c;
  border-radius:8px;
  scroll-snap-align:start;
  box-shadow:0 7px 22px rgba(0,0,0,.32);
  transition:transform .18s ease,box-shadow .18s ease;
}

.poster-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 30px rgba(255,22,216,.20);
}

.poster-card img{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#171027;
}

.poster-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:38px 9px 9px;
  background:linear-gradient(transparent,rgba(0,0,0,.94));
}

.poster-name{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.poster-year{
  margin-top:3px;
  color:#bdb0c6;
  font-size:9px;
}

.poster-type{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,.72);
  color:var(--cyan);
  font-size:7px;
  font-weight:900;
  letter-spacing:1px;
}

.poster-source{
  position:absolute;
  top:7px;
  right:7px;
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:var(--green);
  font-size:11px;
}

.empty{
  padding:28px 5px;
  color:var(--muted);
  font-size:13px;
}

.notice{
  padding:16px;
  border-radius:9px;
  background:rgba(255,22,216,.045);
  border:1px solid rgba(255,22,216,.17);
  color:#c8bacf;
  line-height:1.6;
  font-size:12px;
}

.loading-row{
  display:flex;
  gap:13px;
  overflow:hidden;
  padding-bottom:12px;
}

.skeleton{
  flex:0 0 145px;
  aspect-ratio:2/3;
  border-radius:8px;
  background:linear-gradient(110deg,#10091c,#21122f,#10091c);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
}

@keyframes shimmer{
  to{background-position:-200% 0}
}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{display:flex}

.sheet{
  width:100%;
  max-height:95vh;
  overflow:auto;
  padding:20px 18px calc(30px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;
  background:
    radial-gradient(circle at 50% 0,rgba(138,77,255,.18),transparent 40%),
    #0c0718;
  border-top:1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:27px;
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#170d27;
  color:var(--cyan);
  border:1px solid rgba(25,234,255,.3);
  font-size:22px;
}

.details{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:16px;
}

.details img{
  width:105px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:8px;
  background:#171027;
}

.details p{
  color:#c3b5cb;
  line-height:1.55;
  font-size:13px;
}

.meta{
  color:var(--cyan);
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:7px;
}

.source{
  width:100%;
  margin-top:9px;
  padding:14px;
  text-align:left;
  color:white;
  border-radius:9px;
  background:linear-gradient(100deg,#150c29,#0d0819);
  border:1px solid rgba(25,234,255,.15);
}

.source:hover{
  border-color:var(--cyan);
  box-shadow:0 0 16px rgba(25,234,255,.14);
}

.source-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border-radius:50%;
  color:var(--cyan);
  background:rgba(25,234,255,.08);
}

.source-name{font-weight:900}

.provider{
  margin-top:4px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.badges{margin-top:8px}

.badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 7px;
  margin:3px 5px 0 0;
  border-radius:5px;
  background:rgba(255,22,216,.10);
  color:#ff7be4;
  font-size:8px;
  font-weight:900;
  letter-spacing:.7px;
}

.badge.good{
  background:rgba(66,255,176,.10);
  color:var(--green);
}

.badge.warning{
  background:rgba(255,212,90,.10);
  color:var(--yellow);
}

.badge.blue{
  background:rgba(25,234,255,.10);
  color:var(--cyan);
}

.badge-image{
  height:18px;
  max-width:100px;
  object-fit:contain;
  vertical-align:middle;
}

.source-desc{
  margin-top:7px;
  color:#91859b;
  font-size:10px;
}

.player-shell{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:12px;
  background:#000;
  border:1px solid rgba(25,234,255,.25);
  box-shadow:0 0 30px rgba(25,234,255,.08);
}

video{
  display:block;
  width:100%;
  max-height:70vh;
  background:#000;
}

.iframe-player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

.player-status{
  padding:11px 13px;
  background:#0e0818;
  border-top:1px solid rgba(255,255,255,.07);
  color:#aaa;
  font-size:11px;
}

.player-status.ready{color:var(--green)}
.player-status.error{color:var(--red)}

.player-controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.player-button{
  padding:10px 13px;
  border-radius:7px;
  color:white;
  background:#170d27;
  border:1px solid rgba(255,255,255,.1);
  font-weight:800;
  font-size:11px;
}

.player-button.primary{
  background:linear-gradient(135deg,var(--pink),var(--purple));
  border:0;
}

.field{margin:18px 0}

.field label{
  display:block;
  margin-bottom:8px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.field input,.field textarea,.field select{
  width:100%;
  padding:13px;
  border-radius:7px;
  background:#080510;
  color:white;
  border:1px solid rgba(138,77,255,.3);
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.settings-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:10px;
}

.settings-list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  border-radius:8px;
  background:#11091f;
  border:1px solid rgba(255,255,255,.07);
}

.settings-list-item strong{
  font-size:12px;
}

.settings-list-item small{
  display:block;
  color:#8f8299;
  margin-top:3px;
  word-break:break-all;
}

.delete-btn{
  flex:none;
  border:1px solid rgba(255,85,119,.3);
  color:var(--red);
  background:rgba(255,85,119,.07);
  border-radius:6px;
  padding:7px 9px;
  font-size:10px;
  font-weight:900;
}

.nav{
  position:fixed;
  z-index:400;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(8,5,17,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;
  background:none;
  color:#766a80;
  font-size:9px;
  letter-spacing:1px;
}

.nav button span{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);
  text-shadow:0 0 10px var(--pink);
}

.mdb-count{
  color:var(--muted);
  font-size:9px;
  letter-spacing:1px;
}

.mdb-error{
  margin:0 0 10px;
  padding:12px;
  border-radius:8px;
  color:#ffb4c3;
  background:rgba(255,85,119,.06);
  border:1px solid rgba(255,85,119,.2);
  font-size:11px;
}

@media(min-width:700px){
  .poster-card{flex-basis:180px}
  .skeleton{flex-basis:180px}
  .details{grid-template-columns:190px 1fr}
  .details img{width:190px}
  .hero{min-height:580px}
}
</style>
</head>

<body>

<header>
  <div class="logo">SAUVE</div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">
    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">
    <button id="searchButton">SEARCH</button>
  </div>
</header>

<main id="main">

  <div class="hero">
    <div class="hero-content">

      <div class="hero-kicker">WELCOME TO SAUVE</div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Discover movies and television,
        browse your streaming catalogs,
        MDBList collections and available
        sources from one Netflix-style interface.
      </p>

      <div class="hero-buttons">

        <button class="primary" onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button class="secondary" onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>

    </div>
  </div>

  <div id="catalogContainer">
    <div class="empty">Loading SAUVE…</div>
  </div>

</main>

<nav class="nav">

  <button class="active" onclick="goHome()">
    <span>⌂</span>
    HOME
  </button>

  <button onclick="focusSearch()">
    <span>⌕</span>
    SEARCH
  </button>

  <button onclick="openSettings()">
    <span>⚙</span>
    SETTINGS
  </button>

</nav>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>

/* =========================================================
   SAUVE CONFIG
========================================================= */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const DEFAULT_BADGES =
"https://pastebin.com/raw/gyj0HUuE";

const state = {

  metadata:
    localStorage.getItem("sauve_metadata") ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem("sauve_stream") ||
    "",

  mdbApiKey:
    localStorage.getItem("sauve_mdb_api") ||
    "",

  mdbLists:
    loadStoredLists(),

  badgesURL:
    localStorage.getItem("sauve_badges_url") ||
    DEFAULT_BADGES

};

let currentStreams = [];
let currentPlayableStreams = [];
let currentPlayerIndex = 0;

let badgeData = [];


/* =========================================================
   STORAGE
========================================================= */

function loadStoredLists(){

  try{

    const value =
      JSON.parse(
        localStorage.getItem("sauve_mdb_lists") || "[]"
      );

    return Array.isArray(value)
      ? value
      : [];

  }
  catch(e){

    return [];

  }

}

function saveStoredLists(){

  localStorage.setItem(
    "sauve_mdb_lists",
    JSON.stringify(state.mdbLists)
  );

}


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value=""){

  return String(value)
    .replace(/[&<>"']/g,c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));

}

async function fetchJSON(url,options={}){

  const response =
    await fetch(
      url,
      {
        ...options,
        headers:{
          Accept:"application/json",
          ...(options.headers || {})
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  return response.json();

}

function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(/\/manifest\.json\/?$/i,"");

}

function addonRoot(url){

  return normalizeManifest(url) + "/";

}


/* =========================================================
   MDBLIST URL PARSING
========================================================= */

function parseMDBListURL(input){

  const raw =
    String(input || "").trim();

  if(!raw){
    return null;
  }

  /*
    Accept:

    https://mdblist.com/lists/user/slug
    https://www.mdblist.com/lists/user/slug
    https://mdblist.com/lists/12345
    https://mdblist.com/lists/official/movies
  */

  try{

    const url =
      new URL(raw);

    const parts =
      url.pathname
        .split("/")
        .filter(Boolean);

    const listIndex =
      parts.findIndex(
        x => x.toLowerCase() === "lists"
      );

    if(listIndex < 0){
      return null;
    }

    const after =
      parts.slice(listIndex + 1);

    if(!after.length){
      return null;
    }

    /*
      /lists/{id}
    */

    if(after.length === 1){

      return {
        mode:"id",
        id:after[0],
        original:raw
      };

    }

    /*
      /lists/{user}/{slug}
    */

    return {
      mode:"user",
      user:decodeURIComponent(after[0]),
      slug:decodeURIComponent(after.slice(1).join("/")),
      original:raw
    };

  }
  catch(e){

    return null;

  }

}


/* =========================================================
   MDBLIST API
========================================================= */

const MDB_API =
  "https://api.mdblist.com";


function mdbHeaders(){

  const headers = {
    Accept:"application/json"
  };

  if(state.mdbApiKey){

    /*
      MDBList accepts the personal API key
      through the Authorization header.
    */

    headers.Authorization =
      "Bearer " +
      state.mdbApiKey;

  }

  return headers;

}


async function fetchMDBListItems(
  listConfig
){

  const parsed =
    parseMDBListURL(
      listConfig.url
    );

  if(!parsed){

    throw new Error(
      "Invalid MDBList URL. Use a URL such as https://mdblist.com/lists/username/list-name"
    );

  }

  /*
    Current MDBList API uses:

    /lists/{user}/{slug}/items
    /lists/{id}/items

    Cursor pagination is supported by the
    current API.
  */

  let endpoint;

  if(parsed.mode === "id"){

    endpoint =
      MDB_API +
      "/lists/" +
      encodeURIComponent(parsed.id) +
      "/items";

  }
  else{

    endpoint =
      MDB_API +
      "/lists/" +
      encodeURIComponent(parsed.user) +
      "/" +
      encodeURIComponent(parsed.slug) +
      "/items";

  }

  const allItems = [];

  let cursor = "";
  let safety = 0;

  while(safety < 10){

    safety++;

    const url =
      new URL(endpoint);

    /*
      1000 is the current documented
      maximum per request.
    */

    url.searchParams.set(
      "limit",
      "1000"
    );

    if(cursor){

      url.searchParams.set(
        "cursor",
        cursor
      );

    }

    const response =
      await fetch(
        url.toString(),
        {
          headers:mdbHeaders(),
          cache:"no-store"
        }
      );

    if(!response.ok){

      const text =
        await response.text()
          .catch(()=>"");

      throw new Error(
        "MDBList HTTP " +
        response.status +
        (text
          ? " — " + text.slice(0,180)
          : "")
      );

    }

    const data =
      await response.json();

    const items =
      extractMDBItems(data);

    allItems.push(
      ...items
    );

    const next =
      data?.pagination?.next_cursor ||
      data?.next_cursor ||
      data?.nextCursor ||
      response.headers.get(
        "X-Next-Cursor"
      ) ||
      "";

    const hasMore =
      Boolean(
        data?.pagination?.has_more ??
        data?.has_more
      );

    if(
      !next ||
      !hasMore
    ){

      break;

    }

    cursor =
      String(next);

  }

  /*
    Remove duplicate titles.
  */

  const unique =
    dedupeMDBItems(
      allItems
    );

  /*
    Respect optional per-list limit.
  */

  const limit =
    Number(
      listConfig.limit || 50
    );

  return unique.slice(
    0,
    Math.max(
      1,
      Math.min(
        limit,
        250
      )
    )
  );

}


/* =========================================================
   EXTRACT MDB ITEMS
========================================================= */

function extractMDBItems(data){

  if(!data){
    return [];
  }

  const possible = [

    data.items,

    data.results,

    data.movies,

    data.shows,

    data.metas,

    data.list?.items,

    data.data?.items,

    data.data?.results,

    data.data?.movies,

    data.data?.shows

  ];

  for(
    const candidate of possible
  ){

    if(
      Array.isArray(candidate) &&
      candidate.length
    ){

      return candidate;

    }

  }

  /*
    Some API responses can return an
    object keyed by IDs.
  */

  if(
    data.items &&
    typeof data.items === "object"
  ){

    return Object.values(
      data.items
    );

  }

  return [];

}


/* =========================================================
   NORMALIZE MDB ITEM
========================================================= */

function normalizeMDBItem(item){

  if(!item || typeof item !== "object"){
    return null;
  }

  const ids =
    item.ids ||
    item.id ||
    {};

  let imdb =
    firstValue(
      item.imdb_id,
      item.imdb,
      ids.imdb,
      ids.imdb_id
    );

  let tmdb =
    firstValue(
      item.tmdb_id,
      item.tmdb,
      ids.tmdb,
      ids.tmdb_id
    );

  let tvdb =
    firstValue(
      item.tvdb_id,
      item.tvdb,
      ids.tvdb,
      ids.tvdb_id
    );

  /*
    MDBList may return numeric TMDb IDs
    or IMDb IDs depending on endpoint.
  */

  if(
    typeof imdb === "number"
  ){

    imdb =
      String(imdb);

  }

  if(
    typeof tmdb === "number"
  ){

    tmdb =
      String(tmdb);

  }

  let type =
    item.type ||
    item.mediatype ||
    item.media_type ||
    item.kind ||
    "";

  type =
    String(type).toLowerCase();

  if(
    type === "show" ||
    type === "tv" ||
    type === "series"
  ){

    type = "series";

  }
  else if(
    type === "movie" ||
    type === "film"
  ){

    type = "movie";

  }

  /*
    If type wasn't supplied, use the
    item's known media_type where possible.
  */

  if(
    type !== "movie" &&
    type !== "series"
  ){

    const isTV =
      item.is_tv ||
      item.is_series ||
      item.mediatype === "show";

    type =
      isTV
        ? "series"
        : "movie";

  }

  let id = "";

  /*
    Prefer IMDb because most Stremio
    metadata addons understand tt IDs.
  */

  if(imdb){

    id =
      String(imdb)
        .startsWith("tt")
        ? String(imdb)
        : "tt" + String(imdb);

  }
  else if(tmdb){

    id =
      "tmdb:" +
      String(tmdb);

  }
  else if(tvdb){

    id =
      "tvdb:" +
      String(tvdb);

  }
  else if(item.id){

    id =
      String(item.id);

  }

  const name =
    firstValue(
      item.title,
      item.name,
      item.original_title,
      item.original_name
    ) ||
    "Untitled";

  const poster =
    firstValue(
      item.poster,
      item.poster_url,
      item.poster_path,
      item.images?.poster,
      item.image,
      item.backdrop
    ) ||
    "";

  let year =
    firstValue(
      item.year,
      item.release_year,
      item.releaseInfo,
      item.released
    ) ||
    "";

  if(
    typeof year === "string" &&
    year.length > 4
  ){

    year =
      year.slice(0,4);

  }

  return {

    id,
    type,
    name,
    poster,
    year,
    imdb,
    tmdb,
    tvdb,

    description:
      firstValue(
        item.description,
        item.overview,
        item.plot
      ) || "",

    rating:
      firstValue(
        item.rating,
        item.imdbrating,
        item.tmdb_rating
      ) || ""

  };

}


function firstValue(...values){

  for(
    const value of values
  ){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim()
    ){

      return value;

    }

  }

  return "";

}


function dedupeMDBItems(items){

  const seen =
    new Set();

  const result = [];

  for(
    const raw of items
  ){

    const item =
      normalizeMDBItem(
        raw
      );

    if(!item){
      continue;
    }

    if(!item.id){
      continue;
    }

    const key =
      item.type +
      "|" +
      item.id;

    if(
      seen.has(key)
    ){
      continue;
    }

    seen.add(key);
    result.push(item);

  }

  return result;

}

   MDB ROW
========================================================= */

async function loadMDBRows(){

  const lists =
    state.mdbLists;

  if(
    !state.mdbApiKey ||
    !lists.length
  ){

    return "";

  }

  const sections =
    [];

  for(
    const list of lists
  ){

    if(
      !list ||
      !list.url
    ){

      continue;

    }

    try{

      const items =
        await fetchMDBListItems(
          list
        );

      if(!items.length){

        sections.push(`

          <section class="catalog-section">

            <div class="catalog-heading">

              <h2 class="catalog-title">
                ${escapeHTML(
                  list.name ||
                  "MDBLIST"
                )}
              </h2>

              <span class="catalog-label">
                MDBLIST
              </span>

            </div>

            <div class="notice">

              MDBList responded normally,
              but this list returned no items.

            </div>

          </section>

        `);

        continue;

      }

      sections.push(`

        <section class="catalog-section">

          <div class="catalog-heading">

            <h2 class="catalog-title">
              ${escapeHTML(
                list.name ||
                "MDBLIST"
              )}
            </h2>

            <span class="catalog-label">

              MDBLIST ·
              ${items.length}

            </span>

          </div>

          <div class="row">

            ${items
              .map(
                renderMDBPoster
              )
              .join("")}

          </div>

        </section>

      `);

    }
    catch(error){

      sections.push(`

        <section class="catalog-section">

          <div class="catalog-heading">

            <h2 class="catalog-title">
              ${escapeHTML(
                list.name ||
                "MDBLIST"
              )}
            </h2>

            <span class="catalog-label">
              MDBLIST
            </span>

          </div>

          <div class="mdb-error">

            <strong>

            Check the MDBList URL and API
            key in Settings.

        </section>

    }

  }

  return sections.join("");

}

}


/* =========================================================
   BADGES
========================================================= */

async function loadBadges(){

  if(!state.badgesURL){
    return;
  }

  try{

    const response =
      await fetch(
        state.badgesURL,
        {
          headers:{
            Accept:"text/plain,application/json"
          },
          cache:"no-store"
        }
      );

    if(!response.ok){
      return;
    }

    const text =
      await response.text();

    let parsed = null;

    try{
      parsed =
        JSON.parse(text);
    }
    catch(e){}

    if(parsed){

      badgeData =
        normalizeBadgeData(
          parsed
        );

      return;

    }

    /*
      Also support simple text formats.
    */

    badgeData =
      parseBadgeText(
        text
      );

  }
  catch(e){

    badgeData = [];

  }

}


function normalizeBadgeData(data){

  if(Array.isArray(data)){
    return data;
  }

  if(Array.isArray(data.badges)){
    return data.badges;
  }

  if(Array.isArray(data.sources)){
    return data.sources;
  }

  if(typeof data === "object"){

    return Object.entries(data)
      .map(
        ([key,value]) => {

          if(
            typeof value === "string"
          ){

            return {
              name:key,
              url:value
            };

          }

          return {
            name:key,
            ...(value || {})
          };

        }
      );

  }

  return [];

}


function parseBadgeText(text){

  return String(text || "")
    .split(/\r?\n/)
    .map(
      line => line.trim()
    )
    .filter(Boolean)
    .map(
      line => {

        const separator =
          line.includes("|")
            ? "|"
            : ",";

        const parts =
          line
            .split(separator)
            .map(
              x => x.trim()
            );

        return {
          name:parts[0] || "Badge",
          url:parts[1] || ""
        };

      }
    )
    .filter(
      item => item.url
    );

}


function findBadgesForStream(stream){

  if(!badgeData.length){
    return [];
  }

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  return badgeData.filter(
    badge => {

      const keys =
        [
          badge.name,
          badge.id,
          badge.key,
          badge.provider,
          badge.source
        ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      return (
        keys &&
        text.includes(keys)
      );

    }
  );

}


/* =========================================================
   METADATA CATALOG
========================================================= */

function supportsSearch(catalog){

  if(
    !Array.isArray(
      catalog.extra
    )
  ){
    return false;
  }

  return catalog.extra.some(
    extra =>
      typeof extra === "string"
        ? extra === "search"
        : extra &&
          extra.name === "search"
  );

}


function makeExtraProps(values){

  return Object.entries(values)
    .filter(
      ([,value]) =>
        value !== undefined &&
        value !== null &&
        String(value).length
    )
    .map(
      ([key,value]) =>
        key +
        "=" +
        encodeURIComponent(
          String(value)
        )
    )
    .join("&");

}


function buildCatalogURL(
  catalog,
  extra={}
){

  let url =
    addonRoot(
      state.metadata
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );

  const props =
    makeExtraProps(
      extra
    );

  if(props){

    url +=
      "/" +
      props;

  }

  return url + ".json";

}


function prettyCatalogName(catalog){

  const raw =
    String(
      catalog.name ||
      catalog.id ||
      "CATALOG"
    );

  const lower =
    raw.toLowerCase();

  const mappings = [

    ["netflix","NETFLIX"],
    ["disney+","DISNEY+"],
    ["disney","DISNEY+"],
    ["apple tv","APPLE TV+"],
    ["apple","APPLE TV+"],
    ["hbo","HBO"],
    ["max","MAX"],
    ["hulu","HULU"],
    ["prime","PRIME VIDEO"],
    ["amazon","PRIME VIDEO"],
    ["paramount","PARAMOUNT+"],
    ["peacock","PEACOCK"],
    ["marvel","MARVEL"],
    ["dc","DC"],
    ["popular","POPULAR"],
    ["trending","TRENDING"],
    ["featured","FEATURED"],
    ["top","TOP PICKS"],
    ["new","NEW RELEASES"]

  ];

  for(
    const [needle,label]
    of mappings
  ){

    if(
      lower.includes(
        needle
      )
    ){

      return label;

    }

  }

  return raw.toUpperCase();

}


function catalogPriority(catalog){

  const name =
    String(
      catalog.name ||
      catalog.id ||
      ""
    ).toLowerCase();

  const priority = [

    "featured",
    "trending",
    "popular",
    "netflix",
    "disney",
    "apple",
    "hbo",
    "max",
    "hulu",
    "prime",
    "amazon",
    "paramount",
    "peacock",
    "marvel",
    "dc",
    "top",
    "new"

  ];

  const index =
    priority.findIndex(
      word =>
        name.includes(word)
    );

  return index < 0
    ? 999
    : index;

}

async function loadHome(){

  const container =
    $("catalogContainer");

  /*
    Always render the page immediately.
    This prevents the entire app getting
    stuck on a global "Loading…" screen.
  */

  container.innerHTML = `

    <section class="catalog-section">

      <div class="catalog-heading">

        <h2 class="catalog-title">
          YOUR CINEMA
        </h2>

        <span class="catalog-label">
          LOADING
        </span>

      </div>

      <div class="loading-row">

        ${Array.from(
          {length:7},
          () => `<div class="skeleton"></div>`
        ).join("")}

      </div>

    </section>

  `;

  let metadataHTML = "";
  let mdbHTML = "";

  /*
    Load badge definitions independently.
  */

  await loadBadges();

  /*
    Metadata failure must not stop MDBList.
  */

  try{

    metadataHTML =
      await loadMetadataCatalogs();

  }
  catch(error){

    metadataHTML = `

      <section class="catalog-section">

        <div class="catalog-heading">

          <h2 class="catalog-title">
            SAUVE CATALOG
          </h2>

          <span class="catalog-label">
            METADATA
          </span>

        </div>

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      </section>

    `;

  }

  /*
    MDBList is completely independent.
  */

  try{

    mdbHTML =
      await loadMDBRows();

  }
  catch(error){

    mdbHTML = `

      <section class="catalog-section">

        <div class="notice">

          MDBList could not be loaded.

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      </section>

    `;

  }

  if(
    !metadataHTML &&
    !mdbHTML
  ){

    container.innerHTML = `

      <div class="notice">

        No content is currently configured.

        <br><br>

        Open <strong>Settings</strong> to
        configure your metadata addon,
        stream addon or MDBList lists.

      </div>

    `;

    return;

  }

  /*
    MDBList rows are deliberately placed
    after the normal catalog rows.
  */

  container.innerHTML =
    metadataHTML +
    mdbHTML;

}


async function loadMetadataCatalogs(){

  const manifest =
    await fetchJSON(
      state.metadata
    );

  const catalogs =
    Array.isArray(
      manifest.catalogs
    )
      ? manifest.catalogs
      : [];

  if(!catalogs.length){

    return "";

  }

  const usable =
    catalogs
      .filter(
        catalog =>
          catalog &&
          catalog.id &&
          catalog.type
      )
      .sort(
        (a,b) =>
          catalogPriority(a) -
          catalogPriority(b)
      )
      .slice(0,30);

  const results =
    await Promise.allSettled(
      usable.map(
        async catalog => {

          const data =
            await fetchJSON(
              buildCatalogURL(
                catalog
              )
            );

          return {
            catalog,
            metas:
              Array.isArray(
                data.metas
              )
                ? data.metas
                : []
          };

        }
      )
    );

  let html = "";

  results.forEach(
    result => {

      if(
        result.status !==
        "fulfilled"
      ){
        return;
      }

      const {
        catalog,
        metas
      } =
        result.value;

      if(!metas.length){
        return;
      }

      html +=
        renderCatalogRow(
          catalog,
          metas
        );

    }
  );

  return html;

}


/* =========================================================
   NORMAL METADATA ROW
========================================================= */

function renderCatalogRow(
  catalog,
  metas
){

  const unique =
    dedupeMetas(
      metas
    ).slice(0,30);

  if(!unique.length){
    return "";
  }

  return `

    <section class="catalog-section">

      <div class="catalog-heading">

        <h2 class="catalog-title">

          ${escapeHTML(
            prettyCatalogName(
              catalog
            )
          )}

        </h2>

        <span class="catalog-label">

          ${escapeHTML(
            String(
              catalog.type ||
              ""
            ).toUpperCase()
          )}

        </span>

      </div>

      <div class="row">

        ${unique
          .map(
            renderPosterCard
          )
          .join("")}

      </div>

    </section>

  `;

}


function renderPosterCard(item){

  const type =
    encodeURIComponent(
      item.type ||
      "movie"
    );

  const id =
    encodeURIComponent(
      item.id ||
      ""
    );

  const poster =
    item.poster ||
    item.logo ||
    "";

  return `

    <button
      class="poster-card"
      onclick="
        openTitle(
          '${type}',
          '${id}'
        )
      ">

      <img
        src="${escapeHTML(
          poster
        )}"
        loading="lazy"
        alt="${escapeHTML(
          item.name ||
          "Untitled"
        )}"
        onerror="
          this.style.opacity='.25'
        ">

      <div class="poster-type">

        ${escapeHTML(
          String(
            item.type ||
            "movie"
          ).toUpperCase()
        )}

      </div>

      <div class="poster-overlay">

        <div class="poster-name">

          ${escapeHTML(
            item.name ||
            "Untitled"
          )}

        </div>

        <div class="poster-year">

          ${escapeHTML(
            item.releaseInfo ||
            item.year ||
            ""
          )}

        </div>

      </div>

    </button>

  `;

}


function dedupeMetas(metas){

  const seen =
    new Set();

  return metas.filter(
    item => {

      const key =
        String(
          item.type ||
          ""
        ) +
        "|" +
        String(
          item.id ||
          ""
        );

      if(
        seen.has(key)
      ){
        return false;
      }

      seen.add(key);

      return true;

    }
  );

}


/* =========================================================
   SEARCH
========================================================= */

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();

  if(!query){

    focusSearch();
    return;

  }

  $("catalogContainer").innerHTML = `

    <section class="catalog-section">

      <div class="catalog-heading">

        <h2 class="catalog-title">
          SEARCH
        </h2>

        <span class="catalog-label">
          ${escapeHTML(query)}
        </span>

      </div>

      <div class="loading-row">

        ${Array.from(
          {length:7},
          () => `<div class="skeleton"></div>`
        ).join("")}

      </div>

    </section>

  `;

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    const searchable =
      catalogs.filter(
        supportsSearch
      );

    if(!searchable.length){

      throw new Error(
        "No searchable catalogs were advertised."
      );

    }

    const responses =
      await Promise.allSettled(
        searchable.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog,
                {
                  search:query
                }
              )
            )
        )
      );

    const metas = [];

    responses.forEach(
      result => {

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );

    const results =
      dedupeMetas(
        metas
      );

    $("catalogContainer").innerHTML =

      results.length

        ?

        `

        <section class="catalog-section">

          <div class="catalog-heading">

            <h2 class="catalog-title">
              RESULTS
            </h2>

            <span class="catalog-label">
              ${results.length}
            </span>

          </div>

          <div class="row">

            ${results
              .map(
                renderPosterCard
              )
              .join("")}

          </div>

        </section>

        `

        :

        `

        <div class="notice">

          No results found for
          <strong>
            ${escapeHTML(query)}
          </strong>.

        </div>

        `;

  }
  catch(error){

    $("catalogContainer").innerHTML = `

}

/* =========================================================
   STREAMS
========================================================= */

function buildStreamURL(
  type,
  id
){

  if(!state.stream){

    return "";

  }

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}


function getStreamURL(stream){

  return String(
    stream?.url ||
    ""
  ).trim();

}


function isPlayerFrame(stream){

  return Boolean(
    stream?.playerFrameUrl
  );

}


function isExternal(stream){

  return Boolean(
    stream?.externalUrl
  );

}


function isNotWebReady(stream){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}


function isHLS(stream){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".m3u8") ||
    type.includes("m3u8") ||
    type.includes("mpegurl")
  );

}


function isMP4(stream){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".mp4") ||
    type.includes("mp4")
  );

}


function isWebM(stream){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".webm") ||
    type.includes("webm")
  );

}


function isPlayableCandidate(stream){

  if(isPlayerFrame(stream)){
    return true;
  }

  if(isExternal(stream)){
    return false;
  }

  return (
    isMP4(stream) ||
    isHLS(stream) ||
    isWebM(stream)
  );

}


function providerName(stream){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  const providers = [

    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"

  ];

  for(
    const name of providers
  ){

    if(
      text.includes(name)
    ){

      return name;

    }

  }

  return "stream source";

}


function compatibilityScore(stream){

  let score = 0;

  if(isMP4(stream)){
    score += 100;
  }

  if(isHLS(stream)){
    score += 90;
  }

  if(isWebM(stream)){
    score += 80;
  }

  if(isPlayerFrame(stream)){
    score += 70;
  }

  if(isExternal(stream)){
    score -= 100;
  }

  return score;

}


/* =========================================================
   SOURCE BADGES
========================================================= */

function renderBadgeImages(stream){

  const badges =
    findBadgesForStream(
      stream
    );

  if(!badges.length){
    return "";
  }

  return badges
    .map(
      badge => {

        const url =
          badge.url ||
          badge.image ||
          badge.src ||
          "";

        if(!url){
          return "";
        }

        return `

          <span class="badge blue">

            <img
              class="badge-image"
              src="${escapeHTML(url)}"
              alt="${escapeHTML(
                badge.name ||
                "badge"
              )}"
              onerror="
                this.parentElement.style.display='none'
              ">

          </span>

        `;

      }
    )
    .join("");

}


function renderSource(
  stream,
  index
){

  const playable =
    isPlayableCandidate(
      stream
    );

  let format =
    "SOURCE";

  if(isMP4(stream)){
    format = "MP4";
  }
  else if(isHLS(stream)){
    format = "HLS";
  }
  else if(isWebM(stream)){
    format = "WEBM";
  }
  else if(isPlayerFrame(stream)){
    format = "PLAYER";
  }
  else if(isExternal(stream)){
    format = "EXTERNAL";
  }

  return `

    <button
      class="source"
      ${
        playable
          ? `onclick="playSource(${index})"`
          : `onclick="explainSource(${index})"`
      }>

      <div class="source-top">

        <div class="source-icon">

          ${playable ? "▶" : "!"}

        </div>

        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>

          <div class="provider">

            ${escapeHTML(
              providerName(
                stream
              )
            )}

          </div>

        </div>

      </div>

      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : "warning"}
        ">

          ${format}

        </span>

        ${
          isNotWebReady(stream)

            ?

            `
              <span class="badge warning">
                NOT WEB READY
              </span>
            `

            :

            `
              <span class="badge good">
                WEB READY
              </span>
            `
        }

        ${
          stream.quality

            ?

            `
              <span class="badge blue">
                ${escapeHTML(
                  stream.quality
                )}
              </span>
            `

            :

            ""
        }

        ${
          stream.resolution

            ?

            `
              <span class="badge blue">
                ${escapeHTML(
                  stream.resolution
                )}
              </span>
            `

            :

            ""
        }

        ${renderBadgeImages(stream)}

      </div>

      <div class="source-desc">

        ${
          isExternal(stream)

            ?

            "External destination — SAUVE cannot treat this as a direct video file."

            :

          isNotWebReady(stream)

            ?

            "Provider marked this source as not web-ready."

            :

          playable

            ?

            "Tap to attempt playback inside SAUVE."

            :

            "This source does not expose a browser-compatible media URL."

        }

      </div>

    </button>

  `;

}


/* =========================================================
   FIND SOURCES
========================================================= */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();
    return;

  }

  $("sources").innerHTML = `

    <div class="empty">
      Loading stream sources…
    </div>

  `;

  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );

    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];

    if(!currentStreams.length){

      $("sources").innerHTML = `

        <div class="notice">

          No stream sources were returned
          for this title.

        </div>

      `;

      return;

    }

    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );

    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );

    $("sources").innerHTML = `

      <div class="catalog-heading">

        <h2 class="catalog-title">
          SOURCES
        </h2>

        <span class="catalog-label">
          ${currentStreams.length}
        </span>

      </div>

      <div class="notice">

        <strong>
          ${currentPlayableStreams.length}
        </strong>

        potentially compatible source(s).

      </div>

      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    $("sources").innerHTML = `

      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================================
   PLAYER
========================================================= */

function playSource(index){

  const stream =
    currentStreams[index];

  if(!stream){
    return;
  }

  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );

  if(
    currentPlayerIndex < 0
  ){

    currentPlayerIndex = 0;

  }

  if(isPlayerFrame(stream)){

    openEmbeddedPlayer(
      stream
    );

    return;

  }

  playDirectStream(
    stream
  );

}


function playDirectStream(stream){

  openModal(`

    <div class="sheet-header">

      <h2>NOW PLAYING</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>

      <div
        id="playerStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

  const video =
    $("sauveVideo");

  const status =
    $("playerStatus");

  const url =
    getStreamURL(
      stream
    );

  if(!url){

    showPlayerError(
      "No direct media URL was returned."
    );

    return;

  }

  video.src =
    url;

  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {once:true}
  );

  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );

  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );

  video.addEventListener(
    "error",
    () => {

      showPlayerError(
        "Safari could not decode or access this video source."
      );

    }
  );

  video.load();

}


function openEmbeddedPlayer(stream){

  const url =
    String(
      stream.playerFrameUrl ||
      ""
    ).trim();

  if(!url){

    showPlayerError(
      "No player URL was returned."
    );

    return;

  }

  openModal(`

    <div class="sheet-header">

      <h2>

        ${escapeHTML(
          stream.name ||
          "PLAYER"
        )}

      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <div class="iframe-player">

        <iframe
          src="${escapeHTML(url)}"
          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "
          allowfullscreen>
        </iframe>

      </div>

      <div class="player-status ready">

        Provider player loaded inside SAUVE.

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

}


function showPlayerError(message){

  const status =
    $("playerStatus");

  if(status){

    status.textContent =
      message;

    status.className =
      "player-status error";

  }

}


function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;

  }

  let next =
    currentPlayerIndex + 1;

  if(
    next >=
    currentPlayableStreams.length
  ){

    next = 0;

  }

  currentPlayerIndex =
    next;

  const stream =
    currentPlayableStreams[next];

  if(isPlayerFrame(stream)){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }

}


function explainSource(index){

  const stream =
    currentStreams[index];

  if(!stream){
    return;
  }

  alert(
    isExternal(stream)
      ? "This source is an external destination rather than a direct media stream."
      : "SAUVE could not identify a browser-compatible video URL for this source."
  );

}


function showSourcesAgain(){

  openModal(`

    <div class="sheet-header">

      <h2>SOURCES</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    ${
      currentStreams.length

        ?

        currentStreams
          .map(
            renderSource
          )
          .join("")

        :

        `
          <div class="empty">
            No sources available.
          </div>
        `
    }

  `);

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>SAUVE SETTINGS</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>

    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"
        placeholder="Paste your stream manifest">

    </div>

    <div class="field">

      <label>
        MDBList API Key
      </label>

      <input
        id="mdbApi"
        type="password"
        autocomplete="off"
        value="${escapeHTML(
          state.mdbApiKey
        )}"
        placeholder="Paste your MDBList API key">

    </div>

    <div class="notice">

      Your MDBList API key is stored only in
      this browser's local storage. It is not
      written into this HTML file.

    </div>

    <div class="field">

      <label>
        Add MDBList Category
      </label>

      <input
        id="mdbName"
        placeholder="Category name — e.g. Netflix Movies">

      <br><br>

      <input
        id="mdbURL"
        placeholder="https://mdblist.com/lists/username/list-name">

      <br><br>

      <input
        id="mdbLimit"
        type="number"
        min="1"
        max="250"
        value="50"
        placeholder="Number of titles">

      <br><br>

      <button
        class="primary"
        onclick="addMDBList()">

        + ADD MDBLIST

      </button>

    </div>

    <div class="catalog-heading">

      <h2 class="catalog-title">
        YOUR MDBLISTS
      </h2>

      <span class="catalog-label">
        ${state.mdbLists.length}
      </span>

    </div>

    <div
      class="settings-list">

      ${
        state.mdbLists.length

          ?

          state.mdbLists
            .map(
              (list,index) => `

                <div
                  class="settings-list-item">

                  <div>

                    <strong>
                      ${escapeHTML(
                        list.name ||
                        "MDBList"
                      )}
                    </strong>

                    <small>
                      ${escapeHTML(
                        list.url
                      )}
                    </small>

                  </div>

                  <button
                    class="delete-btn"
                    onclick="
                      removeMDBList(${index})
                    ">

                    REMOVE

                  </button>

                </div>

              `
            )
            .join("")

          :

          `
            <div class="empty">
              No MDBLists added yet.
            </div>
          `
      }

    </div>

    <br>

    <div class="field">

      <label>
        Fusion / Source Badges URL
      </label>

      <input
        id="badgesURL"
        value="${escapeHTML(
          state.badgesURL
        )}"
        placeholder="Paste your badge JSON/text URL">

    </div>

    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);

}


function addMDBList(){

  const name =
    $("mdbName")
      .value
      .trim();

  const url =
    $("mdbURL")
      .value
      .trim();

  const limit =
    Number(
      $("mdbLimit")
        .value
        .trim() ||
      50
    );

  if(!url){

    alert(
      "Enter an MDBList URL."
    );

    return;

  }

  if(
    !parseMDBListURL(url)
  ){

    alert(
      "That does not look like a valid MDBList URL."
    );

    return;

  }

  state.mdbLists.push({

    name:
      name ||
      "MDBList",

    url,

    limit:
      Math.max(
        1,
        Math.min(
          250,
          limit
        )
      )

  });

  saveStoredLists();

  openSettings();

}


function removeMDBList(index){

  if(
    index < 0 ||
    index >= state.mdbLists.length
  ){
    return;
  }

  state.mdbLists.splice(
    index,
    1
  );

  saveStoredLists();

  openSettings();

}


function saveSettings(){

  const metadata =
    $("metadataURL")
      .value
      .trim();

  const stream =
    $("streamURL")
      .value
      .trim();

  const mdbApi =
    $("mdbApi")
      .value
      .trim();

  const badgesURL =
    $("badgesURL")
      .value
      .trim();

  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;

  }

  state.metadata =
    metadata;

  state.stream =
    stream;

  state.mdbApiKey =
    mdbApi;

  state.badgesURL =
    badgesURL;

  localStorage.setItem(
    "sauve_metadata",
    metadata
  );

  localStorage.setItem(
    "sauve_stream",
    stream
  );

  localStorage.setItem(
    "sauve_mdb_api",
    mdbApi
  );

  localStorage.setItem(
    "sauve_badges_url",
    badgesURL
  );

  closeModal();

  loadHome();

}

   UI
========================================================= */

   START

loadHome();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#05030b">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SAUVE Cinema Television</title>

<style>

:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#150b25;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --text:#fff;
  --muted:#9d91a6;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  overflow-x:hidden;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(138,77,255,.38),
      transparent 35%
    ),
    radial-gradient(
      circle at 0 30%,
      rgba(255,22,216,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 50%,
      rgba(25,234,255,.10),
      transparent 30%
    ),
    #05030b;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

/* =========================================================
HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    14px;

  background:rgba(5,3,11,.94);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border-bottom:1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-style:italic;

  font-size:
    clamp(68px,19vw,120px);

  line-height:.78;

  letter-spacing:7px;

  transform:skewX(-7deg);

  color:white;

  text-shadow:
    0 0 4px white,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;

  text-align:center;

  color:var(--cyan);

  font-size:9px;
  font-weight:900;
  letter-spacing:4px;

  text-shadow:0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;

  padding:14px;

  border-radius:8px;

  background:#0c0715;
  color:white;

  border:1px solid rgba(138,77,255,.45);

  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 18px
    rgba(255,22,216,.18);
}

.searchbar button{
  padding:0 18px;

  border:0;
  border-radius:8px;

  color:white;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );
}

/* =========================================================
MAIN
========================================================= */

main{
  width:100%;
  max-width:1500px;

  margin:auto;

  padding:
    16px
    16px
    110px;
}

/* =========================================================
HERO
========================================================= */

.hero{
  position:relative;

  min-height:clamp(400px,58vh,620px);

  overflow:hidden;

  display:flex;
  align-items:flex-end;

  padding:clamp(25px,5vw,60px);

  border-radius:18px;

  border:1px solid rgba(255,22,216,.25);

  background:
    radial-gradient(
      circle at 75% 30%,
      rgba(25,234,255,.18),
      transparent 25%
    ),
    radial-gradient(
      circle at 75% 75%,
      rgba(255,22,216,.25),
      transparent 35%
    ),
    linear-gradient(
      110deg,
      #090511,
      #190c2e,
      #07121e
    );
}

.hero:before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(5,3,11,.98),
      rgba(5,3,11,.72) 48%,
      rgba(5,3,11,.05)
    );
}

.hero:after{
  content:"";

  position:absolute;
  inset:0;

  opacity:.08;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.18) 4px
    );
}

.hero-content{
  position:relative;
  z-index:3;

  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);

  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:
    clamp(46px,9vw,95px);

  line-height:.85;

  text-transform:uppercase;

  text-shadow:
    0 0 20px
    rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;

  line-height:1.6;

  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,
.secondary{
  padding:13px 18px;
  border-radius:8px;
  font-weight:900;
}

.primary{
  border:0;
  color:white;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    0 0 18px
    rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);

  background:rgba(25,234,255,.04);

  border:1px solid rgba(25,234,255,.38);
}

/* =========================================================
CATALOGS
========================================================= */

.catalog-section{
  margin:30px 0 0;
}

.catalog-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:12px;

  padding-bottom:9px;

  border-bottom:
    1px solid
    rgba(255,22,216,.15);
}

.catalog-title{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:25px;
  letter-spacing:1px;
}

.catalog-label{
  color:var(--cyan);

  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.row{
  display:flex;

  gap:13px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:3px 1px 12px;

  scroll-snap-type:x proximity;

  scrollbar-width:none;
}

.row::-webkit-scrollbar{
  display:none;
}

/* =========================================================
POSTERS
========================================================= */

.poster-card{
  position:relative;

  flex:0 0 145px;

  overflow:hidden;

  border:0;
  padding:0;

  text-align:left;
  color:white;

  background:#10091c;

  border-radius:8px;

  scroll-snap-align:start;

  box-shadow:
    0 7px 22px
    rgba(0,0,0,.32);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.poster-card:hover{
  transform:
    translateY(-4px)
    scale(1.02);

  box-shadow:
    0 12px 30px
    rgba(255,22,216,.20);
}

.poster-card img{
  display:block;

  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;

  background:#171027;
}

.poster-overlay{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:38px 9px 9px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.94)
    );
}

.poster-name{
  font-size:12px;
  font-weight:900;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.poster-year{
  margin-top:3px;

  color:#bdb0c6;

  font-size:9px;
}

.poster-type{
  position:absolute;

  top:7px;
  left:7px;

  padding:4px 6px;

  border-radius:4px;

  background:rgba(0,0,0,.72);

  color:var(--cyan);

  font-size:7px;
  font-weight:900;

  letter-spacing:1px;
}

/* =========================================================
SNOAKS BADGE
========================================================= */

.snoaks-badge{
  position:absolute;

  top:7px;
  right:7px;

  z-index:5;

  padding:4px 6px;

  border-radius:4px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  font-size:7px;
  font-weight:900;

  letter-spacing:.8px;

  box-shadow:
    0 0 10px
    rgba(255,22,216,.35);
}

/* =========================================================
NOTICE
========================================================= */

.empty{
  padding:28px 5px;

  color:var(--muted);

  font-size:13px;
}

.notice{
  padding:16px;

  border-radius:9px;

  background:
    rgba(255,22,216,.045);

  border:
    1px solid
    rgba(255,22,216,.17);

  color:#c8bacf;

  line-height:1.6;

  font-size:12px;
}

/* =========================================================
MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.88);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:95vh;

  overflow:auto;

  padding:
    20px
    18px
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  border-radius:
    22px 22px 0 0;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(138,77,255,.18),
      transparent 40%
    ),
    #0c0718;

  border-top:
    1px solid
    rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:27px;
}

.close{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#170d27;

  color:var(--cyan);

  border:
    1px solid
    rgba(25,234,255,.3);

  font-size:22px;
}

/* =========================================================
DETAILS
========================================================= */

.details{
  display:grid;

  grid-template-columns:
    105px 1fr;

  gap:16px;
}

.details img{
  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;
}

.details p{
  color:#c3b5cb;

  line-height:1.55;

  font-size:13px;
}

.meta{
  color:var(--cyan);

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:7px;
}

/* =========================================================
SOURCES
========================================================= */

.source{
  width:100%;

  margin-top:9px;

  padding:14px;

  text-align:left;

  color:white;

  border-radius:9px;

  background:
    linear-gradient(
      100deg,
      #150c29,
      #0d0819
    );

  border:
    1px solid
    rgba(25,234,255,.15);
}

.source:hover{
  border-color:var(--cyan);

  box-shadow:
    0 0 16px
    rgba(25,234,255,.14);
}

.source-top{
  display:flex;
  align-items:center;

  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;

  display:flex;

  align-items:center;
  justify-content:center;

  flex:none;

  border-radius:50%;

  color:var(--cyan);

  background:
    rgba(25,234,255,.08);
}

.source-name{
  font-weight:900;
}

.provider{
  margin-top:4px;

  color:var(--cyan);

  font-size:9px;
  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;
}

.badges{
  margin-top:8px;
}

.badge{
  display:inline-block;

  padding:4px 7px;

  margin-right:5px;

  border-radius:5px;

  background:
    rgba(255,22,216,.10);

  color:#ff7be4;

  font-size:8px;
  font-weight:900;

  letter-spacing:.7px;
}

.badge.good{
  background:
    rgba(66,255,176,.10);

  color:var(--green);
}

.badge.warning{
  background:
    rgba(255,212,90,.10);

  color:var(--yellow);
}

.badge.blue{
  background:
    rgba(25,234,255,.10);

  color:var(--cyan);
}

.source-desc{
  margin-top:7px;

  color:#91859b;

  font-size:10px;
}

/* =========================================================
PLAYER
========================================================= */

.player-shell{
  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#000;

  border:
    1px solid
    rgba(25,234,255,.25);

  box-shadow:
    0 0 30px
    rgba(25,234,255,.08);
}

video{
  display:block;

  width:100%;

  max-height:70vh;

  background:#000;
}

.iframe-player{
  width:100%;
  aspect-ratio:16/9;

  background:#000;
}

iframe{
  display:block;

  width:100%;
  height:100%;

  border:0;

  background:#000;
}

.player-status{
  padding:11px 13px;

  background:#0e0818;

  border-top:
    1px solid
    rgba(255,255,255,.07);

  color:#aaa;

  font-size:11px;
}

.player-status.ready{
  color:var(--green);
}

.player-status.error{
  color:var(--red);
}

.player-controls{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:12px;
}

.player-button{
  padding:10px 13px;

  border-radius:7px;

  color:white;

  background:#170d27;

  border:
    1px solid
    rgba(255,255,255,.1);

  font-weight:800;

  font-size:11px;
}

.player-button.primary{
  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  border:0;
}

/* =========================================================
SETTINGS
========================================================= */

.field{
  margin:18px 0;
}

.field label{
  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:9px;
  font-weight:900;

  letter-spacing:2px;

  text-transform:uppercase;
}

.field input,
.field textarea{
  width:100%;

  padding:13px;

  border-radius:7px;

  background:#080510;

  color:white;

  border:
    1px solid
    rgba(138,77,255,.3);

  outline:none;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.setting-block{
  margin:
    22px 0;

  padding:
    15px;

  border-radius:10px;

  background:
    rgba(255,255,255,.025);

  border:
    1px solid
    rgba(138,77,255,.20);
}

.setting-block h3{
  margin:0 0 7px;

  font-size:15px;

  font-weight:900;
}

.setting-block p{
  margin:0 0 15px;

  color:#9d91a6;

  font-size:11px;

  line-height:1.5;
}

.list-row{
  display:flex;

  gap:7px;

  margin-bottom:9px;
}

.list-row input{
  flex:1;
}

.remove-list{
  width:43px;

  border-radius:7px;

  border:
    1px solid
    rgba(255,85,119,.25);

  background:
    rgba(255,85,119,.08);

  color:var(--red);

  font-weight:900;
}

.small-button{
  padding:
    10px 13px;

  border-radius:7px;

  border:
    1px solid
    rgba(25,234,255,.25);

  background:
    rgba(25,234,255,.06);

  color:var(--cyan);

  font-size:11px;

  font-weight:900;
}

.save-settings{
  width:100%;

  margin-top:10px;

  padding:14px;

  border:0;

  border-radius:8px;

  color:#fff;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );
}

/* =========================================================
NAV
========================================================= */

.nav{
  position:fixed;

  z-index:400;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  padding-bottom:
    env(safe-area-inset-bottom);

  display:flex;

  align-items:center;
  justify-content:space-around;

  background:
    rgba(8,5,17,.96);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-top:
    1px solid
    rgba(255,22,216,.18);
}

.nav button{
  border:0;

  background:none;

  color:#766a80;

  font-size:9px;

  letter-spacing:1px;
}

.nav button span{
  display:block;

  font-size:22px;

  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);

  text-shadow:
    0 0 10px
    var(--pink);
}

/* =========================================================
DESKTOP
========================================================= */

@media(min-width:700px){

  .poster-card{
    flex-basis:180px;
  }

  .details{
    grid-template-columns:
      190px 1fr;
  }

  .details img{
    width:190px;
  }

  .hero{
    min-height:580px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    SAUVE
  </div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>


<main id="main">

  <div class="hero">

    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Discover movies and television,
        browse your catalogs, explore your
        Snoaks lists and find available
        sources.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button
          class="secondary"
          onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>

    </div>

  </div>


  <div id="catalogContainer">

    <div class="empty">
      Loading SAUVE…
    </div>

  </div>

</main>


<nav class="nav">

  <button
    class="active"
    onclick="goHome()">

    <span>⌂</span>
    HOME

  </button>

  <button
    onclick="focusSearch()">

    <span>⌕</span>
    SEARCH

  </button>

  <button
    onclick="openSettings()">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>


<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>


<script>

/* =========================================================
CONFIG
========================================================= */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    "",

  snoaks:
    loadSnoaksLists()

};

let currentStreams = [];

let currentPlayableStreams = [];

let currentPlayerIndex = 0;


/* =========================================================
BASIC HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}


function safeURL(value){

  try{

    return new URL(
      String(value).trim()
    ).href;

  }
  catch{

    return "";

  }

}


function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(
      /\/manifest\.json\/?$/i,
      ""
    );

}


function addonRoot(url){

  return normalizeManifest(url) + "/";
}


async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  return response.json();

}


/* =========================================================
SNOAKS STORAGE
========================================================= */

function loadSnoaksLists(){

  try{

    const raw =
      localStorage.getItem(
        "sauve_snoaks_lists"
      );

    if(!raw){
      return [];
    }

    const parsed =
      JSON.parse(raw);

    if(
      !Array.isArray(parsed)
    ){

      return [];

    }

    return parsed
      .filter(
        item =>
          item &&
          typeof item.url === "string"
      )
      .map(
        item => ({
          name:
            item.name ||
            "Snoaks List",
          url:
            item.url,
          enabled:
            item.enabled !== false
        })
      );

  }
  catch{

    return [];

  }

}


function saveSnoaksLists(){

  localStorage.setItem(

/* =========================================================
CATALOG HELPERS
========================================================= */

function supportsSearch(catalog){

  if(
    !Array.isArray(
      catalog.extra
    )
  ){

    return false;

  }

  return catalog.extra.some(
    extra =>
      typeof extra === "string"
        ? extra === "search"
        : extra &&
          extra.name === "search"
  );

}


function makeExtraProps(values){

  return Object.entries(values)
    .filter(
      ([,value]) =>
        value !== undefined &&
        value !== null &&
        String(value).length
    )
    .map(
      ([key,value]) =>
        key +
        "=" +
        encodeURIComponent(
          String(value)
        )
    )
    .join("&");

}


function buildCatalogURL(
  catalog,
  extra={}
){

  let url =
    addonRoot(
      state.metadata
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );

  const props =
    makeExtraProps(extra);

  if(props){

    url +=
      "/" +
      props;

  }

  return url + ".json";

}


/* =========================================================
CATALOG NAMES
========================================================= */

function prettyCatalogName(catalog){

  const raw =
    String(
      catalog.name ||
      catalog.id ||
      "CATALOG"
    );

  const lower =
    raw.toLowerCase();

  const mappings = [

    ["netflix","NETFLIX"],

    ["disney+","DISNEY+"],
    ["disney","DISNEY+"],

    ["apple tv","APPLE TV+"],
    ["apple","APPLE TV+"],

    ["hbo","HBO"],
    ["max","MAX"],

    ["hulu","HULU"],

    ["prime","PRIME VIDEO"],
    ["amazon","PRIME VIDEO"],

    ["paramount","PARAMOUNT+"],
    ["peacock","PEACOCK"],

    ["marvel","MARVEL"],
    ["dc","DC"],

    ["popular","POPULAR"],
    ["trending","TRENDING"],
    ["featured","FEATURED"],

    ["top","TOP PICKS"],
    ["new","NEW RELEASES"]

  ];

  for(
    const [needle,label]
    of mappings
  ){

    if(
      lower.includes(needle)
    ){

      return label;

    }

  }

  return raw.toUpperCase();

}


function catalogPriority(catalog){

  const name =
    String(
      catalog.name ||
      catalog.id ||
      ""
    ).toLowerCase();

  const priority = [

    "featured",
    "trending",
    "popular",
    "netflix",
    "disney",
    "apple",
    "hbo",
    "max",
    "hulu",
    "prime",
    "amazon",
    "paramount",
    "peacock",
    "marvel",
    "dc",
    "top",
    "new"

  ];

  const index =
    priority.findIndex(
      word =>
        name.includes(word)
    );

  return index < 0
    ? 999
    : index;

}


/* =========================================================
METADATA HOME
========================================================= */

async function loadMetadataCatalogs(){

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    if(!catalogs.length){

      return "";

    }

    const usable =
      catalogs
        .filter(
          catalog =>
            catalog &&
            catalog.id &&
            catalog.type
        )
        .sort(
          (a,b) =>
            catalogPriority(a) -
            catalogPriority(b)
        );

    const selected =
      usable.slice(
        0,
        30
      );

    const results =
      await Promise.allSettled(
        selected.map(
          async catalog => {

            const data =
              await fetchJSON(
                buildCatalogURL(
                  catalog
                )
              );

            return {
              catalog,
              metas:
                Array.isArray(
                  data.metas
                )
                  ? data.metas
                  : []
            };

          }
        )
      );

    let html = "";

    results.forEach(
      result => {

        if(
          result.status !==
          "fulfilled"
        ){

          return;

        }

        const {
          catalog,
          metas
        } =
        result.value;

        if(!metas.length){
          return;
        }

        html +=
          renderCatalogRow(
            catalog,
            metas
          );

      }
    );

    return html;

  }
  catch(error){

    console.warn(
      "Metadata catalog error:",
      error
    );

    return `

      <div class="notice">

        Metadata catalogs could not be loaded.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}

========================================================= */

async function loadSnoaksLists(){

  const enabled =
    state.snoaks.filter(
      item =>
        item.enabled &&
        safeURL(item.url)
    );

  if(!enabled.length){

    return "";

  }

  const results =
    await Promise.allSettled(
      enabled.map(
        item =>
          loadOneSnoaksList(
            item
          )
      )
    );

  let html = "";

  results.forEach(
    result => {

      if(
        result.status !==
        "fulfilled"
      ){

        return;

      }

      if(
        !result.value ||
        !result.value.items.length
      ){

        return;

      }

      html +=
        renderSnoaksRow(
          result.value.name,
          result.value.items
        );

    }
  );

  return html;

}


async function loadOneSnoaksList(item){

  const url =
    safeURL(
      item.url
    );

  if(!url){

    throw new Error(
      "Invalid Snoaks list URL"
    );

  }

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:
            "application/json,text/plain,*/*"
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  const text =
    await response.text();

  let items = [];

  const trimmed =
    text.trim();

  /*
    Try JSON first.
  */

  if(
    trimmed.startsWith("{") ||
    trimmed.startsWith("[")
  ){

    try{

      const json =
        JSON.parse(
          trimmed
        );

      items =
        normalizeSnoaksJSON(
          json
        );

    }
    catch{

      items = [];

    }

  }

  /*
    If JSON wasn't useful,
    try M3U.
  */

  if(!items.length){

    items =
      parseSnoaksM3U(
        trimmed
      );

  }

  return {
    name:
      item.name ||
      "SNOAKS LIST",
    items:
      dedupeSnoaks(
        items
      ).slice(
        0,
        40
      )
  };

}


/* =========================================================
SNOAKS JSON NORMALIZER
========================================================= */

function normalizeSnoaksJSON(data){

  let source = data;

  if(
    data &&
    Array.isArray(
      data.items
    )
  ){

    source =
      data.items;

  }
  else if(
    data &&
    Array.isArray(
      data.movies
    )
  ){

    source =
      data.movies;

  }
  else if(
    data &&
    Array.isArray(
      data.shows
    )
  ){

    source =
      data.shows;

  }
  else if(
    data &&
    Array.isArray(
      data.metas
    )
  ){

    source =
      data.metas;

  }

  if(
    !Array.isArray(source)
  ){

    return [];

  }

  return source
    .map(
      item =>
        normalizeSnoaksItem(
          item
        )
    )
    .filter(Boolean);

}


function normalizeSnoaksItem(item){

  if(
    !item ||
    typeof item !== "object"
  ){

    return null;

  }

  const name =
    item.name ||
    item.title ||
    item.movie ||
    item.show ||
    item.label;

  if(!name){

    return null;

  }

  const poster =
    item.poster ||
    item.posterUrl ||
    item.image ||
    item.imageUrl ||
    item.thumbnail ||
    item.logo ||
    "";

  const url =
    item.url ||
    item.stream ||
    item.streamUrl ||
    item.video ||
    item.videoUrl ||
    "";

  const id =
    item.id ||
    item.imdb_id ||
    item.imdbId ||
    item.tmdb_id ||
    item.tmdbId ||
    ("snoaks-" +
      slugify(name));

  let type =
    String(
      item.type ||
      item.contentType ||
      "movie"
    ).toLowerCase();

  if(
    type === "series" ||
    type === "tv"
  ){

    type = "series";

  }
  else{

    type = "movie";

  }

  return {

    id:
      String(id),

    type,

    name:
      String(name),

    poster:
      String(poster || ""),

    year:
      item.year ||
      item.releaseInfo ||
      "",

    description:
      item.description ||
      item.overview ||
      "",

    streamUrl:
      String(url || ""),

    snoaks:true

  };

}


/* =========================================================
M3U PARSER
========================================================= */

function parseSnoaksM3U(text){

  if(
    !text ||
    !text.includes("#EXTINF")
  ){

    return [];

  }

  const lines =
    text.split(/\r?\n/);

  const items = [];

  let current = null;

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      lines[i].trim();

    if(
      line.startsWith(
        "#EXTINF"
      )
    ){

      const comma =
        line.indexOf(",");

      const title =
        comma >= 0
          ? line
              .slice(
                comma + 1
              )
              .trim()
          : "Snoaks Item";

      const poster =
        extractAttribute(
          line,
          "tvg-logo"
        ) ||
        extractAttribute(
          line,
          "logo"
        ) ||
        "";

      const group =
        extractAttribute(
          line,
          "group-title"
        ) ||
        "SNOAKS";

      current = {

        name:title,

        poster,

        group,

        streamUrl:"",

        type:"movie",

        snoaks:true

      };

    }
    else if(
      current &&
      line &&
      !line.startsWith("#")
    ){

      current.streamUrl =
        line;

      current.id =
        "snoaks-" +
        slugify(
          current.name
        );

      items.push(
        current
      );

      current = null;

    }

  }

  return items;

}


function extractAttribute(
  line,
  name
){

  const regex =
    new RegExp(
      name +
      '="([^"]*)"',
      "i"
    );

  const match =
    line.match(
      regex
    );

  return match
    ? match[1]
    : "";

}


function slugify(value){

  return String(value)
    .toLowerCase()
    .replace(
      /[^a-z0-9]+/g,
      "-"
    )
    .replace(
      /^-+|-+$/g,
      ""
    )
    .slice(
      0,
      80
    );

}


function dedupeSnoaks(items){

  const seen =
    new Set();

  return items.filter(
    item => {

      const key =
        String(
          item.name
        ).toLowerCase();

      if(
        seen.has(key)
      ){

        return false;

      }

      seen.add(key);

      return true;

    }
  );

}

              poster

            style="

              padding:15px;
              text-align:center;
              font-weight:900;
              background:
                linear-gradient(
                  135deg,
                  #180b2c,
                  #080512
                );
            ">

            ${escapeHTML(
              item.name
            )}

          </div>
          `
      }

      <div class="snoaks-badge">
        SNOAKS
      </div>

      <div class="poster-type">
        ${escapeHTML(
          String(
            item.type ||
            "movie"
          ).toUpperCase()
        )}
      </div>

      <div class="poster-overlay">

        <div class="poster-name">
          ${escapeHTML(
            item.name

        <div class="poster-year">
          ${escapeHTML(
            item.year ||
            ""
          )}
        </div>

      </div>

    </button>

  `;

}


function escapeJS(value){

  return String(value || "")
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}

          ${escapeHTML(
            year
          )}
        </div>

      </div>

    </button>

  `;

}


function dedupeMetas(metas){

  const seen =
    new Set();

  return metas.filter(
    item => {

      const key =
        String(
          item.type ||
          ""
        ) +
        "|" +
        String(
          item.id ||
          ""
        );

      if(
        seen.has(key)
      ){

        return false;

      }

      seen.add(key);

      return true;

    }
  );

}

async function loadHome(){

  const container =
    $("catalogContainer");

  /*
    Important:
    render the page in stages.

    This prevents the app from appearing
    frozen while one source is loading.
  */

  container.innerHTML = `

    <section class="catalog-section">

      <div class="catalog-heading">

        <h2 class="catalog-title">
          YOUR CINEMA
        </h2>

        <span class="catalog-label">
          LOADING
        </span>

      </div>

      <div class="empty">
        Loading catalogs…
      </div>

    </section>

  `;

  const metadataPromise =
    loadMetadataCatalogs();

  const snoaksPromise =
    loadSnoaksLists();

  const results =
    await Promise.allSettled([
      metadataPromise,
      snoaksPromise
    ]);

  let html = "";

  if(
    results[0].status ===
    "fulfilled"
  ){

    html +=
      results[0].value;

  }

  if(
    results[1].status ===
    "fulfilled"
  ){

    html +=
      results[1].value;

  }

  if(!html){

    html = `

      <div class="notice">

        <strong>
          SAUVE IS READY
        </strong>

        <br><br>

        No catalogs are currently
        available.

        <br><br>

        Open Settings to verify your
        metadata manifest or add a Snoaks
        list.

      </div>

    `;

  }

  container.innerHTML =
    html;

}

SEARCH
========================================================= */

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();

  if(!query){

    focusSearch();

    return;

  }

  $("main").innerHTML = `

    <div class="hero">

      <div class="hero-content">

        <div class="hero-kicker">
          SAUVE SEARCH
        </div>

        <h1>
          ${escapeHTML(
            query
          )}
        </h1>

        <p>
          Searching movies and television…
        </p>

      </div>

    </div>

    <div
      id="searchResults"
      class="empty">

      Searching…

    </div>

  `;

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    const searchable =
      catalogs.filter(
        supportsSearch
      );

    const responses =
      await Promise.allSettled(
        searchable.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog,
                {
                  search:query
                }
              )
            )
        )
      );

    const metas = [];

    responses.forEach(
      result => {

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );

    const results =
      dedupeMetas(
        metas
      );

    $("searchResults")
      .outerHTML =

      results.length

        ?

        `

        <section>

          <div class="catalog-heading">

            <h2 class="catalog-title">
              RESULTS
            </h2>

            <span class="catalog-label">
              ${results.length}
            </span>

          </div>

          <div class="row">

            ${results
              .map(
                renderPosterCard
              )
              .join("")}

          </div>

        </section>

        `

        :

        `

        <div class="notice">

          No results found for

          <strong>
            ${escapeHTML(query)}
          </strong>.

        </div>

        `;

  }
  catch(error){

    $("searchResults")
      .outerHTML = `

        <div class="notice">

          <strong>
            SEARCH FAILED
          </strong>

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

  }

}

/* =========================================================
SNOAKS TITLE
========================================================= */

let snoaksItemsCache = [];


async function openSnoaksTitle(
  id
){

  /*
    Reload the Snoaks lists so the selected
    item can be found without requiring
    a global database.
  */

  openModal(`

    <div class="sheet-header">

      <h2>
        SNOAKS
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="empty">
      Loading title…
    </div>

  `);

  try{

    const enabled =
      state.snoaks.filter(
        item =>
          item.enabled &&
          safeURL(item.url)
      );

    let found = null;

    for(
      const list
      of enabled
    ){

      try{

        const data =
          await loadOneSnoaksList(
            list
          );

        const match =
          data.items.find(
            item =>
              String(
                item.id
              ) ===
              String(id)
          );

        if(match){

          found =
            match;

          break;

        }

      }
      catch{}

    }

    if(!found){

      throw new Error(
        "Snoaks title could not be loaded."
      );

    }

    openModal(`

      <div class="sheet-header">

        <h2>
          ${escapeHTML(
            found.name
          )}
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>

      <div class="details">

        <img
          src="${escapeHTML(
            found.poster ||
            ""
          )}">

        <div>

          <div class="meta">

            SNOAKS
            ${found.year
              ? " • " +
                escapeHTML(
                  found.year
                )
              : ""}

          </div>

          <p>

            ${escapeHTML(
              found.description ||
              "Snoaks list item."
            )}

          </p>

          ${
            found.streamUrl

              ?

              `
              <button
                class="primary"
                onclick="
                  playSnoaksStream(
                    '${escapeJS(
                      found.streamUrl
                    )}'
                  )
                ">

                ▶ PLAY

              </button>
              `

              :

              `
              <div class="notice">
                This Snoaks item does not
                contain a direct stream URL.
              </div>
              `
          }

        </div>

      </div>

    `);

  }
  catch(error){

    openModal(`

      <div class="sheet-header">

        <h2>
          SNOAKS ERROR
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>

      <div class="notice">

        ${escapeHTML(
          error.message
        )}

      </div>

    `);

  }

}


/* =========================================================
SNOAKS PLAYER
========================================================= */

function playSnoaksStream(
  url
){

  if(!safeURL(url)){

    return;

  }

  const lower =
    url.toLowerCase();

  const isHLS =
    lower.includes(
      ".m3u8"
    );

  const isMP4 =
    lower.includes(
      ".mp4"
    );

  if(
    !isHLS &&
    !isMP4
  ){

    openModal(`

      <div class="sheet-header">

        <h2>
          SNOAKS SOURCE
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>

      <div class="notice">

        This Snoaks item provides a URL,
        but it does not appear to be a
        browser-direct MP4 or HLS stream.

        <br><br>

        SAUVE will not disguise an external
        page as a playable video.

      </div>

      <br>

      <button
        class="secondary"
        onclick="
          window.open(
            '${escapeJS(url)}',
            '_blank',
            'noopener'
          )
        ">

        OPEN EXTERNAL SOURCE

      </button>

    `);

    return;

  }

  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <video
        id="snoaksVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>

      <div
        id="snoaksStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>

  `);

  const video =
    $("snoaksVideo");

  const status =
    $("snoaksStatus");

  video.src =
    url;

  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {
      once:true
    }
  );

  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );

  video.addEventListener(
    "error",
    () => {

      status.textContent =
        "Safari could not decode or access this source.";

      status.className =
        "player-status error";

    }
  );

  video.load();

}


/* =========================================================
STREAM SYSTEM
========================================================= */

function buildStreamURL(
  type,
  id
){

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(
      type
    ) +
    "/" +
    encodeURIComponent(
      id
    ) +
    ".json"
  );

}


function getStreamURL(stream){

  return String(
    stream?.url ||
    ""
  ).trim();

}


function isPlayerFrame(stream){

  return Boolean(
    stream?.playerFrameUrl
  );

}


function isExternal(stream){

  return Boolean(
    stream?.externalUrl
  );

}


function isNotWebReady(stream){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}


function isHLS(stream){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".m3u8") ||
    type.includes("m3u8") ||
    type.includes("mpegurl")
  );

}


function isMP4(stream){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".mp4") ||
    type.includes("mp4")
  );

}


function isWebM(stream){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".webm") ||
    type.includes("webm")
  );

}


function isPlayableCandidate(stream){

  if(
    isPlayerFrame(
      stream
    )
  ){

    return true;

  }

  if(
    isExternal(
      stream
    )
  ){

    return false;

  }

  return (
    isMP4(stream) ||
    isHLS(stream) ||
    isWebM(stream)
  );

}


/* =========================================================
PROVIDER
========================================================= */

function providerName(stream){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  const providers = [

    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"

  ];

  for(
    const name
    of providers
  ){

    if(
      text.includes(name)
    ){

      return name;

    }

  }

  return "stream source";

}


/* =========================================================
SOURCE SCORE
========================================================= */

function compatibilityScore(stream){

  let score = 0;

  if(
    isMP4(stream)
  ){
    score +=100;
  }

  if(
    isHLS(stream)
  ){
    score +=90;
  }

  if(
    isWebM(stream)
  ){
    score +=80;
  }

  if(
    isPlayerFrame(stream)
  ){
    score +=70;
  }

  if(
    isExternal(stream)
  ){
    score -=100;
  }

  return score;

}


/* =========================================================
BADGES
========================================================= */

function renderStreamBadges(
  stream,
  playable,
  format
){

  let html = "";

  html += `

    <span class="
      badge
      ${playable ? "good" : "warning"}
    ">

      ${escapeHTML(
        format
      )}

    </span>

  `;

  if(
    isNotWebReady(
      stream
    )
  ){

    html += `

      <span class="badge warning">
        NOT WEB READY
      </span>

    `;

  }
  else{

    html += `

      <span class="badge good">
        WEB READY
      </span>

    `;

  }

  if(
    stream.quality
  ){

    html += `

      <span class="badge blue">
        ${escapeHTML(
          stream.quality
        )}
      </span>

    `;

  }

  if(
    stream.resolution
  ){

    html += `

      <span class="badge blue">
        ${escapeHTML(
          stream.resolution
        )}
      </span>

    `;

  }

  if(
    stream.videoHash
  ){

    html += `

      <span class="badge">
        HASH
      </span>

    `;

  }

  return html;

}


/* =========================================================
SOURCE RENDER
========================================================= */

function renderSource(
  stream,
  index
){

  const playable =
    isPlayableCandidate(
      stream
    );

  let format =
    "SOURCE";

  if(
    isMP4(stream)
  ){
    format="MP4";
  }
  else if(
    isHLS(stream)
  ){
    format="HLS";
  }
  else if(
    isWebM(stream)
  ){
    format="WEBM";
  }
  else if(
    isPlayerFrame(stream)
  ){
    format="PLAYER";
  }
  else if(
    isExternal(stream)
  ){
    format="EXTERNAL";
  }

  return `

    <button
      class="source"

      ${
        playable

          ?

          `onclick="playSource(${index})"`

          :

          `onclick="explainSource(${index})"`

      }>

      <div class="source-top">

        <div class="source-icon">

          ${
            playable
              ? "▶"
              : "!"
          }

        </div>

        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>

          <div class="provider">

            ${escapeHTML(
              providerName(
                stream
              )
            )}

          </div>

        </div>

      </div>

      <div class="badges">

        ${renderStreamBadges(
          stream,
          playable,
          format
        )}

      </div>

      <div class="source-desc">

        ${
          isExternal(stream)

            ?

            "External destination — SAUVE cannot treat this as a direct video file."

            :

          isNotWebReady(stream)

            ?

            "Provider marked this source as not web-ready."

            :

          playable

            ?

            "Tap to attempt playback inside SAUVE."

            :

            "This source does not expose a browser-compatible media URL."

        }

      </div>

    </button>

  `;

}


/* =========================================================
FIND SOURCES
========================================================= */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }

  $("sources").innerHTML = `

    <div class="empty">
      Loading stream sources…
    </div>

  `;

  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );

    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];

    if(
      !currentStreams.length
    ){

      $("sources").innerHTML = `

        <div class="notice">

          No stream sources were returned
          for this title.

        </div>

      `;

      return;

    }

    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );

    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );

    $("sources").innerHTML = `

      <div class="catalog-heading">

        <h2 class="catalog-title">
          SOURCES
        </h2>

        <span class="catalog-label">
          ${currentStreams.length}
        </span>

      </div>

      <div class="notice">

        <strong>
          ${currentPlayableStreams.length}
        </strong>

        potentially compatible source(s).

      </div>

      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    $("sources").innerHTML = `

      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================================
SOURCE EXPLANATION
========================================================= */

function explainSource(index){

  const stream =
    currentStreams[index];

  if(!stream){
    return;
  }

  if(
    isExternal(stream)
  ){

    alert(
      "This source is an external destination rather than a direct media stream."
    );

    return;

  }

  alert(
    "SAUVE could not identify a browser-compatible video URL for this source."
  );

}


/* =========================================================
PLAY SOURCE
========================================================= */

function playSource(index){

  const stream =
    currentStreams[index];

  if(!stream){
    return;
  }

  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );

  if(
    currentPlayerIndex < 0
  ){
    currentPlayerIndex=0;
  }

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;

  }

  playDirectStream(
    stream
  );

}


/* =========================================================
DIRECT PLAYER
========================================================= */

function playDirectStream(stream){

  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>

      <div
        id="playerStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

  const video =
    $("sauveVideo");

  const status =
    $("playerStatus");

  const url =
    getStreamURL(
      stream
    );

  if(!url){

    showPlayerError(
      "No direct media URL was returned."
    );

    return;

  }

  video.src =
    url;

  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {
      once:true
    }
  );

  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );

  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );

  video.addEventListener(
    "error",
    () => {

      showPlayerError(
        "Safari could not decode or access this video source."
      );

    }
  );

  video.load();

}


/* =========================================================
IFRAME PLAYER
========================================================= */

function openEmbeddedPlayer(stream){

  const url =
    String(
      stream.playerFrameUrl ||
      ""
    ).trim();

  if(!url){

    showPlayerError(
      "No player URL was returned."
    );

    return;

  }

  openModal(`

    <div class="sheet-header">

      <h2>

        ${escapeHTML(
          stream.name ||
          "PLAYER"
        )}

      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <div class="iframe-player">

        <iframe

          src="${escapeHTML(
            url
          )}"

          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "

          allowfullscreen>

        </iframe>

      </div>

      <div class="player-status ready">

        Provider player loaded inside SAUVE.

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

}


/* =========================================================
PLAYER HELPERS
========================================================= */

function showPlayerError(message){

  const status =
    $("playerStatus");

  if(status){

    status.textContent =
      message;

    status.className =
      "player-status error";

  }

}


function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;

  }

  let next =
    currentPlayerIndex + 1;

  if(
    next >=
    currentPlayableStreams.length
  ){

    next=0;

  }

  currentPlayerIndex =
    next;

  const stream =
    currentPlayableStreams[
      next
    ];

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }

}


function showSourcesAgain(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SOURCES
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    ${
      currentStreams.length

        ?

        currentStreams
          .map(
            renderSource
          )
          .join("")

        :

        `
          <div class="empty">
            No sources available.
          </div>
        `
    }

  `);

}


/* =========================================================
SETTINGS
========================================================= */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>


    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"
        placeholder="Paste your stream manifest">

    </div>


    <div class="setting-block">

      <h3>
        SNOAKS LISTS
      </h3>

      <p>

        Add Snoaks list URLs here.
        Multiple lists can be used at the
        same time. Enabled lists appear as
        additional Netflix-style rows on
        your SAUVE homepage.

      </p>


      <div id="snoaksListEditor">

        ${renderSnoaksSettingsRows()}

      </div>


      <button
        class="small-button"
        onclick="addSnoaksSettingRow()">

        + ADD SNOAKS LIST

      </button>

    </div>


    <div class="notice">

      Your metadata and stream addresses
      are stored locally in this browser.

      <br><br>

      Snoaks list addresses are also stored
      locally.

      <br><br>

      A failed Snoaks list will not prevent
      your regular SAUVE catalogs from
      loading.

    </div>


    <button
      class="save-settings"
      onclick="saveSettings()">

      ✓ SAVE ALL SETTINGS

    </button>

  `);

}


function renderSnoaksSettingsRows(){

  if(
    !state.snoaks.length
  ){

    return `

      <div
        class="empty"
        style="padding:10px 0">

        No Snoaks lists added yet.

      </div>

    `;

  }

  return state.snoaks
    .map(
      (item,index) => `

        <div
          class="list-row"
          data-snoaks-row="${index}">

          <input
            class="snoaks-name"
            placeholder="List name"
            value="${escapeHTML(
              item.name ||
              "Snoaks List"
            )}">

          <input
            class="snoaks-url"
            placeholder="Snoaks list URL"
            value="${escapeHTML(
              item.url ||
              ""
            )}">

          <button
            type="button"
            class="remove-list"
            onclick="
              removeSnoaksSettingRow(
                ${index}
              )
            ">

            ×

          </button>

        </div>

      `
    )
    .join("");

}


function addSnoaksSettingRow(){

  captureSnoaksRows();

  state.snoaks.push({

    name:
      "Snoaks List",

    url:
      "",

    enabled:
      true

  });

  const editor =
    $("snoaksListEditor");

  if(editor){

    editor.innerHTML =
      renderSnoaksSettingsRows();

  }

}


function removeSnoaksSettingRow(
  index
){

  captureSnoaksRows();

  state.snoaks.splice(
    index,
    1
  );

  const editor =
    $("snoaksListEditor");

  if(editor){

    editor.innerHTML =
      renderSnoaksSettingsRows();

  }

}


function captureSnoaksRows(){

  const editor =
    $("snoaksListEditor");

  if(!editor){
    return;
  }

  const rows =
    editor.querySelectorAll(
      "[data-snoaks-row]"
    );

  const values = [];

  rows.forEach(
    row => {

      const name =
        row.querySelector(
          ".snoaks-name"
        )?.value
        .trim() ||
        "Snoaks List";

      const url =
        row.querySelector(
          ".snoaks-url"
        )?.value
        .trim() ||
        "";

      if(url){

        values.push({

          name,
          url,
          enabled:true

        });

      }

    }
  );

  state.snoaks =
    values;

}


function saveSettings(){

  const metadata =
    $("metadataURL")
      ?.value
      .trim();

  const stream =
    $("streamURL")
      ?.value
      .trim();

  captureSnoaksRows();

  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;

  }

  state.metadata =
    metadata;

  state.stream =
    stream;

  localStorage.setItem(
    "sauve_metadata",
    metadata
  );

  localStorage.setItem(
    "sauve_stream",
    stream
  );

  saveSnoaksLists();

  closeModal();

  /*
    Reload only after everything has
    successfully been saved.
  */

  loadHome();

}


/* =========================================================
UI
========================================================= */

function focusSearch(){

  const input =
    $("searchInput");

  if(input){

    input.focus();

  }

}


function goHome(){

  location.reload();

}


function openModal(html){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* =========================================================
START
========================================================= */

loadHome();

</script>

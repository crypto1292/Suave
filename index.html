<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#150b25;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --text:#fff;
  --muted:#9d91a6;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#05030b;
}

body{
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -10%,rgba(138,77,255,.38),transparent 35%),
    radial-gradient(circle at 0 30%,rgba(255,22,216,.12),transparent 30%),
    radial-gradient(circle at 100% 50%,rgba(25,234,255,.10),transparent 30%),
    #05030b;
}

button,input{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}

header{
  position:sticky;
  top:0;
  z-index:100;
  padding:calc(10px + env(safe-area-inset-top)) 14px 14px;
  background:rgba(5,3,11,.94);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-bottom:1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-style:italic;
  font-size:clamp(68px,19vw,120px);
  line-height:.78;
  letter-spacing:7px;
  transform:skewX(-7deg);
  color:white;
  text-shadow:
    0 0 4px white,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;
  text-align:center;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:8px;
  background:#0c0715;
  color:white;
  border:1px solid rgba(138,77,255,.45);
  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);
  box-shadow:0 0 18px rgba(255,22,216,.18);
}

.searchbar button{
  padding:0 18px;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}

main{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:16px 16px 110px;
}

.hero{
  position:relative;
  min-height:clamp(400px,58vh,620px);
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  padding:clamp(25px,5vw,60px);
  border-radius:18px;
  border:1px solid rgba(255,22,216,.25);
  background:
    radial-gradient(circle at 75% 30%,rgba(25,234,255,.18),transparent 25%),
    radial-gradient(circle at 75% 75%,rgba(255,22,216,.25),transparent 35%),
    linear-gradient(110deg,#090511,#190c2e,#07121e);
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(5,3,11,.98),rgba(5,3,11,.72) 48%,rgba(5,3,11,.05));
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.08;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.18) 4px);
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:clamp(46px,9vw,95px);
  line-height:.85;
  text-transform:uppercase;
  text-shadow:0 0 20px rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;
  line-height:1.6;
  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,.secondary{
  padding:13px 18px;
  border-radius:8px;
  font-weight:900;
}

.primary{
  border:0;
  color:white;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:0 0 18px rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);
  background:rgba(25,234,255,.04);
  border:1px solid rgba(25,234,255,.38);
}

.catalog-section{
  margin:30px 0 0;
}

.catalog-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:9px;
  border-bottom:1px solid rgba(255,22,216,.15);
}

.catalog-title{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:25px;
  letter-spacing:1px;
}

.catalog-label{
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.row{
  display:flex;
  gap:13px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 1px 12px;
  scroll-snap-type:x proximity;
  scrollbar-width:none;
}

.row::-webkit-scrollbar{display:none}

.poster-card{
  position:relative;
  flex:0 0 145px;
  overflow:hidden;
  border:0;
  padding:0;
  text-align:left;
  color:white;
  background:#10091c;
  border-radius:8px;
  scroll-snap-align:start;
  box-shadow:0 7px 22px rgba(0,0,0,.32);
  transition:transform .18s ease,box-shadow .18s ease;
}

.poster-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 30px rgba(255,22,216,.20);
}

.poster-card img{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#171027;
}

.poster-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:38px 9px 9px;
  background:linear-gradient(transparent,rgba(0,0,0,.94));
}

.poster-name{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.poster-year{
  margin-top:3px;
  color:#bdb0c6;
  font-size:9px;
}

.poster-type{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,.72);
  color:var(--cyan);
  font-size:7px;
  font-weight:900;
  letter-spacing:1px;
}

.poster-score{
  position:absolute;
  top:7px;
  right:7px;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,.78);
  color:var(--yellow);
  font-size:8px;
  font-weight:900;
}

.notice{
  padding:16px;
  border-radius:9px;
  background:rgba(255,22,216,.045);
  border:1px solid rgba(255,22,216,.17);
  color:#c8bacf;
  line-height:1.6;
  font-size:12px;
}

.loading{
  padding:20px 5px;
  color:#91859b;
  font-size:12px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{display:flex}

.sheet{
  width:100%;
  max-height:95vh;
  overflow:auto;
  padding:20px 18px calc(30px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;
  background:
    radial-gradient(circle at 50% 0,rgba(138,77,255,.18),transparent 40%),
    #0c0718;
  border-top:1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:27px;
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#170d27;
  color:var(--cyan);
  border:1px solid rgba(25,234,255,.3);
  font-size:22px;
}

.details{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:16px;
}

.details img{
  width:105px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:8px;
}

.details p{
  color:#c3b5cb;
  line-height:1.55;
  font-size:13px;
}

.meta{
  color:var(--cyan);
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:7px;
}

.source{
  width:100%;
  margin-top:9px;
  padding:14px;
  text-align:left;
  color:white;
  border-radius:9px;
  background:linear-gradient(100deg,#150c29,#0d0819);
  border:1px solid rgba(25,234,255,.15);
}

.source:hover{
  border-color:var(--cyan);
  box-shadow:0 0 16px rgba(25,234,255,.14);
}

.source-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border-radius:50%;
  color:var(--cyan);
  background:rgba(25,234,255,.08);
}

.source-name{font-weight:900}

.provider{
  margin-top:4px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.badges{margin-top:8px}

.badge{
  display:inline-block;
  padding:4px 7px;
  margin-right:5px;
  margin-bottom:4px;
  border-radius:5px;
  background:rgba(255,22,216,.10);
  color:#ff7be4;
  font-size:8px;
  font-weight:900;
  letter-spacing:.7px;
}

.badge.good{
  background:rgba(66,255,176,.10);
  color:var(--green);
}

.badge.warning{
  background:rgba(255,212,90,.10);
  color:var(--yellow);
}

.badge.blue{
  background:rgba(25,234,255,.10);
  color:var(--cyan);
}

.source-desc{
  margin-top:7px;
  color:#91859b;
  font-size:10px;
}

.player-shell{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:12px;
  background:#000;
  border:1px solid rgba(25,234,255,.25);
}

video{
  display:block;
  width:100%;
  max-height:70vh;
  background:#000;
}

.iframe-player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

.player-status{
  padding:11px 13px;
  background:#0e0818;
  border-top:1px solid rgba(255,255,255,.07);
  color:#aaa;
  font-size:11px;
}

.player-status.ready{color:var(--green)}
.player-status.error{color:var(--red)}

.player-controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.player-button{
  padding:10px 13px;
  border-radius:7px;
  color:white;
  background:#170d27;
  border:1px solid rgba(255,255,255,.1);
  font-weight:800;
  font-size:11px;
}

.player-button.primary{
  background:linear-gradient(135deg,var(--pink),var(--purple));
  border:0;
}

.field{margin:18px 0}

.field label{
  display:block;
  margin-bottom:8px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.field input{
  width:100%;
  padding:13px;
  border-radius:7px;
  background:#080510;
  color:white;
  border:1px solid rgba(138,77,255,.3);
  outline:none;
}

.field-row{
  display:flex;
  gap:8px;
}

.field-row input{flex:1}

.small-button{
  padding:0 14px;
  border:0;
  border-radius:7px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}

.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px;
  margin-top:8px;
  background:#120a20;
  border:1px solid rgba(138,77,255,.2);
  border-radius:8px;
}

.list-info{
  min-width:0;
}

.list-name{
  font-weight:900;
  font-size:12px;
}

.list-url{
  margin-top:4px;
  color:#82768c;
  font-size:9px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.delete-button{
  flex:none;
  border:1px solid rgba(255,85,119,.3);
  background:rgba(255,85,119,.08);
  color:var(--red);
  border-radius:6px;
  padding:8px 10px;
  font-size:10px;
  font-weight:900;
}

.nav{
  position:fixed;
  z-index:400;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(8,5,17,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;
  background:none;
  color:#766a80;
  font-size:9px;
  letter-spacing:1px;
}

.nav button span{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);
  text-shadow:0 0 10px var(--pink);
}

.mdb-status{
  margin-top:8px;
  color:#8d8195;
  font-size:10px;
}

@media(min-width:700px){
  .poster-card{flex-basis:180px}
  .details{grid-template-columns:190px 1fr}
  .details img{width:190px}
  .hero{min-height:580px}
}
</style>
</head>

<body>

<header>
  <div class="logo">SAUVE</div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">
    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">
    <button id="searchButton">SEARCH</button>
  </div>
</header>

<main id="main">

  <div class="hero">
    <div class="hero-content">
      <div class="hero-kicker">WELCOME TO SAUVE</div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Discover movies and television,
        browse your catalogs, find available
        sources and play compatible streams.
      </p>

      <div class="hero-buttons">
        <button class="primary" onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button class="secondary" onclick="openSettings()">
          ⚙ SETTINGS
        </button>
      </div>
    </div>
  </div>

  <div id="catalogContainer">

    <div class="loading">
      Loading SAUVE…
    </div>

  </div>

  <!-- MDBLIST ISOLATED FROM MAIN CATALOG -->
  <div id="mdbContainer"></div>

</main>

<nav class="nav">

  <button class="active" onclick="goHome()">
    <span>⌂</span>
    HOME
  </button>

  <button onclick="focusSearch()">
    <span>⌕</span>
    SEARCH
  </button>

  <button onclick="openSettings()">
    <span>⚙</span>
    SETTINGS
  </button>

</nav>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>

/* ============================================================
   SAUVE CONFIG
============================================================ */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const state = {

  metadata:
    localStorage.getItem("sauve_metadata") ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem("sauve_stream") ||
    "",

  mdblistKey:
    localStorage.getItem("sauve_mdblist_key") ||
    "",

  mdblistLists:
    JSON.parse(
      localStorage.getItem("sauve_mdblist_lists") ||
      "[]"
    )

};

let currentStreams = [];
let currentPlayableStreams = [];
let currentPlayerIndex = 0;


/* ============================================================
   HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value=""){
  return String(value)
    .replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));
}

function normalizeManifest(url){
  return String(url || "")
    .trim()
    .replace(/\/manifest\.json\/?$/i,"");
}

function addonRoot(url){
  return normalizeManifest(url) + "/";
}

async function fetchJSON(url,options={}){
  const response =
    await fetch(
      url,
      {
        method:"GET",
        ...options,
        headers:{
          Accept:"application/json",
          ...(options.headers || {})
        },
        cache:"no-store"
      }
    );

  if(!response.ok){
    throw new Error("HTTP " + response.status);
  }

  return response.json();
}


/* ============================================================
   METADATA CATALOGS
============================================================ */

function supportsSearch(catalog){

  if(!Array.isArray(catalog.extra)){
    return false;
  }

  return catalog.extra.some(extra =>
    typeof extra === "string"
      ? extra === "search"
      : extra && extra.name === "search"
  );
}

function makeExtraProps(values){

  return Object.entries(values)
    .filter(([,value]) =>
      value !== undefined &&
      value !== null &&
      String(value).length
    )
    .map(([key,value]) =>
      key + "=" + encodeURIComponent(String(value))
    )
    .join("&");
}

function buildCatalogURL(catalog,extra={}){

  let url =
    addonRoot(state.metadata) +
    "catalog/" +
    encodeURIComponent(catalog.type) +
    "/" +
    encodeURIComponent(catalog.id);

  const props = makeExtraProps(extra);

  if(props){
    url += "/" + props;
  }

  return url + ".json";
}

function prettyCatalogName(catalog){

  const raw =
    String(catalog.name || catalog.id || "CATALOG");

  const lower = raw.toLowerCase();

  const mappings = [
    ["netflix","NETFLIX"],
    ["disney+","DISNEY+"],
    ["disney","DISNEY+"],
    ["apple tv","APPLE TV+"],
    ["apple","APPLE TV+"],
    ["hbo","HBO"],
    ["max","MAX"],
    ["hulu","HULU"],
    ["prime","PRIME VIDEO"],
    ["amazon","PRIME VIDEO"],
    ["paramount","PARAMOUNT+"],
    ["peacock","PEACOCK"],
    ["marvel","MARVEL"],
    ["dc","DC"],
    ["popular","POPULAR"],
    ["trending","TRENDING"],
    ["featured","FEATURED"],
    ["top","TOP PICKS"],
    ["new","NEW RELEASES"]
  ];

  for(const [needle,label] of mappings){
    if(lower.includes(needle)){
      return label;
    }
  }

  return raw.toUpperCase();
}

function catalogPriority(catalog){

  const name =
    String(catalog.name || catalog.id || "").toLowerCase();

  const priority = [
    "featured",
    "trending",
    "popular",
    "netflix",
    "disney",
    "apple",
    "hbo",
    "max",
    "hulu",
    "prime",
    "amazon",
    "paramount",
    "peacock",
    "marvel",
    "dc",
    "top",
    "new"
  ];

  const index =
    priority.findIndex(word =>
      name.includes(word)
    );

  return index < 0 ? 999 : index;
}


/* ============================================================
   LOAD MAIN HOME
============================================================ */

async function loadHome(){

  const container = $("catalogContainer");

  container.innerHTML = `
    <div class="loading">
      Loading your main catalogs…
    </div>
  `;

  try{

    const manifest =
      await fetchJSON(state.metadata);

    const catalogs =
      Array.isArray(manifest.catalogs)
        ? manifest.catalogs
        : [];

    if(!catalogs.length){

      container.innerHTML = `
        <div class="notice">
          Your metadata addon did not advertise any catalogs.
        </div>
      `;

      loadMDBLists();
      return;
    }

    const usable =
      catalogs
        .filter(c =>
          c &&
          c.id &&
          c.type
        )
        .sort((a,b) =>
          catalogPriority(a) -
          catalogPriority(b)
        );

    const selected =
      usable.slice(0,30);

    let html = "";

    /*
      IMPORTANT:
      Each catalog is handled independently.
      If one catalog fails, the others still appear.
    */

    for(const catalog of selected){

      try{

        const data =
          await fetchJSON(
            buildCatalogURL(catalog)
          );

        const metas =
          Array.isArray(data.metas)
            ? data.metas
            : [];

        if(metas.length){
          html += renderCatalogRow(
            catalog,
            metas
          );
        }

      }
      catch(error){

        console.warn(
          "Catalog failed:",
          catalog.id,
          error
        );

      }

    }

    container.innerHTML =
      html ||
      `
        <div class="notice">
          The metadata addon responded,
          but no catalog titles were returned.
        </div>
      `;

  }
  catch(error){

    container.innerHTML = `
      <div class="notice">
        <strong>MAIN CATALOG ERROR</strong>
        <br><br>
        ${escapeHTML(error.message)}
        <br><br>
        Your MDBList section can still load independently.
      </div>
    `;

  }

  /*
    MDBList NEVER blocks the main homepage.
  */

  loadMDBLists();
}


/* ============================================================
   MAIN POSTERS
============================================================ */

function dedupeMetas(metas){

  const seen = new Set();

  return metas.filter(item => {

    const key =
      String(item.type || "") +
      "|" +
      String(item.id || "");

    if(seen.has(key)){
      return false;
    }

    seen.add(key);
    return true;

  });
}

function renderCatalogRow(catalog,metas){

  const unique =
    dedupeMetas(metas).slice(0,30);

  if(!unique.length){
    return "";
  }

  return `
    <section class="catalog-section">

      <div class="catalog-heading">

        <h2 class="catalog-title">
          ${escapeHTML(
            prettyCatalogName(catalog)
          )}
        </h2>

        <span class="catalog-label">
          ${escapeHTML(
            String(catalog.type || "").toUpperCase()
          )}
        </span>

      </div>

      <div class="row">

        ${unique.map(renderPosterCard).join("")}

      </div>

    </section>
  `;
}


/* ============================================================
   MDBLIST
============================================================ */

/*
  MDBList lists are completely independent from the
  metadata addon.

  Add a list using:

  https://mdblist.com/lists/USERNAME/LIST-NAME

  The API key is entered only in Settings.

  The browser sends the key to api.mdblist.com.
*/

function getMDBListParts(url){

  try{

    const parsed =
      new URL(url);

    const parts =
      parsed.pathname
        .split("/")
        .filter(Boolean);

    const listsIndex =
      parts.findIndex(
        part =>
          part.toLowerCase() === "lists"
      );

    if(
      listsIndex >= 0 &&
      parts.length > listsIndex + 2
    ){

      return {
        user:parts[listsIndex + 1],
        slug:parts[listsIndex + 2]
      };

    }

  }
  catch(error){}

  return null;
}


/*
  MDBList's API uses the list's ID for the
  list-items endpoint.

  We first resolve the public list URL.
*/

async function resolveMDBList(url){

  const parts =
    getMDBListParts(url);

  if(!parts){
    throw new Error(
      "Invalid MDBList URL. Use https://mdblist.com/lists/USERNAME/LIST-NAME"
    );
  }

  const api =
    "https://api.mdblist.com";

  /*
    Public list lookup.
  */

  const candidates = [

    api +
      "/lists/" +
      encodeURIComponent(parts.user) +
      "/" +
      encodeURIComponent(parts.slug) +
      "?apikey=" +
      encodeURIComponent(state.mdblistKey),

    api +
      "/lists/" +
      encodeURIComponent(parts.user) +
      "/" +
      encodeURIComponent(parts.slug) +
      "?api_key=" +
      encodeURIComponent(state.mdblistKey)

  ];

  let lastError = null;

  for(const endpoint of candidates){

    try{

      const response =
        await fetch(
          endpoint,
          {
            headers:{
              Accept:"application/json"
            },
            cache:"no-store"
          }
        );

      if(response.ok){

        const data =
          await response.json();

        if(data){
          return data;
        }

      }

      lastError =
        new Error(
          "HTTP " + response.status
        );

    }
    catch(error){

      lastError = error;

    }

  }

  throw lastError ||
    new Error("Unable to access MDBList.");
}


/*
  Extract items from different possible
  MDBList response shapes.
*/

function extractMDBItems(data){

  if(Array.isArray(data)){
    return data;
  }

  if(Array.isArray(data.items)){
    return data.items;
  }

  if(Array.isArray(data.results)){
    return data.results;
  }

  if(
    data.data &&
    Array.isArray(data.data)
  ){
    return data.data;
  }

  if(
    data.list &&
    Array.isArray(data.list.items)
  ){
    return data.list.items;
  }

  return [];
}


/*
  MDBList API response compatibility.

  The API has evolved, so this function accepts
  common ID fields without assuming every item
  has exactly the same shape.
*/

function normalizeMDBItem(item){

  const mediaType =
    String(
      item.mediatype ||
      item.media_type ||
      item.type ||
      item.content_type ||
      ""
    ).toLowerCase();

  let type =
    mediaType.includes("show") ||
    mediaType.includes("tv") ||
    mediaType.includes("series")
      ? "series"
      : "movie";

  if(
    mediaType === "movie"
  ){
    type = "movie";
  }

  const imdb =
    item.imdb_id ||
    item.imdb ||
    item.imdbid ||
    "";

  const tmdb =
    item.tmdb_id ||
    item.tmdb ||
    item.tmdbid ||
    "";

  const id =
    imdb ||
    (tmdb ? "tmdb:" + tmdb : "") ||
    item.id ||
    "";

  const name =
    item.title ||
    item.name ||
    item.original_title ||
    item.original_name ||
    "Untitled";

  const poster =
    item.poster ||
    item.poster_url ||
    item.poster_path ||
    item.image ||
    item.posterUrl ||
    "";

  let finalPoster = poster;

  if(
    finalPoster &&
    String(finalPoster).startsWith("/")
  ){

    finalPoster =
      "https://image.tmdb.org/t/p/w500" +
      finalPoster;

  }

  const year =
    item.year ||
    item.release_year ||
    (
      item.released
        ? String(item.released).slice(0,4)
        : ""
    );

  const rating =
    item.imdb_rating ||
    item.imdbrating ||
    item.rating ||
    item.score ||
    "";

  return {
    id,
    type,
    name,
    poster:finalPoster,
    year,
    rating
  };
}


/*
  Render MDBList row.
*/

function renderMDBRow(list,items){

  const normalized =
    items
      .map(normalizeMDBItem)
      .filter(item =>
        item.id &&
        item.name
      )
      .slice(0,50);

  if(!normalized.length){

    return `
      <section class="catalog-section">

        <div class="catalog-heading">

          <h2 class="catalog-title">
            ${escapeHTML(list.name)}
          </h2>

          <span class="catalog-label">
            MDBLIST
          </span>

        </div>

        <div class="notice">
          This MDBList returned no displayable items.
        </div>

      </section>
    `;

  }

  return `
    <section class="catalog-section">

      <div class="catalog-heading">

        <h2 class="catalog-title">
          ${escapeHTML(list.name)}
        </h2>

        <span class="catalog-label">
          MDBLIST • ${normalized.length}
        </span>

      </div>

      <div class="row">

        ${normalized
          .map(renderMDBPoster)
          .join("")}

      </div>

    </section>

}


/*
  MDBList poster.

  Clicking a MDBList title sends the user
  through the same SAUVE title/source system.
*/

function renderMDBPoster(item){

  const safeType =

/*
  Load all saved MDBLists.

  Each list is isolated with its own try/catch.
*/

async function loadMDBLists(){

  const container =
    $("mdbContainer");

  if(
    !state.mdblistKey ||
    !state.mdblistLists.length
  ){

    container.innerHTML = "";
    return;
  }

  container.innerHTML = `
    <section class="catalog-section">

      <div class="catalog-heading">

        <h2 class="catalog-title">
          MY MDBLISTS
        </h2>

        <span class="catalog-label">
          PERSONAL
        </span>

      </div>

      <div class="loading">
        Loading MDBList collections…
      </div>

    </section>
  `;

  let html = "";

  for(
    const list
    of state.mdblistLists
  ){

    try{

      const data =
        await resolveMDBList(
          list.url
        );

      const items =
        extractMDBItems(data);

      html +=
        renderMDBRow(
          list,
          items
        );

    }
    catch(error){

      console.warn(
        "MDBList failed:",
        list,
        error
      );

      html += `
        <section class="catalog-section">

          <div class="catalog-heading">

            <h2 class="catalog-title">
              ${escapeHTML(list.name)}
            </h2>

            <span class="catalog-label">
              MDBLIST
            </span>

          </div>

          <div class="notice">

            Could not load this MDBList.

            <br><br>

            ${escapeHTML(error.message)}

          </div>

        </section>
      `;

    }

  }

  container.innerHTML =
    html;
}

/* ============================================================
   STREAMS
============================================================ */

function buildStreamURL(type,id){

  return (
    addonRoot(state.stream) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );
}

function getStreamURL(stream){
  return String(
    stream?.url || ""
  ).trim();
}

function isPlayerFrame(stream){
  return Boolean(stream?.playerFrameUrl);
}

function isExternal(stream){
  return Boolean(stream?.externalUrl);
}

function isNotWebReady(stream){
  return Boolean(
    stream?.behaviorHints?.notWebReady
  );
}

function isHLS(stream){

  const url =
    getStreamURL(stream).toLowerCase();

  const type =
    String(stream?.type || "").toLowerCase();

  return (
    url.includes(".m3u8") ||
    type.includes("m3u8") ||
    type.includes("mpegurl")
  );
}

function isMP4(stream){

  const url =
    getStreamURL(stream).toLowerCase();

  const type =
    String(stream?.type || "").toLowerCase();

  return (
    url.includes(".mp4") ||
    type.includes("mp4")
  );
}

function isWebM(stream){

  const url =
    getStreamURL(stream).toLowerCase();

  const type =
    String(stream?.type || "").toLowerCase();

  return (
    url.includes(".webm") ||
    type.includes("webm")
  );
}

function isPlayableCandidate(stream){

  if(isPlayerFrame(stream)){
    return true;
  }

  if(isExternal(stream)){
    return false;
  }

  return (
    isMP4(stream) ||
    isHLS(stream) ||
    isWebM(stream)
  );
}

function providerName(stream){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

  const providers = [
    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"
  ];

  for(const name of providers){

    if(text.includes(name)){
      return name;
    }

  }

  return "stream source";
}

function compatibilityScore(stream){

  let score = 0;

  if(isMP4(stream)) score += 100;
  if(isHLS(stream)) score += 90;
  if(isWebM(stream)) score += 80;
  if(isPlayerFrame(stream)) score += 70;
  if(isExternal(stream)) score -= 100;

  return score;
}


/* ============================================================
   BADGES
============================================================ */

function renderSource(stream,index){

  const playable =
    isPlayableCandidate(stream);

  let format = "SOURCE";

  if(isMP4(stream)) format = "MP4";
  else if(isHLS(stream)) format = "HLS";
  else if(isWebM(stream)) format = "WEBM";
  else if(isPlayerFrame(stream)) format = "PLAYER";
  else if(isExternal(stream)) format = "EXTERNAL";

  return `
    <button
      class="source"
      ${
        playable
          ? `onclick="playSource(${index})"`
          : `onclick="explainSource(${index})"`
      }>

      <div class="source-top">

        <div class="source-icon">
          ${playable ? "▶" : "!"}
        </div>

        <div>

          <div class="source-name">
            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}
          </div>

          <div class="provider">
            ${escapeHTML(
              providerName(stream)
            )}
          </div>

        </div>

      </div>

      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : "warning"}
        ">
          ${format}
        </span>

        ${
          isNotWebReady(stream)
            ? `
              <span class="badge warning">
                NOT WEB READY
              </span>
            `
            : `
              <span class="badge good">
                WEB READY
              </span>
            `
        }

        ${
          stream.quality
            ? `
              <span class="badge blue">
                ${escapeHTML(stream.quality)}
              </span>
            `
            : ""
        }

        ${
          stream.resolution
            ? `
              <span class="badge blue">
                ${escapeHTML(stream.resolution)}
              </span>
            `
            : ""
        }

        ${
          stream.language
            ? `
              <span class="badge blue">
                ${escapeHTML(stream.language)}
              </span>
            `
            : ""
        }

      </div>

      <div class="source-desc">

        ${
          isExternal(stream)
            ? "External destination — SAUVE cannot treat this as a direct video file."
            :
          isNotWebReady(stream)
            ? "Provider marked this source as not web-ready. SAUVE has not automatically disabled it."
            :
          playable
            ? "Tap to attempt playback inside SAUVE."
            :
            "This source does not expose a browser-compatible media URL."
        }

      </div>

    </button>
  `;
}


/* ============================================================
   FIND SOURCES
============================================================ */

async function findSources(type,id){

  if(!state.stream){

    openSettings();
    return;
  }

  $("sources").innerHTML = `
    <div class="loading">
      Loading stream sources…
    </div>
  `;

  try{

    const data =
      await fetchJSON(
        buildStreamURL(type,id)
      );

    currentStreams =
      Array.isArray(data.streams)
        ? data.streams
        : [];

    if(!currentStreams.length){

      $("sources").innerHTML = `
        <div class="notice">
          No stream sources were returned
          for this title.
        </div>
      `;

      return;
    }

    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );

    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );

    $("sources").innerHTML = `
      <div class="catalog-heading">

        <h2 class="catalog-title">
          SOURCES
        </h2>

        <span class="catalog-label">
          ${currentStreams.length}
        </span>

      </div>

      <div class="notice">

        <strong>
          ${currentPlayableStreams.length}
        </strong>

        potentially compatible source(s).

        <br><br>

        Your original source and badge
        information remains intact.

      </div>

      ${currentStreams
        .map(renderSource)
        .join("")}
    `;

  }
  catch(error){

    $("sources").innerHTML = `
      <div class="notice">

        <strong>STREAM ERROR</strong>

        <br><br>

        ${escapeHTML(error.message)}

      </div>
    `;

  }
}


/* ============================================================
   PLAYBACK
============================================================ */

function playSource(index){

  const stream =
    currentStreams[index];

  if(!stream) return;

  currentPlayerIndex =
    currentPlayableStreams.indexOf(stream);

  if(currentPlayerIndex < 0){
    currentPlayerIndex = 0;
  }

  if(isPlayerFrame(stream)){
    openEmbeddedPlayer(stream);
  }
  else{
    playDirectStream(stream);
  }
}

function playDirectStream(stream){

  openModal(`
    <div class="sheet-header">

      <h2>NOW PLAYING</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>

      <div
        id="playerStatus"
        class="player-status">
        Preparing playback…
      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">
        ▶ TRY NEXT SOURCE
      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">
        SOURCES
      </button>

    </div>
  `);

  const video = $("sauveVideo");
  const status = $("playerStatus");

  const url = getStreamURL(stream);

  if(!url){
    showPlayerError("No direct media URL was returned.");
    return;
  }

  video.src = url;

  video.addEventListener(
    "loadedmetadata",
    () => {
      status.textContent = "Ready — press play";
      status.className = "player-status ready";
    },
    {once:true}
  );

  video.addEventListener(
    "playing",
    () => {
      status.textContent = "Playing";
      status.className = "player-status ready";
    }
  );

  video.addEventListener(
    "waiting",
    () => {
      status.textContent = "Buffering…";
    }
  );

  video.addEventListener(
    "error",
    () => {
      showPlayerError(
        "Safari could not decode or access this video source."
      );
    }
  );

  video.load();
}

function openEmbeddedPlayer(stream){

  const url =
    String(stream.playerFrameUrl || "").trim();

  if(!url){
    showPlayerError("No player URL was returned.");
    return;
  }

  openModal(`
    <div class="sheet-header">

      <h2>
        ${escapeHTML(
          stream.name || "PLAYER"
        )}
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <div class="iframe-player">

        <iframe
          src="${escapeHTML(url)}"
          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "
          allowfullscreen>
        </iframe>

      </div>

      <div class="player-status ready">
        Provider player loaded inside SAUVE.
      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">
        TRY NEXT SOURCE
      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">
        SOURCES
      </button>

    </div>
  `);
}

function showPlayerError(message){

  const status = $("playerStatus");

  if(status){

    status.textContent = message;
    status.className = "player-status error";

  }
}

function tryNextSource(){

  if(!currentPlayableStreams.length){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;
  }

  let next =
    currentPlayerIndex + 1;

  if(next >= currentPlayableStreams.length){
    next = 0;
  }

  currentPlayerIndex = next;

  const stream =
    currentPlayableStreams[next];

  if(isPlayerFrame(stream)){
    openEmbeddedPlayer(stream);
  }
  else{
    playDirectStream(stream);
  }
}

function explainSource(index){

  const stream =
    currentStreams[index];

  if(!stream) return;

  if(isExternal(stream)){

    alert(
      "This source is an external destination rather than a direct media stream."
    );

    return;
  }

  alert(
    "SAUVE could not identify a browser-compatible video URL for this source."
  );
}

function showSourcesAgain(){

  openModal(`
    <div class="sheet-header">

      <h2>SOURCES</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    ${
      currentStreams.length
        ? currentStreams.map(renderSource).join("")
        : `
          <div class="loading">
            No sources available.
          </div>
        `
    }
  `);
}

          ${escapeHTML(query)}
        </h1>

        <p>
          Searching movies and television…
        </p>

      </div>

    </div>

    <div
      id="searchResults"
      class="loading">
      Searching…
    </div>
  `;

  try{

    const manifest =
      await fetchJSON(state.metadata);

    const catalogs =
      Array.isArray(manifest.catalogs)
        ? manifest.catalogs
        : [];

    const searchable =
      catalogs.filter(supportsSearch);

    if(!searchable.length){

      throw new Error(
        "No searchable catalogs were advertised by the metadata addon."
      );
    }

    const metas = [];

    for(const catalog of searchable){

      try{

        const result =
          await fetchJSON(
            buildCatalogURL(
              catalog,
              {search:query}
            )
          );

        if(Array.isArray(result.metas)){
          metas.push(...result.metas);
        }

      }
      catch(error){

        console.warn(
          "Search catalog failed:",
          catalog.id
        );

      }

    }

    const results =
      dedupeMetas(metas);

    $("searchResults").outerHTML =
      results.length

        ?

        `
          <section class="catalog-section">

            <div class="catalog-heading">

              <h2 class="catalog-title">
                RESULTS
              </h2>

              <span class="catalog-label">
                ${results.length}
              </span>

            </div>

            <div class="row">

              ${results
                .map(renderPosterCard)
                .join("")}

            </div>

          </section>
        `

        :

        `
          <div class="notice">
            No results found for
            <strong>
              ${escapeHTML(query)}
            </strong>.
          </div>
        `;

  }
  catch(error){

    $("searchResults").outerHTML = `
      <div class="notice">

        <strong>SEARCH FAILED</strong>

        <br><br>

        ${escapeHTML(error.message)}

      </div>
    `;

  }
}


/* ============================================================
   POSTER FOR MAIN CATALOG
============================================================ */

function renderPosterCard(item){

  const type =
    encodeURIComponent(
      item.type || "movie"
    );

  const id =
    encodeURIComponent(
      item.id || ""
    );

  const poster =
    item.poster ||
    item.logo ||
    "";

  const year =
    item.releaseInfo ||
    item.year ||
    "";

  const kind =
    String(
      item.type || "movie"
    ).toUpperCase();

  return `
    <button
      class="poster-card"
      onclick="openTitle('${type}','${id}')">

      <img
        src="${escapeHTML(poster)}"
        loading="lazy"
        onerror="this.style.opacity='.25'">

      <div class="poster-type">
        ${escapeHTML(kind)}
      </div>

      <div class="poster-overlay">

        <div class="poster-name">
          ${escapeHTML(
            item.name || "Untitled"
          )}
        </div>

        <div class="poster-year">
          ${escapeHTML(year)}
        </div>

      </div>

    </button>
  `;
}


/* ============================================================
   SETTINGS
============================================================ */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>SAUVE SETTINGS</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(state.metadata)}">

    </div>


    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        value="${escapeHTML(state.stream)}"
        placeholder="Paste your stream manifest">

    </div>


    <div class="field">

      <label>
        MDBList API Key
      </label>

      <input
        id="mdblistKey"
        type="password"
        autocomplete="off"
        value="${escapeHTML(state.mdblistKey)}"
        placeholder="Paste MDBList API key">

      <div class="mdb-status">

        Stored locally in this browser.

      </div>

    </div>


    <div class="field">

      <label>
        Add MDBList

      </label>

      <input
        id="mdbName"
        placeholder="List name — e.g. Snoaks">

      <br><br>

      <input
        id="mdbURL"
        placeholder="https://mdblist.com/lists/user/list-name">

      <br><br>

      <button
        class="primary"
        onclick="addMDBList()">

        + ADD MDBLIST

      </button>

    </div>


    <div class="field">

      <label>
        Your MDBLists
      </label>

      <div id="mdbSettingsLists">

        ${renderMDBSettingsLists()}

      </div>

    </div>


    <div class="notice">

      <strong>MDBList setup</strong>

      <br><br>

      Enter your MDBList API key above,
      then add one or more public MDBList
      URLs.

      <br><br>

      Each list becomes its own horizontal
      Netflix-style row on your SAUVE
      homepage.

      <br><br>

      MDBList loading is independent from
      your main metadata catalogs, so an
      MDBList error cannot stop the rest
      of SAUVE from loading.

    </div>


    <br>


    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);
}


function renderMDBSettingsLists(){

  if(!state.mdblistLists.length){

    return `
      <div class="mdb-status">
        No MDBLists added yet.
      </div>
    `;

  }

  return state.mdblistLists
    .map((list,index) => `

      <div class="list-item">

        <div class="list-info">

          <div class="list-name">
            ${escapeHTML(list.name)}
          </div>

          <div class="list-url">
            ${escapeHTML(list.url)}
          </div>

        </div>

        <button
          class="delete-button"
          onclick="removeMDBList(${index})">

          DELETE

        </button>

      </div>

    `)
    .join("");
}


function addMDBList(){

  const name =
    $("mdbName").value.trim();

  const url =
    $("mdbURL").value.trim();

  if(!name){

    alert(
      "Enter a name for this MDBList."
    );

    return;
  }

  if(!url){

    alert(
      "Enter the MDBList URL."
    );

    return;
  }

  if(!getMDBListParts(url)){

    alert(
      "That does not look like a valid MDBList URL.\n\nUse:\nhttps://mdblist.com/lists/USERNAME/LIST-NAME"
    );

    return;
  }

  state.mdblistLists.push({
    name,
    url
  });

  localStorage.setItem(
    "sauve_mdblist_lists",
    JSON.stringify(
      state.mdblistLists
    )
  );

  $("mdbName").value = "";
  $("mdbURL").value = "";

  $("mdbSettingsLists").innerHTML =
    renderMDBSettingsLists();

}


function removeMDBList(index){

  if(
    !confirm(
      "Remove this MDBList from SAUVE?"
    )
  ){

    return;

  }

  state.mdblistLists.splice(
    index,
    1
  );

  localStorage.setItem(
    "sauve_mdblist_lists",
    JSON.stringify(
      state.mdblistLists
    )
  );

  $("mdbSettingsLists").innerHTML =
    renderMDBSettingsLists();

}


function saveSettings(){

  const metadata =
    $("metadataURL").value.trim();

  const stream =
    $("streamURL").value.trim();

  const mdblistKey =
    $("mdblistKey").value.trim();

  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;
  }

  state.metadata = metadata;
  state.stream = stream;
  state.mdblistKey = mdblistKey;

  localStorage.setItem(
    "sauve_metadata",
    metadata
  );

  localStorage.setItem(
    "sauve_stream",
    stream
  );

  localStorage.setItem(
    "sauve_mdblist_key",
    mdblistKey
  );

  localStorage.setItem(
    "sauve_mdblist_lists",
    JSON.stringify(
      state.mdblistLists
    )
  );

  closeModal();

  location.reload();
}


/* ============================================================
   UI
============================================================ */

function focusSearch(){

  /*
    Search can be called after a reload.
  */

  const input =
    $("searchInput");

  if(input){

    input.focus();

    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }

}

function goHome(){
  location.reload();
}

function openModal(html){

  $("sheet").innerHTML = html;

  $("modal")
    .classList
    .add("open");

}

function closeModal(){

  /*
    Stop any video when modal closes.
  */

  const video =
    $("sauveVideo");

  if(video){

    try{
      video.pause();
    }
    catch(error){}

    video.removeAttribute("src");

  }

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML = "";

}

$("modal").addEventListener(
  "click",
  event => {

    if(event.target.id === "modal"){
      closeModal();
    }

  }
);

$("searchButton").addEventListener(
  "click",
  performSearch
);

$("searchInput").addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){
      performSearch();
    }

  }
);


/* ============================================================
   START
============================================================ */

/*
  IMPORTANT:
  Main catalog and MDBList are not chained together.

  Main homepage starts immediately.
*/

loadHome();

</script>

</body>
</html>

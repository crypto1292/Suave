<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover">

<meta name="theme-color"
      content="#05030b">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>SAUVE Cinema Television</title>

<style>

:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#150b25;

  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;

  --text:#fff;
  --muted:#9d91a6;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;

  background:#05030b;
}

body{

  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  overflow-x:hidden;

  background:

    radial-gradient(
      circle at 50% -10%,
      rgba(138,77,255,.38),
      transparent 35%
    ),

    radial-gradient(
      circle at 0 30%,
      rgba(255,22,216,.12),
      transparent 30%
    ),

    radial-gradient(
      circle at 100% 50%,
      rgba(25,234,255,.10),
      transparent 30%
    ),

    #05030b;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

/* =========================================================
   HEADER
========================================================= */

header{

  position:sticky;

  top:0;

  z-index:100;

  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    14px;

  background:
    rgba(5,3,11,.94);

  backdrop-filter:
    blur(25px);

  -webkit-backdrop-filter:
    blur(25px);

  border-bottom:
    1px solid
    rgba(255,22,216,.18);
}

.logo{

  text-align:center;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-style:italic;

  font-size:
    clamp(68px,19vw,120px);

  line-height:.78;

  letter-spacing:7px;

  transform:
    skewX(-7deg);

  color:white;

  text-shadow:

    0 0 4px white,

    0 0 9px var(--pink),

    0 0 20px var(--pink),

    0 0 45px var(--purple),

    6px 5px 0
    rgba(25,234,255,.55);
}

.logo-sub{

  margin-top:14px;

  text-align:center;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:4px;

  text-shadow:
    0 0 10px var(--cyan);
}

/* =========================================================
   SEARCH
========================================================= */

.searchbar{

  display:flex;

  gap:8px;

  max-width:900px;

  margin:
    18px auto 0;
}

.searchbar input{

  flex:1;

  min-width:0;

  padding:14px;

  border-radius:8px;

  background:#0c0715;

  color:white;

  border:
    1px solid
    rgba(138,77,255,.45);

  outline:none;
}

.searchbar input:focus{

  border-color:
    var(--pink);

  box-shadow:
    0 0 18px
    rgba(255,22,216,.18);
}

.searchbar button{

  padding:
    0 18px;

  border:0;

  border-radius:8px;

  color:white;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );
}

/* =========================================================
   MAIN
========================================================= */

main{

  width:100%;

  max-width:1500px;

  margin:auto;

  padding:
    16px 16px
    110px;
}

/* =========================================================
   HERO
========================================================= */

.hero{

  position:relative;

  min-height:
    clamp(400px,58vh,620px);

  overflow:hidden;

  display:flex;

  align-items:flex-end;

  padding:
    clamp(25px,5vw,60px);

  border-radius:18px;

  border:
    1px solid
    rgba(255,22,216,.25);

  background:

    radial-gradient(
      circle at 75% 30%,
      rgba(25,234,255,.18),
      transparent 25%
    ),

    radial-gradient(
      circle at 75% 75%,
      rgba(255,22,216,.25),
      transparent 35%
    ),

    linear-gradient(
      110deg,
      #090511,
      #190c2e,
      #07121e
    );
}

.hero:before{

  content:"";

  position:absolute;

  inset:0;

  background:

    linear-gradient(
      90deg,
      rgba(5,3,11,.98),
      rgba(5,3,11,.72) 48%,
      rgba(5,3,11,.05)
    );
}

.hero:after{

  content:"";

  position:absolute;

  inset:0;

  opacity:.08;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.18) 4px
    );
}

.hero-content{

  position:relative;

  z-index:3;

  max-width:720px;
}

.hero-kicker{

  color:var(--cyan);

  font-size:10px;

  font-weight:900;

  letter-spacing:3px;
}

.hero h1{

  margin:15px 0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:
    clamp(46px,9vw,95px);

  line-height:.85;

  text-transform:uppercase;

  text-shadow:
    0 0 20px
    rgba(255,22,216,.35);
}

.hero p{

  color:#c7b9ce;

  line-height:1.6;

  font-size:14px;
}

.hero-buttons{

  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:20px;
}

.primary,
.secondary{

  padding:
    13px 18px;

  border-radius:8px;

  font-weight:900;
}

.primary{

  border:0;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    0 0 18px
    rgba(255,22,216,.25);
}

.secondary{

  color:var(--cyan);

  background:
    rgba(25,234,255,.04);

  border:
    1px solid
    rgba(25,234,255,.38);
}

/* =========================================================
   CATEGORY ROWS
========================================================= */

.catalog-section{

  margin:
    30px 0 0;
}

.catalog-heading{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:12px;

  padding-bottom:9px;

  border-bottom:
    1px solid
    rgba(255,22,216,.15);
}

.catalog-title{

  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:25px;

  letter-spacing:1px;
}

.catalog-label{

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;
}

.row{

  display:flex;

  gap:13px;

  overflow-x:auto;

  overflow-y:hidden;

  padding:
    3px 1px 12px;

  scroll-snap-type:x proximity;

  scrollbar-width:none;
}

.row::-webkit-scrollbar{
  display:none;
}

/* =========================================================
   NETFLIX STYLE CARDS
========================================================= */

.poster-card{

  position:relative;

  flex:
    0 0
    145px;

  overflow:hidden;

  border:0;

  padding:0;

  text-align:left;

  color:white;

  background:#10091c;

  border-radius:8px;

  scroll-snap-align:start;

  box-shadow:
    0 7px 22px
    rgba(0,0,0,.32);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.poster-card:hover{

  transform:
    translateY(-4px)
    scale(1.02);

  box-shadow:
    0 12px 30px
    rgba(255,22,216,.20);
}

.poster-card img{

  display:block;

  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;

  background:#171027;
}

.poster-overlay{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:
    38px 9px 9px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.94)
    );
}

.poster-name{

  font-size:12px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.poster-year{

  margin-top:3px;

  color:#bdb0c6;

  font-size:9px;
}

.poster-type{

  position:absolute;

  top:7px;

  left:7px;

  padding:
    4px 6px;

  border-radius:4px;

  background:
    rgba(0,0,0,.72);

  color:var(--cyan);

  font-size:7px;

  font-weight:900;

  letter-spacing:1px;
}

/* =========================================================
   EMPTY / NOTICE
========================================================= */

.empty{

  padding:
    28px 5px;

  color:var(--muted);

  font-size:13px;
}

.notice{

  padding:16px;

  border-radius:9px;

  background:
    rgba(255,22,216,.045);

  border:
    1px solid
    rgba(255,22,216,.17);

  color:#c8bacf;

  line-height:1.6;

  font-size:12px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.88);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);
}

.modal.open{
  display:flex;
}

.sheet{

  width:100%;

  max-height:95vh;

  overflow:auto;

  padding:
    20px
    18px
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  border-radius:
    22px 22px 0 0;

  background:

    radial-gradient(
      circle at 50% 0,
      rgba(138,77,255,.18),
      transparent 40%
    ),

    #0c0718;

  border-top:
    1px solid
    rgba(255,22,216,.35);
}

.sheet-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:18px;
}

.sheet-header h2{

  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:27px;
}

.close{

  width:40px;

  height:40px;

  border-radius:50%;

  background:#170d27;

  color:var(--cyan);

  border:
    1px solid
    rgba(25,234,255,.3);

  font-size:22px;
}

/* =========================================================
   DETAILS
========================================================= */

.details{

  display:grid;

  grid-template-columns:
    105px 1fr;

  gap:16px;
}

.details img{

  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;
}

.details p{

  color:#c3b5cb;

  line-height:1.55;

  font-size:13px;
}

.meta{

  color:var(--cyan);

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:7px;
}

/* =========================================================
   SOURCES
========================================================= */

.source{

  width:100%;

  margin-top:9px;

  padding:14px;

  text-align:left;

  color:white;

  border-radius:9px;

  background:
    linear-gradient(
      100deg,
      #150c29,
      #0d0819
    );

  border:
    1px solid
    rgba(25,234,255,.15);
}

.source:hover{

  border-color:
    var(--cyan);

  box-shadow:
    0 0 16px
    rgba(25,234,255,.14);
}

.source-top{

  display:flex;

  align-items:center;

  gap:12px;
}

.source-icon{

  width:36px;

  height:36px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex:none;

  border-radius:50%;

  color:var(--cyan);

  background:
    rgba(25,234,255,.08);
}

.source-name{
  font-weight:900;
}

.provider{

  margin-top:4px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;
}

.badges{

  margin-top:8px;
}

.badge{

  display:inline-block;

  padding:
    4px 7px;

  margin-right:5px;

  border-radius:5px;

  background:
    rgba(255,22,216,.10);

  color:#ff7be4;

  font-size:8px;

  font-weight:900;

  letter-spacing:.7px;
}

.badge.good{

  background:
    rgba(66,255,176,.10);

  color:var(--green);
}

.badge.warning{

  background:
    rgba(255,212,90,.10);

  color:var(--yellow);
}

.badge.blue{

  background:
    rgba(25,234,255,.10);

  color:var(--cyan);
}

.source-desc{

  margin-top:7px;

  color:#91859b;

  font-size:10px;
}

/* =========================================================
   PLAYER
========================================================= */

.player-shell{

  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#000;

  border:
    1px solid
    rgba(25,234,255,.25);

  box-shadow:
    0 0 30px
    rgba(25,234,255,.08);
}

video{

  display:block;

  width:100%;

  max-height:70vh;

  background:#000;
}

.iframe-player{

  width:100%;

  aspect-ratio:16/9;

  background:#000;
}

iframe{

  display:block;

  width:100%;

  height:100%;

  border:0;

  background:#000;
}

.player-status{

  padding:
    11px 13px;

  background:#0e0818;

  border-top:
    1px solid
    rgba(255,255,255,.07);

  color:#aaa;

  font-size:11px;
}

.player-status.ready{
  color:var(--green);
}

.player-status.error{
  color:var(--red);
}

.player-controls{

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:12px;
}

.player-button{

  padding:
    10px 13px;

  border-radius:7px;

  color:white;

  background:#170d27;

  border:
    1px solid
    rgba(255,255,255,.1);

  font-weight:800;

  font-size:11px;
}

.player-button.primary{

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  border:0;
}

/* =========================================================
   SETTINGS
========================================================= */

.field{
  margin:18px 0;
}

.field label{

  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;

  text-transform:uppercase;
}

.field input{

  width:100%;

  padding:13px;

  border-radius:7px;

  background:#080510;

  color:white;

  border:
    1px solid
    rgba(138,77,255,.3);

  outline:none;
}

/* =========================================================
   NAV
========================================================= */

.nav{

  position:fixed;

  z-index:400;

  left:0;

  right:0;

  bottom:0;

  height:76px;

  padding-bottom:
    env(safe-area-inset-bottom);

  display:flex;

  align-items:center;

  justify-content:space-around;

  background:
    rgba(8,5,17,.96);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  border-top:
    1px solid
    rgba(255,22,216,.18);
}

.nav button{

  border:0;

  background:none;

  color:#766a80;

  font-size:9px;

  letter-spacing:1px;
}

.nav button span{

  display:block;

  font-size:22px;

  margin-bottom:4px;
}

.nav button.active{

  color:var(--pink);

  text-shadow:
    0 0 10px
    var(--pink);
}

/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .poster-card{
    flex-basis:180px;
  }

  .details{

    grid-template-columns:
      190px 1fr;
  }

  .details img{
    width:190px;
  }

  .hero{
    min-height:580px;
  }
}

</style>
</head>

<body>

<header>

  <div class="logo">
    SAUVE
  </div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>


<main id="main">

  <div class="hero">

    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Discover movies and television,
        browse your catalogs, find available
        sources and play compatible streams
        directly inside SAUVE.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="focusSearch()">

          ⌕ SEARCH

        </button>

        <button
          class="secondary"
          onclick="openSettings()">

          ⚙ SETTINGS

        </button>

      </div>

    </div>

  </div>


  <div id="catalogContainer">

    <div class="empty">
      Loading SAUVE…
    </div>

  </div>

</main>


<nav class="nav">

  <button
    class="active"
    onclick="goHome()">

    <span>⌂</span>
    HOME

  </button>

  <button
    onclick="focusSearch()">

    <span>⌕</span>
    SEARCH

  </button>

  <button
    onclick="openSettings()">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>


<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>


<script>

/* ============================================================
   CONFIGURATION
============================================================ */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    ""

};

let currentStreams = [];

let currentPlayableStreams = [];

let currentPlayerIndex = 0;


/* ============================================================
   HELPERS
============================================================ */

function $(id){

  return document.getElementById(id);

}


function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}


function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(
      /\/manifest\.json\/?$/i,
      ""
    );

}


function addonRoot(url){

  return normalizeManifest(url) + "/";
}


async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  return response.json();

}


/* ============================================================
   CATALOG SUPPORT
============================================================ */

function supportsSearch(catalog){

  if(
    !Array.isArray(
      catalog.extra
    )
  ){

    return false;

  }

  return catalog.extra.some(
    extra =>
      typeof extra === "string"
        ? extra === "search"
        : extra &&
          extra.name === "search"
  );

}


function makeExtraProps(values){

  return Object.entries(values)
    .filter(
      ([,value]) =>
        value !== undefined &&
        value !== null &&
        String(value).length
    )
    .map(
      ([key,value]) =>
        key +
        "=" +
        encodeURIComponent(
          String(value)
        )
    )
    .join("&");

}


function buildCatalogURL(
  catalog,
  extra={}
){

  let url =
    addonRoot(
      state.metadata
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );

  const props =
    makeExtraProps(extra);

  if(props){

    url +=
      "/" +
      props;

  }

  return url + ".json";

}


/* ============================================================
   CATEGORY NAME
============================================================ */

function prettyCatalogName(
  catalog
){

  const raw =
    String(
      catalog.name ||
      catalog.id ||
      "CATALOG"
    );

  const lower =
    raw.toLowerCase();

  const mappings = [

    ["netflix","NETFLIX"],

    ["disney","DISNEY+"],

    ["disney+","DISNEY+"],

    ["apple","APPLE TV+"],

    ["apple tv","APPLE TV+"],

    ["hbo","HBO"],

    ["max","MAX"],

    ["hulu","HULU"],

    ["prime","PRIME VIDEO"],

    ["amazon","PRIME VIDEO"],

    ["paramount","PARAMOUNT+"],

    ["peacock","PEACOCK"],

    ["marvel","MARVEL"],

    ["dc","DC"],

    ["popular","POPULAR"],

    ["trending","TRENDING"],

    ["featured","FEATURED"],

    ["top","TOP PICKS"],

    ["new","NEW RELEASES"]

  ];

  for(
    const [needle,label]
    of mappings
  ){

    if(
      lower.includes(
        needle
      )
    ){

      return label;

    }

  }

  return raw.toUpperCase();

}


/* ============================================================
   CATALOG SORT
============================================================ */

function catalogPriority(
  catalog
){

  const name =
    String(
      catalog.name ||
      catalog.id ||
      ""
    ).toLowerCase();

  const priority = [

    "featured",

    "trending",

    "popular",

    "netflix",

    "disney",

    "apple",

    "hbo",

    "max",

    "hulu",

    "prime",

    "amazon",

    "paramount",

    "peacock",

    "marvel",

    "dc",

    "top",

    "new"

  ];

  const index =
    priority.findIndex(
      word =>
        name.includes(word)
    );

  return index < 0
    ? 999
    : index;

}


/* ============================================================
   LOAD HOME
============================================================ */

async function loadHome(){

  const container =
    $("catalogContainer");

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    if(!catalogs.length){

      container.innerHTML = `

        <div class="notice">

          Your metadata addon did not
          advertise any catalogs.

        </div>

      `;

      return;

    }

    /*
      Instead of only selecting "movie"
      and "series", SAUVE now uses the
      catalogs actually advertised by
      your metadata addon.
    */

    const usable =
      catalogs
        .filter(
          catalog =>
            catalog &&
            catalog.id &&
            catalog.type
        )
        .sort(
          (a,b) =>
            catalogPriority(a) -
            catalogPriority(b)
        );

    /*
      Load many catalogs.

      This is intentionally higher than
      the old two-row system.
    */

    const selected =
      usable.slice(
        0,
        30
      );

    const results =
      await Promise.allSettled(
        selected.map(
          async catalog => {

            const data =
              await fetchJSON(
                buildCatalogURL(
                  catalog
                )
              );

            return {
              catalog,
              metas:
                Array.isArray(
                  data.metas
                )
                  ? data.metas
                  : []
            };

          }
        )
      );

    let html = "";

    results.forEach(
      result => {

        if(
          result.status !==
          "fulfilled"
        ){

          return;

        }

        const {
          catalog,
          metas
        } =
          result.value;

        if(
          !metas.length
        ){

          return;

        }

        html +=
          renderCatalogRow(
            catalog,
            metas
          );

      }
    );

    if(!html){

      html = `

        <div class="notice">

          The metadata addon responded,
          but did not return any titles for
          its advertised catalogs.

        </div>

      `;

    }

    container.innerHTML =
      html;

  }
  catch(error){

    container.innerHTML = `

      <div class="notice">

        <strong>
          SAUVE METADATA ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        Check your metadata manifest
        under Settings.

      </div>

    `;

  }

}

/* ============================================================
   DEDUPE
============================================================ */

function dedupeMetas(
  metas
){

  const seen =
    new Set();

  return metas.filter(
    item => {

      const key =
        String(
          item.type ||
          ""
        ) +
        "|" +
        String(
          item.id ||
          ""
        );

      if(
        seen.has(key)
      ){

        return false;

      }

      seen.add(key);

      return true;

    }
  );

}

/* ============================================================
   STREAM URL
============================================================ */

function buildStreamURL(
  type,
  id
){

  /*
    This handles both:

    movie
    series

    correctly.

    For TV series, the stream addon
    receives the actual series ID.

  */

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(
      type
    ) +
    "/" +
    encodeURIComponent(
      id
    ) +
    ".json"
  );

}


/* ============================================================
   STREAM DETECTION
============================================================ */

function getStreamURL(
  stream
){

  return String(
    stream?.url ||
    ""
  ).trim();

}


function isPlayerFrame(
  stream
){

  return Boolean(
    stream?.playerFrameUrl
  );

}


function isExternal(
  stream
){

  return Boolean(
    stream?.externalUrl
  );

}


function isNotWebReady(
  stream
){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}


function isHLS(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".m3u8") ||
    type.includes("m3u8") ||
    type.includes("mpegurl")
  );

}


function isMP4(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".mp4") ||
    type.includes("mp4")
  );

}


function isWebM(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".webm") ||
    type.includes("webm")
  );

}


function isPlayableCandidate(
  stream
){

  if(
    isPlayerFrame(
      stream
    )
  ){

    return true;

  }

  if(
    isExternal(
      stream
    )
  ){

    return false;

  }

  return (
    isMP4(stream) ||
    isHLS(stream) ||
    isWebM(stream)
  );

}


/* ============================================================
   PROVIDER
============================================================ */

function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  const providers = [

    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"

  ];

  for(
    const name
    of providers
  ){

    if(
      text.includes(
        name
      )
    ){

      return name;

    }

  }

  return "stream source";

}


/* ============================================================
   SOURCE SCORE
============================================================ */

function compatibilityScore(
  stream
){

  let score = 0;

  if(
    isMP4(stream)
  ){

    score += 100;

  }

  if(
    isHLS(stream)
  ){

    score += 90;

  }

  if(
    isWebM(stream)
  ){

    score += 80;

  }

  if(
    isPlayerFrame(stream)
  ){

    score += 70;

  }

  if(
    isExternal(stream)
  ){

    score -= 100;

  }

  return score;

}


/* ============================================================
   SOURCE UI
============================================================ */

function renderSource(
  stream,
  index
){

  const playable =
    isPlayableCandidate(
      stream
    );

  let format =
    "SOURCE";

  if(
    isMP4(stream)
  ){

    format =
      "MP4";

  }
  else if(
    isHLS(stream)
  ){

    format =
      "HLS";

  }
  else if(
    isWebM(stream)
  ){

    format =
      "WEBM";

  }
  else if(
    isPlayerFrame(stream)
  ){

    format =
      "PLAYER";

  }
  else if(
    isExternal(stream)
  ){

    format =
      "EXTERNAL";

  }

  return `

    <button
      class="source"

      ${
        playable

          ?

          `onclick="playSource(${index})"`

          :

          `onclick="explainSource(${index})"`

      }>

      <div class="source-top">

        <div class="source-icon">

          ${
            playable
              ? "▶"
              : "!"
          }

        </div>

        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>

          <div class="provider">

            ${escapeHTML(
              providerName(
                stream
              )
            )}

          </div>

        </div>

      </div>


      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : "warning"}
        ">

          ${format}

        </span>


        ${
          isNotWebReady(stream)

            ?

            `
              <span class="badge warning">
                NOT WEB READY
              </span>
            `

            :

            `
              <span class="badge good">
                WEB READY
              </span>
            `
        }


        ${
          stream.quality

            ?

            `
              <span class="badge blue">
                ${escapeHTML(
                  stream.quality
                )}
              </span>
            `

            :

            ""
        }


        ${
          stream.resolution

            ?

            `
              <span class="badge blue">
                ${escapeHTML(
                  stream.resolution
                )}
              </span>
            `

            :

            ""
        }

      </div>


      <div class="source-desc">

        ${
          isExternal(stream)

            ?

            "External destination — SAUVE cannot treat this as a direct video file."

            :

          isNotWebReady(stream)

            ?

            "Provider marked this source as not web-ready. SAUVE has not automatically disabled it."

            :

          playable

            ?

            "Tap to attempt playback inside SAUVE."

            :

            "This source does not expose a browser-compatible media URL."

        }

      </div>

    </button>

  `;

}


/* ============================================================
   FIND SOURCES
============================================================ */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }

  $("sources").innerHTML = `

    <div class="empty">

      Loading stream sources…

    </div>

  `;

  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );

    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];

    if(
      !currentStreams.length
    ){

      $("sources").innerHTML = `

        <div class="notice">

          No stream sources were returned
          for this title.

        </div>

      `;

      return;

    }

    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );

    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );

    $("sources").innerHTML = `

      <div class="heading">

        <h2>
          SOURCES
        </h2>

        <span>

          ${currentStreams.length}

        </span>

      </div>


      <div class="notice">

        <strong>
          ${currentPlayableStreams.length}
        </strong>

        potentially compatible source(s).

        <br><br>

        Sources marked
        <strong>NOT WEB READY</strong>
        are not automatically rejected.

      </div>


      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    $("sources").innerHTML = `

      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* ============================================================
   SOURCE EXPLANATION
============================================================ */

function explainSource(
  index
){

  const stream =
    currentStreams[index];

  if(!stream){

    return;

  }

  if(
    isExternal(stream)
  ){

    alert(
      "This source is an external destination rather than a direct media stream."
    );

    return;

  }

  alert(
    "SAUVE could not identify a browser-compatible video URL for this source."
  );

}


/* ============================================================
   PLAY SOURCE
============================================================ */

function playSource(
  index
){

  const stream =
    currentStreams[index];

  if(!stream){

    return;

  }

  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );

  if(
    currentPlayerIndex < 0
  ){

    currentPlayerIndex = 0;

  }

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;

  }

  playDirectStream(
    stream
  );

}


/* ============================================================
   DIRECT PLAYER
============================================================ */

function playDirectStream(
  stream
){

  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>


      <div
        id="playerStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>


    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>


      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

  const video =
    $("sauveVideo");

  const status =
    $("playerStatus");

  const url =
    getStreamURL(
      stream
    );

  if(!url){

    showPlayerError(
      "No direct media URL was returned."
    );

    return;

  }

  video.src =
    url;

  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {
      once:true
    }
  );

  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );

  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );

  video.addEventListener(
    "error",
    () => {

      showPlayerError(
        "Safari could not decode or access this video source."
      );

    }
  );

  video.load();

}

/* ============================================================

============================================================ */

function showPlayerError(

){

/* ============================================================
   NEXT SOURCE
============================================================ */

function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;

  }

  let next =
    currentPlayerIndex + 1;

  if(
    next >=
    currentPlayableStreams.length
  ){

    next = 0;

  }

  currentPlayerIndex =
    next;

  const stream =
    currentPlayableStreams[
      next
    ];

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }

}

    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>


    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"

        placeholder="
          Paste your stream manifest
        ">

    </div>


    <div class="notice">

      SAUVE stores these addresses locally
      in your browser.

      <br><br>

      The homepage automatically reads
      the catalogs advertised by your
      metadata addon.

      <br><br>

      This means additional catalogs can
      appear without having to hard-code
      every category into SAUVE.

    </div>


    <br>


    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);

}


function saveSettings(){

  const metadata =
    $("metadataURL")
      .value
      .trim();

  const stream =
    $("streamURL")
      .value
      .trim();

  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;

  }

  state.metadata =
    metadata;

  state.stream =
    stream;

  localStorage.setItem(
    "sauve_metadata",
    metadata
  );

  localStorage.setItem(
    "sauve_stream",
    stream
  );

  closeModal();

  location.reload();

}


/* ============================================================
   UI
============================================================ */

function focusSearch(){

  $("searchInput")
    .focus();

}


function goHome(){

  location.reload();

}


function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* ============================================================
   START
============================================================ */

loadHome();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#080612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SAUVE — Neon Cinema</title>

<style>
:root{
  --bg:#07050f;
  --bg2:#10091d;
  --panel:#130d24;
  --panel2:#1b1030;
  --white:#fff8ff;
  --muted:#a99bb9;
  --pink:#ff2ed1;
  --purple:#9b5cff;
  --cyan:#22e7ff;
  --orange:#ff7043;
  --yellow:#ffd166;
  --border:rgba(255,255,255,.11);
  --pinkGlow:0 0 10px rgba(255,46,209,.75),
              0 0 28px rgba(255,46,209,.35);
  --cyanGlow:0 0 10px rgba(34,231,255,.7),
              0 0 28px rgba(34,231,255,.3);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--white);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
              "Segoe UI",Arial,sans-serif;
  overflow-x:hidden;

  background:
    radial-gradient(circle at 50% -10%,
      rgba(155,92,255,.28),
      transparent 34%),
    radial-gradient(circle at 0% 40%,
      rgba(255,46,209,.11),
      transparent 30%),
    radial-gradient(circle at 100% 55%,
      rgba(34,231,255,.09),
      transparent 28%),
    linear-gradient(180deg,#07050f,#090611 65%,#040308);
}

/* Retro scanlines */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:999;
  opacity:.045;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    rgba(255,255,255,.18) 4px
  );
}

/* Retro floor */
body:after{
  content:"";
  position:fixed;
  left:-25%;
  right:-25%;
  bottom:-20%;
  height:48vh;
  pointer-events:none;
  opacity:.11;
  transform:perspective(300px) rotateX(62deg);
  background-image:
    linear-gradient(rgba(34,231,255,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,46,209,.5) 1px,transparent 1px);
  background-size:55px 55px;
  z-index:0;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  position:relative;
  z-index:2;
  min-height:100vh;
  padding-bottom:calc(82px + env(safe-area-inset-bottom));
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:50;
  padding:
    calc(15px + env(safe-area-inset-top))
    15px
    14px;

  background:rgba(7,5,15,.93);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border-bottom:1px solid rgba(255,46,209,.18);
}

.logo-wrap{
  text-align:center;
  margin:0 0 15px;
}

.logo{
  display:inline-block;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-size:clamp(62px,18vw,118px);
  line-height:.78;
  letter-spacing:7px;
  font-style:italic;
  transform:skewX(-6deg);
  color:#fff;
  text-transform:uppercase;

  text-shadow:
    0 0 3px #fff,
    0 0 8px var(--pink),
    0 0 18px var(--pink),
    0 0 38px var(--purple),
    5px 5px 0 rgba(34,231,255,.55);

  animation:logoPulse 3.5s ease-in-out infinite;
}

.logo:after{
  content:"SAUVE";
  position:absolute;
  color:transparent;
  -webkit-text-stroke:2px var(--cyan);
  opacity:.5;
  transform:translate(5px,4px);
}

.logo-sub{
  margin-top:12px;
  font-size:9px;
  letter-spacing:5px;
  color:var(--cyan);
  text-shadow:0 0 8px var(--cyan);
  font-weight:800;
}

@keyframes logoPulse{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.2)}
}

.header-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:9px;
}

.icon-btn{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid rgba(34,231,255,.3);
  background:rgba(15,9,29,.9);
  color:var(--cyan);
  box-shadow:0 0 10px rgba(34,231,255,.12);
}

.search{
  display:flex;
  gap:8px;
  max-width:800px;
  margin:auto;
}

.search input{
  flex:1;
  min-width:0;
  border:1px solid rgba(155,92,255,.35);
  border-radius:8px;
  background:rgba(18,13,39,.92);
  color:white;
  padding:13px 14px;
  outline:none;
}

.search input:focus{
  border-color:var(--pink);
  box-shadow:0 0 15px rgba(255,46,209,.2);
}

.search button{
  border:0;
  border-radius:8px;
  padding:0 15px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:var(--pinkGlow);
}

/* MAIN */

main{
  width:100%;
  max-width:1350px;
  margin:auto;
  padding:17px;
}

/* HERO */

.hero{
  position:relative;
  min-height:clamp(390px,62vh,610px);
  overflow:hidden;
  border-radius:18px;
  border:1px solid rgba(255,46,209,.28);

  display:flex;
  align-items:flex-end;

  padding:clamp(24px,5vw,55px);

  background:
    radial-gradient(circle at 78% 25%,
      rgba(34,231,255,.2),
      transparent 22%),
    radial-gradient(circle at 72% 65%,
      rgba(255,46,209,.25),
      transparent 30%),
    linear-gradient(110deg,#0a0615,#190b31 55%,#0b1024);

  box-shadow:
    inset 0 0 70px rgba(155,92,255,.12),
    0 0 35px rgba(255,46,209,.08);
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(7,5,15,.98),
      rgba(7,5,15,.73) 42%,
      rgba(7,5,15,.08)
    );
}

.hero:after{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  right:-100px;
  top:-80px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(34,231,255,.35),
    transparent 62%
  );
  filter:blur(25px);
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:680px;
}

.kicker{
  display:inline-block;
  color:var(--cyan);
  font-size:10px;
  letter-spacing:3px;
  font-weight:900;
  text-transform:uppercase;
  text-shadow:0 0 10px var(--cyan);
  margin-bottom:15px;
}

.hero h1{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:clamp(46px,10vw,100px);
  line-height:.86;
  text-transform:uppercase;
  text-shadow:
    0 0 8px rgba(255,255,255,.4),
    0 0 25px rgba(255,46,209,.4);
}

.hero p{
  color:#c4b7d3;
  line-height:1.65;
  max-width:560px;
  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,
.secondary{
  border-radius:8px;
  padding:13px 18px;
  font-weight:900;
}

.primary{
  border:0;
  color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:var(--pinkGlow);
}

.secondary{
  border:1px solid rgba(34,231,255,.4);
  color:var(--cyan);
  background:rgba(34,231,255,.06);
  box-shadow:0 0 15px rgba(34,231,255,.08);
}

/* SECTIONS */

section{
  margin:34px 0;
}

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
  border-bottom:1px solid rgba(255,46,209,.18);
  padding-bottom:10px;
}

.section-heading h2{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:25px;
  letter-spacing:1px;
  text-transform:uppercase;
  text-shadow:0 0 12px rgba(255,46,209,.35);
}

.section-heading span{
  color:var(--cyan);
  font-size:9px;
  letter-spacing:2px;
  font-weight:bold;
}

/* CARDS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.card{
  appearance:none;
  padding:0;
  text-align:left;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
  border-radius:10px;
  background:linear-gradient(180deg,#15102b,#0f0b20);
  color:#fff;
  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}

.card:hover{
  transform:translateY(-5px);
  border-color:rgba(255,46,209,.5);
  box-shadow:0 0 22px rgba(255,46,209,.18);
}

.poster{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#17102c;
}

.card-info{
  padding:11px;
}

.card-title{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-weight:bold;
  font-size:14px;
}

.card-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:10px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:94vh;
  overflow:auto;
  background:
    radial-gradient(circle at 50% 0%,
      rgba(155,92,255,.15),
      transparent 40%),
    #0d0920;
  border-top:1px solid rgba(255,46,209,.4);
  border-radius:22px 22px 0 0;
  padding:20px 18px calc(30px + env(safe-area-inset-bottom));
}

.sheet-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.sheet-header h2{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  letter-spacing:1px;
  font-size:27px;
  text-shadow:0 0 15px rgba(255,46,209,.4);
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#17102c;
  border:1px solid rgba(34,231,255,.25);
  color:var(--cyan);
  font-size:22px;
}

/* DETAILS */

.details{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:16px;
}

.details img{
  width:105px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:8px;
  box-shadow:0 0 18px rgba(255,46,209,.18);
}

.details p{
  color:#c1b5cc;
  line-height:1.55;
  font-size:13px;
}

.meta-line{
  color:var(--cyan);
  font-size:11px;
  letter-spacing:1px;
}

/* SOURCES */

.source-list{
  margin-top:20px;
}

.source{
  display:block;
  width:100%;
  text-align:left;
  border:1px solid rgba(34,231,255,.18);
  background:linear-gradient(100deg,#140e29,#0d0a1d);
  color:#fff;
  padding:14px;
  margin-top:8px;
  border-radius:8px;
}

.source:hover{
  border-color:var(--cyan);
  box-shadow:var(--cyanGlow);
}

.source strong{
  display:block;
}

.source small{
  display:block;
  color:var(--muted);
  margin-top:5px;
}

/* SETTINGS */

.field{
  margin:18px 0;
}

.field label{
  display:block;
  margin-bottom:8px;
  color:var(--cyan);
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  font-weight:bold;
}

.field input{
  width:100%;
  padding:14px;
  border-radius:7px;
  border:1px solid rgba(155,92,255,.3);
  background:#080612;
  color:#fff;
  outline:none;
}

.field input:focus{
  border-color:var(--pink);
  box-shadow:0 0 15px rgba(255,46,209,.12);
}

.notice{
  padding:14px;
  border:1px solid rgba(255,46,209,.15);
  border-radius:8px;
  background:rgba(255,46,209,.04);
  color:#b7aabd;
  font-size:12px;
  line-height:1.6;
}

.status{
  margin-top:13px;
  font-size:12px;
}

/* PLAYER */

.player-wrap{
  background:#000;
  border-radius:10px;
  overflow:hidden;
  border:1px solid rgba(34,231,255,.25);
  box-shadow:
    0 0 30px rgba(34,231,255,.08);
}

video{
  display:block;
  width:100%;
  max-height:70vh;
  min-height:220px;
  background:#000;
}

.player-info{
  padding:12px;
  background:#100b20;
}

.player-info strong{
  display:block;
}

.player-info small{
  color:var(--muted);
}

/* EMPTY */

.empty{
  padding:25px 0;
  color:var(--muted);
  font-size:13px;
}

/* NAV */

.bottom-nav{
  position:fixed;
  z-index:70;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(8,6,18,.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,46,209,.2);
}

.nav-btn{
  background:none;
  border:0;
  color:#75687f;
  font-size:9px;
  letter-spacing:1px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
}

.nav-btn span{
  font-size:22px;
}

.nav-btn.active{
  color:var(--pink);
  text-shadow:0 0 10px var(--pink);
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }

  .hero{
    min-height:530px;
  }

  .details{
    grid-template-columns:190px 1fr;
  }

  .details img{
    width:190px;
  }
}

@media(max-width:430px){
  .logo{
    font-size:64px;
  }

  .hero{
    min-height:410px;
    padding:25px;
  }

  .hero h1{
    font-size:48px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="logo-wrap">
    <div class="logo">SAUVE</div>

    <div class="logo-sub">
      CINEMA • TELEVISION • AFTER DARK
    </div>
  </div>

  <div class="header-actions">

    <button
      class="icon-btn"
      id="searchFocus">
      ⌕
    </button>

    <button
      class="icon-btn"
      id="settingsButton">
      ⚙
    </button>

  </div>

  <div class="search">

    <input
      id="searchInput"
      placeholder="Search movies & television"
      autocomplete="off">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>

<main id="main">

  <div class="hero">

    <div class="hero-content">

      <div class="kicker">
        Welcome to SAUVE
      </div>

      <h1>
        Cinema<br>
        After Dark
      </h1>

      <p>
        Your neon media player powered by
        your metadata and your own compatible
        streaming addon.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          id="heroSearch">
          ▶ EXPLORE
        </button>

        <button
          class="secondary"
          id="heroSettings">
          ＋ ADD STREAM ADDON
        </button>

      </div>

    </div>

  </div>

  <section>

    <div class="section-heading">
      <h2>Trending</h2>
      <span>AIO METADATA</span>
    </div>

    <div id="trending" class="empty">
      Loading cinema…
    </div>

  </section>

  <section>

    <div class="section-heading">
      <h2>Television</h2>
      <span>SERIES</span>
    </div>

    <div id="series" class="empty">
      Loading television…
    </div>

  </section>

</main>

<nav class="bottom-nav">

  <button class="nav-btn active" data-page="home">
    <span>⌂</span>
    HOME
  </button>

  <button class="nav-btn" data-page="search">
    <span>⌕</span>
    SEARCH
  </button>

  <button class="nav-btn" data-page="library">
    <span>♡</span>
    LIBRARY
  </button>

  <button class="nav-btn" data-page="settings">
    <span>⚙</span>
    SETTINGS
  </button>

</nav>

</div>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>

/* =========================================================
   SAUVE CONFIGURATION
   ========================================================= */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";


const state = {

  metadata:
    localStorage.getItem("sauve_metadata") ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem("sauve_stream") ||
    "",

  favorites:
    JSON.parse(
      localStorage.getItem("sauve_favorites") ||
      "[]"
    ),

  history:
    JSON.parse(
      localStorage.getItem("sauve_history") ||
      "[]"
    )

};


/* =========================================================
   HELPERS
   ========================================================= */

const $ = selector =>
  document.querySelector(selector);


function escapeHTML(value=""){

  return String(value)
    .replace(/[&<>"']/g, character => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[character]));

}


async function getJSON(url){

  const response = await fetch(url,{
    headers:{
      "Accept":"application/json"
    }
  });

  if(!response.ok){
    throw new Error(
      "HTTP " + response.status
    );
  }

  return response.json();

}


function addonBase(manifest){

  return manifest
    .replace(
      /\/manifest\.json(?:\?.*)?$/i,
      "/"
    );

}


/*
  Standard Stremio-style resource URL.
*/

function resourceURL(
  manifest,
  resource,
  type,
  id
){

  return (
    addonBase(manifest) +
    resource + "/" +
    encodeURIComponent(type) + "/" +
    encodeURIComponent(id) +
    ".json"
  );

}


/* =========================================================
   CARD
   ========================================================= */

function getPoster(item){

  return (
    item?.poster ||
    item?.logo ||
    ""
  );

}


function cardHTML(item){

  return `
    <button
      class="card"
      data-id="${escapeHTML(item.id || "")}"
      data-type="${escapeHTML(item.type || "movie")}">

      <img
        class="poster"
        src="${escapeHTML(getPoster(item))}"
        loading="lazy"
        onerror="this.style.visibility='hidden'">

      <div class="card-info">

        <div class="card-title">
          ${escapeHTML(item.name || "Untitled")}
        </div>

        <div class="card-sub">
          ${escapeHTML(
            item.releaseInfo ||
            item.year ||
            ""
          )}
        </div>

      </div>

    </button>
  `;

}


function gridHTML(items=[]){

  if(!items.length){
    return `
      <div class="empty">
        Nothing found.
      </div>
    `;
  }

  return `
    <div class="grid">
      ${items.map(cardHTML).join("")}
    </div>
  `;

}


/* =========================================================
   HOME
   ========================================================= */

async function loadHome(){

  $("#trending").innerHTML =
    `<div class="empty">Loading cinema…</div>`;

  $("#series").innerHTML =
    `<div class="empty">Loading television…</div>`;


  /*
    Try the standard catalog endpoints.
  */

  try{

    const movieURL =
      resourceURL(
        state.metadata,
        "catalog",
        "movie",
        "tmdb.trending"
      );

    const result =
      await getJSON(movieURL);

    $("#trending").innerHTML =
      gridHTML(result.metas || []);

  }
  catch(error){

    $("#trending").innerHTML = `
      <div class="empty">
        Metadata catalog unavailable.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }


  try{

    const seriesURL =
      resourceURL(
        state.metadata,
        "catalog",
        "series",
        "tmdb.trending"
      );

    const result =
      await getJSON(seriesURL);

    $("#series").innerHTML =
      gridHTML(result.metas || []);

  }
  catch(error){

    $("#series").innerHTML = `
      <div class="empty">
        Television catalog unavailable.
      </div>
    `;

  }

}


/* =========================================================
   SEARCH
   ========================================================= */

async function search(query){

  $("#main").innerHTML = `

    <section>

      <div class="section-heading">

        <h2>Search</h2>

        <span>
          ${escapeHTML(query)}
        </span>

      </div>

      <div id="searchResults" class="empty">
        Searching…
      </div>

    </section>

  `;


  try{

    const movieURL =
      resourceURL(
        state.metadata,
        "catalog",
        "movie",
        "search"
      ) +
      "?search=" +
      encodeURIComponent(query);


    const seriesURL =
      resourceURL(
        state.metadata,
        "catalog",
        "series",
        "search"
      ) +
      "?search=" +
      encodeURIComponent(query);


    const [
      movies,
      series
    ] = await Promise.all([
      getJSON(movieURL),
      getJSON(seriesURL)
    ]);


    const results = [
      ...(movies.metas || []),
      ...(series.metas || [])
    ];


    $("#searchResults").innerHTML =
      gridHTML(results);

  }
  catch(error){

    $("#searchResults").innerHTML = `
      <div class="empty">
        Search unavailable.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}

/* =========================================================
   STREAM DISCOVERY
   ========================================================= */

async function findStreams(type,id){

  if(!state.stream){

    openModal(`

      <div class="sheet-header">

        <h2>ADD STREAM ADDON</h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>

      <div class="notice">

        No stream addon is currently
        configured.

        <br><br>

        Add your own PenguPlay-compatible
        manifest in SAUVE Settings.

      </div>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="settings()">
          ⚡ OPEN SETTINGS
        </button>

      </div>

    `);

    return;
  }


  $("#sourceArea").innerHTML = `
    <div class="empty">
      Contacting stream addon…
    </div>
  `;


  /*
    Use the actual stream resource
    returned by the user's addon.
  */

  const url =
    resourceURL(
      state.stream,
      "stream",
      type,
      id
    );


  try{

    const result =
      await getJSON(url);


    const streams =
      result.streams || [];


    if(!streams.length){

      $("#sourceArea").innerHTML = `
        <div class="empty">
          No streams were returned
          for this title.
        </div>
      `;

      return;
    }


    $("#sourceArea").innerHTML = `

      <div class="section-heading">

        <h2>Sources</h2>

        <span>
          ${streams.length} FOUND
        </span>

      </div>

      ${streams.map(
        (stream,index) => {

          const streamURL =
            stream.url || "";

          const title =
            stream.name ||
            stream.title ||
            "SOURCE " + (index + 1);

          const description =
            stream.description ||
            stream.quality ||
            stream.type ||
            "HTTP source";

          return `

            <button
              class="source"
              data-stream-index="${index}">

              <strong>
                ${escapeHTML(title)}
              </strong>

              <small>
                ${escapeHTML(description)}
              </small>

            </button>

          `;

        }
      ).join("")}

    `;


    $("#sourceArea")
      .querySelectorAll(
        "[data-stream-index]"
      )
      .forEach(button => {

        const index =
          Number(
            button.dataset.streamIndex
          );

        button.onclick =
          () => playStream(
            streams[index]
          );

      });

  }
  catch(error){

    $("#sourceArea").innerHTML = `

      <div class="notice">

        Stream addon request failed.

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;

  }

}


/* =========================================================
   STREAM TYPE DETECTION
   ========================================================= */

function detectStreamType(stream){

  if(!stream){
    return "unknown";
  }


  const url =
    String(
      stream.url ||
      ""
    ).toLowerCase();


  const type =
    String(
      stream.type ||
      ""
    ).toLowerCase();


  const hint =
    String(
      stream.behaviorHints?.videoSize ||
      ""
    ).toLowerCase();


  /*
    HLS
  */

  if(
    type.includes("mpegurl") ||
    type.includes("m3u8") ||
    url.includes(".m3u8") ||
    url.includes("application/vnd.apple.mpegurl") ||
    url.includes("application/x-mpegurl")
  ){

    return "hls";

  }


  /*
    MP4
  */

  if(
    type.includes("mp4") ||
    type.includes("video/mp4") ||
    url.includes(".mp4")
  ){

    return "mp4";

  }


  /*
    WebM
  */

  if(
    type.includes("webm") ||
    url.includes(".webm")
  ){

    return "webm";

  }


  /*
    Generic HTTP video
  */

  if(
    type.startsWith("video/")
  ){

    return "video";

  }


  return "unknown";

}


/* =========================================================
   PLAYER
   ========================================================= */

function playStream(stream){

  const url =
    stream?.url ||
    "";


  if(!url){

    showPlaybackError(
      "",
      "The stream addon did not return a playable URL."
    );

    return;
  }


  /*
    Only HTTP/HTTPS sources can be
    handled by the browser player.
  */

  if(
    !/^https?:\/\//i.test(url)
  ){

    showPlaybackError(
      url,
      "This source uses a protocol that the iPhone browser cannot play directly."
    );

    return;
  }


  const streamType =
    detectStreamType(stream);


  const label =
    streamType === "hls"
      ? "HLS"
      : streamType === "mp4"
      ? "MP4"
      : streamType === "webm"
      ? "WEBM"
      : "HTTP VIDEO";


  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="player-wrap">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">

      </video>


      <div class="player-info">

        <strong>
          SAUVE PLAYER
        </strong>

        <small id="playerStatus">
          Preparing ${label} source…
        </small>

      </div>

    </div>

  `);


  const video =
    document.getElementById(
      "sauveVideo"
    );


  const status =
    document.getElementById(
      "playerStatus"
    );


  /*
    Store a little playback history.
  */

  try{

    state.history.unshift({
      url:url,
      time:Date.now()
    });

    state.history =
      state.history.slice(0,20);

    localStorage.setItem(
      "sauve_history",
      JSON.stringify(
        state.history
      )
    );

  }
  catch(e){}


  /*
    IMPORTANT:
    iPhone Safari has native HLS support.
  */

  if(streamType === "hls"){

    status.textContent =
      "Loading HLS stream…";


    video.src = url;


    video.addEventListener(
      "loadedmetadata",
      () => {

        status.textContent =
          "HLS stream ready.";

        video.play()
          .catch(() => {});

      },
      {once:true}
    );


    video.addEventListener(
      "canplay",
      () => {

        status.textContent =
          "Ready to play.";

      },
      {once:true}
    );


    video.addEventListener(
      "error",
      () => {

        showPlaybackError(
          url,
          "Safari could not load this HLS stream."
        );

      },
      {once:true}
    );


    video.load();

    return;
  }


  /*
    MP4 / WebM / ordinary browser video.
  */

  status.textContent =
    "Loading video…";


  video.src = url;


  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Video ready.";

      video.play()
        .catch(() => {});

    },
    {once:true}
  );


  video.addEventListener(
    "canplay",
    () => {

      status.textContent =
        "Ready to play.";

    },
    {once:true}
  );


  video.addEventListener(
    "error",
    () => {

      showPlaybackError(
        url,
        "Safari could not decode or access this video source."
      );

    },
    {once:true}
  );


  video.load();

}


/* =========================================================
   PLAYBACK ERROR
   ========================================================= */

function showPlaybackError(
  url,
  message
){

  openModal(`

    <div class="sheet-header">

      <h2>
        PLAYBACK FAILED
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="notice">

      <strong>
        ${escapeHTML(message)}
      </strong>

      <br><br>

      SAUVE successfully received a
      source from your stream addon,
      but the iPhone browser couldn't
      play that source directly.

      <br><br>

      Possible causes include:

      <br>

      • Browser-incompatible format
      <br>
      • Required authorization headers
      <br>
      • CORS restrictions
      <br>
      • DRM protection
      <br>
      • Expired source
      <br>
      • Provider-specific playback requirements

    </div>


    ${
      url
      ? `
        <div class="field">

          <label>
            Returned Source
          </label>

          <input
            readonly
            value="${escapeHTML(url)}">

        </div>
      `
      : ""
    }


    <div class="hero-buttons">

      <button
        class="secondary"
        onclick="settings()">

        ⚙ SETTINGS

      </button>

    </div>

  `);

}


/* =========================================================
   FAVORITES
   ========================================================= */

function toggleFavorite(id){

  if(
    state.favorites.includes(id)
  ){

    state.favorites =
      state.favorites.filter(
        item => item !== id
      );

  }
  else{

    state.favorites.push(id);

  }


  localStorage.setItem(
    "sauve_favorites",
    JSON.stringify(
      state.favorites
    )
  );


  closeModal();

}


/* =========================================================
   SETTINGS
   ========================================================= */

function settings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(state.metadata)}">

    </div>


    <div class="field">

      <label>
        Your PenguPlay / HTTP Stream Manifest
      </label>

      <input
        id="streamURL"
        placeholder="Paste your own manifest URL"
        value="${escapeHTML(state.stream)}">

    </div>


    <div class="notice">

      <strong>
        YOUR CONFIGURATION
      </strong>

      <br><br>

      SAUVE stores these manifest URLs
      locally on this device.

      <br><br>

      No Real-Debrid API key is embedded
      in this application.

      <br><br>

      If your addon itself requires a
      private credential, keep that
      credential inside the addon/provider
      configuration rather than publishing
      it in this HTML file.

    </div>


    <div class="hero-buttons">

      <button
        class="primary"
        id="saveSettings">

        ✓ SAVE & TEST

      </button>


      <button
        class="secondary"
        id="disconnect">

        DISCONNECT STREAM

      </button>

    </div>


    <div
      id="settingsStatus"
      class="status">
    </div>

  `);


  $("#saveSettings").onclick =
    async () => {

      const metadata =
        $("#metadataURL")
          .value
          .trim();


      const stream =
        $("#streamURL")
          .value
          .trim();


      if(!metadata){

        $("#settingsStatus")
          .textContent =
          "Enter an AIO metadata manifest.";

        return;

      }


      $("#settingsStatus")
        .textContent =
        "Testing metadata connection…";


      try{

        await getJSON(metadata);


        $("#settingsStatus")
          .textContent =
          "Testing stream addon…";


        if(stream){

          await getJSON(stream);

        }


        state.metadata =
          metadata;

        state.stream =
          stream;


        localStorage.setItem(
          "sauve_metadata",
          metadata
        );


        if(stream){

          localStorage.setItem(
            "sauve_stream",
            stream
          );

        }
        else{

          localStorage.removeItem(
            "sauve_stream"
          );

        }


        $("#settingsStatus")
          .innerHTML = `

            <span style="
              color:#22e7ff;
              text-shadow:0 0 8px #22e7ff;
              font-weight:bold;
            ">
              ✓ SAUVE CONNECTED
            </span>

          `;


        setTimeout(
          () => {

            closeModal();
            loadHome();

          },
          700
        );

      }
      catch(error){

        $("#settingsStatus")
          .innerHTML = `

            <span style="
              color:#ff46d5;
              font-weight:bold;
            ">

              CONNECTION FAILED

              <br><br>

              ${escapeHTML(
                error.message
              )}

            </span>

          `;

      }

    };


  $("#disconnect").onclick =
    () => {

      state.stream = "";

      localStorage.removeItem(
        "sauve_stream"
      );

      settings();

    };

}

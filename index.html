<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#150b25;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --text:#fff;
  --muted:#9d91a6;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#05030b;
}

body{
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -10%,rgba(138,77,255,.38),transparent 35%),
    radial-gradient(circle at 0 30%,rgba(255,22,216,.12),transparent 30%),
    radial-gradient(circle at 100% 50%,rgba(25,234,255,.10),transparent 30%),
    #05030b;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    14px;
  background:rgba(5,3,11,.94);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-bottom:1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-style:italic;
  font-size:clamp(68px,19vw,120px);
  line-height:.78;
  letter-spacing:7px;
  transform:skewX(-7deg);
  color:#fff;
  text-shadow:
    0 0 4px #fff,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;
  text-align:center;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:8px;
  background:#0c0715;
  color:#fff;
  border:1px solid rgba(138,77,255,.45);
  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);
  box-shadow:0 0 18px rgba(255,22,216,.18);
}

.searchbar button{
  padding:0 18px;
  border:0;
  border-radius:8px;
  color:#fff;
  font-weight:900;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}

/* MAIN */

main{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:16px 16px 110px;
}

/* HERO */

.hero{
  position:relative;
  min-height:clamp(400px,58vh,620px);
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  padding:clamp(25px,5vw,60px);
  border-radius:18px;
  border:1px solid rgba(255,22,216,.25);
  background:
    radial-gradient(circle at 75% 30%,rgba(25,234,255,.18),transparent 25%),
    radial-gradient(circle at 75% 75%,rgba(255,22,216,.25),transparent 35%),
    linear-gradient(110deg,#090511,#190c2e,#07121e);
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    rgba(5,3,11,.98),
    rgba(5,3,11,.72) 48%,
    rgba(5,3,11,.05)
  );
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.08;
  background:repeating-linear-gradient(
    0deg,
    transparent 0,
    transparent 3px,
    rgba(255,255,255,.18) 4px
  );
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:clamp(46px,9vw,95px);
  line-height:.85;
  text-transform:uppercase;
  text-shadow:0 0 20px rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;
  line-height:1.6;
  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,
.secondary{
  padding:13px 18px;
  border-radius:8px;
  font-weight:900;
}

.primary{
  border:0;
  color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:0 0 18px rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);
  background:rgba(25,234,255,.04);
  border:1px solid rgba(25,234,255,.38);
}

/* CATALOG */

.catalog-section{
  margin:30px 0 0;
}

.catalog-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:9px;
  border-bottom:1px solid rgba(255,22,216,.15);
}

.catalog-title{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:25px;
  letter-spacing:1px;
}

.catalog-label{
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.row{
  display:flex;
  gap:13px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 1px 12px;
  scroll-snap-type:x proximity;
  scrollbar-width:none;
}

.row::-webkit-scrollbar{
  display:none;
}

/* POSTERS */

.poster-card{
  position:relative;
  flex:0 0 145px;
  overflow:hidden;
  border:0;
  padding:0;
  text-align:left;
  color:#fff;
  background:#10091c;
  border-radius:8px;
  scroll-snap-align:start;
  box-shadow:0 7px 22px rgba(0,0,0,.32);
  transition:transform .18s ease,box-shadow .18s ease;
}

.poster-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 30px rgba(255,22,216,.20);
}

.poster-card img{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#171027;
}

.poster-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:38px 9px 9px;
  background:linear-gradient(transparent,rgba(0,0,0,.94));
}

.poster-name{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.poster-year{
  margin-top:3px;
  color:#bdb0c6;
  font-size:9px;
}

.poster-type{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,.72);
  color:var(--cyan);
  font-size:7px;
  font-weight:900;
  letter-spacing:1px;
}

/* NOTICE */

.empty{
  padding:28px 5px;
  color:var(--muted);
  font-size:13px;
}

.notice{
  padding:16px;
  border-radius:9px;
  background:rgba(255,22,216,.045);
  border:1px solid rgba(255,22,216,.17);
  color:#c8bacf;
  line-height:1.6;
  font-size:12px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:95vh;
  overflow:auto;
  padding:20px 18px calc(30px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;
  background:
    radial-gradient(circle at 50% 0,rgba(138,77,255,.18),transparent 40%),
    #0c0718;
  border-top:1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:27px;
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#170d27;
  color:var(--cyan);
  border:1px solid rgba(25,234,255,.3);
  font-size:22px;
}

/* DETAILS */

.details{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:16px;
}

.details img{
  width:105px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:8px;
}

.details p{
  color:#c3b5cb;
  line-height:1.55;
  font-size:13px;
}

.meta{
  color:var(--cyan);
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:7px;
}

/* EPISODES */

.season-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 12px;
  scrollbar-width:none;
}

.season-bar::-webkit-scrollbar{
  display:none;
}

.season-button{
  flex:none;
  padding:9px 13px;
  border-radius:7px;
  color:#bdaec8;
  background:#130b21;
  border:1px solid rgba(138,77,255,.25);
  font-size:10px;
  font-weight:900;
}

.season-button.active{
  color:#fff;
  border-color:var(--pink);
  background:linear-gradient(135deg,rgba(255,22,216,.22),rgba(138,77,255,.22));
  box-shadow:0 0 12px rgba(255,22,216,.12);
}

.episode-list{
  display:grid;
  gap:9px;
}

.episode{
  width:100%;
  display:grid;
  grid-template-columns:115px 1fr;
  gap:12px;
  padding:0;
  overflow:hidden;
  text-align:left;
  color:#fff;
  background:#11091d;
  border:1px solid rgba(138,77,255,.18);
  border-radius:9px;
}

.episode:hover{
  border-color:var(--pink);
}

.episode img{
  width:115px;
  height:70px;
  object-fit:cover;
  background:#08050d;
}

.episode-info{
  padding:9px 9px 9px 0;
  min-width:0;
}

.episode-number{
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
}

.episode-title{
  margin-top:4px;
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.episode-description{
  margin-top:4px;
  color:#91859b;
  font-size:9px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* SOURCES */

.source{
  width:100%;
  margin-top:9px;
  padding:14px;
  text-align:left;
  color:#fff;
  border-radius:9px;
  background:linear-gradient(100deg,#150c29,#0d0819);
  border:1px solid rgba(25,234,255,.15);
}

.source:hover{
  border-color:var(--cyan);
  box-shadow:0 0 16px rgba(25,234,255,.14);
}

.source-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border-radius:50%;
  color:var(--cyan);
  background:rgba(25,234,255,.08);
}

.source-name{
  font-weight:900;
}

.provider{
  margin-top:4px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.badges{
  margin-top:8px;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  margin-right:5px;
  margin-bottom:4px;
  border-radius:5px;
  background:rgba(255,22,216,.10);
  color:#ff7be4;
  font-size:8px;
  font-weight:900;
  letter-spacing:.7px;
}

.badge.good{
  background:rgba(66,255,176,.10);
  color:var(--green);
}

.badge.warning{
  background:rgba(255,212,90,.10);
  color:var(--yellow);
}

.badge.blue{
  background:rgba(25,234,255,.10);
  color:var(--cyan);
}

.source-desc{
  margin-top:7px;
  color:#91859b;
  font-size:10px;
}

/* PLAYER */

.player-shell{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:12px;
  background:#000;
  border:1px solid rgba(25,234,255,.25);
  box-shadow:0 0 30px rgba(25,234,255,.08);
}

video{
  display:block;
  width:100%;
  max-height:70vh;
  background:#000;
}

.iframe-player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

.player-status{
  padding:11px 13px;
  background:#0e0818;
  border-top:1px solid rgba(255,255,255,.07);
  color:#aaa;
  font-size:11px;
}

.player-status.ready{
  color:var(--green);
}

.player-status.error{
  color:var(--red);
}

.player-controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.player-button{
  padding:10px 13px;
  border-radius:7px;
  color:#fff;
  background:#170d27;
  border:1px solid rgba(255,255,255,.1);
  font-weight:800;
  font-size:11px;
}

.player-button.primary{
  background:linear-gradient(135deg,var(--pink),var(--purple));
  border:0;
}

/* SETTINGS */

.field{
  margin:18px 0;
}

.field label{
  display:block;
  margin-bottom:8px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.field input{
  width:100%;
  padding:13px;
  border-radius:7px;
  background:#080510;
  color:#fff;
  border:1px solid rgba(138,77,255,.3);
  outline:none;
}

.small-help{
  margin-top:7px;
  color:#7f7388;
  font-size:9px;
  line-height:1.5;
}

/* NAV */

.nav{
  position:fixed;
  z-index:400;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(8,5,17,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;
  background:none;
  color:#766a80;
  font-size:9px;
  letter-spacing:1px;
}

.nav button span{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);
  text-shadow:0 0 10px var(--pink);
}

/* DESKTOP */

@media(min-width:700px){

  .poster-card{
    flex-basis:180px;
  }

  .details{
    grid-template-columns:190px 1fr;
  }

  .details img{
    width:190px;
  }

  .hero{
    min-height:580px;
  }

  .episode{
    grid-template-columns:180px 1fr;
  }

  .episode img{
    width:180px;
    height:100px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">SAUVE</div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>

<main id="main">

  <div class="hero">

    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Browse your MDBList collections and television catalogs
        in a Netflix-style interface. Select a show, choose a
        season and episode, then find available sources.
      </p>

      <div class="hero-buttons">

        <button class="primary" onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button class="secondary" onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>

    </div>

  </div>

  <div id="catalogContainer">
    <div class="empty">
      Loading SAUVE…
    </div>
  </div>

</main>

<nav class="nav">

  <button class="active" onclick="goHome()">
    <span>⌂</span>
    HOME
  </button>

  <button onclick="focusSearch()">
    <span>⌕</span>
    SEARCH
  </button>

  <button onclick="openSettings()">
    <span>⚙</span>
    SETTINGS
  </button>

</nav>

<div class="modal" id="modal">

  <div class="sheet" id="sheet"></div>

</div>

<script>

/* ============================================================
   CONFIG
============================================================ */

const DEFAULT_CATALOG =
"stremio://931ea03c081b-mdblist-stremio.baby-beamup.club/unified/latest-movies-digital-release/userapi-snoak-12rh0aihjpmyvra4f4x5od8tb/MDBList/manifest.json";

const DEFAULT_METADATA =
DEFAULT_CATALOG;

const state = {

  metadata:
    localStorage.getItem("sauve_metadata") ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem("sauve_stream") ||
    "",

  catalog:
    localStorage.getItem("sauve_catalog") ||
    DEFAULT_CATALOG

};

let currentStreams = [];

let currentPlayableStreams = [];

let currentPlayerIndex = 0;

let currentShowMeta = null;

let currentSelectedSeason = null;


/* ============================================================
   HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value=""){
  return String(value)
    .replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));
}

function normalizeAddonURL(url){

  let value =
    String(url || "").trim();

  if(!value){
    return "";
  }

  /*
    Convert Stremio protocol to HTTPS.
  */

  if(value.startsWith("stremio://")){
    value =
      "https://" +
      value.substring(
        "stremio://".length
      );
  }

  return value;
}

function addonRoot(url){

  let value =
    normalizeAddonURL(url);

  value =
    value.replace(
      /\/manifest\.json\/?$/i,
      ""
    );

  return value.replace(/\/+$/,"") + "/";
}

async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        },
        cache:"no-store"
      }
    );

  if(!response.ok){
    throw new Error(
      "HTTP " + response.status
    );
  }

  return response.json();
}

function dedupeMetas(metas){

  const seen = new Set();

  return metas.filter(item=>{

    const key =
      String(item.type || "") +
      "|" +
      String(item.id || "");

    if(seen.has(key)){
      return false;
    }

    seen.add(key);
    return true;

  });
}


/* ============================================================
   STREMIO URL HELPERS
============================================================ */

function buildCatalogURL(
  catalog
){

  return (
    addonRoot(state.catalog) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    ) +
    ".json"
  );
}

function buildMetaURL(
  type,
  id
){

  return (
    addonRoot(state.metadata) +
    "meta/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );
}

function buildStreamURL(
  type,
  id
){

  if(!state.stream){
    throw new Error(
      "No stream addon has been configured in Settings."
    );
  }

  return (
    addonRoot(state.stream) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );
}


/* ============================================================
   CATALOG NAME
============================================================ */

function prettyCatalogName(catalog){

  const raw =
    String(
      catalog.name ||
      catalog.id ||
      "CATALOG"
    );

  const lower =
    raw.toLowerCase();

  const mappings = [

    ["netflix","NETFLIX"],
    ["disney+","DISNEY+"],
    ["disney","DISNEY+"],
    ["apple tv","APPLE TV+"],
    ["apple","APPLE TV+"],
    ["hbo","HBO"],
    ["max","MAX"],
    ["hulu","HULU"],
    ["prime","PRIME VIDEO"],
    ["amazon","PRIME VIDEO"],
    ["paramount","PARAMOUNT+"],
    ["peacock","PEACOCK"],
    ["marvel","MARVEL"],
    ["dc","DC"],
    ["popular","POPULAR"],
    ["trending","TRENDING"],
    ["featured","FEATURED"],
    ["latest","LATEST"],
    ["new","NEW RELEASES"],
    ["watchlist","WATCHLIST"]

  ];

  for(
    const [needle,label]
    of mappings
  ){

    if(lower.includes(needle)){
      return label;
    }

  }

  return raw.toUpperCase();
}


/* ============================================================
   LOAD MANIFEST
============================================================ */

async function loadManifest(){

  const url =
    normalizeAddonURL(
      state.catalog
    );

  const manifest =
    await fetchJSON(url);

  return manifest;
}


/* ============================================================
   HOME
============================================================ */

async function loadHome(){

  const container =
    $("catalogContainer");

  container.innerHTML = `
    <div class="empty">
      Loading catalogs…
    </div>
  `;

  try{

    const manifest =
      await loadManifest();

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    if(!catalogs.length){

      container.innerHTML = `
        <div class="notice">
          No catalogs were advertised by the MDBList addon.
        </div>
      `;

      return;
    }

    const selected =
      catalogs
        .filter(c=>c && c.id && c.type)
        .slice(0,40);

    let html = "";

    /*
      Load catalogs one at a time with a
      timeout so one broken catalog cannot
      freeze the entire homepage.
    */

    for(
      const catalog of selected
    ){

      try{

        const data =
          await fetchJSON(
            buildCatalogURL(
              catalog
            )
          );

        const metas =
          Array.isArray(data.metas)
            ? dedupeMetas(data.metas)
            : [];

        if(!metas.length){
          continue;
        }

        html +=
          renderCatalogRow(
            catalog,
            metas.slice(0,40)
          );

      }
      catch(error){

        console.warn(
          "Catalog failed:",
          catalog,
          error
        );

      }

      /*
        Render as we go so the page
        never appears permanently stuck.
      */

      if(html){
        container.innerHTML = html;
      }

    }

    if(!html){

      container.innerHTML = `
        <div class="notice">
          MDBList connected, but no catalog titles
          could be loaded. Check the catalog URL
          in Settings.
        </div>
      `;

    }

  }
  catch(error){

    container.innerHTML = `
      <div class="notice">

        <strong>
          MDBLIST COULD NOT BE LOADED
        </strong>

        <br><br>

        ${escapeHTML(error.message)}

        <br><br>

        Open Settings and verify your
        MDBList Stremio URL.

      </div>
    `;

  }

}

/* ============================================================
   GET VIDEOS
============================================================ */

function getVideos(meta){

  /*
    Standard Stremio metadata normally
    exposes episodes through "videos".
  */

  if(
    Array.isArray(meta.videos)
  ){
    return meta.videos;
  }

  if(
    Array.isArray(meta.series)
  ){
    return meta.series;
  }

  if(
    meta.videos &&
    typeof meta.videos === "object"
  ){
    return Object.values(
      meta.videos
    );
  }

  return [];
}


/* ============================================================
   SEASONS
============================================================ */

function getSeasonNumber(video){

  const value =
    video.season ??
    video.seasonNumber ??
    video.season_index ??
    1;

  const number =
    parseInt(
      value,
      10
    );

  return Number.isFinite(number)
    ? number
    : 1;
}

function getEpisodeNumber(video){

  const value =
    video.episode ??
    video.episodeNumber ??
    video.number ??
    video.episode_index ??
    1;

  const number =
    parseInt(
      value,
      10
    );

  return Number.isFinite(number)
    ? number
    : 1;
}

function getSeasons(videos){

  return [
    ...new Set(
      videos.map(
        getSeasonNumber
      )
    )
  ].sort(
    (a,b)=>a-b
  );
}

   SEASON BUTTONS

  return `

/* ============================================================
   SELECT SEASON
============================================================ */

function selectSeason(
  season
){

  currentSelectedSeason =
    season;

  const videos =
    getVideos(
      currentShowMeta
    );

  const area =
    $("episodeArea");

  if(!area){
    return;
  }

  area.innerHTML =
    renderEpisodes(
      videos,
      season
    );

  /*
    Update active season button.
  */

  document
    .querySelectorAll(
      ".season-button"
    )
    .forEach(button=>{

      const text =
        button.textContent
          .trim()
          .replace(
            "SEASON ",
            ""
          );

      button.classList.toggle(
        "active",
        parseInt(text,10) ===
        season
      );

    });

}


/* ============================================================
   RENDER EPISODES
============================================================ */

function renderEpisodes(
  videos,
  season
){

  const episodes =
    videos
      .filter(
        video =>
          getSeasonNumber(video) ===
          season
      )
      .sort(
        (a,b) =>
          getEpisodeNumber(a) -
          getEpisodeNumber(b)
      );

  if(!episodes.length){

    return `

      <div class="notice">

        No episodes were returned for
        Season ${season}.

      </div>

    `;

  }

  return `

    <div
      class="episode-list">

      ${episodes.map(
        renderEpisode
      ).join("")}

    </div>

  `;
}


/* ============================================================
   EPISODE
============================================================ */

function renderEpisode(
  video
){

  const season =
    getSeasonNumber(video);

  const episode =
    getEpisodeNumber(video);

  /*
    This is the critical TV ID.

    Most Stremio stream addons expect:

    SERIES_ID:season:episode

    The metadata video's own ID is used
    when available because some addons
    provide a specific episode ID.
  */

  const episodeId =
    video.id ||
    `${currentShowMeta.id}:${season}:${episode}`;

  const safeEpisodeId =
    encodeURIComponent(
      episodeId
    );

  const title =
    video.title ||
    video.name ||
    `Episode ${episode}`;

  const thumbnail =
    video.thumbnail ||
    video.poster ||
    currentShowMeta.poster ||
    "";

  return `

    <button
      class="episode"
      onclick="
        openEpisodeSources(
          '${encodeURIComponent(
            currentShowMeta.type ||
            "series"
          )}',
          '${safeEpisodeId}',
          ${season},
          ${episode},
          '${encodeURIComponent(
            title
          )}'
        )
      ">

      <img
        src="${escapeHTML(
          thumbnail
        )}"
        loading="lazy"
        onerror="
          this.style.opacity='.2'
        ">

      <div class="episode-info">

        <div class="episode-number">

          S${String(season).padStart(2,"0")}
          E${String(episode).padStart(2,"0")}

        </div>

        <div class="episode-title">

          ${escapeHTML(
            title
          )}

        </div>

        <div class="episode-description">

          ${escapeHTML(
            video.overview ||
            video.description ||
            ""
          )}

        </div>

      </div>

    </button>

  `;
}

    );

  const rawId =

    );

    );

  openModal(`

        onclick="closeModal()">

      class="notice">

    </div>

    <div

  );

/* ============================================================
   STREAM HELPERS
============================================================ */

function getStreamURL(stream){

  return String(
    stream?.url ||
    ""
  ).trim();

}

function isPlayerFrame(stream){

  return Boolean(
    stream?.playerFrameUrl
  );

}

function isExternal(stream){

  return Boolean(
    stream?.externalUrl
  );

}

function isNotWebReady(stream){

  return Boolean(
    stream?.behaviorHints?.notWebReady
  );

}

function isHLS(stream){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".m3u8") ||
    type.includes("m3u8") ||
    type.includes("mpegurl")
  );
}

function isMP4(stream){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".mp4") ||
    type.includes("mp4") ||
    type.includes("video/mp4")
  );
}

function isWebM(stream){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".webm") ||
    type.includes("webm")
  );
}

function isPlayableCandidate(stream){

  if(isPlayerFrame(stream)){
    return true;
  }

  if(isExternal(stream)){
    return false;
  }

  return (
    isMP4(stream) ||
    isHLS(stream) ||
    isWebM(stream)
  );
}


/* ============================================================
   PROVIDER
============================================================ */

function providerName(stream){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  const providers = [

    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud",
    "torbox",
    "real-debrid",
    "realdebrid",
    "debrid",
    "torrent",
    "usenet"

  ];

  for(
    const provider
    of providers
  ){

    if(
      text.includes(provider)
    ){

      return provider;
    }

  }

  return "stream source";
}


/* ============================================================
   BADGE EXTRACTION
============================================================ */

function getBadgeValues(
  stream
){

  const badges = [];

  /*
    Existing explicit badge fields.
  */

  if(
    Array.isArray(stream.badges)
  ){

    badges.push(
      ...stream.badges
    );

  }

  /*
    Some addons use behaviorHints.
  */

  if(
    stream.behaviorHints
  ){

    const hints =
      stream.behaviorHints;

    if(hints.videoHash){
      badges.push(
        "HASH"
      );
    }

    if(hints.bingeGroup){
      badges.push(
        "BINGE"
      );
    }

    if(hints.proxyHeaders){
      badges.push(
        "PROXY"
      );
    }

  }

  /*
    Parse common information directly
    from the stream title/name.
  */

  const text =
    [
      stream.name,
      stream.title,
      stream.description
    ]
    .filter(Boolean)
    .join(" ");

  const patterns = [

    /\b4K\b/i,
    /\b2160p\b/i,
    /\b1080p\b/i,
    /\b720p\b/i,
    /\b480p\b/i,

    /\bHDR10\+?\b/i,
    /\bHDR\b/i,
    /\bDV\b/i,
    /\bDOLBY VISION\b/i,

    /\bATMOS\b/i,
    /\bTRUEHD\b/i,
    /\bDTS-HD\b/i,
    /\bDTS\b/i,

    /\bHEVC\b/i,
    /\bH265\b/i,
    /\bH264\b/i,

    /\bWEB-DL\b/i,
    /\bWEBRIP\b/i,
    /\bBLURAY\b/i,
    /\bREMUX\b/i

  ];

  patterns.forEach(
    pattern=>{

      const match =
        text.match(pattern);

      if(match){
        badges.push(
          match[0].toUpperCase()
        );
      }

    }
  );

  return [
    ...new Set(
      badges
        .map(
          value =>
            String(value)
              .replace(
                /<[^>]*>/g,
                ""
              )
              .trim()
        )
        .filter(Boolean)
    )
  ];
}


/* ============================================================
   SOURCE SCORE
============================================================ */

function compatibilityScore(stream){

  let score = 0;

  if(isMP4(stream)){
    score += 100;
  }

  if(isHLS(stream)){
    score += 90;
  }

  if(isWebM(stream)){
    score += 80;
  }

  if(isPlayerFrame(stream)){
    score += 70;
  }

  if(isExternal(stream)){
    score -= 100;
  }

  return score;
}


/* ============================================================
   RENDER SOURCE
============================================================ */

function renderSource(
  stream,
  index
){

  const playable =
    isPlayableCandidate(
      stream
    );

  let format =
    "SOURCE";

  if(isMP4(stream)){
    format="MP4";
  }
  else if(isHLS(stream)){
    format="HLS";
  }
  else if(isWebM(stream)){
    format="WEBM";
  }
  else if(isPlayerFrame(stream)){
    format="PLAYER";
  }
  else if(isExternal(stream)){
    format="EXTERNAL";
  }

  const badges =
    getBadgeValues(
      stream
    );

  return `

    <button
      class="source"
      onclick="${
        playable
          ? `playSource(${index})`
          : `explainSource(${index})`
      }">

      <div class="source-top">

        <div class="source-icon">
          ${playable ? "▶" : "!"}
        </div>

        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>

          <div class="provider">

            ${escapeHTML(
              providerName(stream)
            )}

          </div>

        </div>

      </div>

      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : "warning"}
        ">

          ${format}

        </span>

        ${
          isNotWebReady(stream)
            ? `
              <span class="badge warning">
                NOT WEB READY
              </span>
            `
            : `
              <span class="badge good">
                WEB READY
              </span>
            `
        }

        ${
          badges.map(
            badge => `

              <span class="badge blue">
                ${escapeHTML(badge)}
              </span>

            `
          ).join("")
        }

      </div>

      <div class="source-desc">

        ${
          isExternal(stream)
            ? "External destination — SAUVE cannot play this as a direct video file."

          : isNotWebReady(stream)
            ? "Provider marked this source as not web-ready."

          : playable
            ? "Tap to attempt playback inside SAUVE."

          : "This source does not expose a browser-compatible media URL."
        }

      </div>

    </button>

  `;
}


/* ============================================================
   FIND SOURCES
============================================================ */

async function findSources(
  type,
  id
){

  const sourceArea =
    $("sources");

  if(!sourceArea){
    return;
  }

  if(!state.stream){

    sourceArea.innerHTML = `

      <div class="notice">

        No stream addon is configured.

        <br><br>

        Open Settings and paste your
        stream addon manifest URL.

      </div>

    `;

    return;
  }

  sourceArea.innerHTML = `

    <div class="empty">
      Loading stream sources…
    </div>

  `;

  try{

    const url =
      buildStreamURL(
        type,
        id
      );

    console.log(
      "SAUVE stream request:",
      url
    );

    const data =
      await fetchJSON(url);

    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];

    if(!currentStreams.length){

      sourceArea.innerHTML = `

        <div class="notice">

          No sources were returned for this
          episode.

          <br><br>

          Episode requested:

          <strong>
            ${escapeHTML(id)}
          </strong>

        </div>

      `;

      return;
    }

    currentStreams.sort(
      (a,b)=>
        compatibilityScore(b) -
        compatibilityScore(a)
    );

    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );

    sourceArea.innerHTML = `

      <div class="catalog-heading">

        <h2 class="catalog-title">
          SOURCES
        </h2>

        <span class="catalog-label">
          ${currentStreams.length}
        </span>

      </div>

      <div class="notice">

        <strong>
          ${currentPlayableStreams.length}
        </strong>
        potentially compatible source(s).

      </div>

      ${currentStreams.map(
        renderSource
      ).join("")}

    `;

  }
  catch(error){

    sourceArea.innerHTML = `

      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        Requested:

        <strong>
          ${escapeHTML(id)}
        </strong>

      </div>

    `;

  }

}


/* ============================================================
   PLAY SOURCE
============================================================ */

function playSource(index){

  const stream =
    currentStreams[index];

  if(!stream){
    return;
  }

  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );

  if(
    currentPlayerIndex < 0
  ){
    currentPlayerIndex=0;
  }

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;
  }

  playDirectStream(
    stream
  );
}


/* ============================================================
   DIRECT PLAYER
============================================================ */

function playDirectStream(stream){

  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>

      <div
        id="playerStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

  const video =
    $("sauveVideo");

  const status =
    $("playerStatus");

  const url =
    getStreamURL(
      stream
    );

  if(!url){

    showPlayerError(
      "No direct media URL was returned."
    );

    return;
  }

  video.src=url;

  video.addEventListener(
    "loadedmetadata",
    ()=>{

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {once:true}
  );

  video.addEventListener(
    "playing",
    ()=>{

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );

  video.addEventListener(
    "waiting",
    ()=>{

      status.textContent =
        "Buffering…";

    }
  );

  video.addEventListener(
    "error",
    ()=>{

      showPlayerError(
        "Safari could not decode or access this video source."
      );

    }
  );

  video.load();
}


/* ============================================================
   IFRAME PLAYER
============================================================ */

function openEmbeddedPlayer(stream){

  const url =
    String(
      stream.playerFrameUrl ||
      ""
    ).trim();

  if(!url){

    showPlayerError(
      "No player URL was returned."
    );

    return;
  }

  openModal(`

    <div class="sheet-header">

      <h2>
        ${escapeHTML(
          stream.name ||
          "PLAYER"
        )}
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <div class="iframe-player">

        <iframe
          src="${escapeHTML(url)}"
          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "
          allowfullscreen>
        </iframe>

      </div>

      <div class="player-status ready">
        Provider player loaded.
      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);
}


/* ============================================================
   NEXT SOURCE
============================================================ */

function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;
  }

  let next =
    currentPlayerIndex + 1;

  if(
    next >=
    currentPlayableStreams.length
  ){
    next=0;
  }

  currentPlayerIndex=next;

  const stream =
    currentPlayableStreams[next];

  if(isPlayerFrame(stream)){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }
}


/* ============================================================
   SHOW SOURCES
============================================================ */

function showSourcesAgain(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SOURCES
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    ${
      currentStreams.length
        ? currentStreams.map(
            renderSource
          ).join("")
        : `
          <div class="empty">
            No sources available.
          </div>
        `
    }

  `);
}


/* ============================================================
   EXPLAIN SOURCE
============================================================ */

function explainSource(index){

  const stream =
    currentStreams[index];

  if(!stream){
    return;
  }

  alert(
    isExternal(stream)
      ? "This source is an external destination rather than a direct media stream."
      : "SAUVE could not identify a browser-compatible video URL for this source."
  );
}


/* ============================================================
   PLAYER ERROR
============================================================ */

function showPlayerError(message){

  const status =
    $("playerStatus");

  if(status){

    status.textContent =
      message;

    status.className =
      "player-status error";

  }
}


/* ============================================================
   SEARCH
============================================================ */

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();

  if(!query){

    focusSearch();
    return;

  }

  $("catalogContainer").innerHTML = `

    <section class="catalog-section">

      <div class="catalog-heading">

        <h2 class="catalog-title">
          SEARCH
        </h2>

        <span class="catalog-label">
          ${escapeHTML(query)}
        </span>

      </div>

      <div id="searchResults">

        <div class="empty">
          Searching…
        </div>

      </div>

    </section>

  `;

  try{

    const manifest =
      await loadManifest();

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    const results = [];

    /*
      Many MDBList catalogs do not advertise
      search support. We therefore try the
      catalogs rather than relying exclusively
      on the extra declaration.
    */

    for(
      const catalog
      of catalogs.slice(0,25)
    ){

      try{

        const url =
          addonRoot(
            state.catalog
          ) +
          "catalog/" +
          encodeURIComponent(
            catalog.type
          ) +
          "/" +
          encodeURIComponent(
            catalog.id
          ) +
          "/" +
          "search=" +
          encodeURIComponent(
            query
          ) +
          ".json";

        const data =
          await fetchJSON(url);

        if(
          Array.isArray(
            data.metas
          )
        ){

          results.push(
            ...data.metas
          );

        }

      }
      catch(error){

        console.warn(
          "Search catalog failed",
          error
        );

      }

    }

    const unique =
      dedupeMetas(
        results
      );

    $("searchResults").innerHTML =

      unique.length

        ?

        `

          <div class="row">

            ${unique.map(
              renderPosterCard
            ).join("")}

          </div>

        `

        :

        `

          <div class="notice">

            No results found for
            <strong>
              ${escapeHTML(query)}
            </strong>.

          </div>

        `;

  }
  catch(error){

    $("searchResults").innerHTML = `

      <div class="notice">

        SEARCH FAILED

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* ============================================================
   SETTINGS
============================================================ */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="field">

      <label>
        MDBList / Catalog Stremio URL
      </label>

      <input
        id="catalogURL"
        value="${escapeHTML(
          state.catalog
        )}"
        placeholder="stremio://.../manifest.json">

      <div class="small-help">

        Your working MDBList Stremio URL can
        be pasted here. SAUVE automatically
        converts stremio:// to HTTPS when
        making requests.

      </div>

    </div>

    <div class="field">

      <label>
        Metadata Manifest
      </label>

      </label>

      SAUVE now loads the show's metadata,

    <button

    </button>

  `);
}


/* ============================================================
   SAVE SETTINGS
============================================================ */

function saveSettings(){

  const catalog =
    $("catalogURL")
      .value
      .trim();

  const metadata =
    $("metadataURL")
      .value
      .trim();

  const stream =
    $("streamURL")
      .value
      .trim();

  if(!catalog){

    alert(
      "Enter your MDBList Stremio catalog URL."
    );

    return;
  }

  state.catalog =
    catalog;

  state.metadata =
    metadata ||
    catalog;

  state.stream =
    stream;

  localStorage.setItem(
    "sauve_catalog",
    state.catalog
  );

  localStorage.setItem(
    "sauve_metadata",
    state.metadata
  );

  localStorage.setItem(
    "sauve_stream",
    state.stream
  );

  closeModal();

  loadHome();
}


/* ============================================================
   RESET
============================================================ */

function resetSettings(){

  localStorage.removeItem(
    "sauve_catalog"
  );

  localStorage.removeItem(
    "sauve_metadata"
  );

  localStorage.removeItem(
    "sauve_stream"
  );

  location.reload();
}


/* ============================================================
   UI
============================================================ */

function focusSearch(){

  const input =
    $("searchInput");

  input.focus();

  input.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}

function goHome(){

  loadHome();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function openModal(html){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}

function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML="";
}

$("modal")
  .addEventListener(
    "click",
    event=>{

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );

$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );

$("searchInput")
  .addEventListener(
    "keydown",
    event=>{

      if(
        event.key === "Enter"
      ){

        performSearch();

      }

    }
  );


/* ============================================================
   START
============================================================ */

loadHome();

</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#080612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SAUVE — Neon Cinema</title>

<style>

:root{
  --bg:#07050f;
  --panel:#110b20;
  --panel2:#19102d;
  --pink:#ff2ed1;
  --purple:#995cff;
  --cyan:#22e7ff;
  --yellow:#ffd166;
  --orange:#ff7043;
  --white:#fff8ff;
  --muted:#a99ab8;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--white);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(153,92,255,.28),
      transparent 34%
    ),
    radial-gradient(
      circle at 0% 40%,
      rgba(255,46,209,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 55%,
      rgba(34,231,255,.1),
      transparent 28%
    ),
    linear-gradient(
      180deg,
      #07050f,
      #090611 70%,
      #040308
    );
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  padding-bottom:
    calc(82px + env(safe-area-inset-bottom));
}

/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;
  top:0;
  z-index:50;

  padding:
    calc(14px + env(safe-area-inset-top))
    15px
    14px;

  background:rgba(7,5,15,.94);

  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  border-bottom:
    1px solid rgba(255,46,209,.18);
}

.logo-wrap{
  text-align:center;
  margin-bottom:15px;
}

.logo{
  display:inline-block;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-size:
    clamp(65px,18vw,120px);

  line-height:.78;

  letter-spacing:7px;

  font-style:italic;

  transform:skewX(-6deg);

  color:#fff;

  text-shadow:
    0 0 3px #fff,
    0 0 8px var(--pink),
    0 0 20px var(--pink),
    0 0 40px var(--purple),
    5px 5px 0 rgba(34,231,255,.55);
}

.logo-sub{
  margin-top:12px;

  color:var(--cyan);

  font-size:9px;

  letter-spacing:5px;

  font-weight:900;

  text-shadow:
    0 0 9px var(--cyan);
}

.header-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:9px;
}

.icon-btn{
  width:38px;
  height:38px;

  border-radius:50%;

  border:
    1px solid rgba(34,231,255,.3);

  background:#100a20;

  color:var(--cyan);

  box-shadow:
    0 0 12px rgba(34,231,255,.12);
}

.search{
  display:flex;
  gap:8px;

  max-width:800px;
  margin:auto;
}

.search input{
  flex:1;
  min-width:0;

  border:
    1px solid rgba(153,92,255,.35);

  border-radius:8px;

  background:#120c23;

  color:white;

  padding:13px 14px;

  outline:none;
}

.search input:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 15px rgba(255,46,209,.2);
}

.search button,
.primary{
  border:0;

  color:white;

  font-weight:900;

  border-radius:8px;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    0 0 12px rgba(255,46,209,.65),
    0 0 30px rgba(255,46,209,.25);
}

/* =====================================================
   MAIN
===================================================== */

main{
  width:100%;
  max-width:1350px;
  margin:auto;
  padding:17px;
}

/* =====================================================
   HERO
===================================================== */

.hero{
  position:relative;

  min-height:
    clamp(390px,62vh,610px);

  overflow:hidden;

  border-radius:18px;

  border:
    1px solid rgba(255,46,209,.28);

  display:flex;
  align-items:flex-end;

  padding:
    clamp(24px,5vw,55px);

  background:
    radial-gradient(
      circle at 78% 25%,
      rgba(34,231,255,.2),
      transparent 22%
    ),
    radial-gradient(
      circle at 72% 65%,
      rgba(255,46,209,.25),
      transparent 30%
    ),
    linear-gradient(
      110deg,
      #0a0615,
      #190b31 55%,
      #0b1024
    );
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(7,5,15,.98),
      rgba(7,5,15,.72) 45%,
      rgba(7,5,15,.08)
    );
}

.hero-content{
  position:relative;
  z-index:2;
  max-width:680px;
}

.kicker{
  color:var(--cyan);

  font-size:10px;

  letter-spacing:3px;

  font-weight:900;

  text-shadow:
    0 0 10px var(--cyan);
}

.hero h1{
  margin:15px 0 0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:
    clamp(46px,10vw,100px);

  line-height:.86;

  text-transform:uppercase;

  text-shadow:
    0 0 8px rgba(255,255,255,.4),
    0 0 25px rgba(255,46,209,.4);
}

.hero p{
  color:#c4b7d3;
  line-height:1.65;
  max-width:560px;
  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,
.secondary{
  padding:13px 18px;
}

.secondary{
  border:
    1px solid rgba(34,231,255,.4);

  border-radius:8px;

  color:var(--cyan);

  background:
    rgba(34,231,255,.06);
}

/* =====================================================
   SECTIONS
===================================================== */

section{
  margin:34px 0;
}

.section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:12px;

  margin-bottom:15px;

  padding-bottom:10px;

  border-bottom:
    1px solid rgba(255,46,209,.18);
}

.section-heading h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:25px;

  text-transform:uppercase;

  text-shadow:
    0 0 12px rgba(255,46,209,.35);
}

.section-heading span{
  color:var(--cyan);

  font-size:9px;

  letter-spacing:2px;

  font-weight:900;
}

/* =====================================================
   CARDS
===================================================== */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:13px;
}

.card{
  padding:0;

  overflow:hidden;

  text-align:left;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #15102b,
      #0f0b20
    );

  color:white;
}

.card:hover{
  border-color:
    rgba(255,46,209,.5);

  box-shadow:
    0 0 22px rgba(255,46,209,.18);
}

.poster{
  display:block;

  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;

  background:#17102c;
}

.card-info{
  padding:11px;
}

.card-title{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;

  font-weight:800;

  font-size:14px;
}

.card-sub{
  margin-top:4px;

  color:var(--muted);

  font-size:10px;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.78);

  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:94vh;

  overflow:auto;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(153,92,255,.15),
      transparent 40%
    ),
    #0d0920;

  border-top:
    1px solid rgba(255,46,209,.4);

  border-radius:
    22px 22px 0 0;

  padding:
    20px
    18px
    calc(30px + env(safe-area-inset-bottom));
}

.sheet-header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:20px;
}

.sheet-header h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:27px;
}

.close{
  width:40px;
  height:40px;

  border-radius:50%;

  border:
    1px solid rgba(34,231,255,.25);

  background:#17102c;

  color:var(--cyan);

  font-size:22px;
}

/* =====================================================
   DETAILS
===================================================== */

.details{
  display:grid;

  grid-template-columns:
    105px 1fr;

  gap:16px;
}

.details img{
  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;
}

.details p{
  color:#c1b5cc;

  line-height:1.55;

  font-size:13px;
}

.meta-line{
  color:var(--cyan);

  font-size:11px;

  letter-spacing:1px;
}

/* =====================================================
   PROVIDER SOURCE LIST
===================================================== */

.source-list{
  margin-top:22px;
}

.source{
  display:block;

  width:100%;

  text-align:left;

  margin-top:9px;

  padding:14px;

  border-radius:9px;

  border:
    1px solid rgba(34,231,255,.18);

  background:
    linear-gradient(
      100deg,
      #140e29,
      #0d0a1d
    );

  color:white;

  transition:.2s ease;
}

.source:hover{
  border-color:var(--cyan);

  box-shadow:
    0 0 15px rgba(34,231,255,.2);
}

.source-main{
  display:flex;
  align-items:center;
  gap:12px;
}

.source-icon{
  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:none;

  border-radius:50%;

  background:
    rgba(34,231,255,.08);

  color:var(--cyan);
}

.source-title{
  font-weight:900;
}

.source-provider{
  margin-top:4px;

  color:var(--cyan);

  font-size:10px;

  letter-spacing:1px;

  text-transform:uppercase;
}

.source-details{
  margin-top:6px;

  color:var(--muted);

  font-size:10px;
}

.source-status{
  margin-top:8px;

  font-size:10px;

  color:#aaa;
}

.badge{
  display:inline-block;

  padding:4px 7px;

  margin-right:5px;

  border-radius:5px;

  font-size:8px;

  letter-spacing:1px;

  font-weight:900;

  background:
    rgba(255,46,209,.12);

  color:#ff74df;
}

.badge.ready{
  background:
    rgba(34,231,255,.1);

  color:var(--cyan);
}

/* =====================================================
   PLAYER
===================================================== */

.player-wrap{
  background:#000;

  border-radius:10px;

  overflow:hidden;

  border:
    1px solid rgba(34,231,255,.25);

  box-shadow:
    0 0 30px rgba(34,231,255,.08);
}

video{
  display:block;

  width:100%;

  max-height:70vh;

  min-height:220px;

  background:#000;
}

.player-info{
  padding:12px;

  background:#100b20;
}

.player-info strong{
  display:block;
}

.player-info small{
  color:var(--muted);
}

/* =====================================================
   SETTINGS
===================================================== */

.field{
  margin:18px 0;
}

.field label{
  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:10px;

  letter-spacing:2px;

  text-transform:uppercase;

  font-weight:900;
}

.field input{
  width:100%;

  padding:14px;

  border-radius:7px;

  border:
    1px solid rgba(153,92,255,.3);

  background:#080612;

  color:white;

  outline:none;
}

.notice{
  padding:14px;

  border:
    1px solid rgba(255,46,209,.15);

  border-radius:8px;

  background:
    rgba(255,46,209,.04);

  color:#b7aabd;

  font-size:12px;

  line-height:1.6;
}

/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
  position:fixed;

  z-index:70;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  padding-bottom:
    env(safe-area-inset-bottom);

  display:flex;

  justify-content:space-around;
  align-items:center;

  background:
    rgba(8,6,18,.94);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-top:
    1px solid rgba(255,46,209,.2);
}

.nav-btn{
  border:0;
  background:none;

  color:#75687f;

  font-size:9px;

  letter-spacing:1px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:5px;
}

.nav-btn span{
  font-size:22px;
}

.nav-btn.active{
  color:var(--pink);

  text-shadow:
    0 0 10px var(--pink);
}

.empty{
  padding:25px 0;

  color:var(--muted);

  font-size:13px;
}

@media(min-width:700px){

  .grid{
    grid-template-columns:
      repeat(5,minmax(0,1fr));
  }

  .details{
    grid-template-columns:
      190px 1fr;
  }

  .details img{
    width:190px;
  }

}

</style>
</head>

<body>

<div class="app">

<header>

  <div class="logo-wrap">

    <div class="logo">
      SAUVE
    </div>

    <div class="logo-sub">
      CINEMA • TELEVISION • AFTER DARK
    </div>

  </div>

  <div class="header-actions">

    <button

<main id="main">

  <div class="hero">

      </div>

      <h1>
        CINEMA<br>

      </h1>

      <p>
        A neon media experience powered by
        your metadata and your compatible
        streaming addon.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          id="heroSearch">
          ▶ EXPLORE
        </button>

        <button
          class="secondary"
          id="heroSettings">

        </button>

      </div>

    </div>

  </div>

  <section>

    <div class="section-heading">

      <h2>

</main>

<nav class="bottom-nav">

  <button
    class="nav-btn active"

  </button>

  <button
    class="nav-btn"

    <span>⌕</span>

  </button>

</div>

  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

<script>

/* =====================================================
   CONFIG
===================================================== */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";


const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    "",

  favorites:
    JSON.parse(
      localStorage.getItem(
        "sauve_favorites"
      ) || "[]"
    )

};


/* =====================================================
   HELPERS
===================================================== */

function $(selector){
  return document.querySelector(selector);
}


function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}


async function getJSON(url){

  const response =
    await fetch(url,{
      headers:{
        Accept:"application/json"
      }
    });

  if(!response.ok){
    throw new Error(
      "HTTP " +
      response.status
    );
  }

  return response.json();

}


function addonBase(manifest){

  return manifest.replace(
    /\/manifest\.json(?:\?.*)?$/i,
    "/"
  );

}


function resourceURL(
  manifest,
  resource,
  type,
  id
){

  return (
    addonBase(manifest) +
    resource +
    "/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}


/* =====================================================
   STREAM FORMAT DETECTION
===================================================== */

function detectStreamFormat(stream){

  const url =
    String(
      stream?.url || ""
    ).toLowerCase();

  const type =
    String(
      stream?.type || ""
    ).toLowerCase();

  const title =
    String(
      stream?.title ||
      stream?.name ||
      stream?.description ||
      ""
    ).toLowerCase();


  if(
    type.includes("mpegurl") ||
    type.includes("m3u8") ||
    url.includes(".m3u8")
  ){

    return "hls";

  }


  if(
    type.includes("mp4") ||
    url.includes(".mp4") ||
    title.includes("mp4")
  ){

    return "mp4";

  }


  if(
    type.includes("webm") ||
    url.includes(".webm") ||
    title.includes("webm")
  ){

    return "webm";

  }


  if(
    type.startsWith("video/")
  ){

    return "video";

  }


  return "unknown";

}


/* =====================================================
   PROVIDER DETECTION
===================================================== */

function detectProvider(stream){

  const text =
    (
      stream?.name ||
      stream?.title ||
      stream?.description ||
      stream?.url ||
      ""
    ).toLowerCase();


  const providers = [

    "2peckle",
    "4khdhub",
    "111477",
    "vidking",
    "vidfast",
    "vidlink",
    "moviebox",
    "moviesdrives",
    "miruro",
    "cinefreak",
    "aniwaves",
    "vegamovies",
    "vaplayer",
    "zxcstream",
    "aether",
    "animesuge"

  ];


  for(
    const provider of providers
  ){

    if(
      text.includes(provider)
    ){

      return provider;

    }

  }


  return "stream provider";

}


/* =====================================================
   PLAYABILITY SCORE
===================================================== */

function scoreStream(stream){

  const format =
    detectStreamFormat(
      stream
    );

  const provider =
    detectProvider(
      stream
    );


  let score = 0;


  /*
    Native browser formats.
  */

  if(format === "hls"){
    score += 100;
  }

  else if(format === "mp4"){
    score += 95;
  }

  else if(format === "webm"){
    score += 90;
  }

  else if(format === "video"){
    score += 80;
  }

  else{
    score += 50;
  }


  /*
    2Peckle gets a small preference
    because you've confirmed it works
    in your current iPhone setup.

    It is NOT treated as the only
    playable provider.
  */

  if(provider === "2peckle"){
    score += 10;
  }


  return score;

}


/* =====================================================
   SOURCE LABEL
===================================================== */

function sourceLabel(stream){

  const format =
    detectStreamFormat(
      stream
    );


  if(format === "hls"){
    return "HLS";
  }

  if(format === "mp4"){
    return "MP4";
  }

  if(format === "webm"){
    return "WEBM";
  }

  if(format === "video"){
    return "VIDEO";
  }

  return "HTTP";

}


/* =====================================================
   POSTER
===================================================== */

function getPoster(item){

  return (
    item?.poster ||
    item?.logo ||
    ""
  );

}


/* =====================================================
   CARD
===================================================== */

function cardHTML(item){

  return `

    <button
      class="card"
      data-id="${escapeHTML(item.id || "")}"
      data-type="${escapeHTML(item.type || "movie")}">

      <img
        class="poster"
        src="${escapeHTML(getPoster(item))}"
        loading="lazy"
        onerror="
          this.style.visibility='hidden'
        ">

      <div class="card-info">

        <div class="card-title">

          ${escapeHTML(
            item.name ||
            "Untitled"
          )}

        </div>

        <div class="card-sub">

          ${escapeHTML(
            item.releaseInfo ||
            item.year ||
            ""
          )}

        </div>

      </div>

    </button>

  `;

}


function gridHTML(items=[]){

  if(!items.length){

    return `
      <div class="empty">
        Nothing found.
      </div>
    `;

  }

  return `
    <div class="grid">
      ${items.map(cardHTML).join("")}
    </div>
  `;

}

/* =====================================================
   STREAM SEARCH
===================================================== */

async function findStreams(
  type,
  id
){

  if(!state.stream){

    settings();

    return;

  }


  $("#sourceArea").innerHTML = `

    <div class="empty">

      <span style="
        color:#22e7ff;
        text-shadow:
          0 0 10px #22e7ff;
      ">

        SCANNING PROVIDERS…

      </span>

    </div>

  `;


  try{

    const result =
      await getJSON(

        resourceURL(
          state.stream,
          "stream",
          type,
          id
        )

      );


    let streams =
      result.streams ||
      [];


    if(!streams.length){

      $("#sourceArea").innerHTML = `

        <div class="notice">

          No sources were returned.

        </div>

      `;

      return;

    }


    /*
      Enrich every source.
    */

    streams =
      streams.map(
        (stream,index) => ({

          ...stream,

          _index:index,

          _provider:
            detectProvider(
              stream
            ),

          _format:
            detectStreamFormat(
              stream
            ),

          _score:
            scoreStream(
              stream
            )

        })
      );


    /*
      Sort best candidates first.
    */

    streams.sort(
      (a,b) =>
        b._score -
        a._score
    );


    $("#sourceArea").innerHTML = `

      <div class="section-heading">

        <h2>
          SOURCES
        </h2>

        <span>
          ${streams.length} FOUND
        </span>

      </div>


      <div>

        ${streams.map(
          (stream,index) => `

            <button
              class="source"
              data-source-index="${index}">

              <div class="source-main">

                <div class="source-icon">

                  ▶

                </div>


                <div>

                  <div class="source-title">

                    ${escapeHTML(
                      stream.name ||
                      stream.title ||
                      "STREAM"
                    )}

                  </div>


                  <div class="source-provider">

                    ${escapeHTML(
                      stream._provider
                    )}

                  </div>


                  <div class="source-details">

                    <span class="badge ready">

                      ${escapeHTML(
                        sourceLabel(stream)
                      )}

                    </span>


                    ${
                      stream.quality
                      ?

                      `<span class="badge">
                        ${escapeHTML(
                          stream.quality
                        )}
                      </span>`

                      :

                      ""
                    }

                  </div>

                </div>

              </div>


              <div class="source-status">

                ${escapeHTML(
                  stream.description ||
                  "HTTP source"
                )}

              </div>

            </button>

          `
        ).join("")}

      </div>

    `;


    $("#sourceArea")
      .querySelectorAll(
        "[data-source-index]"
      )
      .forEach(
        button => {

          button.onclick =
            () => {

              const index =
                Number(
                  button.dataset
                    .sourceIndex
                );


              playStream(
                streams[index]
              );

            };

        }
      );

  }
  catch(error){

    $("#sourceArea").innerHTML = `

      <div class="notice">

        <strong>
          SOURCE SEARCH FAILED
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =====================================================
   PLAYER
===================================================== */

function playStream(stream){

  const url =
    stream?.url ||
    "";


  if(!url){

    playbackError(
      "This source did not provide a playable URL."
    );

    return;

  }


  const provider =
    detectProvider(
      stream
    );


  const format =
    detectStreamFormat(
      stream
    );


  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="player-wrap">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>


      <div class="player-info">

        <strong>

          ${escapeHTML(
            provider
          )}

        </strong>


        <small id="playerStatus">

          Loading
          ${escapeHTML(format.toUpperCase())}
          …

        </small>

      </div>

    </div>

  `);


  const video =
    $("#sauveVideo");


  const status =
    $("#playerStatus");


  /*
    IMPORTANT:
    We use the URL exactly as returned
    by the user's configured addon.

    We do not invent headers or bypass
    provider authorization.
  */

  video.src =
    url;


  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "READY";


      video.play()
        .catch(
          () => {}
        );

    },
    {
      once:true
    }
  );


  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "PLAYING";

    }
  );


  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "BUFFERING…";

    }
  );


  video.addEventListener(
    "error",
    () => {

      playbackError(
        "Safari could not decode or access this source. Try another provider."
      );

    },
    {
      once:true
    }
  );


  video.load();

}


/* =====================================================
   PLAYBACK ERROR
===================================================== */

function playbackError(message){

  openModal(`

    <div class="sheet-header">

      <h2>
        PLAYBACK ERROR
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="notice">

      ${escapeHTML(
        message
      )}

      <br><br>

      This usually means the provider
      requires playback behavior that
      Safari cannot reproduce directly.

      <br><br>

      Try another source.

    </div>

  `);

}

        <span>

  try{

/* =====================================================
   SETTINGS
===================================================== */

function settings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>


    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        placeholder="Paste your stream manifest"
        value="${escapeHTML(
          state.stream
        )}">

    </div>


    <div class="notice">

      SAUVE stores these manifest URLs
      locally on this device.

      <br><br>

      SAUVE does not ask for or store
      your Real-Debrid API key.

    </div>


    <div class="hero-buttons">

      <button
        class="primary"
        id="saveSettings">

        ✓ SAVE

      </button>

    </div>


    <div
      id="settingsStatus"
      style="
        margin-top:15px;
        color:#22e7ff;
      ">
    </div>

  `);


  $("#saveSettings").onclick =
    () => {

      const metadata =
        $("#metadataURL")
          .value
          .trim();


      const stream =
        $("#streamURL")
          .value
          .trim();


      if(!metadata){

        $("#settingsStatus")
          .textContent =
          "Metadata manifest required.";

        return;

      }


      state.metadata =
        metadata;

      state.stream =
        stream;


      localStorage.setItem(
        "sauve_metadata",
        metadata
      );


      if(stream){

        localStorage.setItem(
          "sauve_stream",
          stream
        );

      }
      else{

        localStorage.removeItem(
          "sauve_stream"
        );

      }


      $("#settingsStatus")
        .textContent =
        "✓ SETTINGS SAVED";


      setTimeout(
        () => {

          closeModal();

          loadHome();

        },
        600
      );

    };

}


/* =====================================================
   MODAL
===================================================== */

function openModal(html){

  $("#sheet").innerHTML =
    html;

  $("#modal")
    .classList
    .add("open");

}


function closeModal(){

  $("#modal")
    .classList
    .remove("open");

  $("#sheet").innerHTML =
    "";

}


/* =====================================================
   EVENTS
===================================================== */

$("#searchButton").onclick =
  () => {

    const query =
      $("#searchInput")
        .value
        .trim();


    if(query){
      search(query);
    }

  };


$("#searchInput")
  .addEventListener(
    "keydown",
    e => {

      if(
        e.key === "Enter"
      ){

        $("#searchButton")
          .click();

      }

    }
  );


$("#searchFocus").onclick =
  () =>
    $("#searchInput")
      .focus();


$("#heroSearch").onclick =
  () =>
    $("#searchInput")
      .focus();


$("#heroSettings").onclick =
  settings;


$("#settingsButton").onclick =
  settings;


document.addEventListener(
  "click",
  event => {

    const card =
      event.target.closest(
        ".card"
      );


    if(!card){
      return;
    }


    openDetails(
      card.dataset.type,
      card.dataset.id
    );

  }
);


$("#modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


document
  .querySelectorAll(
    ".nav-btn"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          if(
            button.dataset.page ===
            "home"
          ){

            location.reload();

          }


          if(
            button.dataset.page ===
            "search"
          ){

            $("#searchInput")
              .focus();

          }


          if(
            button.dataset.page ===
            "settings"
          ){

            settings();

          }

        };

    }
  );


/* =====================================================
   START
===================================================== */

loadHome();

</script>

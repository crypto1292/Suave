<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover">

<meta name="theme-color" content="#080612">

<title>SAUVE — Neon Cinema</title>

<style>

/* =========================================================
   SAUVE NEON CINEMA
   ========================================================= */

:root{
  --bg:#080612;
  --bg2:#0d0920;
  --panel:#120d27;
  --panel2:#191033;

  --white:#fff8ff;
  --muted:#a99bb9;

  --pink:#ff3bd4;
  --purple:#9b5cff;
  --cyan:#25eaff;
  --orange:#ff7043;
  --yellow:#ffd166;

  --border:rgba(255,255,255,.12);

  --shadow-pink:
    0 0 10px rgba(255,59,212,.65),
    0 0 30px rgba(255,59,212,.35);

  --shadow-cyan:
    0 0 10px rgba(37,234,255,.65),
    0 0 30px rgba(37,234,255,.3);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--white);
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:

    radial-gradient(
      circle at 50% -10%,
      rgba(155,92,255,.25),
      transparent 35%
    ),

    radial-gradient(
      circle at 0% 40%,
      rgba(255,59,212,.10),
      transparent 30%
    ),

    radial-gradient(
      circle at 100% 60%,
      rgba(37,234,255,.08),
      transparent 30%
    ),

    linear-gradient(
      180deg,
      #080612,
      #090615 60%,
      #05040b
    );

  overflow-x:hidden;
}


/* =========================================================
   RETRO SCANLINES
   ========================================================= */

body::before{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  z-index:999;

  opacity:.055;

  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.12) 4px
    );
}


/* =========================================================
   NEON GRID
   ========================================================= */

body::after{
  content:"";

  position:fixed;

  left:-20%;
  right:-20%;
  bottom:-18%;

  height:48vh;

  pointer-events:none;

  opacity:.12;

  transform:
    perspective(300px)
    rotateX(62deg);

  background-image:

    linear-gradient(
      rgba(37,234,255,.5) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,59,212,.5) 1px,
      transparent 1px
    );

  background-size:
    55px 55px;

  z-index:0;
}


/* =========================================================
   APP
   ========================================================= */

.app{
  position:relative;
  z-index:2;

  min-height:100vh;

  padding-bottom:
    calc(
      90px +
      env(safe-area-inset-bottom)
    );
}


/* =========================================================
   HEADER
   ========================================================= */

header{

  position:sticky;

  top:0;

  z-index:50;

  padding:
    calc(
      18px +
      env(safe-area-inset-top)
    )
    16px
    15px;

  background:
    linear-gradient(
      180deg,
      rgba(8,6,18,.98),
      rgba(8,6,18,.88)
    );

  backdrop-filter:
    blur(22px);

  border-bottom:
    1px solid
    rgba(255,59,212,.18);
}


/* =========================================================
   LOGO
   ========================================================= */

.logo-wrap{

  text-align:center;

  margin:
    2px
    0
    16px;
}


.logo{

  position:relative;

  display:inline-block;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-size:
    clamp(
      58px,
      17vw,
      112px
    );

  line-height:.78;

  letter-spacing:
    7px;

  font-style:italic;

  transform:
    skewX(-5deg);

  color:#fff;

  text-transform:uppercase;

  text-shadow:

    0 0 3px #fff,

    0 0 9px var(--pink),

    0 0 20px var(--pink),

    0 0 45px var(--purple),

    5px 5px 0
      rgba(37,234,255,.55);

  animation:
    neonPulse
    3.5s
    ease-in-out
    infinite;
}

.logo::after{

  content:"SAUVE";

  position:absolute;

  inset:0;

  color:transparent;

  -webkit-text-stroke:
    2px
    var(--cyan);

  opacity:.55;

  transform:
    translate(5px,4px);

  z-index:-1;
}

.logo-sub{

  margin-top:12px;

  font-size:9px;

  letter-spacing:5px;

  color:var(--cyan);

  text-shadow:
    0 0 8px var(--cyan);

  font-weight:bold;
}

@keyframes neonPulse{

  0%,
  100%{
    filter:
      brightness(1);
  }

  50%{
    filter:
      brightness(1.18);
  }

}


/* =========================================================
   HEADER ACTIONS
   ========================================================= */

.header-actions{

  position:absolute;

  right:15px;

  top:
    calc(
      25px +
      env(safe-area-inset-top)
    );

  display:flex;

  gap:7px;
}

.icon-btn{

  width:40px;
  height:40px;

  border-radius:50%;

  border:
    1px solid
    rgba(37,234,255,.3);

  background:
    rgba(13,9,32,.85);

  color:var(--cyan);

  font-size:18px;

  box-shadow:
    0 0 10px
    rgba(37,234,255,.15);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search{

  display:flex;

  gap:8px;

  max-width:760px;

  margin:auto;
}

.search input{

  flex:1;

  min-width:0;

  border:
    1px solid
    rgba(155,92,255,.35);

  border-radius:8px;

  background:
    rgba(18,13,39,.9);

  color:#fff;

  padding:14px 15px;

  outline:none;

  box-shadow:
    inset
    0 0 18px
    rgba(155,92,255,.08);
}

.search input:focus{

  border-color:
    var(--pink);

  box-shadow:
    0 0 15px
    rgba(255,59,212,.2);
}

.search button{

  border:0;

  border-radius:8px;

  padding:
    0 17px;

  color:#fff;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    var(--shadow-pink);
}


/* =========================================================
   MAIN
   ========================================================= */

main{

  width:100%;

  max-width:1300px;

  margin:auto;

  padding:
    18px;
}


/* =========================================================
   HERO
   ========================================================= */

.hero{

  position:relative;

  min-height:
    clamp(
      390px,
      62vh,
      610px
    );

  overflow:hidden;

  border-radius:18px;

  border:
    1px solid
    rgba(255,59,212,.28);

  display:flex;

  align-items:flex-end;

  padding:
    clamp(22px,5vw,55px);

  background:

    radial-gradient(
      circle at 78% 25%,
      rgba(37,234,255,.2),
      transparent 22%
    ),

    radial-gradient(
      circle at 72% 65%,
      rgba(255,59,212,.25),
      transparent 30%
    ),

    linear-gradient(
      110deg,
      #0a0615,
      #190b31 55%,
      #0b1024
    );

  box-shadow:
    inset
    0 0 70px
    rgba(155,92,255,.12),

    0 0 35px
    rgba(255,59,212,.08);
}

.hero::before{

  content:"";

  position:absolute;

  inset:0;

  background:

    linear-gradient(
      90deg,
      rgba(8,6,18,.98),
      rgba(8,6,18,.72) 42%,
      rgba(8,6,18,.08)
    );

}

.hero::after{

  content:"";

  position:absolute;

  width:420px;
  height:420px;

  right:-100px;
  top:-80px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(37,234,255,.35),
      transparent 62%
    );

  filter:
    blur(25px);
}

.hero-content{

  position:relative;

  z-index:3;

  max-width:680px;
}

.kicker{

  display:inline-block;

  color:var(--cyan);

  font-size:11px;

  letter-spacing:3px;

  font-weight:bold;

  text-transform:uppercase;

  text-shadow:
    0 0 10px
    var(--cyan);

  margin-bottom:15px;
}

.hero h1{

  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:
    clamp(
      45px,
      10vw,
      100px
    );

  line-height:.86;

  letter-spacing:-1px;

  text-transform:uppercase;

  text-shadow:

    0 0 8px
    rgba(255,255,255,.4),

    0 0 25px
    rgba(255,59,212,.4);
}

.hero p{

  color:#c4b7d3;

  line-height:1.65;

  max-width:560px;

  font-size:14px;
}

.hero-buttons{

  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:20px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.primary{

  border:0;

  border-radius:8px;

  padding:
    14px
    21px;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  color:#fff;

  font-weight:900;

  box-shadow:
    var(--shadow-pink);
}

.secondary{

  border:
    1px solid
    rgba(37,234,255,.4);

  border-radius:8px;

  padding:
    13px
    18px;

  background:
    rgba(37,234,255,.06);

  color:var(--cyan);

  font-weight:bold;

  box-shadow:
    0 0 15px
    rgba(37,234,255,.08);
}


/* =========================================================
   SECTION
   ========================================================= */

section{

  margin:
    34px
    0;
}

.section-heading{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  gap:12px;

  margin-bottom:15px;

  border-bottom:
    1px solid
    rgba(255,59,212,.18);

  padding-bottom:10px;
}

.section-heading h2{

  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:25px;

  letter-spacing:1px;

  text-transform:uppercase;

  text-shadow:
    0 0 12px
    rgba(255,59,212,.35);
}

.section-heading span{

  color:var(--cyan);

  font-size:9px;

  letter-spacing:2px;

  font-weight:bold;
}


/* =========================================================
   GRID
   ========================================================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:13px;
}


/* =========================================================
   CARD
   ========================================================= */

.card{

  appearance:none;

  padding:0;

  text-align:left;

  overflow:hidden;

  border:
    1px solid
    rgba(255,255,255,.09);

  border-radius:10px;

  background:
    linear-gradient(
      180deg,
      #15102b,
      #0f0b20
    );

  color:#fff;

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}

.card:hover{

  transform:
    translateY(-5px);

  border-color:
    rgba(255,59,212,.5);

  box-shadow:
    0 0 22px
    rgba(255,59,212,.18);
}

.poster{

  display:block;

  width:100%;

  aspect-ratio:
    2 / 3;

  object-fit:cover;

  background:
    #17102c;
}

.card-info{

  padding:11px;
}

.card-title{

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  font-weight:bold;

  font-size:14px;
}

.card-sub{

  margin-top:4px;

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.78);

  backdrop-filter:
    blur(7px);
}

.modal.open{

  display:flex;
}

.sheet{

  width:100%;

  max-height:
    94vh;

  overflow:auto;

  background:

    radial-gradient(
      circle at 50% 0%,
      rgba(155,92,255,.15),
      transparent 40%
    ),

    #0d0920;

  border-top:
    1px solid
    rgba(255,59,212,.4);

  border-radius:
    22px
    22px
    0
    0;

  padding:
    20px
    18px
    calc(
      30px +
      env(safe-area-inset-bottom)
    );
}

.sheet-header{

  display:flex;

  justify-content:
    space-between;

  align-items:center;

  margin-bottom:20px;
}

.sheet-header h2{

  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  letter-spacing:1px;

  font-size:27px;

  text-shadow:
    0 0 15px
    rgba(255,59,212,.4);
}

.close{

  width:40px;
  height:40px;

  border-radius:50%;

  background:#17102c;

  border:
    1px solid
    rgba(37,234,255,.25);

  color:var(--cyan);

  font-size:22px;
}


/* =========================================================
   DETAILS
   ========================================================= */

.details{

  display:grid;

  grid-template-columns:
    105px 1fr;

  gap:16px;
}

.details img{

  width:105px;

  aspect-ratio:
    2 / 3;

  object-fit:cover;

  border-radius:8px;

  box-shadow:
    0 0 18px
    rgba(255,59,212,.18);
}

.details p{

  color:#c1b5cc;

  line-height:1.55;

  font-size:13px;
}

.meta-line{

  color:var(--cyan);

  font-size:11px;

  letter-spacing:1px;
}


/* =========================================================
   SOURCES
   ========================================================= */

.source-list{

  margin-top:20px;
}

.source{

  display:block;

  width:100%;

  text-align:left;

  border:
    1px solid
    rgba(37,234,255,.18);

  background:
    linear-gradient(
      100deg,
      #140e29,
      #0d0a1d
    );

  color:#fff;

  padding:14px;

  margin-top:8px;

  border-radius:8px;

  transition:.2s;
}

.source:hover{

  border-color:
    var(--cyan);

  box-shadow:
    var(--shadow-cyan);
}

.source strong{

  display:block;

  color:#fff;
}

.source small{

  display:block;

  color:var(--muted);

  margin-top:5px;
}


/* =========================================================
   SETTINGS
   ========================================================= */

.field{

  margin:
    18px
    0;
}

.field label{

  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:10px;

  letter-spacing:2px;

  text-transform:uppercase;

  font-weight:bold;
}

.field input{

  width:100%;

  padding:14px;

  border-radius:7px;

  border:
    1px solid
    rgba(155,92,255,.3);

  background:#080612;

  color:#fff;

  outline:none;
}

.field input:focus{

  border-color:
    var(--pink);

  box-shadow:
    0 0 15px
    rgba(255,59,212,.12);
}

.notice{

  padding:14px;

  border:
    1px solid
    rgba(255,59,212,.15);

  border-radius:8px;

  background:
    rgba(255,59,212,.04);

  color:#b7aabd;

  font-size:12px;

  line-height:1.6;
}

.status{

  margin-top:13px;

  font-size:12px;
}


/* =========================================================
   PLAYER
   ========================================================= */

.player-wrap{

  background:#000;

  border-radius:9px;

  overflow:hidden;

  border:
    1px solid
    rgba(37,234,255,.22);

  box-shadow:
    0 0 30px
    rgba(37,234,255,.08);
}

video{

  display:block;

  width:100%;

  max-height:70vh;

  background:#000;
}

.player-info{

  padding:12px;

  background:#100b20;
}

.player-info strong{

  display:block;
}

.player-info small{

  color:var(--muted);
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty{

  padding:
    25px
    0;

  color:var(--muted);

  font-size:13px;
}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav{

  position:fixed;

  z-index:70;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  padding-bottom:
    env(safe-area-inset-bottom);

  display:flex;

  justify-content:
    space-around;

  align-items:center;

  background:
    rgba(8,6,18,.94);

  backdrop-filter:
    blur(20px);

  border-top:
    1px solid
    rgba(255,59,212,.2);
}

.nav-btn{

  background:none;

  border:0;

  color:#75687f;

  font-size:9px;

  letter-spacing:1px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:5px;
}

.nav-btn span{

  font-size:22px;
}

.nav-btn.active{

  color:var(--pink);

  text-shadow:
    0 0 10px
    var(--pink);
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media(min-width:700px){

  .grid{

    grid-template-columns:
      repeat(
        5,
        minmax(0,1fr)
      );
  }

  .hero{

    min-height:530px;
  }

  .details{

    grid-template-columns:
      190px 1fr;
  }

  .details img{

    width:190px;
  }
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media(max-width:430px){

  .header-actions{

    position:static;

    justify-content:center;

    margin-top:8px;
  }

  .logo{

    font-size:64px;
  }

  .hero{

    min-height:410px;

    padding:25px;
  }

  .hero h1{

    font-size:48px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
     ===================================================== -->

<header>

  <div class="logo-wrap">

    <div class="logo">
      SAUVE
    </div>

    <div class="logo-sub">
      CINEMA • TELEVISION • AFTER DARK
    </div>

  </div>


  <div class="header-actions">

    <button
      class="icon-btn"
      id="searchFocus">
      ⌕
    </button>

    <button
      class="icon-btn"
      id="settingsButton">
      ⚙
    </button>

  </div>


  <div class="search">

    <input
      id="searchInput"
      placeholder="Search movies & television"
      autocomplete="off">

    <button
      id="searchButton">
      SEARCH
    </button>

  </div>

</header>


<!-- =====================================================
     MAIN
     ===================================================== -->

<main id="main">


  <div class="hero">

    <div class="hero-content">

      <div class="kicker">
        Welcome to SAUVE
      </div>

      <h1>
        Cinema<br>
        After Dark
      </h1>

      <p>
        A neon-retro media experience powered
        by your metadata and your own compatible
        streaming addons.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          id="heroSearch">
          ▶ EXPLORE
        </button>

        <button
          class="secondary"
          id="heroSettings">
          ＋ ADD STREAM ADDON
        </button>

      </div>

    </div>

  </div>


  <section>

    <div class="section-heading">

      <h2>
        Trending
      </h2>

      <span>
        AIO METADATA
      </span>

    </div>

    <div
      id="trending"
      class="empty">

      Loading cinema…

    </div>

  </section>


  <section>

    <div class="section-heading">

      <h2>
        Television
      </h2>

      <span>
        SERIES
      </span>

    </div>

    <div
      id="series"
      class="empty">

      Loading television…

    </div>

  </section>


</main>


<!-- =====================================================
     NAVIGATION
     ===================================================== -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    data-page="home">

    <span>⌂</span>
    HOME

  </button>


  <button
    class="nav-btn"
    data-page="search">

    <span>⌕</span>
    SEARCH

  </button>


  <button
    class="nav-btn"
    data-page="library">

    <span>♡</span>
    LIBRARY

  </button>


  <button
    class="nav-btn"
    data-page="settings">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>


</div>


<!-- =====================================================
     MODAL
     ===================================================== -->

<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>


<script>

/* =========================================================
   SAUVE ENGINE
   ========================================================= */


/*
  Built-in metadata manifest.

  This is the metadata service you supplied
  previously.
*/

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";


/*
  Everything else is user-configurable.
*/

const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    "",

  favorites:
    JSON.parse(
      localStorage.getItem(
        "sauve_favorites"
      ) ||
      "[]"
    ),

  history:
    JSON.parse(
      localStorage.getItem(
        "sauve_history"
      ) ||
      "[]"
    )

};


/* =========================================================
   HELPERS
   ========================================================= */

const $ =
  selector =>
    document.querySelector(
      selector
    );


function escapeHTML(
  value=""
){

  return String(value)
    .replace(
      /[&<>"']/g,

      character => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[character])

    );

}


async function getJSON(
  url
){

  const response =
    await fetch(
      url,
      {
        headers:{
          "Accept":
            "application/json"
        }
      }
    );


  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  return response.json();

}


/*
  Convert:

  https://example.com/stremio/xxx/manifest.json

  into:

  https://example.com/stremio/xxx/
*/

function addonBase(
  manifest
){

  return manifest
    .replace(
      /\/manifest\.json(?:\?.*)?$/i,
      "/"
    );

}


/* =========================================================
   STREMIO RESOURCE URL
   ========================================================= */

function resourceURL(
  manifest,
  resource,
  type,
  id
){

  return (

    addonBase(
      manifest
    ) +

    resource +
    "/" +

    encodeURIComponent(
      type
    ) +

    "/" +

    encodeURIComponent(
      id
    ) +

    ".json"

  );

}


/* =========================================================
   POSTER
   ========================================================= */

function getPoster(
  item
){

  return (
    item?.poster ||
    item?.logo ||
    ""
  );

}


/* =========================================================
   CARD
   ========================================================= */

function cardHTML(
  item
){

  return `

    <button
      class="card"
      data-id="${escapeHTML(
        item.id ||
        ""
      )}"
      data-type="${escapeHTML(
        item.type ||
        "movie"
      )}">

      <img
        class="poster"
        src="${escapeHTML(
          getPoster(item)
        )}"
        loading="lazy">

      <div class="card-info">

        <div class="card-title">
          ${escapeHTML(
            item.name ||
            "Untitled"
          )}
        </div>

        <div class="card-sub">
          ${escapeHTML(
            item.releaseInfo ||
            item.year ||
            ""
          )}
        </div>

      </div>

    </button>

  `;

}


/* =========================================================
   GRID
   ========================================================= */

function gridHTML(
  items=[]
){

  if(!items.length){

    return `
      <div class="empty">
        Nothing found.
      </div>
    `;

  }


  return `

    <div class="grid">

      ${items
        .map(cardHTML)
        .join("")}

    </div>

  `;

}


/* =========================================================
   CATALOG
   ========================================================= */

async function catalog(
  id,
  type,
  extra=""
){

  let url =
    resourceURL(
      state.metadata,
      "catalog",
      type,
      id
    );


  if(extra){

    url +=
      "?" +
      extra;

  }


  return getJSON(
    url
  );

}


/* =========================================================
   HOME
   ========================================================= */

async function loadHome(){

  try{

    /*
      We first try the common AIO catalog.
      If the supplied metadata addon uses
      a different catalog ID, the settings
      screen can still be used and the
      search/details layer remains modular.
    */

    const result =
      await catalog(
        "tmdb.trending",
        "movie"
      );


    $("#trending")
      .innerHTML =
      gridHTML(
        result.metas ||
        []
      );

  }
  catch(error){

    $("#trending")
      .innerHTML = `

        <div class="empty">

          Metadata connection needs
          configuration/testing.

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

  }


  try{

    const result =
      await catalog(
        "tmdb.trending",
        "series"
      );


    $("#series")
      .innerHTML =
      gridHTML(
        result.metas ||
        []
      );

  }
  catch(error){

    $("#series")
      .innerHTML = `

        <div class="empty">

          Television catalog unavailable.

        </div>

      `;

  }

}


/* =========================================================
   SEARCH
   ========================================================= */

async function search(
  query
){

  $("#main")
    .innerHTML = `

      <section>

        <div class="section-heading">

          <h2>
            Search
          </h2>

          <span>
            ${escapeHTML(query)}
          </span>

        </div>

        <div
          id="searchResults"
          class="empty">

          Searching…

        </div>

      </section>

    `;


  try{

    /*
      Search catalogs vary between addons.
      We try the standard search resources.
    */

    const movieURL =
      resourceURL(
        state.metadata,
        "catalog",
        "movie",
        "search"
      ) +
      "?search=" +
      encodeURIComponent(
        query
      );


    const seriesURL =
      resourceURL(
        state.metadata,
        "catalog",
        "series",
        "search"
      ) +
      "?search=" +
      encodeURIComponent(
        query
      );


    const [
      movies,
      series
    ] =
      await Promise.all([
        getJSON(movieURL),
        getJSON(seriesURL)
      ]);


    const results = [

      ...(movies.metas || []),

      ...(series.metas || [])

    ];


    $("#searchResults")
      .innerHTML =
      gridHTML(
        results
      );

  }
  catch(error){

    $("#searchResults")
      .innerHTML = `

        <div class="empty">

          Search unavailable.

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

  }

}


/* =========================================================
   DETAILS
   ========================================================= */

async function openDetails(
  type,
  id
){

  openModal(`

    <div class="empty">
      Loading title…
    </div>

  `);


  try{

    const result =
      await getJSON(

        resourceURL(
          state.metadata,
          "meta",
          type,
          id
        )

      );


    const item =
      result.meta ||
      result;


    const saved =
      state.favorites
        .includes(id);


    openModal(`

      <div class="sheet-header">

        <h2>
          ${escapeHTML(
            item.name ||
            "Title"
          )}
        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>


      <div class="details">

        <img
          src="${escapeHTML(
            getPoster(item)
          )}">


        <div>

          <div class="meta-line">

            ${escapeHTML(
              item.releaseInfo ||
              item.year ||
              ""
            )}

          </div>


          <p>

            ${escapeHTML(
              item.description ||
              "No description available."
            )}

          </p>


          <div class="hero-buttons">

            <button
              class="primary"
              id="playTitle">

              ▶ FIND SOURCES

            </button>


            <button
              class="secondary"
              id="favoriteTitle">

              ${saved
                ? "♥ SAVED"
                : "♡ SAVE"}

            </button>

          </div>

        </div>

      </div>


      <div
        id="sourceArea"
        class="source-list">

      </div>

    `);


    $("#playTitle")
      .onclick =
      () =>
        findStreams(
          type,
          id
        );


    $("#favoriteTitle")
      .onclick =
      () =>
        toggleFavorite(
          id
        );


    /*
      If metadata supplies episodes,
      display them.
    */

    if(
      item.videos &&
      item.videos.length
    ){

      const sourceArea =
        $("#sourceArea");


      sourceArea.innerHTML = `

        <section>

          <div class="section-heading">

            <h2>
              Episodes
            </h2>

          </div>

          ${item.videos
            .map(
              episode => `

                <button
                  class="source"
                  data-episode="${escapeHTML(
                    episode.id
                  )}">

                  <strong>

                    ${escapeHTML(
                      episode.name ||
                      episode.title ||
                      "Episode"
                    )}

                  </strong>

                  <small>

                    ${
                      episode.season
                        ? "Season " +
                          escapeHTML(
                            episode.season
                          )
                        : ""
                    }

                    ${
                      episode.episode
                        ? " • Episode " +
                          escapeHTML(
                            episode.episode
                          )
                        : ""
                    }

                  </small>

                </button>

              `
            )
            .join("")}

        </section>

      `;


      sourceArea
        .querySelectorAll(
          "[data-episode]"
        )
        .forEach(
          button => {

            button.onclick =
              () =>
                findStreams(
                  "series",
                  button.dataset
                    .episode
                );

          }
        );

    }

  }
  catch(error){

    openModal(`

      <div class="sheet-header">

        <h2>
          SAUVE
        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>

      <div class="notice">

        Unable to load this title.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `);

  }

}


/* =========================================================
   STREAM DISCOVERY
   ========================================================= */

async function findStreams(
  type,
  id
){

  if(
    !state.stream
  ){

    openModal(`

      <div class="sheet-header">

        <h2>
          ADD STREAM ADDON
        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>


      <div class="notice">

        SAUVE doesn't contain a private
        stream configuration.

        <br><br>

        Paste your own compatible
        PenguPlay/HTTP addon manifest
        into Settings.

      </div>


      <div class="hero-buttons">

        <button
          class="primary"
          onclick="settings()">

          ⚡ OPEN SETTINGS

        </button>

      </div>

    `);

    return;

  }


  openModal(`

    <div class="sheet-header">

      <h2>
        SOURCES
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div
      id="sources"
      class="empty">

      Contacting stream addon…

    </div>

  `);


  try{

    const url =
      resourceURL(
        state.stream,
        "stream",
        type,
        id
      );


    const result =
      await getJSON(
        url
      );


    const streams =
      result.streams ||
      [];


    if(!streams.length){

      $("#sources")
        .innerHTML = `

          <div class="empty">

            No streams were returned
            for this title.

          </div>

        `;

      return;

    }


    $("#sources")
      .innerHTML =

      streams
        .map(
          (stream,index) => {

            const url =
              stream.url ||
              "";


            return `

              <button
                class="source"
                data-url="${escapeHTML(
                  url
                )}">

                <strong>

                  ${escapeHTML(
                    stream.name ||
                    stream.title ||
                    "SOURCE " +
                    (index + 1)
                  )}

                </strong>

                <small>

                  ${escapeHTML(
                    stream.description ||
                    stream.quality ||
                    stream.type ||
                    "HTTP source"
                  )}

                </small>

              </button>

            `;

          }
        )
        .join("");


    $("#sources")
      .querySelectorAll(
        "[data-url]"
      )
      .forEach(
        button => {

          button.onclick =
            () =>
              playStream(
                button.dataset
                  .url
              );

        }
      );

  }
  catch(error){

    $("#sources")
      .innerHTML = `

        <div class="notice">

          Stream addon request failed.

          <br><br>

          ${escapeHTML(
            error.message
          )}

          <br><br>

          If the addon works in Stremio
          but not here, it may require
          CORS or a native Stremio
          playback environment.

        </div>

      `;

  }

}


/* =========================================================
   PLAYER
   ========================================================= */

function playStream(
  url
){

  if(!url){

    alert(
      "The addon did not return a playable URL."
    );

    return;

  }


  /*
    SAUVE accepts HTTP/HTTPS URLs.

    It does not attempt to bypass
    authentication, DRM, CORS,
    provider restrictions, or
    unsupported protocols.
  */

  if(
    !/^https?:\/\//i.test(
      url
    )
  ){

    openModal(`

      <div class="sheet-header">

        <h2>
          EXTERNAL SOURCE
        </h2>

        <button
          class="close"
          onclick="closeModal()">

          ×

        </button>

      </div>


      <div class="notice">

        This source uses a protocol
        that the iPhone browser cannot
        directly play.

      </div>


      <div class="hero-buttons">

        <button
          class="primary"
          onclick="
            location.href='${escapeHTML(
              url
            )}'
          ">

          OPEN SOURCE

        </button>

      </div>

    `);

    return;

  }


  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="player-wrap">

      <video
        controls
        playsinline
        autoplay
        src="${escapeHTML(
          url
        )}">

      </video>


      <div class="player-info">

        <strong>
          SAUVE PLAYER
        </strong>

        <small>
          HTTP / browser-compatible source
        </small>

      </div>

    </div>

  `);

}


/* =========================================================
   FAVORITES
   ========================================================= */

function toggleFavorite(
  id
){

  if(
    state.favorites
      .includes(id)
  ){

    state.favorites =
      state.favorites.filter(
        item =>
          item !== id
      );

  }
  else{

    state.favorites.push(
      id
    );

  }


  localStorage.setItem(
    "sauve_favorites",
    JSON.stringify(
      state.favorites
    )
  );


  closeModal();

}


/* =========================================================
   SETTINGS
   ========================================================= */

function settings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>


    <div class="field">

      <label>
        Your PenguPlay / HTTP Stream Manifest
      </label>

      <input
        id="streamURL"
        placeholder="Paste your own configured manifest URL"
        value="${escapeHTML(
          state.stream
        )}">

    </div>


    <div class="notice">

      <strong>
        YOUR STREAM ADDON
      </strong>

      <br><br>

      Paste the manifest URL generated
      by your compatible addon.

      <br><br>

      SAUVE stores this setting locally
      on this device. It does not embed
      someone else's private configuration
      into the application.

    </div>


    <div class="hero-buttons">

      <button
        class="primary"
        id="saveSettings">

        ✓ SAVE & TEST

      </button>


      <button
        class="secondary"
        id="disconnect">

        DISCONNECT

      </button>

    </div>


    <div
      id="settingsStatus"
      class="status">

    </div>

  `);


  $("#saveSettings")
    .onclick =
    async () => {

      const metadata =
        $("#metadataURL")
          .value
          .trim();


      const stream =
        $("#streamURL")
          .value
          .trim();


      if(!metadata){

        $("#settingsStatus")
          .textContent =
          "Enter a metadata manifest.";

        return;

      }


      $("#settingsStatus")
        .textContent =
        "Testing connection…";


      try{

        await getJSON(
          metadata
        );


        if(stream){

          await getJSON(
            stream
          );

        }


        state.metadata =
          metadata;

        state.stream =
          stream;


        localStorage.setItem(
          "sauve_metadata",
          metadata
        );


        if(stream){

          localStorage.setItem(
            "sauve_stream",
            stream
          );

        }
        else{

          localStorage.removeItem(
            "sauve_stream"
          );

        }


        $("#settingsStatus")
          .innerHTML = `

            <span
              style="
                color:#25eaff;
                text-shadow:
                  0 0 8px #25eaff;
              ">

              ✓ SAUVE CONNECTED

            </span>

          `;


        setTimeout(
          () => {

            closeModal();

            loadHome();

          },
          700
        );

      }
      catch(error){

        $("#settingsStatus")
          .innerHTML = `

            <span
              style="
                color:#ff5bd8;
              ">

              CONNECTION FAILED

              <br>

              ${escapeHTML(
                error.message
              )}

            </span>

          `;

      }

    };


  $("#disconnect")
    .onclick =
    () => {

      state.stream =
        "";

      localStorage.removeItem(
        "sauve_stream"
      );

      settings();

    };

}


/* =========================================================
   MODAL
   ========================================================= */

function openModal(
  html
){

  $("#sheet")
    .innerHTML =
    html;

  $("#modal")
    .classList
    .add("open");

}


function closeModal(){

  $("#modal")
    .classList
    .remove("open");

  $("#sheet")
    .innerHTML =
    "";

}


/* =========================================================
   SEARCH
   ========================================================= */

$("#searchButton")
  .onclick =
  () => {

    const query =
      $("#searchInput")
        .value
        .trim();


    if(query){

      search(
        query
      );

    }

  };


$("#searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        $("#searchButton")
          .click();

      }

    }
  );


$("#searchFocus")
  .onclick =
  () =>
    $("#searchInput")
      .focus();


$("#heroSearch")
  .onclick =
  () =>
    $("#searchInput")
      .focus();


$("#heroSettings")
  .onclick =
  settings;


$("#settingsButton")
  .onclick =
  settings;


/* =========================================================
   CARD CLICK
   ========================================================= */

document.addEventListener(
  "click",
  event => {

    const card =
      event.target.closest(
        ".card"
      );


    if(!card){

      return;

    }


    openDetails(
      card.dataset.type,
      card.dataset.id
    );

  }
);


/* =========================================================
   MODAL BACKDROP
   ========================================================= */

$("#modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


/* =========================================================
   NAVIGATION
   ========================================================= */

document
  .querySelectorAll(
    ".nav-btn"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          document
            .querySelectorAll(
              ".nav-btn"
            )
            .forEach(
              item =>
                item.classList
                  .remove(
                    "active"
                  )
            );


          button.classList
            .add(
              "active"
            );


          if(
            button.dataset.page ===
            "home"
          ){

            location.reload();

          }


          if(
            button.dataset.page ===
            "search"
          ){

            $("#searchInput")
              .focus();

          }


          if(
            button.dataset.page ===
            "settings"
          ){

            settings();

          }


          if(
            button.dataset.page ===
            "library"
          ){

            $("#main")
              .innerHTML = `

                <section>

                  <div
                    class="section-heading">

                    <h2>
                      Library
                    </h2>

                    <span>
                      SAVED TITLES
                    </span>

                  </div>


                  <div
                    class="empty">

                    Your saved titles
                    will appear here.

                  </div>

                </section>

              `;

          }

        };

    }
  );


/* =========================================================
   START
   ========================================================= */

loadHome();

</script>

</html>

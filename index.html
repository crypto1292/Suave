<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#150b25;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --text:#fff;
  --muted:#9d91a6;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#05030b;
}

body{
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -10%,rgba(138,77,255,.38),transparent 35%),
    radial-gradient(circle at 0 30%,rgba(255,22,216,.12),transparent 30%),
    radial-gradient(circle at 100% 50%,rgba(25,234,255,.10),transparent 30%),
    #05030b;
}

button,input{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}

header{
  position:sticky;
  top:0;
  z-index:100;
  padding:calc(10px + env(safe-area-inset-top)) 14px 14px;
  background:rgba(5,3,11,.94);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-bottom:1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-style:italic;
  font-size:clamp(68px,19vw,120px);
  line-height:.78;
  letter-spacing:7px;
  transform:skewX(-7deg);
  color:white;
  text-shadow:
    0 0 4px white,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;
  text-align:center;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:8px;
  background:#0c0715;
  color:white;
  border:1px solid rgba(138,77,255,.45);
  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);
  box-shadow:0 0 18px rgba(255,22,216,.18);
}

.searchbar button{
  padding:0 18px;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}

main{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:16px 16px 110px;
}

.hero{
  position:relative;
  min-height:clamp(400px,58vh,620px);
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  padding:clamp(25px,5vw,60px);
  border-radius:18px;
  border:1px solid rgba(255,22,216,.25);
  background:
    radial-gradient(circle at 75% 30%,rgba(25,234,255,.18),transparent 25%),
    radial-gradient(circle at 75% 75%,rgba(255,22,216,.25),transparent 35%),
    linear-gradient(110deg,#090511,#190c2e,#07121e);
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(5,3,11,.98),rgba(5,3,11,.72) 48%,rgba(5,3,11,.05));
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.08;
  background:repeating-linear-gradient(
    0deg,
    transparent 0,
    transparent 3px,
    rgba(255,255,255,.18) 4px
  );
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:clamp(46px,9vw,95px);
  line-height:.85;
  text-transform:uppercase;
  text-shadow:0 0 20px rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;
  line-height:1.6;
  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,.secondary{
  padding:13px 18px;
  border-radius:8px;
  font-weight:900;
}

.primary{
  border:0;
  color:white;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:0 0 18px rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);
  background:rgba(25,234,255,.04);
  border:1px solid rgba(25,234,255,.38);
}

.catalog-section{
  margin:30px 0 0;
}

.catalog-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:9px;
  border-bottom:1px solid rgba(255,22,216,.15);
}

.catalog-title{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:25px;
  letter-spacing:1px;
}

.catalog-label{
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.row{
  display:flex;
  gap:13px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 1px 12px;
  scroll-snap-type:x proximity;
  scrollbar-width:none;
}

.row::-webkit-scrollbar{display:none}

.poster-card{
  position:relative;
  flex:0 0 145px;
  overflow:hidden;
  border:0;
  padding:0;
  text-align:left;
  color:white;
  background:#10091c;
  border-radius:8px;
  scroll-snap-align:start;
  box-shadow:0 7px 22px rgba(0,0,0,.32);
  transition:transform .18s ease,box-shadow .18s ease;
}

.poster-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 30px rgba(255,22,216,.20);
}

.poster-card img{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#171027;
}

.poster-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:38px 9px 9px;
  background:linear-gradient(transparent,rgba(0,0,0,.94));
}

.poster-name{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.poster-year{
  margin-top:3px;
  color:#bdb0c6;
  font-size:9px;
}

.poster-type{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,.72);
  color:var(--cyan);
  font-size:7px;
  font-weight:900;
  letter-spacing:1px;
}

.poster-score{
  position:absolute;
  right:7px;
  top:7px;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,.78);
  color:var(--yellow);
  font-size:8px;
  font-weight:900;
}

.mdb-source{
  margin-bottom:24px;
}

.mdb-source .catalog-heading{
  border-bottom-color:rgba(138,77,255,.35);
}

.mdb-pill{
  color:#ff7be4;
  border:1px solid rgba(255,22,216,.25);
  padding:4px 7px;
  border-radius:5px;
  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
}

.empty{
  padding:28px 5px;
  color:var(--muted);
  font-size:13px;
}

.notice{
  padding:16px;
  border-radius:9px;
  background:rgba(255,22,216,.045);
  border:1px solid rgba(255,22,216,.17);
  color:#c8bacf;
  line-height:1.6;
  font-size:12px;
}

.error-box{
  padding:16px;
  border-radius:9px;
  background:rgba(255,85,119,.06);
  border:1px solid rgba(255,85,119,.3);
  color:#ffc0cb;
  line-height:1.6;
  font-size:12px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{display:flex}

.sheet{
  width:100%;
  max-height:95vh;
  overflow:auto;
  padding:20px 18px calc(30px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;
  background:
    radial-gradient(circle at 50% 0,rgba(138,77,255,.18),transparent 40%),
    #0c0718;
  border-top:1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:27px;
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#170d27;
  color:var(--cyan);
  border:1px solid rgba(25,234,255,.3);
  font-size:22px;
}

.details{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:16px;
}

.details img{
  width:105px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:8px;
}

.details p{
  color:#c3b5cb;
  line-height:1.55;
  font-size:13px;
}

.meta{
  color:var(--cyan);
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:7px;
}

.source{
  width:100%;
  margin-top:9px;
  padding:14px;
  text-align:left;
  color:white;
  border-radius:9px;
  background:linear-gradient(100deg,#150c29,#0d0819);
  border:1px solid rgba(25,234,255,.15);
}

.source:hover{
  border-color:var(--cyan);
  box-shadow:0 0 16px rgba(25,234,255,.14);
}

.source-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border-radius:50%;
  color:var(--cyan);
  background:rgba(25,234,255,.08);
}

.source-name{font-weight:900}

.provider{
  margin-top:4px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.badges{
  margin-top:8px;
}

.badge{
  display:inline-block;
  padding:4px 7px;
  margin-right:5px;
  margin-bottom:4px;
  border-radius:5px;
  background:rgba(255,22,216,.10);
  color:#ff7be4;
  font-size:8px;
  font-weight:900;
  letter-spacing:.7px;
}

.badge.good{
  background:rgba(66,255,176,.10);
  color:var(--green);
}

.badge.warning{
  background:rgba(255,212,90,.10);
  color:var(--yellow);
}

.badge.blue{
  background:rgba(25,234,255,.10);
  color:var(--cyan);
}

.source-desc{
  margin-top:7px;
  color:#91859b;
  font-size:10px;
}

.player-shell{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:12px;
  background:#000;
  border:1px solid rgba(25,234,255,.25);
  box-shadow:0 0 30px rgba(25,234,255,.08);
}

video{
  display:block;
  width:100%;
  max-height:70vh;
  background:#000;
}

.iframe-player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

.player-status{
  padding:11px 13px;
  background:#0e0818;
  border-top:1px solid rgba(255,255,255,.07);
  color:#aaa;
  font-size:11px;
}

.player-status.ready{color:var(--green)}
.player-status.error{color:var(--red)}

.player-controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.player-button{
  padding:10px 13px;
  border-radius:7px;
  color:white;
  background:#170d27;
  border:1px solid rgba(255,255,255,.1);
  font-weight:800;
  font-size:11px;
}

.player-button.primary{
  background:linear-gradient(135deg,var(--pink),var(--purple));
  border:0;
}

.field{
  margin:18px 0;
}

.field label{
  display:block;
  margin-bottom:8px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.field input{
  width:100%;
  padding:13px;
  border-radius:7px;
  background:#080510;
  color:white;
  border:1px solid rgba(138,77,255,.3);
  outline:none;
}

.list-editor{
  border:1px solid rgba(138,77,255,.25);
  background:rgba(138,77,255,.045);
  border-radius:10px;
  padding:12px;
  margin:10px 0;
}

.list-editor input{
  margin-bottom:8px;
}

.remove-list{
  padding:8px 10px;
  border-radius:6px;
  border:1px solid rgba(255,85,119,.3);
  background:rgba(255,85,119,.08);
  color:#ff9caf;
  font-size:10px;
  font-weight:900;
}

.add-list{
  padding:10px 13px;
  border-radius:7px;
  border:1px solid rgba(25,234,255,.3);
  background:rgba(25,234,255,.06);
  color:var(--cyan);
  font-weight:900;
  font-size:11px;
}

.nav{
  position:fixed;
  z-index:400;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(8,5,17,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;
  background:none;
  color:#766a80;
  font-size:9px;
  letter-spacing:1px;
}

.nav button span{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);
  text-shadow:0 0 10px var(--pink);
}

@media(min-width:700px){
  .poster-card{flex-basis:180px}
  .details{grid-template-columns:190px 1fr}
  .details img{width:190px}
  .hero{min-height:580px}
}
</style>
</head>

<body>

<header>
  <div class="logo">SAUVE</div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">
    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">
    <button id="searchButton">SEARCH</button>
  </div>
</header>

<main id="main">

  <div class="hero">
    <div class="hero-content">
      <div class="hero-kicker">WELCOME TO SAUVE</div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Discover movies and television, browse your catalogs,
        explore MDBList collections, find available sources
        and play compatible streams directly inside SAUVE.
      </p>

      <div class="hero-buttons">
        <button class="primary" onclick="focusSearch()">⌕ SEARCH</button>
        <button class="secondary" onclick="openSettings()">⚙ SETTINGS</button>
      </div>
    </div>
  </div>

  <div id="catalogContainer">
    <div class="empty">Loading SAUVE…</div>
  </div>

</main>

<nav class="nav">
  <button class="active" onclick="goHome()">
    <span>⌂</span>
    HOME
  </button>

  <button onclick="focusSearch()">
    <span>⌕</span>
    SEARCH
  </button>

  <button onclick="openSettings()">
    <span>⚙</span>
    SETTINGS
  </button>
</nav>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>

/* ============================================================
   SAUVE CONFIG
============================================================ */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const state = {

  metadata:
    localStorage.getItem("sauve_metadata") ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem("sauve_stream") ||
    "",

  mdbKey:
    localStorage.getItem("sauve_mdb_key") ||
    "",

  mdbLists:
    loadStoredLists()

};

let currentStreams = [];
let currentPlayableStreams = [];
let currentPlayerIndex = 0;


/* ============================================================
   HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value=""){
  return String(value)
    .replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));
}

function loadStoredLists(){

  try{

    const value =
      JSON.parse(
        localStorage.getItem("sauve_mdb_lists") ||
        "[]"
      );

    return Array.isArray(value)
      ? value
      : [];

  }catch{

    return [];

  }

}

function saveStoredLists(){

  localStorage.setItem(
    "sauve_mdb_lists",
    JSON.stringify(
      state.mdbLists
    )
  );

}

function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(/\/manifest\.json\/?$/i,"");

}

function addonRoot(url){

  return normalizeManifest(url) + "/";
}

async function fetchJSON(url,options={}){

  const response =
    await fetch(
      url,
      {
        ...options,
        headers:{
          Accept:"application/json",
          ...(options.headers || {})
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " + response.status
    );

  }

  return response.json();

}


/* ============================================================
   MDBLIST
============================================================ */

const MDB_API =
  "https://api.mdblist.com";


function parseMDBListURL(input){

  const raw =
    String(input || "")
      .trim();

  if(!raw){

    return null;

  }

  /*
    Supports:

    https://mdblist.com/lists/user/slug
    https://www.mdblist.com/lists/user/slug
    /lists/user/slug
    direct numeric IDs
  */

  if(/^\d+$/.test(raw)){

    return {
      id:raw,
      slug:raw,
      type:"user"
    };

  }

  let url;

  try{

    url =
      new URL(
        raw.startsWith("http")
          ? raw
          : "https://" + raw
      );

  }catch{

    return null;

  }

  const parts =
    url.pathname
      .split("/")
      .filter(Boolean);

  const index =
    parts.indexOf("lists");

  if(index < 0){

    return null;

  }

  const after =
    parts.slice(
      index + 1
    );

  if(!after.length){

    return null;

  }

  /*
    Official lists:
    /lists/official/movies/slug

    Normal lists:
    /lists/username/slug
  */

  if(after[0] === "official"){

    return {
      type:"official",
      slug:
        after
          .slice(1)
          .join("/")
    };

  }

  return {
    type:"user",
    username:after[0],
    slug:after.slice(1).join("/")
  };

}


function buildMDBEndpoints(
  list
){

  const parsed =
    parseMDBListURL(
      list.url
    );

  if(!parsed){

    return [];

  }

  const encodedKey =
    encodeURIComponent(
      state.mdbKey
    );

  const endpoints = [];

  /*
    Current official-list endpoint.
  */

  if(
    parsed.type === "official"
  ){

    endpoints.push(
      `${MDB_API}/lists/official/${encodeURIComponent(parsed.slug)}/items?limit=1000&apikey=${encodedKey}`
    );

    endpoints.push(
      `${MDB_API}/lists/official/${encodeURIComponent(parsed.slug)}?append_to_response=items&apikey=${encodedKey}`
    );

  }
  else{

    /*
      Current user list endpoint.
      MDBList's API accepts list identifiers
      through the /lists endpoint.
    */

    const username =
      parsed.username || "";

    const slug =
      parsed.slug || "";

    endpoints.push(
      `${MDB_API}/lists/${encodeURIComponent(username)}/${encodeURIComponent(slug)}/items?limit=1000&apikey=${encodedKey}`
    );

    endpoints.push(
      `${MDB_API}/lists/${encodeURIComponent(username)}/${encodeURIComponent(slug)}?append_to_response=items&apikey=${encodedKey}`
    );

  }

  return endpoints;

}


function extractMDBItems(data){

  if(!data){

    return [];

  }

  if(
    Array.isArray(data)
  ){

    return data;

  }

  if(
    Array.isArray(data.items)
  ){

    return data.items;

  }

  if(
    Array.isArray(data.metas)
  ){

    return data.metas;

  }

  if(
    Array.isArray(data.results)
  ){

    return data.results;

  }

  if(
    data.data &&
    Array.isArray(data.data.items)
  ){

    return data.data.items;

  }

  if(
    data.data &&
    Array.isArray(data.data)
  ){

    return data.data;

  }

  return [];

}


function normalizeMDBItem(
  item
){

  const obj =
    item || {};

  const nested =
    obj.movie ||
    obj.show ||
    obj.media ||
    obj.meta ||
    obj;

  let type =
    nested.type ||
    obj.mediatype ||
    obj.media_type ||
    obj.type ||
    "";

  type =
    String(type)
      .toLowerCase();

  if(
    type === "tv"
  ){

    type = "series";

  }

  if(
    type === "show"
  ){

    type = "series";

  }

  if(
    !["movie","series"].includes(type)
  ){

    if(
      nested.first_air_date ||
      nested.tvdb_id
    ){

      type = "series";

    }
    else{

      type = "movie";

    }

  }

  const tmdb =
    nested.tmdb_id ||
    nested.tmdb ||
    obj.tmdb_id ||
    obj.tmdb ||
    null;

  const imdb =
    nested.imdb_id ||
    nested.imdb ||
    obj.imdb_id ||
    obj.imdb ||
    "";

  const tvdb =
    nested.tvdb_id ||
    nested.tvdb ||
    obj.tvdb_id ||
    obj.tvdb ||
    "";

  const id =
    tmdb
      ? String(tmdb)
      : imdb
        ? String(imdb)
        : tvdb
          ? String(tvdb)
          : String(
              nested.id ||
              obj.id ||
              ""
            );

  const name =
    nested.title ||
    nested.name ||
    obj.title ||
    obj.name ||
    "Untitled";

  const poster =
    nested.poster ||
    nested.poster_url ||
    obj.poster ||
    obj.poster_url ||
    "";

  const year =
    nested.year ||
    obj.year ||
    (
      nested.release_date
        ? String(
            nested.release_date
          ).slice(0,4)
        : ""
    ) ||
    (
      nested.first_air_date
        ? String(
            nested.first_air_date
          ).slice(0,4)
        : ""
    );

  const rating =
    nested.score ??
    nested.rating ??
    obj.score ??
    obj.rating ??
    "";

  return {

    id,

    type,

    name,

    poster,

    year,

    rating,

    imdb_id:imdb,

    tmdb_id:tmdb,

    tvdb_id:tvdb

  };

}


async function fetchMDBList(
  list
){

  if(!state.mdbKey){

    throw new Error(
      "MDBList API key has not been entered in Settings."
    );

  }

  const parsed =
    parseMDBListURL(
      list.url
    );

  if(!parsed){

    throw new Error(
      "Invalid MDBList URL. Use a URL such as https://mdblist.com/lists/username/list-name"
    );

  }

  const endpoints =
    buildMDBEndpoints(
      list
    );

  let lastError =
    null;

  for(
    const endpoint
    of endpoints
  ){

    try{

      const first =
        await fetchJSON(
          endpoint
        );

      let items =
        extractMDBItems(
          first
        );

      /*
        Cursor pagination.

        MDBList recommends cursor pagination
        for current list integrations.
      */

      let cursor =
        first?.pagination?.next_cursor ||
        first?.next_cursor ||
        null;

      let loops = 0;

      while(
        cursor &&
        loops < 10 &&
        items.length < 1000
      ){

        loops++;

        const nextURL =
          new URL(
            endpoint
          );

        nextURL.searchParams.set(
          "cursor",
          cursor
        );

        nextURL.searchParams.set(
          "limit",
          "1000"
        );

        const next =
          await fetchJSON(
            nextURL.toString()
          );

        items.push(
          ...extractMDBItems(
            next
          )
        );

        cursor =
          next?.pagination?.next_cursor ||
          next?.next_cursor ||
          null;

        if(
          next?.pagination?.has_more === false
        ){

          cursor = null;

        }

      }

      const normalized =
        items
          .map(
            normalizeMDBItem
          )
          .filter(
            item =>
              item.id &&
              item.name
          );

      if(
        normalized.length
      ){

        return {
          items:
            dedupeMetas(
              normalized
            ),
          raw:first
        };

      }

      /*
        The endpoint worked but returned no
        usable media objects. Try the next
        supported response shape.
      */

      lastError =
        new Error(
          "MDBList responded normally, but no usable movie or TV items were returned."
        );

    }
    catch(error){

      lastError =
        error;

    }

  }

  throw (
    lastError ||
    new Error(
      "MDBList could not be loaded."
    )
  );

}


/* ============================================================
   MDBLIST ROWS
============================================================ */

async function loadMDBRows(){

  const container =
    $("mdbContainer");

  if(!container){

    return;

  }

  if(
    !state.mdbKey ||
    !state.mdbLists.length
  ){

    container.innerHTML = "";

    return;

  }

  container.innerHTML =
    state.mdbLists
      .map(
        list =>
          `
          <section
            class="catalog-section mdb-source"
            id="mdb-${escapeHTML(list.id)}">

            <div class="catalog-heading">

              <h2 class="catalog-title">
                ${escapeHTML(
                  list.name ||
                  "MDBLIST"
                )}
              </h2>

              <span class="mdb-pill">
                MDBLIST
              </span>

            </div>

            <div class="row">

              <div class="empty">
                Loading list…
              </div>

            </div>

          </section>
          `
      )
      .join("");

  /*
    Load every configured list independently.
    One broken list no longer prevents the
    other rows or homepage from rendering.
  */

  await Promise.all(
    state.mdbLists.map(
      async list => {

        const section =
          document.getElementById(
            "mdb-" + list.id
          );

        if(!section){

          return;

        }

        const row =
          section.querySelector(
            ".row"
          );

        try{

          const result =
            await fetchMDBList(
              list
            );

          const items =
            result.items
              .slice(
                0,
                Number(
                  list.limit || 40
                )
              );

          if(!items.length){

            row.innerHTML = `
              <div class="empty">
                This MDBList contains no usable movie or TV items.
              </div>
            `;

            return;

          }

          row.innerHTML =
            items
              .map(
                renderPosterCard
              )
              .join("");

        }
        catch(error){

          row.innerHTML = `
            <div class="error-box">

              <strong>
                MDBLIST COULD NOT BE LOADED
              </strong>

              <br><br>

              ${escapeHTML(
                error.message
              )}

              <br><br>

              Check the list URL and API key
              in Settings.

            </div>
          `;

        }

      }
    )
  );

}

============================================================ */

function supportsSearch(
  catalog
){

  if(
    !Array.isArray(
      catalog.extra
    )
  ){

    return false;

  }

  return catalog.extra.some(
    extra =>
      typeof extra === "string"
        ? extra === "search"
        : extra &&
          extra.name === "search"
  );

}


function makeExtraProps(
  values
){

  return Object.entries(
    values
  )
    .filter(
      ([,value]) =>
        value !== undefined &&
        value !== null &&
        String(value).length
    )
    .map(
      ([key,value]) =>
        key +
        "=" +
        encodeURIComponent(
          String(value)
        )
    )
    .join("&");

}


function buildCatalogURL(
  catalog,
  extra={}
){

  let url =
    addonRoot(
      state.metadata
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );

  const props =
    makeExtraProps(
      extra
    );

  if(props){

    url +=
      "/" +
      props;

  }

  return url + ".json";

}


function prettyCatalogName(
  catalog
){

  const raw =
    String(
      catalog.name ||
      catalog.id ||
      "CATALOG"
    );

  const lower =
    raw.toLowerCase();

  const mappings = [

    ["netflix","NETFLIX"],
    ["disney+","DISNEY+"],
    ["disney","DISNEY+"],
    ["apple tv","APPLE TV+"],
    ["apple","APPLE TV+"],
    ["hbo","HBO"],
    ["max","MAX"],
    ["hulu","HULU"],
    ["prime","PRIME VIDEO"],
    ["amazon","PRIME VIDEO"],
    ["paramount","PARAMOUNT+"],
    ["peacock","PEACOCK"],
    ["marvel","MARVEL"],
    ["dc","DC"],
    ["popular","POPULAR"],
    ["trending","TRENDING"],
    ["featured","FEATURED"],
    ["top","TOP PICKS"],
    ["new","NEW RELEASES"]

  ];

  for(
    const [needle,label]
    of mappings
  ){

    if(
      lower.includes(
        needle
      )
    ){

      return label;

    }

  }

  return raw.toUpperCase();

}


function catalogPriority(
  catalog
){

  const name =
    String(
      catalog.name ||
      catalog.id ||
      ""
    ).toLowerCase();

  const priority = [

    "featured",
    "trending",
    "popular",
    "netflix",
    "disney",
    "apple",
    "hbo",
    "max",
    "hulu",
    "prime",
    "amazon",
    "paramount",
    "peacock",
    "marvel",
    "dc",
    "top",
    "new"

  ];

  const index =
    priority.findIndex(
      word =>
        name.includes(word)
    );

  return index < 0
    ? 999
    : index;

}

   HOME
============================================================ */

async function loadHome(){

  const container =
    $("catalogContainer");

  container.innerHTML = `
    <div class="empty">
      Loading catalogs…
    </div>
  `;

  let metadataHTML = "";

  /*
    Metadata is allowed to fail without
    killing MDBList.
  */

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    const usable =
      catalogs
        .filter(
          catalog =>
            catalog &&
            catalog.id &&
            catalog.type
        )
        .sort(
          (a,b) =>
            catalogPriority(a) -
            catalogPriority(b)
        )
        .slice(
          0,
          30
        );

    const results =
      await Promise.allSettled(
        usable.map(
          async catalog => {

            const data =
              await fetchJSON(
                buildCatalogURL(
                  catalog
                )
              );

            return {
              catalog,
              metas:
                Array.isArray(
                  data.metas
                )
                  ? data.metas
                  : []
            };

          }
        )
      );

    results.forEach(
      result => {

        if(
          result.status !==
          "fulfilled"
        ){

          return;

        }

        const {
          catalog,
          metas
        } =
          result.value;

        if(
          !metas.length
        ){

          return;

        }

        metadataHTML +=
          renderCatalogRow(
            catalog,
            metas
          );

      }
    );

  }
  catch(error){

    metadataHTML = `
      <div class="notice">

        Metadata catalogs could not be loaded.

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>
    `;

  }

  /*
    Always create MDB container.
    This prevents the MDB row from becoming
    a blank box or disappearing.
  */

  container.innerHTML =
    metadataHTML +
    `
      <div id="mdbContainer"></div>
    `;

  /*
    MDBList is loaded separately.
    Therefore a metadata problem cannot
    prevent MDBList rows from appearing.
  */

  await loadMDBRows();

}

            String(
              year
            )
          )}

function dedupeMetas(
  metas
){

  const seen =
    new Set();

  return metas.filter(
    item => {

      const key =
        String(
          item.type ||
          ""
        ) +
        "|" +
        String(
          item.id ||
          ""
        );

      if(
        seen.has(key)
      ){

        return false;

      }

      seen.add(key);

      return true;

    }
  );

}

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();

  if(!query){

    focusSearch();

    return;

  }

  $("main").innerHTML = `
    <div class="hero">

      <div class="hero-content">

        <div class="hero-kicker">
          SAUVE SEARCH
        </div>

        <h1>
          ${escapeHTML(query)}
        </h1>

        <p>
          Searching movies and television…
        </p>

      </div>

    </div>

    <div id="searchResults" class="empty">
      Searching…
    </div>
  `;

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    const searchable =
      catalogs.filter(
        supportsSearch
      );

    if(!searchable.length){

      throw new Error(
        "No searchable catalogs were advertised by the metadata addon."
      );

    }

    const responses =
      await Promise.allSettled(

    const metas = [];

    responses.forEach(

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );

    const results =
      dedupeMetas(
        metas
      );

    $("searchResults")
      .outerHTML =
      results.length

        ?

        `
        <section>

          <div class="catalog-heading">

                renderPosterCard

        :

        `
        <div class="notice">
          No results found for
          <strong>
            ${escapeHTML(query)}
          </strong>.
        </div>
        `;

  }
  catch(error){

    $("searchResults")
      .outerHTML = `
        <div class="error-box">

          <strong>
            SEARCH FAILED
          </strong>

          <br><br>

          ${escapeHTML(

}

/* ============================================================
   STREAM SYSTEM
   PRESERVED FROM YOUR CURRENT VERSION
============================================================ */

function buildStreamURL(
  type,
  id
){

  if(!state.stream){

    throw new Error(
      "No stream manifest has been configured in Settings."
    );

  }

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}

function getStreamURL(
  stream
){

  return String(
    stream?.url ||
    ""
  ).trim();

}

function isPlayerFrame(
  stream
){

  return Boolean(
    stream?.playerFrameUrl
  );

}

function isExternal(
  stream
){

  return Boolean(
    stream?.externalUrl
  );

}

function isNotWebReady(
  stream
){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}

function isHLS(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".m3u8") ||
    type.includes("m3u8") ||
    type.includes("mpegurl")
  );

}

function isMP4(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".mp4") ||
    type.includes("mp4")
  );

}

function isWebM(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".webm") ||
    type.includes("webm")
  );

}

function isPlayableCandidate(
  stream
){

  if(
    isPlayerFrame(stream)
  ){

    return true;

  }

  if(
    isExternal(stream)
  ){

    return false;

  }

  return (
    isMP4(stream) ||
    isHLS(stream) ||
    isWebM(stream)
  );

}

function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

  const providers = [
    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"
  ];

  for(
    const name
    of providers
  ){

    if(
      text.includes(name)
    ){

      return name;

    }

  }

  return "stream source";

}

function compatibilityScore(
  stream
){

  let score = 0;

  if(isMP4(stream)) score += 100;
  if(isHLS(stream)) score += 90;
  if(isWebM(stream)) score += 80;
  if(isPlayerFrame(stream)) score += 70;
  if(isExternal(stream)) score -= 100;

  return score;

}


/* ============================================================
   SOURCE BADGES
============================================================ */

function renderSource(
  stream,
  index
){

  const playable =
    isPlayableCandidate(
      stream
    );

  let format =
    "SOURCE";

  if(isMP4(stream))
    format="MP4";
  else if(isHLS(stream))
    format="HLS";
  else if(isWebM(stream))
    format="WEBM";
  else if(isPlayerFrame(stream))
    format="PLAYER";
  else if(isExternal(stream))
    format="EXTERNAL";

  /*
    Preserve as much badge information
    returned by the stream addon as possible.
  */

  const badgeValues = [];

  [
    stream.quality,
    stream.resolution,
    stream.videoCodec,
    stream.videoCodecName,
    stream.audioCodec,
    stream.audioCodecName,
    stream.audioChannels,
    stream.language,
    stream.lang,
    stream.hdr,
    stream.hdrType,
    stream.bitDepth,
    stream.container,
    stream.size,
    stream.behaviorHints?.filename
  ]
    .filter(
      value =>
        value !== undefined &&
        value !== null &&
        String(value).trim()
    )
    .forEach(
      value =>
        badgeValues.push(
          String(value)
        )
    );

  const uniqueBadges =
    [...new Set(
      badgeValues
    )].slice(
      0,
      12
    );

  return `
    <button
      class="source"
      ${
        playable
          ? `onclick="playSource(${index})"`
          : `onclick="explainSource(${index})"`
      }>

      <div class="source-top">

        <div class="source-icon">
          ${playable ? "▶" : "!"}
        </div>

        <div>

          <div class="source-name">
            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}
          </div>

          <div class="provider">
            ${escapeHTML(
              providerName(
                stream
              )
            )}
          </div>

        </div>

      </div>

      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : "warning"}
        ">
          ${format}
        </span>

        ${
          isNotWebReady(stream)

            ?

            `
              <span class="badge warning">
                NOT WEB READY
              </span>
            `

            :

            `
              <span class="badge good">
                WEB READY
              </span>
            `
        }

        ${uniqueBadges
          .map(
            value =>
              `
                <span class="badge blue">
                  ${escapeHTML(
                    value
                  )}
                </span>
              `
          )
          .join("")}

      </div>

      <div class="source-desc">

        ${
          isExternal(stream)

            ?

            "External destination — SAUVE cannot treat this as a direct video file."

            :

          isNotWebReady(stream)

            ?

            "Provider marked this source as not web-ready. SAUVE has not automatically disabled it."

            :

          playable

            ?

            "Tap to attempt playback inside SAUVE."

            :

            "This source does not expose a browser-compatible media URL."
        }

      </div>

    </button>
  `;

}


/* ============================================================
   SOURCES
============================================================ */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }

  $("sources").innerHTML = `
    <div class="empty">
      Loading stream sources…
    </div>
  `;

  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );

    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];

    if(
      !currentStreams.length
    ){

      $("sources").innerHTML = `
        <div class="notice">
          No stream sources were returned for this title.
        </div>
      `;

      return;

    }

    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );

    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );

    $("sources").innerHTML = `

      <div class="catalog-heading">

        <h2 class="catalog-title">
          SOURCES
        </h2>

        <span class="catalog-label">
          ${currentStreams.length}
        </span>

      </div>

      <div class="notice">

        <strong>
          ${currentPlayableStreams.length}
        </strong>

        potentially compatible source(s).

      </div>

      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    $("sources").innerHTML = `
      <div class="error-box">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>
    `;

  }

}


/* ============================================================
   PLAYER
============================================================ */

function playSource(
  index
){

  const stream =
    currentStreams[index];

  if(!stream){

    return;

  }

  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );

  if(
    currentPlayerIndex < 0
  ){

    currentPlayerIndex=0;

  }

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;

  }

  playDirectStream(
    stream
  );

}


function playDirectStream(
  stream
){

  openModal(`
    <div class="sheet-header">

      <h2>NOW PLAYING</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>

      <div
        id="playerStatus"
        class="player-status">
        Preparing playback…
      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">
        ▶ TRY NEXT SOURCE
      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">
        SOURCES
      </button>

    </div>
  `);

  const video =
    $("sauveVideo");

  const status =
    $("playerStatus");

  const url =
    getStreamURL(
      stream
    );

  if(!url){

    showPlayerError(
      "No direct media URL was returned."
    );

    return;

  }

  video.src =
    url;

  video.addEventListener(
    "loadedmetadata",
    ()=>{
      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";
    },
    {once:true}
  );

  video.addEventListener(
    "playing",
    ()=>{
      status.textContent =
        "Playing";

      status.className =
        "player-status ready";
    }
  );

  video.addEventListener(
    "waiting",
    ()=>{
      status.textContent =
        "Buffering…";
    }
  );

  video.addEventListener(
    "error",
    ()=>{
      showPlayerError(
        "Safari could not decode or access this video source."
      );
    }
  );

  video.load();

}


function openEmbeddedPlayer(
  stream
){

  const url =
    String(
      stream.playerFrameUrl ||
      ""
    ).trim();

  if(!url){

    showPlayerError(
      "No player URL was returned."
    );

    return;

  }

  openModal(`
    <div class="sheet-header">

      <h2>
        ${escapeHTML(
          stream.name ||
          "PLAYER"
        )}
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <div class="iframe-player">

        <iframe
          src="${escapeHTML(url)}"
          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "
          allowfullscreen>
        </iframe>

      </div>

      <div class="player-status ready">
        Provider player loaded inside SAUVE.
      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">
        TRY NEXT SOURCE
      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">
        SOURCES
      </button>

    </div>
  `);

}


function showPlayerError(
  message
){

  const status =
    $("playerStatus");

  if(status){

    status.textContent =
      message;

    status.className =
      "player-status error";

  }

}


function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;

  }

  let next =
    currentPlayerIndex + 1;

  if(
    next >=
    currentPlayableStreams.length
  ){

    next=0;

  }

  currentPlayerIndex =
    next;

  const stream =
    currentPlayableStreams[
      next
    ];

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }

}


function showSourcesAgain(){

  openModal(`
    <div class="sheet-header">

      <h2>SOURCES</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    ${
      currentStreams.length

        ?

        currentStreams
          .map(
            renderSource
          )
          .join("")

        :

        `
          <div class="empty">
            No sources available.
          </div>
        `
    }
  `);

}


function explainSource(
  index
){

  const stream =
    currentStreams[index];

  if(!stream){

    return;

  }

  alert(
    "SAUVE could not identify a browser-compatible video URL for this source."
  );

}


/* ============================================================
   SETTINGS
============================================================ */

function openSettings(){

  openModal(`
    <div class="sheet-header">

      <h2>SAUVE SETTINGS</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">
    </div>

    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"
        placeholder="Paste your stream manifest">
    </div>

    <div class="field">

      <label>
        MDBList API Key
      </label>

      <input
        id="mdbKey"
        type="password"
        autocomplete="off"
        value="${escapeHTML(
          state.mdbKey
        )}"
        placeholder="Paste your MDBList API key">

    </div>

    <div class="notice">

      Your MDBList API key is stored locally
      in this browser using localStorage.

      <br><br>

      Do not publish your API key directly
      inside a public GitHub repository.

    </div>

    <br>

    <div class="catalog-heading">

      <h2 class="catalog-title">
        MDBLIST ROWS
      </h2>

      <span class="catalog-label">
        CUSTOM
      </span>

    </div>

    <div id="mdbListEditors">

      ${renderMDBEditors()}

    </div>

    <button
      class="add-list"
      onclick="addMDBList()">

      + ADD MDBLIST

    </button>

    <br><br>

    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>
  `);

}


function renderMDBEditors(){

  if(
    !state.mdbLists.length
  ){

    return `
      <div class="empty">
        No MDBLists added yet.
      </div>
    `;

  }

  return state.mdbLists
    .map(
      (list,index) =>
        `
        <div class="list-editor">

          <div class="field">

            <label>
              Row Name
            </label>

            <input
              id="mdb-name-${index}"
              value="${escapeHTML(
                list.name ||
                ""
              )}"
              placeholder="My Movies">

          </div>

          <div class="field">

            <label>
              MDBList URL
            </label>

            <input
              id="mdb-url-${index}"
              value="${escapeHTML(
                list.url ||
                ""
              )}"
              placeholder="https://mdblist.com/lists/username/list-name">

          </div>

          <div class="field">

            <label>
              Maximum Items
            </label>

            <input
              id="mdb-limit-${index}"
              type="number"
              min="1"
              max="1000"
              value="${escapeHTML(
                String(
                  list.limit ||
                  40
                )
              )}">

          </div>

          <button
            class="remove-list"
            onclick="removeMDBList(${index})">

            REMOVE LIST

          </button>

        </div>
        `
    )
    .join("");

}


function addMDBList(){

  collectMDBEditors();

  state.mdbLists.push({

    id:
      "list-" +
      Date.now(),

    name:
      "MDBList",

    url:
      "",

    limit:
      40

  });

  openSettings();

}


function removeMDBList(
  index
){

  collectMDBEditors();

  state.mdbLists.splice(
    index,
    1
  );

  openSettings();

}


function collectMDBEditors(){

  const editors =
    document.querySelectorAll(
      ".list-editor"
    );

  if(!editors.length){

    return;

  }

  state.mdbLists =
    Array.from(
      editors
    ).map(
      (editor,index) => {

        const old =
          state.mdbLists[index] ||
          {};

        return {

          id:
            old.id ||
            "list-" +
            Date.now() +
            "-" +
            index,

          name:
            (
              document.getElementById(
                "mdb-name-" +
                index
              )?.value ||
              "MDBList"
            ).trim(),

          url:
            (
              document.getElementById(
                "mdb-url-" +
                index
              )?.value ||
              ""
            ).trim(),

          limit:
            Math.max(
              1,
              Math.min(
                1000,
                Number(
                  document.getElementById(
                    "mdb-limit-" +
                    index
                  )?.value ||
                  40
                )
              )
            )

        };

      }
    );

}


function saveSettings(){

  collectMDBEditors();

  const metadata =
    $("metadataURL")
      .value
      .trim();

  const stream =
    $("streamURL")
      .value
      .trim();

  const mdbKey =
    $("mdbKey")
      .value
      .trim();

  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;

  }

  state.metadata =
    metadata;

  state.stream =
    stream;

  state.mdbKey =
    mdbKey;

  localStorage.setItem(
    "sauve_metadata",
    metadata
  );

  localStorage.setItem(
    "sauve_stream",
    stream
  );

  localStorage.setItem(
    "sauve_mdb_key",
    mdbKey
  );

  saveStoredLists();

  closeModal();

  location.reload();

}


/* ============================================================
   UI
============================================================ */

function focusSearch(){

  const input =
    $("searchInput");

  if(input){

    input.focus();

    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }

}


function goHome(){

  location.reload();

}


function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* ============================================================
   START
============================================================ */

loadHome();

</script>

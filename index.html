<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070510">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#06040d;
  --panel:#10091b;
  --panel2:#170d27;
  --pink:#ff19d5;
  --purple:#884cff;
  --cyan:#19eaff;
  --yellow:#ffd65a;
  --white:#fff;
  --muted:#a99bad;
  --line:rgba(255,255,255,.09);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--white);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(136,76,255,.34),
      transparent 35%
    ),
    radial-gradient(
      circle at 0% 40%,
      rgba(255,25,213,.13),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 55%,
      rgba(25,234,255,.10),
      transparent 30%
    ),
    #06040d;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    14px;

  background:
    rgba(6,4,13,.94);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border-bottom:
    1px solid rgba(255,25,213,.18);
}

.logo{
  text-align:center;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-style:italic;

  font-size:
    clamp(64px,18vw,112px);

  line-height:.78;

  letter-spacing:7px;

  transform:skewX(-7deg);

  color:#fff;

  text-shadow:
    0 0 4px #fff,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 42px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  text-align:center;

  margin-top:14px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:4px;

  text-shadow:
    0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;

  max-width:900px;

  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;

  padding:14px;

  border-radius:8px;

  background:#0d0817;

  color:white;

  border:
    1px solid rgba(136,76,255,.40);

  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 18px rgba(255,25,213,.18);
}

.searchbar button{
  border:0;

  padding:0 18px;

  border-radius:8px;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  color:white;

  font-weight:900;

  box-shadow:
    0 0 18px rgba(255,25,213,.30);
}

/* =========================
   MAIN
========================= */

main{
  width:100%;
  max-width:1400px;

  margin:auto;

  padding:16px;
}

.hero{
  position:relative;

  min-height:
    clamp(390px,58vh,600px);

  overflow:hidden;

  border-radius:18px;

  display:flex;
  align-items:flex-end;

  padding:
    clamp(25px,5vw,60px);

  border:
    1px solid rgba(255,25,213,.25);

  background:
    radial-gradient(
      circle at 75% 35%,
      rgba(25,234,255,.13),
      transparent 25%
    ),
    radial-gradient(
      circle at 70% 75%,
      rgba(255,25,213,.20),
      transparent 32%
    ),
    linear-gradient(
      110deg,
      #090511,
      #190c2e,
      #07121e
    );
}

.hero:after{
  content:"";

  position:absolute;
  inset:0;

  opacity:.10;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.18) 4px
    );
}

.hero:before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(6,4,13,.98),
      rgba(6,4,13,.72) 50%,
      rgba(6,4,13,.05)
    );
}

.hero-content{
  position:relative;
  z-index:3;

  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);

  font-size:10px;

  font-weight:900;

  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:
    clamp(46px,9vw,95px);

  line-height:.85;

  text-transform:uppercase;

  text-shadow:
    0 0 20px rgba(255,25,213,.35);
}

.hero p{
  color:#c7b9ce;

  line-height:1.6;

  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;

  margin-top:20px;
}

.primary,
.secondary{
  padding:13px 18px;

  border-radius:8px;

  font-weight:900;
}

.primary{
  border:0;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    0 0 18px rgba(255,25,213,.25);
}

.secondary{
  background:
    rgba(25,234,255,.04);

  border:
    1px solid rgba(25,234,255,.38);

  color:var(--cyan);
}

/* =========================
   SECTIONS
========================= */

section{
  margin:32px 0;
}

.heading{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:15px;

  padding-bottom:10px;

  border-bottom:
    1px solid rgba(255,25,213,.18);
}

.heading h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:25px;

  letter-spacing:1px;
}

.heading span{
  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:13px;
}

.card{
  padding:0;

  overflow:hidden;

  text-align:left;

  color:white;

  background:
    linear-gradient(
      180deg,
      #170d27,
      #0d0717
    );

  border:
    1px solid var(--line);

  border-radius:10px;
}

.card:hover{
  border-color:
    rgba(255,25,213,.55);

  box-shadow:
    0 0 18px rgba(255,25,213,.12);
}

.poster{
  width:100%;

  aspect-ratio:2/3;

  display:block;

  object-fit:cover;

  background:#171027;
}

.card-info{
  padding:11px;
}

.card-title{
  font-size:14px;

  font-weight:850;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.card-sub{
  margin-top:5px;

  color:var(--muted);

  font-size:10px;
}

.empty{
  padding:28px 5px;

  color:var(--muted);

  font-size:13px;
}

.notice{
  padding:16px;

  border-radius:9px;

  background:
    rgba(255,25,213,.045);

  border:
    1px solid rgba(255,25,213,.17);

  color:#c8bacf;

  line-height:1.6;

  font-size:12px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.82);

  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:94vh;

  overflow:auto;

  padding:
    20px
    18px
    calc(30px + env(safe-area-inset-bottom));

  border-radius:
    22px 22px 0 0;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(136,76,255,.18),
      transparent 40%
    ),
    #0c0718;

  border-top:
    1px solid rgba(255,25,213,.35);
}

.sheet-header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:27px;
}

.close{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#170d27;

  color:var(--cyan);

  border:
    1px solid rgba(25,234,255,.3);

  font-size:22px;
}

/* =========================
   DETAILS
========================= */

.details{
  display:grid;

  grid-template-columns:
    105px 1fr;

  gap:16px;
}

.details img{
  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;
}

.details p{
  color:#c3b5cb;

  line-height:1.55;

  font-size:13px;
}

.meta{

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:7px;

   SOURCES

.source{

  margin-top:9px;

  padding:14px;

  text-align:left;

  color:white;

  border-radius:9px;

  background:

      #150c29,
      #0d0819

  border:
    1px solid rgba(25,234,255,.15);

  box-shadow:

.source-top{

  color:var(--cyan);

.provider{
  margin-top:4px;

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;

}

.badges{
  margin-top:8px;

.badge{
  display:inline-block;

  padding:4px 7px;

  margin-right:5px;

  border-radius:5px;

  background:
    rgba(255,25,213,.10);

  color:#ff7be4;

  font-size:8px;

  font-weight:900;

  letter-spacing:.7px;
}

.badge.ok{
  background:
    rgba(25,234,255,.10);

  color:var(--cyan);
}

.source-desc{
  margin-top:7px;

  color:#91859b;

  font-size:10px;
}

/* =========================
   PLAYER
========================= */

.player{
  width:100%;

  overflow:hidden;

  background:#000;

  border-radius:10px;

  border:
    1px solid rgba(25,234,255,.20);
}

video{
  width:100%;

  display:block;

  background:#000;

  max-height:70vh;
}

.player-info{

  background:#10091c;
}

.player-info strong{

}

.player-info small{

}

/* =========================
   SETTINGS
========================= */

.field{
  margin:18px 0;
}

.field label{
  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;

  text-transform:uppercase;
}

.field input{
  width:100%;

  padding:13px;

  border-radius:7px;

  background:#080510;

  color:white;

  border:
    1px solid rgba(136,76,255,.3);

  outline:none;

/* =========================
   NAV
========================= */

.nav{
  position:fixed;

  z-index:400;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  padding-bottom:
    env(safe-area-inset-bottom);

  display:flex;

  align-items:center;

  justify-content:space-around;

  background:
    rgba(8,5,17,.96);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-top:
    1px solid rgba(255,25,213,.18);
}

.nav button{
  border:0;

  background:none;

  color:#766a80;

  font-size:9px;

  letter-spacing:1px;
}

.nav button span{
  display:block;

  font-size:22px;

  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);

  text-shadow:
    0 0 10px var(--pink);

@media(min-width:700px){

  .grid{
    grid-template-columns:
      repeat(5,minmax(0,1fr));
  }

  .details{
    grid-template-columns:
      190px 1fr;
  }

  .details img{
    width:190px;
  }
}

</style>

<body>

<div class="app">

<header>

  <div class="logo">
    SAUVE
  </div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>


<main id="main">

  <div class="hero">

    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Your neon media interface.
        Search your metadata catalogs,
        choose a title, then discover
        compatible stream sources.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button
          class="secondary"
          onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>

    </div>

  </div>


  <section>

    <div class="heading">

      <h2>
        DISCOVER
      </h2>

      <span>
        AIO METADATA
      </span>

    </div>

    <div
      id="homeResults"
      class="empty">
      Loading…
    </div>

  </section>

</main>


<nav class="nav">

  <button
    class="active"
    onclick="goHome()">

    <span>⌂</span>
    HOME

  </button>

  <button
    onclick="focusSearch()">

    <span>⌕</span>
    SEARCH

  </button>

  <button
    onclick="openSettings()">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>

</div>


<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    ""

};

let currentStreams = [];


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}


function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(
      /\/manifest\.json\/?$/i,
      ""
    );

}


function addonRoot(url){

  return normalizeManifest(url) + "/";
}


/* =========================================================
   FETCH JSON
========================================================= */

async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        },
        cache:"no-store"
      }
    );


  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  return response.json();

}


/* =========================================================
   MANIFEST
========================================================= */

async function getManifest(){

  return fetchJSON(
    state.metadata
  );

}


/* =========================================================
   EXTRA SUPPORT
========================================================= */

function supportsExtra(
  catalog,
  name
){

  return Array.isArray(
    catalog.extra
  )
  &&
  catalog.extra.some(
    extra =>
      typeof extra === "string"
        ? extra === name
        : extra &&
          extra.name === name
  );

}


/* =========================================================
   SEARCH CATALOGS
========================================================= */

function getSearchCatalogs(
  manifest
){

  const catalogs =
    Array.isArray(
      manifest.catalogs
    )
      ? manifest.catalogs
      : [];


  return catalogs.filter(
    catalog => {

      if(
        !catalog ||
        !catalog.id ||
        !catalog.type
      ){

        return false;

      }


      return supportsExtra(
        catalog,
        "search"
      );

    }
  );

}


/* =========================================================
   EXTRA PROPS ENCODING
========================================================= */

/*
  Stremio's addon path format is:

  /catalog/{type}/{id}/{extraProps}.json

  Example:

  /catalog/movie/top/search=Inception.json

  The property itself is encoded as
  key=value.
*/

function makeExtraProps(
  values
){

  return Object.entries(
    values
  )
  .filter(
    ([,value]) =>
      value !== undefined &&
      value !== null &&
      String(value).length
  )
  .map(
    ([key,value]) =>
      key +
      "=" +
      encodeURIComponent(
        String(value)
      )
  )
  .join("&");

}


/* =========================================================
   CATALOG URL
========================================================= */

function buildCatalogURL(
  catalog,
  extra={}
){

  const root =
    addonRoot(
      state.metadata
    );


  let url =
    root +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );


  const props =
    makeExtraProps(
      extra
    );


  if(props){

    url +=
      "/" +
      props;

  }


  url +=
    ".json";


  return url;

}


/* =========================================================
   HOME CATALOGS
========================================================= */

async function loadHome(){

  const box =
    $("homeResults");


  box.innerHTML =
    `<div class="empty">
      Loading catalog…
    </div>`;


  try{

    const manifest =
      await getManifest();


    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];


    /*
      Don't assume there is a catalog
      called "top" or "popular".

      Use the first normal catalog
      for movies and the first one for
      series if available.
    */

    const selected = [];


    for(
      const type of [
        "movie",
        "series"
      ]
    ){

      const catalog =
        catalogs.find(
          c =>
            c &&
            c.type === type &&
            !supportsExtra(
              c,
              "search"
            )
        )
        ||
        catalogs.find(
          c =>
            c &&
            c.type === type
        );


      if(catalog){

        selected.push(
          catalog
        );

      }

    }


    if(!selected.length){

      box.innerHTML = `

        <div class="notice">

          No movie or series catalogs
          were advertised by your metadata
          manifest.

        </div>

      `;

      return;

    }


    const responses =
      await Promise.allSettled(
        selected.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog
              )
            )
        )
      );


    const all = [];


    for(
      const response
      of responses
    ){

      if(
        response.status ===
        "fulfilled"
      ){

        all.push(
          ...(response.value.metas || [])
        );

      }

    }


    box.innerHTML =
      renderGrid(
        dedupeMetas(all)
      );


  }
  catch(error){

    box.innerHTML = `

      <div class="notice">

        <strong>
          METADATA CONNECTION FAILED
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================================
   SEARCH
========================================================= */

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();


  if(!query){

    focusSearch();

    return;

  }


  $("main").innerHTML = `

    <section>

      <div class="heading">

        <h2>
          SEARCH
        </h2>

        <span>
          ${escapeHTML(query)}
        </span>

      </div>


      <div
        id="searchResults"
        class="empty">

        Searching metadata catalogs…

      </div>

    </section>

  `;


  try{

    const manifest =
      await getManifest();


    const catalogs =
      getSearchCatalogs(
        manifest
      );


    if(!catalogs.length){

      throw new Error(
        "Your AIO metadata manifest does not advertise any catalogs with search support."
      );

    }


    /*
      Search every supported catalog.

      This is important because an addon can
      expose separate movie and series
      searchable catalogs.
    */

    const requests =
      catalogs.map(
        catalog => {

          const url =
            buildCatalogURL(
              catalog,
              {
                search:query
              }
            );


          return fetchJSON(
            url
          )
          .then(
            data => ({
              catalog,
              data
            })
          );

        }
      );


    const responses =
      await Promise.allSettled(
        requests
      );


    const all = [];


    for(
      const result
      of responses
    ){

      if(
        result.status ===
        "fulfilled"
      ){

        all.push(
          ...(result.value.data.metas || [])
        );

      }

    }


    const unique =
      dedupeMetas(all);


    $("searchResults")
      .innerHTML =
      renderGrid(
        unique
      );


    if(
      !unique.length
    ){

      $("searchResults")
        .innerHTML = `

          <div class="notice">

            No results were returned for
            <strong>
              ${escapeHTML(query)}
            </strong>.

            <br><br>

            ${catalogs.length}
            searchable catalog(s) were
            queried successfully.

          </div>

        `;

    }

  }
  catch(error){

    $("searchResults")
      .innerHTML = `

        <div class="notice">

          <strong>
            SEARCH FAILED
          </strong>

          <br><br>

          ${escapeHTML(
            error.message
          )}

          <br><br>

          Open Settings and verify your
          AIO Metadata Manifest.

        </div>

      `;

  }

}


/* =========================================================
   DEDUPLICATE
========================================================= */

function dedupeMetas(
  metas
){

  const seen =
    new Set();

  return metas.filter(
    item => {

      const key =
        String(
          item.type ||
          ""
        ) +
        "|" +
        String(
          item.id ||
          ""
        );


      if(
        seen.has(key)
      ){

        return false;

      }


      seen.add(key);

      return true;

    }
  );

}


/* =========================================================
   GRID
========================================================= */

function renderGrid(
  metas
){

  if(
    !metas ||
    !metas.length
  ){

    return `
      <div class="empty">
        No results found.
      </div>
    `;

  }


  return `

    <div class="grid">

      ${metas.map(
        item => {

          const type =
            encodeURIComponent(
              item.type ||
              "movie"
            );


          const id =
            encodeURIComponent(
              item.id ||
              ""
            );


          return `

            <button
              class="card"
              onclick="
                openTitle(
                  '${type}',
                  '${id}'
                )
              ">

              <img
                class="poster"
                src="${escapeHTML(
                  item.poster ||
                  item.logo ||
                  ""
                )}"
                loading="lazy"
                onerror="
                  this.style.opacity='0'
                ">


              <div class="card-info">

                <div class="card-title">

                  ${escapeHTML(
                    item.name ||
                    "Untitled"
                  )}

                </div>


                <div class="card-sub">

                  ${escapeHTML(
                    item.releaseInfo ||
                    item.year ||
                    item.type ||
                    ""
                  )}

                </div>

              </div>

            </button>

          `;

        }
      ).join("")}

    </div>

  `;

}


/* =========================================================
   META
========================================================= */

async function openTitle(
  encodedType,
  encodedId
){

  const type =
    decodeURIComponent(
      encodedType
    );


  const id =
    decodeURIComponent(
      encodedId
    );


  openModal(`

    <div class="sheet-header">

      <h2>
        LOADING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="empty">
      Loading title…
    </div>

  `);


  try{

    const url =
      addonRoot(
        state.metadata
      ) +
      "meta/" +
      encodeURIComponent(type) +
      "/" +
      encodeURIComponent(id) +
      ".json";


    const data =
      await fetchJSON(
        url
      );


    const meta =
      data.meta ||
      data;


    openModal(`

      <div class="sheet-header">

        <h2>
          ${escapeHTML(
            meta.name ||
            "TITLE"
          )}
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>


      <div class="details">

        <img
          src="${escapeHTML(
            meta.poster ||
            meta.logo ||
            ""
          )}">


        <div>

          <div class="meta">

            ${escapeHTML(
              meta.releaseInfo ||
              meta.year ||
              meta.type ||
              ""
            )}

          </div>


          <p>

            ${escapeHTML(
              meta.description ||
              "No description available."
            )}

          </p>


          <button
            class="primary"
            id="sourceButton">

            ▶ FIND SOURCES

          </button>

        </div>

      </div>


      <div
        id="sources"
        style="margin-top:25px">
      </div>

    `);


    $("sourceButton")
      .onclick =
      () =>
        findSources(
          type,
          id
        );


  }
  catch(error){

    openModal(`

      <div class="sheet-header">

        <h2>
          ERROR
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>


      <div class="notice">

        ${escapeHTML(
          error.message
        )}

      </div>

    `);

  }

}


/* =========================================================
   STREAM URL
========================================================= */

function buildStreamURL(
  type,
  id
){

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}


/* =========================================================
   PROVIDER
========================================================= */

function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();


  const providers = [
    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"
  ];


  for(
    const provider of providers
  ){

    if(
      text.includes(provider)
    ){

      return provider;

    }

  }


  return "stream source";

}


/* =========================================================
   FORMAT
========================================================= */

function formatName(
  stream
){

  const url =
    String(
      stream.url ||
      ""
    ).toLowerCase();


  const type =
    String(
      stream.type ||
      ""
    ).toLowerCase();


  if(
    type.includes("mpegurl") ||
    type.includes("m3u8") ||
    url.includes(".m3u8")
  ){

    return "HLS";

  }


  if(
    type.includes("mp4") ||
    url.includes(".mp4")
  ){

    return "MP4";

  }


  if(
    type.includes("webm") ||
    url.includes(".webm")
  ){

    return "WEBM";

  }


  return "HTTP";

}


/* =========================================================
   SOURCE DISPLAY
========================================================= */

function renderSource(
  stream,
  index
){

  const notReady =
    Boolean(
      stream
        ?.behaviorHints
        ?.notWebReady
    );


  const player =
    Boolean(
      stream.playerFrameUrl
    );


  const external =
    Boolean(
      stream.externalUrl
    );


  let status =
    "DIRECT";


  if(player){

    status =
      "PLAYER";

  }
  else if(external){

    status =
      "EXTERNAL";

  }
  else if(notReady){

    status =
      "NOT WEB READY";

  }


  return `

    <button
      class="source"
      onclick="playSource(${index})">

      <div class="source-top">

        <div class="source-icon">
          ▶
        </div>

        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>

          <div class="provider">

            ${escapeHTML(
              providerName(
                stream
              )
            )}

          </div>

        </div>

      </div>


      <div class="badges">

        <span class="badge ok">

          ${escapeHTML(
            formatName(stream)
          )}

        </span>


        <span class="badge">

          ${status}

        </span>


        ${
          stream.quality
          ?
          `<span class="badge">
            ${escapeHTML(
              stream.quality
            )}
          </span>`
          :
          ""
        }

      </div>


      <div class="source-desc">

        ${escapeHTML(
          stream.description ||
          "Source returned by your stream addon."
        )}

      </div>

    </button>

  `;

}


/* =========================================================
   FIND SOURCES
========================================================= */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }


  $("sources").innerHTML = `

    <div class="empty">
      Loading stream sources…
    </div>

  `;


  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );


    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];


    if(
      !currentStreams.length
    ){

      $("sources").innerHTML = `

        <div class="notice">

          No stream sources were returned
          for this title.

        </div>

      `;

      return;

    }


    /*
      Prefer things the browser may be
      able to use, while preserving all
      returned sources.
    */

    currentStreams.sort(
      (a,b) => {

        function score(s){

          let score = 0;


          if(
            s.playerFrameUrl
          ){

            score += 100;

          }


          if(
            s.externalUrl
          ){

            score += 80;

          }


          if(
            !s.behaviorHints
              ?.notWebReady
          ){

            score += 30;

          }


          const format =
            formatName(s);


          if(
            format === "MP4"
          ){

            score += 45;

          }


          if(
            format === "HLS"
          ){

            score += 40;

          }


          if(
            format === "WEBM"
          ){

            score += 35;

          }


          if(
            providerName(s)
            ===
            "2peckle"
          ){

            score += 10;

          }


          return score;

        }


        return score(b) -
               score(a);

      }
    );


    $("sources").innerHTML = `

      <div class="heading">

        <h2>
          SOURCES
        </h2>

        <span>
          ${currentStreams.length}
        </span>

      </div>


      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    $("sources").innerHTML = `

      <div class="notice">

        <strong>
          STREAM CONNECTION FAILED
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================================================
   PLAY SOURCE
========================================================= */

function playSource(
  index
){

  const stream =
    currentStreams[index];


  if(!stream){

    return;

  }


  if(
    stream.playerFrameUrl
  ){

    openPlayerFrame(
      stream.playerFrameUrl
    );

    return;

  }


  if(
    stream.externalUrl
  ){

    openExternal(
      stream.externalUrl
    );

    return;

  }


  if(
    stream
      ?.behaviorHints
      ?.notWebReady
  ){

    openModal(`

      <div class="sheet-header">

        <h2>
          NOT WEB READY
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>


      <div class="notice">

        This stream is marked by the
        addon as not web-ready.

        <br><br>

        SAUVE will not attempt to bypass
        provider restrictions or DRM.

        <br><br>

        Try another source.

      </div>

    `);

    return;

  }


  if(stream.url){

    playDirect(
      stream
    );

    return;

  }


  openModal(`

    <div class="sheet-header">

      <h2>
        UNSUPPORTED
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="notice">

      This stream did not provide a
      direct URL, player URL, or external
      destination.

    </div>

  `);

}


/* =========================================================
   DIRECT PLAYER
========================================================= */

function playDirect(
  stream
){

  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="player">

      <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>


      <div class="player-info">

        <strong>

          ${escapeHTML(
            stream.name ||
            stream.title ||
            "SAUVE"
          )}

        </strong>

        <small id="playerStatus">
          Loading…
        </small>

      </div>

    </div>

  `);


  const video =
    $("video");


  const status =
    $("playerStatus");


  video.src =
    stream.url;


  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready";

    }
  );


  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

    }
  );


  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );


  video.addEventListener(
    "error",
    () => {

      status.textContent =
        "Safari could not decode or access this source.";

    }
  );


  video.load();

}


/* =========================================================
   IFRAME PLAYER
========================================================= */

function openPlayerFrame(
  url
){

  openModal(`

    <div class="sheet-header">

      <h2>
        PROVIDER PLAYER
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div
      style="
        position:relative;
        width:100%;
        aspect-ratio:16/9;
        background:#000;
        border-radius:10px;
        overflow:hidden;
      ">

      <iframe
        src="${escapeHTML(url)}"
        allow="
          autoplay;
          fullscreen;
          picture-in-picture
        "
        allowfullscreen
        style="
          position:absolute;
          inset:0;
          width:100%;
          height:100%;
          border:0;
        ">
      </iframe>

    </div>

  `);

}


/* =========================================================
   EXTERNAL
========================================================= */

function openExternal(
  url
){

  openModal(`

    <div class="sheet-header">

      <h2>
        EXTERNAL PLAYER
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="notice">

      This provider supplied an external
      playback destination.

      <br><br>

      <button
        class="primary"
        id="openExternalButton">

        OPEN SOURCE

      </button>

    </div>

  `);


  $("openExternalButton")
    .onclick =
    () => {

      window.open(
        url,
        "_blank"
      );

    };

}


/* =========================================================
   SETTINGS
========================================================= */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>


    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>


    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"
        placeholder="Paste your stream manifest">

    </div>


    <div class="notice">

      SAUVE stores the manifest addresses
      locally in this browser.

      <br><br>

      SAUVE does not store a Real-Debrid
      API key.

    </div>


    <br>


    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);

}


function saveSettings(){

  const metadata =
    $("metadataURL")
      .value
      .trim();


  const stream =
    $("streamURL")
      .value
      .trim();


  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;

  }


  state.metadata =
    metadata;


  state.stream =
    stream;


  localStorage.setItem(
    "sauve_metadata",
    metadata
  );


  localStorage.setItem(
    "sauve_stream",
    stream
  );


  closeModal();

  location.reload();

}


/* =========================================================
   NAVIGATION
========================================================= */

function focusSearch(){

  $("searchInput")
    .focus();

}


function goHome(){

  location.reload();

}


function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* =========================================================
   START
========================================================= */

loadHome();

</script>

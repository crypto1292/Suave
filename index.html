<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color"
      content="#05030b">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-title"
      content="SAUVE">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="description"
      content="SAUVE Cinema Television">

<link rel="manifest"
      href="./manifest.json">

<link rel="apple-touch-icon"
      href="./icons/apple-touch-icon.png">

<title>SAUVE Cinema Television</title>

<style>

/* =========================================================
   SAUVE
   CINEMA TELEVISION
   iPHONE / PWA EDITION
========================================================= */

:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#150b25;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --text:#fff;
  --muted:#9d91a6;
}

*{
  box-sizing:border-box;
}

html{
  margin:0;
  padding:0;
  min-height:100%;
  background:#05030b;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  padding:0;
  min-height:100vh;
  min-height:100dvh;

  color:white;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;

  overflow-x:hidden;

  overscroll-behavior:none;

  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  user-select:none;
  -webkit-user-select:none;

  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(138,77,255,.38),
      transparent 35%
    ),
    radial-gradient(
      circle at 0 30%,
      rgba(255,22,216,.12),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 50%,
      rgba(25,234,255,.10),
      transparent 30%
    ),
    #05030b;
}

body.modal-open{
  overflow:hidden;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}

button:active{
  transform:scale(.98);
}

input{
  user-select:text;
  -webkit-user-select:text;
}


/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:
    calc(10px + env(safe-area-inset-top))
    14px
    14px;

  background:
    rgba(5,3,11,.94);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border-bottom:
    1px solid rgba(255,22,216,.18);
}


/* =========================================================
   LOGO
========================================================= */

.logo{
  text-align:center;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-style:italic;

  font-size:
    clamp(
      68px,
      19vw,
      120px
    );

  line-height:.78;

  letter-spacing:7px;

  transform:skewX(-7deg);

  color:white;

  text-shadow:
    0 0 4px white,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;

  text-align:center;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:4px;

  text-shadow:
    0 0 10px var(--cyan);
}


/* =========================================================
   SEARCH
========================================================= */

.searchbar{
  display:flex;

  gap:8px;

  max-width:900px;

  margin:
    18px auto 0;
}

.searchbar input{
  flex:1;

  min-width:0;

  padding:14px;

  border-radius:8px;

  background:#0c0715;

  color:white;

  border:
    1px solid rgba(138,77,255,.45);

  outline:none;

  -webkit-appearance:none;
  appearance:none;
}

.searchbar input:focus{
  border-color:var(--pink);

  box-shadow:
    0 0 18px
    rgba(255,22,216,.18);
}

.searchbar button{
  padding:
    0 18px;

  border:0;

  border-radius:8px;

  color:white;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );
}


/* =========================================================
   MAIN
========================================================= */

main{
  width:100%;

  max-width:1500px;

  margin:auto;

  padding:
    16px
    16px
    calc(
      110px +
      env(safe-area-inset-bottom)
    );
}



/* =========================================================
   STREAMING PREMIERES / FEATURED POSTERS
========================================================= */

.streaming-featured{
  position:relative;
  margin:0 0 22px;
  border-radius:22px;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(18,10,30,.96),rgba(5,3,11,.98));
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 18px 55px rgba(0,0,0,.35);
}

.streaming-featured-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  padding:20px 18px 12px;
}

.streaming-featured-kicker{
  color:var(--cyan);
  font-size:10px;
  font-weight:900;
  letter-spacing:2.5px;
}

.streaming-featured-title{
  margin:4px 0 0;
  font-size:24px;
  line-height:1;
  font-weight:900;
  letter-spacing:-.6px;
}

.streaming-featured-note{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.featured-poster-row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:4px 18px 20px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.featured-poster-row::-webkit-scrollbar{
  display:none;
}

.featured-poster{
  position:relative;
  flex:0 0 clamp(145px,42vw,185px);
  aspect-ratio:2/3;
  padding:0;
  border:0;
  border-radius:15px;
  overflow:hidden;
  background:#120b1c;
  scroll-snap-align:start;
  box-shadow:0 10px 28px rgba(0,0,0,.4);
}

.featured-poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .35s ease;
}

.featured-poster:active img{
  transform:scale(.97);
}

.featured-poster:after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:42%;
  background:linear-gradient(transparent,rgba(0,0,0,.92));
  pointer-events:none;
}

.featured-poster-info{
  position:absolute;
  z-index:2;
  left:11px;
  right:11px;
  bottom:10px;
  text-align:left;
}

.featured-poster-name{
  font-size:13px;
  line-height:1.15;
  font-weight:900;
  color:#fff;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.featured-poster-year{
  margin-top:4px;
  font-size:10px;
  color:#c9becf;
  font-weight:800;
}

.no-featured-posters{
  margin:0 18px 20px;
  padding:24px 16px;
  border-radius:15px;
  color:var(--muted);
  text-align:center;
  background:rgba(255,255,255,.035);
}

/* =========================================================
   POPCORN STREAM LOADER
========================================================= */

.popcorn-loader{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-height:120px;
  padding:20px;
  color:#fff;
  text-align:center;
  transition:opacity .25s ease,transform .25s ease;
}

.popcorn-loader.hidden{
  display:none;
}

.popcorn-machine{
  position:relative;
  width:92px;
  height:86px;
}

.popcorn-bucket{
  position:absolute;
  left:20px;
  bottom:0;
  width:52px;
  height:52px;
  border-radius:6px 6px 11px 11px;
  background:repeating-linear-gradient(
    90deg,
    #fff 0 8px,
    #ff365f 8px 17px
  );
  border:2px solid rgba(255,255,255,.8);
  transform-origin:bottom center;
  animation:bucketWiggle 1.5s ease-in-out infinite;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.popcorn-kernel{
  position:absolute;
  width:15px;
  height:15px;
  border-radius:50% 50% 45% 45%;
  background:#ffe08a;
  box-shadow:0 2px 5px rgba(0,0,0,.25);
  animation:popcornJump 1.25s ease-in-out infinite;
}

.popcorn-kernel:nth-child(2){left:25px;top:13px;animation-delay:0s}
.popcorn-kernel:nth-child(3){left:45px;top:7px;animation-delay:.18s}
.popcorn-kernel:nth-child(4){left:58px;top:20px;animation-delay:.36s}
.popcorn-kernel:nth-child(5){left:36px;top:23px;animation-delay:.54s}
.popcorn-kernel:nth-child(6){left:13px;top:23px;animation-delay:.72s}

.popcorn-loader-text{
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  color:#d9cce1;
}

@keyframes popcornJump{
  0%,100%{transform:translateY(10px) rotate(0deg) scale(.9);opacity:.65}
  35%{transform:translateY(-10px) rotate(12deg) scale(1)}
  65%{transform:translateY(2px) rotate(-9deg) scale(1)}
}

@keyframes bucketWiggle{
  0%,100%{transform:rotate(-2deg)}
  50%{transform:rotate(2deg)}
}

/* =========================================================
   HERO
========================================================= */

.hero{
  position:relative;

  min-height:
    clamp(
      400px,
      58vh,
      620px
    );

  overflow:hidden;

  display:flex;

  align-items:flex-end;

  padding:
    clamp(
      25px,
      5vw,
      60px
    );

  border-radius:18px;

  border:
    1px solid
    rgba(255,22,216,.25);

  background:
    radial-gradient(
      circle at 75% 30%,
      rgba(25,234,255,.18),
      transparent 25%
    ),
    radial-gradient(
      circle at 75% 75%,
      rgba(255,22,216,.25),
      transparent 35%
    ),
    linear-gradient(
      110deg,
      #090511,
      #190c2e,
      #07121e
    );
}

.hero:before{
  content:"";

  position:absolute;

  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(5,3,11,.98),
      rgba(5,3,11,.72) 48%,
      rgba(5,3,11,.05)
    );
}

.hero:after{
  content:"";

  position:absolute;

  inset:0;

  opacity:.08;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.18) 4px
    );
}

.hero-content{
  position:relative;

  z-index:3;

  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);

  font-size:10px;

  font-weight:900;

  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:
    clamp(
      46px,
      9vw,
      95px
    );

  line-height:.85;

  text-transform:uppercase;

  text-shadow:
    0 0 20px
    rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;

  line-height:1.6;

  font-size:14px;
}

.hero-buttons{
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  margin-top:20px;
}

.primary,
.secondary{
  padding:
    13px 18px;

  border-radius:8px;

  font-weight:900;
}

.primary{
  border:0;

  color:white;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    0 0 18px
    rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);

  background:
    rgba(25,234,255,.04);

  border:
    1px solid
    rgba(25,234,255,.38);
}


/* =========================================================
   CATALOGS
========================================================= */

.catalog-section{
  margin:30px 0 0;
}

.catalog-heading{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:12px;

  padding-bottom:9px;

  border-bottom:
    1px solid
    rgba(255,22,216,.15);
}

.catalog-title{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:25px;

  letter-spacing:1px;
}

.catalog-label{
  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;
}

.row{
  display:flex;

  gap:13px;

  overflow-x:auto;

  overflow-y:hidden;

  padding:
    3px
    1px
    12px;

  scroll-snap-type:
    x proximity;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.row::-webkit-scrollbar{
  display:none;
}

.poster-card{
  position:relative;

  flex:
    0 0 145px;

  overflow:hidden;

  border:0;

  padding:0;

  text-align:left;

  color:white;

  background:#10091c;

  border-radius:8px;

  scroll-snap-align:start;

  box-shadow:
    0 7px 22px
    rgba(0,0,0,.32);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.poster-card img{
  display:block;

  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;

  background:#171027;
}

.poster-overlay{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:
    38px
    9px
    9px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.94)
    );
}

.poster-name{
  font-size:12px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.poster-year{
  margin-top:3px;

  color:#bdb0c6;

  font-size:9px;
}

.poster-type{
  position:absolute;

  top:7px;
  left:7px;

  padding:
    4px 6px;

  border-radius:4px;

  background:
    rgba(0,0,0,.72);

  color:var(--cyan);

  font-size:7px;

  font-weight:900;

  letter-spacing:1px;
}


/* =========================================================
   STATES
========================================================= */

.empty{
  padding:
    28px 5px;

  color:var(--muted);

  font-size:13px;
}

.notice{
  padding:16px;

  border-radius:9px;

  background:
    rgba(255,22,216,.045);

  border:
    1px solid
    rgba(255,22,216,.17);

  color:#c8bacf;

  line-height:1.6;

  font-size:12px;
}

.loading{
  padding:25px;

  text-align:center;

  color:#bcaec5;
}

.spinner{
  width:28px;
  height:28px;

  margin:
    0 auto 12px;

  border-radius:50%;

  border:
    3px solid
    rgba(255,255,255,.12);

  border-top-color:
    var(--pink);

  animation:
    spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.88);

  backdrop-filter:blur(10px);

  -webkit-backdrop-filter:blur(10px);

  padding-top:
    env(safe-area-inset-top);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:95vh;

  overflow:auto;

  -webkit-overflow-scrolling:touch;

  padding:
    20px
    18px
    calc(
      30px +
      env(safe-area-inset-bottom)
    );

  border-radius:
    22px
    22px
    0
    0;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(138,77,255,.18),
      transparent 40%
    ),
    #0c0718;

  border-top:
    1px solid
    rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:27px;
}

.close{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#170d27;

  color:var(--cyan);

  border:
    1px solid
    rgba(25,234,255,.3);

  font-size:22px;

  flex:none;
}


/* =========================================================
   DETAILS
========================================================= */

.details{
  display:grid;

  grid-template-columns:
    105px 1fr;

  gap:16px;
}

.details img{
  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;

  background:#171027;
}

.details p{
  color:#c3b5cb;

  line-height:1.55;

  font-size:13px;
}

.meta{
  color:var(--cyan);

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:7px;
}

.section-title{
  margin:
    25px 0 10px;

  font-family:
    Impact,
    Haettenschweiler,
    sans-serif;

  font-size:22px;
}


/* =========================================================
   SEASONS
========================================================= */

.season-tabs{
  display:flex;

  gap:8px;

  overflow-x:auto;

  padding-bottom:8px;

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.season-tabs::-webkit-scrollbar{
  display:none;
}

.season-button{
  flex:none;

  padding:
    9px 13px;

  border-radius:7px;

  border:
    1px solid
    rgba(138,77,255,.3);

  background:#140b23;

  color:#bfb1c8;

  font-size:10px;

  font-weight:900;

  touch-action:manipulation;
}

.season-button.active{
  color:white;

  border-color:
    var(--pink);

  background:
    linear-gradient(
      135deg,
      rgba(255,22,216,.35),
      rgba(138,77,255,.35)
    );
}


/* =========================================================
   EPISODES
========================================================= */

.episode-list{
  display:flex;

  flex-direction:column;

  gap:8px;
}

.episode{
  width:100%;

  display:grid;

  grid-template-columns:
    80px 1fr;

  gap:12px;

  padding:8px;

  border-radius:8px;

  border:
    1px solid
    rgba(255,255,255,.07);

  background:#120a20;

  color:white;

  text-align:left;
}

.episode img{
  width:80px;

  aspect-ratio:16/9;

  object-fit:cover;

  border-radius:5px;

  background:#08050d;
}

.episode-number{
  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;
}

.episode-name{
  margin-top:4px;

  font-weight:900;

  font-size:12px;
}

.episode-desc{
  margin-top:5px;

  color:#8f8499;

  font-size:9px;

  line-height:1.4;
}


/* =========================================================
   SOURCES
========================================================= */

.source{
  width:100%;

  margin-top:9px;

  padding:14px;

  text-align:left;

  color:white;

  border-radius:9px;

  background:
    linear-gradient(
      100deg,
      #150c29,
      #0d0819
    );

  border:
    1px solid
    rgba(25,234,255,.15);
}

.source-top{
  display:flex;

  align-items:center;

  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;

  display:flex;

  align-items:center;

  justify-content:center;

  flex:none;

  border-radius:50%;

  color:var(--cyan);

  background:
    rgba(25,234,255,.08);
}

.source-name{
  font-weight:900;
}

.provider{
  margin-top:4px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;
}

.badges{
  margin-top:8px;
}

.badge{
  display:inline-block;

  padding:
    4px 7px;

  margin-right:5px;

  margin-bottom:4px;

  border-radius:5px;

  background:
    rgba(255,22,216,.10);

  color:#ff7be4;

  font-size:8px;

  font-weight:900;

  letter-spacing:.7px;
}

.badge.good{
  background:
    rgba(66,255,176,.10);

  color:var(--green);
}

.badge.warning{
  background:
    rgba(255,212,90,.10);

  color:var(--yellow);
}

.badge.blue{
  background:
    rgba(25,234,255,.10);

  color:var(--cyan);
}

.source-desc{
  margin-top:7px;

  color:#91859b;

  font-size:10px;
}


/* =========================================================
   PLAYER
========================================================= */

.player-shell{
  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#000;

  border:
    1px solid
    rgba(25,234,255,.25);

  box-shadow:
    0 0 30px

<script>

/* =========================================================
   CONFIG
========================================================= */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const DEFAULT_ADDON =
"";


const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    "",

  addons:
    loadJSON(
      "sauve_addons",
      []
    ),

  aiostreams:
    localStorage.getItem(
      "sauve_aiostreams"
    ) ||
    "",

  realdebrid:
    localStorage.getItem(
      "sauve_realdebrid"
    ) ||
    ""

};


let currentStreams = [];

let currentPlayableStreams = [];

let currentPlayerIndex = 0;

let currentTitle = null;

let currentSeriesId = "";

let currentSelectedSeason = 1;


/* =========================================================
   EPISODE STORE
========================================================= */

const episodeStore =
  new Map();


/* =========================================================
   STORAGE
========================================================= */

function loadJSON(
  key,
  fallback
){

  try{

    const value =
      localStorage.getItem(
        key
      );

    if(!value){

      return fallback;

    }

    return JSON.parse(
      value
    );

  }
  catch(e){

    return fallback;

  }

}


function saveState(){

  localStorage.setItem(
    "sauve_metadata",
    state.metadata
  );

  localStorage.setItem(
    "sauve_stream",
    state.stream
  );

  localStorage.setItem(
    "sauve_addons",
    JSON.stringify(
      state.addons
    )
  );

  localStorage.setItem(
    "sauve_aiostreams",
    state.aiostreams || ""
  );

  localStorage.setItem(
    "sauve_realdebrid",
    state.realdebrid || ""
  );

}


/* =========================================================
   HELPERS
========================================================= */

function $(id){

  return document.getElementById(
    id
  );

}


function escapeHTML(
  value=""
){

  return String(
    value
  )
  .replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );

}


function normalizeManifest(
  url
){

  return String(
    url || ""
  )
  .trim()
  .replace(
    /\/manifest\.json\/?$/i,
    ""
  );

}


function toHTTP(
  url
){

  let value =
    String(
      url || ""
    )
    .trim();

  if(
    value.startsWith(
      "stremio://"
    )
  ){

    value =
      "https://" +
      value.substring(
        "stremio://".length
      );

  }

  return value;

}


function addonRoot(
  url
){

  return normalizeManifest(
    toHTTP(url)
  ) + "/";

}


async function fetchJSON(
  url
){

  const response =
    await fetch(
      toHTTP(url),
      {
        method:"GET",

        headers:{
          Accept:
            "application/json"
        },

        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  return response.json();

}


/* =========================================================
   CATALOG URL
========================================================= */

function makeExtraProps(
  values
){

  return Object.entries(
    values
  )
  .filter(
    ([,value]) =>
      value !== undefined &&
      value !== null &&
      String(value).length
  )
  .map(
    ([key,value]) =>
      key +
      "=" +
      encodeURIComponent(
        String(value)
      )
  )
  .join("&");

}


function buildCatalogURL(
  addon,
  catalog,
  extra={}
){

  let url =
    addonRoot(
      addon
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );

  const props =
    makeExtraProps(
      extra
    );

  if(props){

    url +=
      "/" +
      props;

  }

  return url +
    ".json";

}


/* =========================================================
   META URL
========================================================= */

function buildMetaURL(
  addon,
  type,
  id
){

  return (
    addonRoot(
      addon
    ) +
    "meta/" +
    encodeURIComponent(
      type
    ) +
    "/" +
    encodeURIComponent(
      id
    ) +
    ".json"
  );

}


/* =========================================================
   STREAM URL
========================================================= */

function buildStreamURL(
  type,
  id
){

  if(!state.stream){

    return "";

  }

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(
      type
    ) +
    "/" +
    encodeURIComponent(
      id
    ) +
    ".json"
  );

}


/* =========================================================
   TV EPISODE STREAM URL
========================================================= */

function buildEpisodeStreamURL(
  seriesId,
  season,
  episode
){

  if(!state.stream){

    return "";

  }

  const episodeId =
    seriesId +
    ":" +
    season +
    ":" +
    episode;

  return (
    addonRoot(
      state.stream
    ) +
    "stream/series/" +
    encodeURIComponent(
      episodeId
    ) +
    ".json"
  );

}


/* =========================================================
   CATALOG NAME
========================================================= */

function prettyCatalogName(
  catalog
){

  const raw =
    String(
      catalog.name ||
      catalog.id ||
      "CATALOG"
    );

  const lower =
    raw.toLowerCase();

  const mappings = [

    ["netflix","NETFLIX"],
    ["disney+","DISNEY+"],
    ["disney","DISNEY+"],
    ["apple tv","APPLE TV+"],
    ["apple","APPLE TV+"],
    ["hbo","HBO"],
    ["max","MAX"],
    ["hulu","HULU"],
    ["prime","PRIME VIDEO"],
    ["amazon","PRIME VIDEO"],
    ["paramount","PARAMOUNT+"],
    ["peacock","PEACOCK"],
    ["marvel","MARVEL"],
    ["dc","DC"],
    ["popular","POPULAR"],
    ["trending","TRENDING"],
    ["featured","FEATURED"],
    ["latest","LATEST"],
    ["digital","DIGITAL RELEASES"],
    ["top","TOP PICKS"],
    ["new","NEW RELEASES"]

  ];

  for(
    const [
      needle,
      label
    ]
    of mappings
  ){

    if(
      lower.includes(
        needle
      )
    ){

      return label;

    }

  }

  return raw.toUpperCase();

}


/* =========================================================
   CATALOG PRIORITY
========================================================= */

function catalogPriority(
  catalog
){

  const name =
    String(
      catalog.name ||
      catalog.id ||
      ""
    )
    .toLowerCase();

  const priority = [

    "featured",
    "trending",
    "popular",
    "netflix",
    "disney",
    "apple",
    "hbo",
    "max",
    "hulu",
    "prime",
    "amazon",
    "paramount",
    "peacock",
    "marvel",
    "dc",
    "latest",
    "digital",
    "top",
    "new"

  ];

  const index =
    priority.findIndex(
      word =>
        name.includes(
          word
        )
    );

  return index < 0
    ? 999
    : index;

}


/* =========================================================
   ADDON MANIFEST
========================================================= */

async function loadAddonManifest(
  addon
){

  const manifestURL =
    normalizeManifest(
      toHTTP(addon)
    ) +
    "/manifest.json";

  return fetchJSON(
    manifestURL
  );

}


/* =========================================================
   EXTERNAL ADDONS
========================================================= */

async function loadExternalAddons(){

  const addons =
    state.addons
      .filter(Boolean);

  if(!addons.length){

    return "";

  }

  let html = "";

  for(
    const addon
    of addons
  ){

    try{

      const manifest =
        await loadAddonManifest(
          addon
        );

      const catalogs =
        Array.isArray(
          manifest.catalogs
        )
          ? manifest.catalogs
          : [];

      for(
        const catalog
        of catalogs.slice(
          0,
          20
        )
      ){

        try{

          const data =
            await fetchJSON(
              buildCatalogURL(
                addon,
                catalog
              )
            );

          const metas =
            Array.isArray(
              data.metas
            )
              ? data.metas
              : [];

          if(!metas.length){

            continue;

          }

          html +=
            renderCatalogRow(
              catalog,
              metas
            );

        }
        catch(e){

          console.warn(
            "Catalog failed:",
            catalog,
            e
          );

        }

      }

    }
    catch(error){

      console.warn(
        "Addon failed:",
        addon,
        error
      );

    }

  }

  return html;

}


/* =========================================================
   HOME
========================================================= */

async function loadHome(){

  const container =
    $("catalogContainer");

  container.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Loading catalogs…

    </div>

  `;

  let mainHTML = "";

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    const usable =
      catalogs
        .filter(
          c =>
            c &&
            c.id &&
            c.type
        )
        .sort(
          (a,b) =>
            catalogPriority(a) -
            catalogPriority(b)
        );

    const selected =
      usable.slice(
        0,
        30
      );

    let featuredMetas = [];

    const results =
      await Promise.allSettled(
        selected.map(
          async catalog => {

            const data =
              await fetchJSON(
                buildCatalogURL(
                  state.metadata,
                  catalog
                )
              );

            return {

              catalog,

              metas:
                Array.isArray(
                  data.metas
                )
                  ? data.metas
                  : []

            };

          }
        )
      );

    results.forEach(
      result => {

        if(
          result.status !==
          "fulfilled"
        ){

          return;

        }

        if(
          !result.value.metas.length
        ){

          return;

        }

        const catalogName = String(
          result.value.catalog.name ||
          result.value.catalog.id ||
          ""
        ).toLowerCase();

        if(
          !featuredMetas.length &&
          (
            catalogName.includes("new") ||
            catalogName.includes("latest") ||
            catalogName.includes("digital") ||
            catalogName.includes("streaming") ||
            catalogName.includes("release") ||
            catalogName.includes("premiere")
          )
        ){
          featuredMetas =
            result.value.metas;
        }

        if(!featuredMetas.length){
          const movieMetas =
            result.value.metas.filter(
              item =>
                String(item.type || "").toLowerCase() === "movie"
            );

          if(movieMetas.length){
            featuredMetas = movieMetas;
          }
        }

        mainHTML +=
          renderCatalogRow(
            result.value.catalog,
            result.value.metas
          );

      }
    );

  }
  catch(error){

    mainHTML += `

      <div class="notice">

        Metadata catalog error:

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }


  try{

    const addonHTML =
      await loadExternalAddons();

    mainHTML +=
      addonHTML;

  }
  catch(error){

    console.warn(
      "External addons failed",
      error
    );

  }


  if(!mainHTML){

    mainHTML = `

      <div class="notice">

        No catalogs could be loaded.

        <br><br>

        Open Settings and verify your
        metadata addon or Stremio list.

      </div>

    `;

  }

  container.innerHTML =
    mainHTML;

}


/* =========================================================
   DEDUPE
========================================================= */

function dedupeMetas(
  metas
){

  const seen =
    new Set();

  return metas.filter(
    item => {

      const key =
        String(
          item.type || ""
        ) +
        "|" +
        String(
          item.id || ""
        );

      if(
        seen.has(key)
      ){

        return false;

      }

      seen.add(key);

      return true;

    }
  );

}

async function openTitle(
  encodedType,
  encodedId
){

  const type =
    decodeURIComponent(
      encodedType
    );

  const id =
    decodeURIComponent(
      encodedId
    );

  currentSeriesId =
    id;

  openModal(`

    <div class="sheet-header">

      <h2>

      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div class="loading">

      <div class="spinner"></div>

      Loading title…

    </div>

  `);


  try{

    const addons = [

      state.metadata,

      ...state.addons

    ]
    .filter(Boolean);


    let meta = null;


    for(
      const addon
      of addons
    ){

      try{

        const data =
          await fetchJSON(
            buildMetaURL(
              addon,
              type,
              id
            )
          );

        if(
          data &&
          (
            data.meta ||
            data.name
          )
        ){

          meta =
            data.meta ||
            data;

          break;

        }

      }
      catch(e){

          "Metadata source failed",
          addon,
          e
        );

      }

    }


    if(!meta){

      throw new Error(
        "Unable to load title information."
      );

    }


    currentTitle =
      meta;


    if(
      type !== "series"
    ){

      renderMovieTitle(
        meta,
        type,
        id
      );

      return;

    }


    renderSeriesTitle(
      meta,
      id

  }
  catch(error){

        ${escapeHTML(
          error.message
        )}

      </div>

    `);

  }

}


/* =========================================================
   POPCORN MOVIES — EXACT TITLE DEEP LINK
========================================================= */
function popcornKind(type){
  const t=String(type||"movie").toLowerCase();
  return (t==="series"||t==="tv"||t==="show") ? "tv" : "movie";
}
function popcornNumericId(v){
  if(v===null||v===undefined)return "";
  const x=String(v).trim();
  if(/^\d+$/.test(x))return x;
  const m=x.match(/(?:tmdb[:/]|themoviedb\.org\/(?:movie|tv)\/)(\d+)/i);
  return m?m[1]:"";
}
function popcornExistingId(meta,id){
  const vals=[id,meta&&meta.tmdbId,meta&&meta.tmdb_id,meta&&meta.tmdb,meta&&meta.ids&&meta.ids.tmdb,meta&&meta.external_ids&&meta.external_ids.tmdb];
  for(const v of vals){const n=popcornNumericId(v);if(n)return n;}
  return "";
}
function popcornIMDb(meta,id){
  const vals=[id,meta&&meta.imdb_id,meta&&meta.imdbId,meta&&meta.imdb,meta&&meta.ids&&meta.ids.imdb,meta&&meta.external_ids&&meta.external_ids.imdb];
  for(const v of vals){if(v){const m=String(v).match(/tt\d{5,12}/i);if(m)return m[0];}}
  return "";
}
async function popcornResolveTMDB(meta,id,type){
  const direct=popcornExistingId(meta,id);
  if(direct)return direct;
  const imdb=popcornIMDb(meta,id);
  if(!imdb)return "";
  try{
    const endpoint="https://v3-cinemeta.strem.io/meta/"+popcornKind(type)+"/"+encodeURIComponent(imdb)+".json";
    const r=await fetch(endpoint,{cache:"no-store"});
    if(r.ok){
      const d=await r.json();
      const m=d&&d.meta?d.meta:d;
      const n=popcornExistingId(m,"");
      if(n)return n;
      const links=Array.isArray(m&&m.links)?m.links:[];
      for(const link of links){
        const n2=popcornNumericId(link&&link.url||"");
        if(n2)return n2;
      }
    }
  }catch(e){console.warn("Popcorn title resolver:",e);}
  return "";
}
async function openPopcornMovies(type,id,meta){
  meta=meta||currentTitle||{};
  const kind=popcornKind(type);
  const title=String(meta.name||meta.title||"").trim();
  const year=String(meta.releaseInfo||meta.year||meta.releaseDate||meta.first_air_date||"").match(/(?:19|20)\d{2}/);
  const tmdb=await popcornResolveTMDB(meta,id,type);
  if(tmdb){
    window.location.href="https://popcornmovies.io/"+kind+"/"+encodeURIComponent(tmdb);
    return;
  }
  /* Do not show the old TMDB error. Open PopcornMovies search instead. */
  const q=[title,year?year[0]:""].filter(Boolean).join(" ");
  window.location.href="https://popcornmovies.io/browse"+(q?"?search="+encodeURIComponent(q):"");
}
function popcornButton(type,id,meta){
  return '<button class="primary" type="button" id="popcornSourceButton" style="margin-top:10px;width:100%;background:linear-gradient(135deg,#ff16d8,#8a4dff,#19eaff);">🍿 OPEN ON POPCORN</button>';
}

/* =========================================================
   SEASONS
========================================================= */

function getSeasons(
  videos
){

  return [
    ...new Set(
      videos
        .map(
          v =>
            Number(
              v.season
            )
        )
        .filter(
          n =>
            Number.isFinite(n) &&
            n > 0
        )
    )
  ]
  .sort(
    (a,b) =>
      a-b
  );

}


/* =========================================================
   SERIES SEASON
========================================================= */

){

          )
      )
      .sort(

          Number(

/* =========================================================
   SELECT EPISODE
========================================================= */

async function selectEpisode(
  key
){

  const episode =
    episodeStore.get(
      key
    );


  if(!episode){

    return;

  }


  const season =
    Number(
      episode.season
    );


  const episodeNumber =
    Number(
      episode.episode ||
      episode.number
    );


  if(
    !season ||
    !episodeNumber
  ){

    alert(
      "This episode is missing its season or episode number."
    );

    return;

  }


  const sources =
    $("episodeSources");


  if(!sources){

    return;

  }


  sources.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      Finding sources for

      <strong>

        ${escapeHTML(
          episode.name ||
          "Episode " +
          episodeNumber
        )}

      </strong>

      …

    </div>

  `;


  try{

    const url =
      buildEpisodeStreamURL(
        currentSeriesId,
        season,
        episodeNumber
      );


    if(!url){

      throw new Error(
        "No stream addon is configured."
      );

    }


    const data =
      await fetchJSON(
        url
      );


    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];


    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );


    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );


    if(
      !currentStreams.length
    ){

      sources.innerHTML = `

        <div class="notice">

          No sources were returned for

          <strong>

            ${escapeHTML(
              episode.name ||
              "Episode " +
              episodeNumber
            )}

          </strong>.

          <br><br>

          Stream addons normally require
          the episode ID in this format:

          <br><br>

          series:id:season:episode

        </div>

      `;

      return;

    }


    sources.innerHTML = `

      <div class="section-title">

        SOURCES

      </div>

      <div class="notice">

        ${currentStreams.length}
        source(s) found for

        <strong>

          S${season}E${episodeNumber}

        </strong>.

        <br><br>

        ${currentPlayableStreams.length}
        potentially browser-compatible.

      </div>


      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    sources.innerHTML = `

      <div class="notice">

        <strong>
          EPISODE SOURCE ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        Episode requested:

        <strong>

          ${escapeHTML(
            currentSeriesId
          )}:${season}:${episodeNumber}

        </strong>

      </div>

    `;

  }

}

/* =========================================================
   STREAM DETECTION
========================================================= */

function getStreamURL(
  stream
){

  return String(
    stream?.url ||
    ""
  ).trim();

}


function isPlayerFrame(
  stream
){

  return Boolean(
    stream?.playerFrameUrl
  );

}


function isExternal(
  stream
){

  return Boolean(
    stream?.externalUrl
  );

}


function isNotWebReady(
  stream
){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}


function isHLS(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".m3u8") ||
    type.includes("m3u8") ||
    type.includes("mpegurl")
  );

}


function isMP4(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".mp4") ||
    type.includes("mp4")
  );

}


function isWebM(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".webm") ||
    type.includes("webm")
  );

}


function isPlayableCandidate(
  stream
){

  if(
    isPlayerFrame(
      stream
    )
  ){

    return true;

  }

  if(
    isExternal(
      stream
    )
  ){

    return false;

  }

  return (
    isMP4(stream) ||
    isHLS(stream) ||
    isWebM(stream)
  );

}


/* =========================================================
   PROVIDER
========================================================= */

function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();


  const providers = [

    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud",
    "torbox",
    "realdebrid",
    "debrid",
    "usenet"

  ];


  for(
    const name
    of providers
  ){

    if(
      text.includes(
        name
      )
    ){

      return name;

    }

  }


  return "stream source";

}


/* =========================================================
   BADGES
========================================================= */

function extractBadges(
  stream
){

  const values = [

    stream.name,

    stream.title,

    stream.description,

    stream.behaviorHints?.proxyHeaders
      ? "proxy"
      : "",

    stream.quality,

    stream.resolution,

    stream.type

  ]
  .filter(Boolean)
  .join(" ")
  .toLowerCase();


  const badges = [];


  const checks = [

    ["4k","4K","good"],
    ["2160","4K","good"],
    ["uhd","UHD","good"],
    ["1080","1080P","blue"],
    ["720","720P","blue"],
    ["hdr10+","HDR10+","good"],
    ["hdr10","HDR10","good"],
    [" dolby vision","DV","good"],
    ["dv ","DV","good"],
    ["atmos","ATMOS","good"],
    ["truehd","TRUEHD","good"],
    ["hevc","HEVC","blue"],
    ["h265","H265","blue"],
    ["h.265","H265","blue"],
    ["av1","AV1","blue"],
    ["web-dl","WEB-DL","blue"],
    ["webdl","WEB-DL","blue"],
    ["bluray","BLURAY","blue"],
    ["blu-ray","BLURAY","blue"],
    ["remux","REMUX","good"],
    ["aac","AAC","blue"],
    ["ac3","AC3","blue"],
    ["eac3","EAC3","blue"],
    ["dd+","DD+","blue"],
    ["7.1","7.1","blue"],
    ["5.1","5.1","blue"],
    ["multi","MULTI","blue"],
    ["dual","DUAL","blue"]

  ];


  for(
    const [
      needle,
      label,
      css
    ]
    of checks
  ){

    if(
      values.includes(
        needle
      )
    ){

      if(
        !badges.some(
          b =>
            b.label ===
            label
        )
      ){

        badges.push({
          label,
          css
        });

      }

    }

  }


  return badges;

}

/* =========================================================
   SCORE
========================================================= */

function compatibilityScore(
  stream
){

  let score = 0;


  if(
    isMP4(stream)
  ){

    score += 100;

  }


  if(
    isHLS(stream)
  ){

    score += 90;

  }


  if(
    isWebM(stream)
  ){

    score += 80;

  }


  if(
    isPlayerFrame(stream)
  ){

    score += 70;

  }


  if(
    isExternal(stream)
  ){

    score -= 100;

  }


  return score;

}


/* =========================================================
   PLAY SOURCE
========================================================= */

function playSource(
  index
){

  const stream =
    currentStreams[index];


  if(!stream){

    return;

  }


  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );


  if(
    currentPlayerIndex < 0
  ){

    currentPlayerIndex = 0;

  }


  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;

  }


  playDirectStream(
    stream
  );

}

/* =========================================================
   NEXT SOURCE
========================================================= */

function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;

  }


  let next =
    currentPlayerIndex + 1;


  if(
    next >=
    currentPlayableStreams.length
  ){

    next = 0;

  }


  currentPlayerIndex =
    next;


  const stream =
    currentPlayableStreams[
      next
    ];


  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }

}

/* =========================================================
   SEARCH SUPPORT
========================================================= */

function supportsSearch(
  catalog
){

  if(
    !Array.isArray(
      catalog.extra
    )
  ){

    return false;

  }


  return catalog.extra.some(
    extra => {

      if(
        typeof extra ===
        "string"
      ){

        return (
          extra ===
          "search"
        );

      }


      return (
        extra &&
        (
          extra.name ===
          "search" ||
          extra.name ===
          "q"
        )
      );

    }
  );

}


/* =========================================================
   SEARCH
========================================================= */

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();


  if(!query){

    focusSearch();

    return;

  }


  $("main").innerHTML = `

    <div class="hero">

      <div class="hero-content">

        <div class="hero-kicker">

          SAUVE SEARCH

        </div>

        <h1>

          ${escapeHTML(
            query
          )}

        </h1>

        <p>

          Searching movies and television…

        </p>

      </div>

    </div>

    <div
      id="searchResults"
      class="loading">

      <div class="spinner"></div>

      Searching…

    </div>

  `;


  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );


    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];


    const searchable =
      catalogs.filter(
        supportsSearch
      );


    const metas = [];


    const responses =
      await Promise.allSettled(

        searchable.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                state.metadata,
                catalog,
                {
                  search:
                    query
                }
              )
            )
        )

      );


    responses.forEach(
      result => {

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );


    for(
      const addon
      of state.addons
    ){

      try{

        const addonManifest =
          await loadAddonManifest(
            addon
          );


        const addonCatalogs =
          Array.isArray(
            addonManifest.catalogs
          )
            ? addonManifest.catalogs
            : [];


        const addonSearchable =
          addonCatalogs.filter(
            supportsSearch
          );


        const addonResults =
          await Promise.allSettled(
            addonSearchable.map(
              catalog =>
                fetchJSON(
                  buildCatalogURL(
                    addon,
                    catalog,
                    {
                      search:
                        query
                    }
                  )
                )
            )
          );


        addonResults.forEach(
          result => {

            if(
              result.status ===
              "fulfilled"
            ){

              metas.push(
                ...(result.value.metas || [])
              );

            }

          }
        );

      }
      catch(e){

        console.warn(
          "Addon search failed",
          e
        );

      }

    }


    const results =
      dedupeMetas(
        metas
      );


    $("searchResults")
      .outerHTML =

      results.length

        ?

        `

          <section>

            <div
              class="catalog-heading">

              <h2
                class="catalog-title">

                RESULTS

              </h2>

              <span
                class="catalog-label">

                ${results.length}

              </span>

            </div>

            <div
              class="row">

              ${results
                .map(
                  renderPosterCard
                )
                .join("")}

            </div>

          </section>

        `

        :

        `

          <div class="notice">

            No results found for

            <strong>

              ${escapeHTML(
                query
              )}

            </strong>.

          </div>

        `;

  }
  catch(error){

    $("searchResults")
      .outerHTML = `

        <div class="notice">

          <strong>
            SEARCH FAILED
          </strong>

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

  }

}

function addAddon(){

  if(!input){

    return;

  }


  const url =
    input.value.trim();


  if(!url){

    alert(
      "Paste a Stremio manifest URL first."
    );

    return;

  }


  if(
    !url.includes(
      "manifest.json"
    )
  ){

    alert(
      "The URL should point to a Stremio manifest.json."
    );

    return;

  }


  if(
    state.addons.includes(
      url
    )
  ){

    alert(
      "That list is already added."
    );

    return;

  }


  state.addons.push(
    url
  );


  saveState();

  openSettings();

}

      "Enter a metadata manifest."
    );

    return;

  }


  state.metadata =
    metadata;


  state.stream =
    stream ||
    aiostreams ||
    "";

  state.aiostreams =
    aiostreams;

  state.realdebrid =
    realdebrid;


  saveState();


  closeModal();


  location.reload();

}


/* =========================================================
   UI
========================================================= */

function focusSearch(){

  const input =
    $("searchInput");

  if(!input){

    return;

  }

  input.focus();

  /*
    On iPhone, scrolling the input
    into view gives a much more
    native search experience.
  */

  setTimeout(
    () => {

      input.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },
    100
  );

}


function goHome(){

  location.reload();

}


function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

  document.body
    .classList
    .add("modal-open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

  document.body
    .classList
    .remove("modal-open");

}


/* =========================================================
   MODAL BACKDROP
========================================================= */

$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


/* =========================================================
   iPHONE SHEET SWIPE
========================================================= */

let modalStartY = 0;

let modalCurrentY = 0;


$("sheet")
  .addEventListener(
    "touchstart",
    event => {

      if(
        event.touches.length !== 1
      ){

        return;

      }

      modalStartY =
        event.touches[0].clientY;

      modalCurrentY =
        modalStartY;

    },
    {
      passive:true
    }
  );


$("sheet")
  .addEventListener(
    "touchmove",
    event => {

      if(
        event.touches.length !== 1
      ){

        return;

      }

      modalCurrentY =
        event.touches[0].clientY;

    },
    {
      passive:true
    }
  );


$("sheet")
  .addEventListener(
    "touchend",
    () => {

      const distance =
        modalCurrentY -
        modalStartY;

      if(
        distance > 120
      ){

        closeModal();

      }

    }
  );


/* =========================================================
   EVENT DELEGATION
========================================================= */

document.addEventListener(
  "click",
  event => {

    const poster =
      event.target.closest(
        ".poster-card"
      );

    if(poster){

      const type =
        poster.dataset.type;

      const id =
        poster.dataset.id;

      if(
        type &&
        id
      ){

        openTitle(
          type,
          id
        );

      }

      return;

    }


    const episode =
      event.target.closest(
        ".episode"
      );

    if(episode){

      const key =
        episode.dataset.episodeKey;

      if(key){

        selectEpisode(
          key
        );

      }

      return;

    }


    const source =
      event.target.closest(
        ".source"
      );

    if(source){

      const index =
        Number(
          source.dataset.sourceIndex
        );

      if(
        Number.isFinite(index)
      ){

        if(
          isPlayableCandidate(
            currentStreams[index]
          )
        ){

          playSource(
            index
          );

        }
        else{

          explainSource(
            index
          );

        }

      }

    }

  }
);


/* =========================================================
   SEARCH EVENTS
========================================================= */

$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        performSearch();

      }

    }
  );


/* =========================================================
   PWA
========================================================= */

function isSAUVEStandalone(){

  return (

    window.matchMedia(
      "(display-mode: standalone)"
    ).matches ||

    window.navigator.standalone === true

  );

}


if(
  isSAUVEStandalone()
){

  document.documentElement
    .classList
    .add(
      "sauve-standalone"
    );

}


if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./service-worker.js",
          {
            scope:"./"
          }
        )
        .then(
          registration => {

            console.log(
              "SAUVE PWA ready:",
              registration.scope
            );

          }
        )
        .catch(
          error => {

            console.warn(
              "SAUVE PWA unavailable:",
              error
            );

          }
        );

    }
  );

}


/* =========================================================
   START
========================================================= */

loadHome();

</script>

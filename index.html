<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#170b2a;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --muted:#9d91a7;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(circle at 50% -10%,rgba(138,77,255,.38),transparent 35%),
    radial-gradient(circle at 0 45%,rgba(255,22,216,.13),transparent 30%),
    radial-gradient(circle at 100% 55%,rgba(25,234,255,.10),transparent 30%),
    #05030b;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    15px;

  background:rgba(5,3,11,.94);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border-bottom:1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;

  font-family:
    Impact,
    Haettenschweiler,
    "Arial Narrow Bold",
    sans-serif;

  font-style:italic;

  font-size:clamp(70px,19vw,125px);

  line-height:.78;

  letter-spacing:7px;

  transform:skewX(-7deg);

  color:#fff;

  text-shadow:
    0 0 4px #fff,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;

  text-align:center;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:4px;

  text-shadow:0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;

  max-width:900px;

  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;

  padding:14px;

  border-radius:8px;

  background:#0c0715;

  color:#fff;

  border:1px solid rgba(138,77,255,.45);

  outline:none;
}

.searchbar button{
  padding:0 18px;

  border:0;
  border-radius:8px;

  color:#fff;

  font-weight:900;

  background:linear-gradient(
    135deg,
    var(--pink),
    var(--purple)
  );
}

/* MAIN */

main{
  width:100%;
  max-width:1450px;

  margin:auto;

  padding:16px 16px 105px;
}

.hero{
  position:relative;

  min-height:clamp(390px,58vh,600px);

  overflow:hidden;

  display:flex;
  align-items:flex-end;

  padding:clamp(25px,5vw,60px);

  border-radius:18px;

  border:1px solid rgba(255,22,216,.25);

  background:
    radial-gradient(circle at 75% 35%,rgba(25,234,255,.13),transparent 25%),
    radial-gradient(circle at 70% 75%,rgba(255,22,216,.20),transparent 32%),
    linear-gradient(110deg,#090511,#190c2e,#07121e);
}

.hero:before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(5,3,11,.98),
      rgba(5,3,11,.72) 50%,
      rgba(5,3,11,.05)
    );
}

.hero:after{
  content:"";

  position:absolute;
  inset:0;

  opacity:.09;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.18) 4px
    );
}

.hero-content{
  position:relative;
  z-index:3;

  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);

  font-size:10px;

  font-weight:900;

  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;

  font-family:Impact,Haettenschweiler,sans-serif;

  font-size:clamp(46px,9vw,95px);

  line-height:.85;

  text-transform:uppercase;

  text-shadow:0 0 20px rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;

  line-height:1.6;

  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;

  gap:10px;

  margin-top:20px;
}

.primary,
.secondary{
  padding:13px 18px;

  border-radius:8px;

  font-weight:900;
}

.primary{
  border:0;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--pink),
      var(--purple)
    );

  box-shadow:
    0 0 18px rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);

  background:rgba(25,234,255,.04);

  border:1px solid rgba(25,234,255,.38);
}

/* SECTIONS */

section{
  margin:32px 0;
}

.heading{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:15px;
  padding-bottom:10px;

  border-bottom:1px solid rgba(255,22,216,.18);
}

.heading h2{
  margin:0;

  font-family:Impact,Haettenschweiler,sans-serif;

  font-size:25px;

  letter-spacing:1px;
}

.heading span{
  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;
}

.empty{
  padding:28px 5px;

  color:var(--muted);

  font-size:13px;
}

.notice{
  padding:16px;

  border-radius:9px;

  background:rgba(255,22,216,.045);

  border:1px solid rgba(255,22,216,.17);

  color:#c8bacf;

  line-height:1.6;

  font-size:12px;
}

/* GRID */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:13px;
}

.card{
  padding:0;

  overflow:hidden;

  text-align:left;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      #170d27,
      #0d0717
    );

  border:1px solid rgba(255,255,255,.08);

  border-radius:10px;
}

.poster{
  display:block;

  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;

  background:#171027;
}

.card-info{
  padding:11px;
}

.card-title{
  font-size:14px;

  font-weight:850;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.card-sub{
  margin-top:5px;

  color:var(--muted);

  font-size:10px;
}

/* MODAL */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:flex-end;

  background:rgba(0,0,0,.88);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:95vh;

  overflow:auto;

  padding:
    20px
    18px
    calc(30px + env(safe-area-inset-bottom));

  border-radius:22px 22px 0 0;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(138,77,255,.18),
      transparent 40%
    ),
    #0c0718;

  border-top:1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;

  font-family:Impact,Haettenschweiler,sans-serif;

  font-size:27px;
}

.close{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#170d27;

  color:var(--cyan);

  border:1px solid rgba(25,234,255,.3);

  font-size:22px;
}

/* DETAILS */

.details{
  display:grid;

  grid-template-columns:105px 1fr;

  gap:16px;
}

.details img{
  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;
}

.details p{
  color:#c3b5cb;

  line-height:1.55;

  font-size:13px;
}

.meta{
  color:var(--cyan);

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:7px;
}

/* SERIES */

.season-select{
  width:100%;

  padding:13px;

  margin:20px 0 12px;

  border-radius:8px;

  background:#10091d;

  color:#fff;

  border:1px solid rgba(138,77,255,.4);

  outline:none;
}

.episode{
  width:100%;

  display:flex;

  gap:12px;

  align-items:center;

  margin-top:9px;

  padding:13px;

  text-align:left;

  color:#fff;

  background:#120a20;

  border:1px solid rgba(255,255,255,.08);

  border-radius:9px;
}

.episode-number{
  min-width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:8px;

  color:var(--cyan);

  background:rgba(25,234,255,.08);

  font-weight:900;
}

.episode-title{
  font-weight:800;

  font-size:13px;
}

.episode-desc{
  margin-top:4px;

  color:#8e8198;

  font-size:10px;
}

/* SOURCES */

.source{
  width:100%;

  margin-top:9px;

  padding:14px;

  text-align:left;

  color:#fff;

  border-radius:9px;

  background:
    linear-gradient(
      100deg,
      #150c29,
      #0d0819
    );

  border:1px solid rgba(25,234,255,.15);
}

.source:disabled{
  cursor:not-allowed;
}

.source-top{
  display:flex;

  align-items:center;

  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:var(--cyan);

  background:rgba(25,234,255,.08);
}

.source-name{
  font-weight:900;
}

.provider{
  margin-top:4px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;
}

.badges{
  margin-top:8px;
}

.badge{
  display:inline-block;

  padding:4px 7px;

  margin-right:5px;

  border-radius:5px;

  background:rgba(255,22,216,.10);

  color:#ff7be4;

  font-size:8px;

  font-weight:900;

  letter-spacing:.7px;
}

.badge.good{
  background:rgba(66,255,176,.10);

  color:var(--green);
}

.badge.warning{
  background:rgba(255,212,90,.10);

  color:var(--yellow);
}

/* PLAYER */

.player-shell{
  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#000;

  border:1px solid rgba(25,234,255,.25);

  box-shadow:0 0 30px rgba(25,234,255,.08);
}

video{
  display:block;

  width:100%;

  height:auto;

  min-height:180px;

  max-height:70vh;

  background:#000;
}

.player-status{
  padding:11px 13px;

  background:#0e0818;

  border-top:1px solid rgba(255,255,255,.07);

  color:#aaa;

  font-size:11px;
}

.player-status.ready{
  color:var(--green);
}

.player-status.error{
  color:var(--red);
}

.player-controls{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:12px;
}

.player-button{
  padding:10px 13px;

  border-radius:7px;

  color:#fff;

  background:#170d27;

  border:1px solid rgba(255,255,255,.1);

  font-weight:800;

  font-size:11px;
}

/* SETTINGS */

.field{
  margin:18px 0;
}

.field label{
  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;

  text-transform:uppercase;
}

.field input{
  width:100%;

  padding:13px;

  border-radius:7px;

  background:#080510;

  color:#fff;

  border:1px solid rgba(138,77,255,.3);

  outline:none;
}

/* NAV */

.nav{
  position:fixed;

  z-index:400;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  padding-bottom:env(safe-area-inset-bottom);

  display:flex;

  align-items:center;
  justify-content:space-around;

  background:rgba(8,5,17,.96);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-top:1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;

  background:none;

  color:#766a80;

  font-size:9px;

  letter-spacing:1px;
}

.nav button span{
  display:block;

  font-size:22px;

  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);

  text-shadow:0 0 10px var(--pink);
}

@media(min-width:700px){

  .grid{
    grid-template-columns:
      repeat(5,minmax(0,1fr));
  }

  .details{
    grid-template-columns:190px 1fr;
  }

  .details img{
    width:190px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">SAUVE</div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>

<main id="main">

  <div class="hero">

    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Discover movies and television,
        explore seasons and episodes,
        and find available sources.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button
          class="secondary"
          onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>

    </div>

  </div>

  <section>

    <div class="heading">

      <h2>DISCOVER</h2>

      <span>AIO METADATA</span>

    </div>

    <div
      id="homeResults"
      class="empty">

      Loading…

    </div>

  </section>

</main>

<nav class="nav">

  <button
    class="active"
    onclick="goHome()">

    <span>⌂</span>
    HOME

  </button>

  <button
    onclick="focusSearch()">

    <span>⌕</span>
    SEARCH

  </button>

  <button
    onclick="openSettings()">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>

<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>

<script>

/* ============================================================
   CONFIG
============================================================ */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const state = {

  metadata:
    localStorage.getItem("sauve_metadata")
    ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem("sauve_stream")
    ||
    ""

};

let currentStreams = [];

let currentPlayableStreams = [];

let currentPlayerIndex = 0;

let currentTitleType = "";

let currentTitleId = "";


/* ============================================================
   HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}

function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(
      /\/manifest\.json\/?$/i,
      ""
    );

}

function addonRoot(url){

  return normalizeManifest(url) + "/";
}

async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " + response.status
    );

  }

  return response.json();

}


/* ============================================================
   METADATA
============================================================ */

async function getManifest(){

  return fetchJSON(
    state.metadata
  );

}

function supportsSearch(catalog){

  return Array.isArray(catalog.extra)
    &&
    catalog.extra.some(
      extra =>
        typeof extra === "string"
          ? extra === "search"
          : extra &&
            extra.name === "search"
    );

}

function getSearchCatalogs(manifest){

  return (
    Array.isArray(manifest.catalogs)
      ? manifest.catalogs
      : []
  )
  .filter(
    catalog =>
      catalog &&
      catalog.id &&
      catalog.type &&
      supportsSearch(catalog)
  );

}

function makeExtraProps(values){

  return Object.entries(values)
    .filter(
      ([,value]) =>
        value !== undefined &&
        value !== null &&
        String(value).length
    )
    .map(
      ([key,value]) =>
        key +
        "=" +
        encodeURIComponent(
          String(value)
        )
    )
    .join("&");

}

function buildCatalogURL(catalog,extra={}){

  let url =
    addonRoot(state.metadata) +
    "catalog/" +
    encodeURIComponent(catalog.type) +
    "/" +
    encodeURIComponent(catalog.id);

  const props =
    makeExtraProps(extra);

  if(props){

    url += "/" + props;

  }

  return url + ".json";

}


/* ============================================================
   HOME
============================================================ */

async function loadHome(){

  const box =
    $("homeResults");

  try{

    const manifest =
      await getManifest();

    const catalogs =
      Array.isArray(manifest.catalogs)
        ? manifest.catalogs
        : [];

    const selected = [];

    ["movie","series"]
      .forEach(type => {

        const catalog =
          catalogs.find(
            c =>
              c &&
              c.type === type
          );

        if(catalog){
          selected.push(catalog);
        }

      });

    if(!selected.length){

      box.innerHTML = `
        <div class="notice">
          No movie or series catalogs
          were advertised by the metadata addon.
        </div>
      `;

      return;

    }

    const responses =
      await Promise.allSettled(
        selected.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(catalog)
            )
        )
      );

    const metas = [];

    responses.forEach(result => {

      if(
        result.status === "fulfilled"
      ){

        metas.push(
          ...(result.value.metas || [])
        );

      }

    });

    box.innerHTML =
      renderGrid(
        dedupeMetas(metas)
      );

  }
  catch(error){

    box.innerHTML = `
      <div class="notice">

        <strong>
          METADATA ERROR
        </strong>

        <br><br>

        ${escapeHTML(error.message)}

      </div>
    `;

  }

}


/* ============================================================
   SEARCH
============================================================ */

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();

  if(!query){

    focusSearch();

    return;

  }

  $("main").innerHTML = `

    <section>

      <div class="heading">

        <h2>SEARCH</h2>

        <span>
          ${escapeHTML(query)}
        </span>

      </div>

      <div
        id="searchResults"
        class="empty">

        Searching…

      </div>

    </section>

  `;

  try{

    const manifest =
      await getManifest();

    const catalogs =
      getSearchCatalogs(
        manifest
      );

    if(!catalogs.length){

      throw new Error(
        "No searchable catalogs were advertised by the metadata manifest."
      );

    }

    const responses =
      await Promise.allSettled(
        catalogs.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog,
                {
                  search:query
                }
              )
            )
        )
      );

    const metas = [];

    responses.forEach(result => {

      if(
        result.status === "fulfilled"
      ){

        metas.push(
          ...(result.value.metas || [])
        );

      }

    });

    const results =
      dedupeMetas(metas);

    $("searchResults").innerHTML =
      results.length
        ? renderGrid(results)
        : `
          <div class="notice">
            No results found for
            <strong>
              ${escapeHTML(query)}
            </strong>.
          </div>
        `;

  }
  catch(error){

    $("searchResults").innerHTML = `
      <div class="notice">

        <strong>
          SEARCH FAILED
        </strong>

        <br><br>

        ${escapeHTML(error.message)}

      </div>
    `;

  }

}


/* ============================================================
   GRID
============================================================ */

function dedupeMetas(metas){

  const seen =
    new Set();

  return metas.filter(item => {

    const key =
      String(item.type || "") +
      "|" +
      String(item.id || "");

    if(seen.has(key)){
      return false;
    }

    seen.add(key);

    return true;

  });

}

function renderGrid(metas){

  if(
    !metas ||
    !metas.length
  ){

    return `
      <div class="empty">
        No results.
      </div>
    `;

  }

  return `
    <div class="grid">

      ${metas.map(item => {

        const type =
          encodeURIComponent(
            item.type || "movie"
          );

        const id =
          encodeURIComponent(
            item.id || ""
          );

        return `

          <button
            class="card"
            onclick="openTitle('${type}','${id}')">

            <img
              class="poster"
              src="${escapeHTML(
                item.poster ||
                item.logo ||
                ""
              )}"
              loading="lazy"
              onerror="this.style.opacity='0'">

            <div class="card-info">

              <div class="card-title">

                ${escapeHTML(
                  item.name ||
                  "Untitled"
                )}

              </div>

              <div class="card-sub">

                ${escapeHTML(
                  item.releaseInfo ||
                  item.year ||
                  item.type ||
                  ""
                )}

              </div>

            </div>

          </button>

        `;

      }).join("")}

    </div>
  `;

}


/* ============================================================
   TITLE
============================================================ */

async function openTitle(
  encodedType,
  encodedId
){

  const type =
    decodeURIComponent(encodedType);

  const id =
    decodeURIComponent(encodedId);

  currentTitleType = type;
  currentTitleId = id;

  openModal(`

    <div class="sheet-header">

      <h2>LOADING</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="empty">
      Loading title…
    </div>

  `);

  try{

    const url =
      addonRoot(state.metadata) +
      "meta/" +
      encodeURIComponent(type) +
      "/" +
      encodeURIComponent(id) +
      ".json";

    const data =
      await fetchJSON(url);

    const meta =
      data.meta || data;

    const isSeries =
      type === "series";

    openModal(`

      <div class="sheet-header">

        <h2>
          ${escapeHTML(
            meta.name || "TITLE"
          )}
        </h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>

      <div class="details">

        <img
          src="${escapeHTML(
            meta.poster ||
            meta.logo ||
            ""
          )}">

        <div>

          <div class="meta">

            ${escapeHTML(
              meta.releaseInfo ||
              meta.year ||
              type
            )}

          </div>

          <p>

            ${escapeHTML(
              meta.description ||
              "No description available."
            )}

          </p>

          ${
            isSeries
              ?
              `
                <button
                  class="primary"
                  onclick="showSeriesEpisodes()">

                  ▶ SELECT EPISODE

                </button>
              `
              :
              `
                <button
                  class="primary"
                  onclick="findSources(
                    '${escapeHTML(type)}',
                    '${escapeHTML(id)}'
                  )">

                  ▶ FIND SOURCES

                </button>
              `
          }

        </div>

      </div>

      <div id="seriesArea"></div>

      <div id="sources"></div>

    `);

    if(isSeries){

      await showSeriesEpisodes();

    }

  }
  catch(error){

    openModal(`

      <div class="sheet-header">

        <h2>ERROR</h2>

        <button
          class="close"
          onclick="closeModal()">
          ×
        </button>

      </div>

      <div class="notice">

        ${escapeHTML(error.message)}

      </div>

    `);

  }

}


/* ============================================================
   SERIES / EPISODES
============================================================ */

async function showSeriesEpisodes(){

  const area =
    $("seriesArea");

  if(!area){
    return;
  }

  area.innerHTML = `
    <div class="empty">
      Loading seasons…
    </div>
  `;

  try{

    const url =
      addonRoot(state.metadata) +
      "meta/" +
      encodeURIComponent(currentTitleType) +
      "/" +
      encodeURIComponent(currentTitleId) +
      ".json";

    const data =
      await fetchJSON(url);

    const meta =
      data.meta || data;

    const videos =
      Array.isArray(meta.videos)
        ? meta.videos
        : [];

    if(!videos.length){

      area.innerHTML = `
        <div class="notice">
          This series did not return
          episode information.
        </div>
      `;

      return;

    }

    const seasons =
      [...new Set(
        videos.map(
          v => Number(v.season || 1)
        )
      )]
      .sort(
        (a,b) => a-b
      );

    area.innerHTML = `

      <select
        class="season-select"
        id="seasonSelect">

        ${seasons.map(
          season => `
            <option value="${season}">
              Season ${season}
            </option>
          `
        ).join("")}

      </select>

      <div id="episodeList"></div>

    `;

    $("seasonSelect")
      .addEventListener(
        "change",
        () =>
          renderEpisodes(
            videos,
            Number(
              $("seasonSelect").value
            )
          )
      );

    renderEpisodes(
      videos,
      seasons[0]
    );

  }
  catch(error){

    area.innerHTML = `
      <div class="notice">

        ${escapeHTML(error.message)}

      </div>
    `;

  }

}

function renderEpisodes(
  videos,
  season
){

  const list =
    $("episodeList");

  if(!list){
    return;
  }

  const episodes =
    videos
      .filter(
        v =>
          Number(v.season || 1)
          === season
      )
      .sort(
        (a,b) =>
          Number(a.episode || 0)
          -
          Number(b.episode || 0)
      );

  list.innerHTML =
    episodes.length
      ?
      episodes.map(
        episode => {

          const episodeId =
            episode.id ||
            `${currentTitleId}:${season}:${episode.episode}`;

          return `

            <button
              class="episode"
              onclick="findEpisodeSources(
                'series',
                '${escapeHTML(episodeId)}'
              )">

              <div class="episode-number">

                ${escapeHTML(
                  episode.episode ||
                  "?"
                )}

              </div>

              <div>

                <div class="episode-title">

                  ${escapeHTML(
                    episode.title ||
                    `Episode ${episode.episode || ""}`
                  )}

                </div>

                <div class="episode-desc">

                  ${escapeHTML(
                    episode.overview ||
                    ""
                  )}

                </div>

              </div>

            </button>

          `;

        }
      ).join("")
      :
      `
        <div class="empty">
          No episodes found.
        </div>
      `;

}


/* ============================================================
   STREAM
============================================================ */

function buildStreamURL(
  type,
  id
){

  return (
    addonRoot(state.stream) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}

async function findEpisodeSources(
  type,
  id
){

  await findSources(
    type,
    id
  );

}


/* ============================================================
   SOURCE DETECTION
============================================================ */

function getStreamURL(stream){

  return String(
    stream?.url || ""
  ).trim();

}

function getStreamType(stream){

  return String(
    stream?.type ||
    ""
  ).toLowerCase();

}

function isHLS(stream){

  const url =
    getStreamURL(stream)
      .toLowerCase();

  const type =
    getStreamType(stream);

  return (
    type.includes("mpegurl") ||
    type.includes("m3u8") ||
    url.includes(".m3u8")
  );

}

function isMP4(stream){

  const url =
    getStreamURL(stream)
      .toLowerCase();

  const type =
    getStreamType(stream);

  return (
    type.includes("mp4") ||
    type.includes("video/mp4") ||
    url.includes(".mp4")
  );

}

function isWebM(stream){

  const url =
    getStreamURL(stream)
      .toLowerCase();

  const type =
    getStreamType(stream);

  return (
    type.includes("webm") ||
    type.includes("video/webm") ||
    url.includes(".webm")
  );

}

function isDirectVideo(stream){

  return (
    isHLS(stream) ||
    isMP4(stream) ||
    isWebM(stream)
  );

}

function hasPlayerFrame(stream){

  return Boolean(
    stream?.playerFrameUrl
  );

}

function isExternal(stream){

  return Boolean(
    stream?.externalUrl
  );

}

function providerName(stream){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  const providers = [
    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud",
    "pengu",
    "penguplay"
  ];

  for(
    const provider of providers
  ){

    if(text.includes(provider)){
      return provider;
    }

  }

  return "stream source";

}


/* ============================================================
   SOURCE SCORE
============================================================ */

function compatibilityScore(stream){

  let score = 0;

  if(isMP4(stream)){
    score += 100;
  }

  if(isHLS(stream)){
    score += 95;
  }

  if(isWebM(stream)){
    score += 85;
  }

  if(hasPlayerFrame(stream)){
    score += 60;
  }

  if(
    stream?.behaviorHints
      ?.notWebReady
  ){
    score -= 10;
  }

  if(isExternal(stream)){
    score -= 100;
  }

  return score;

}


/* ============================================================
   SOURCE UI
============================================================ */

function renderSource(
  stream,
  index
){

  const direct =
    isDirectVideo(stream);

  const frame =
    hasPlayerFrame(stream);

  const playable =
    direct || frame;

  let format =
    "SOURCE";

  if(isMP4(stream)){
    format = "MP4";
  }
  else if(isHLS(stream)){
    format = "HLS";
  }
  else if(isWebM(stream)){
    format = "WEBM";
  }
  else if(frame){
    format = "PLAYER";
  }

  return `

    <button
      class="source"
      ${playable
        ? `onclick="playSource(${index})"`
        : `disabled`
      }
      style="
        ${playable
          ? ""
          : "opacity:.48;cursor:not-allowed;"
        }
      ">

      <div class="source-top">

        <div class="source-icon">

          ${playable ? "▶" : "×"}

        </div>

        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>

          <div class="provider">

            ${escapeHTML(
              providerName(stream)
            )}

          </div>

        </div>

      </div>

      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : ""}
        ">

          ${format}

        </span>

        ${
          stream?.behaviorHints
            ?.notWebReady
            ?
            `
              <span class="badge warning">
                PROVIDER FLAG
              </span>
            `
            :
            `
              <span class="badge good">
                DETECTED
              </span>
            `
        }

      </div>

    </button>

  `;

}


/* ============================================================
   FIND SOURCES
============================================================ */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }

  const box =
    $("sources");

  if(!box){
    return;
  }

  box.innerHTML = `
    <div class="empty">
      Loading stream sources…
    </div>
  `;

  try{

    const data =
      await fetchJSON(
        buildStreamURL(type,id)
      );

    currentStreams =
      Array.isArray(data.streams)
        ? data.streams
        : [];

    if(!currentStreams.length){

      box.innerHTML = `
        <div class="notice">

          No stream sources were returned
          for this title or episode.

        </div>
      `;

      return;

    }

    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );

    currentPlayableStreams =
      currentStreams.filter(
        stream =>
          isDirectVideo(stream) ||
          hasPlayerFrame(stream)
      );

    box.innerHTML = `

      <div class="heading">

        <h2>SOURCES</h2>

        <span>
          ${currentStreams.length}
        </span>

      </div>

      <div class="notice">

        ${currentPlayableStreams.length}
        source(s) can be attempted by
        the SAUVE player.

        <br><br>

        Sources that aren't directly
        browser-playable are shown separately
        rather than pretending they are video.

      </div>

      ${currentStreams
        .map(renderSource)
        .join("")}

    `;

  }
  catch(error){

    box.innerHTML = `
      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>
    `;

  }

}


/* ============================================================
   PLAY SOURCE
============================================================ */

function playSource(index){

  const stream =
    currentStreams[index];

  if(!stream){
    return;
  }

  currentPlayerIndex =
    currentPlayableStreams.indexOf(stream);

  if(currentPlayerIndex < 0){
    currentPlayerIndex = 0;
  }

  if(hasPlayerFrame(stream)){

    openEmbeddedPlayer(stream);

    return;

  }

  playDirectStream(stream);

}


/* ============================================================
   DIRECT PLAYER
============================================================ */

function playDirectStream(stream){

  const url =
    getStreamURL(stream);

  if(!url){

    showPlayerError(
      "The source did not return a media URL."
    );

    return;

  }

  let mime = "";

  if(isHLS(stream)){
    mime = "application/vnd.apple.mpegurl";
  }
  else if(isMP4(stream)){
    mime = "video/mp4";
  }
  else if(isWebM(stream)){
    mime = "video/webm";
  }

  openModal(`

    <div class="sheet-header">

      <h2>NOW PLAYING</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata"
        ${mime
          ? `type="${mime}"`
          : ""
        }>
      </video>

      <div
        id="playerStatus"
        class="player-status">

        Checking source…

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

  const video =
    $("sauveVideo");

  const status =
    $("playerStatus");

  if(!video){
    return;
  }

  if(
    isHLS(stream) &&
    !video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ){

    status.textContent =
      "Safari does not report native HLS support for this source.";

    status.className =
      "player-status error";

    return;

  }

  if(
    isMP4(stream) &&
    !video.canPlayType("video/mp4")
  ){

    status.textContent =
      "Safari does not report MP4 support for this source.";

    status.className =
      "player-status error";

    return;

  }

  if(
    isWebM(stream) &&
    !video.canPlayType("video/webm")
  ){

    status.textContent =
      "Safari does not report WebM support for this source.";

    status.className =
      "player-status error";

    return;

  }

  status.textContent =
    "Loading video…";

  try{

    video.src = url;

    video.load();

  }
  catch(error){

    showPlayerError(
      error.message
    );

    return;

  }

  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {once:true}
  );

  video.addEventListener(
    "canplay",
    () => {

      status.textContent =
        "Ready";

      status.className =
        "player-status ready";

    },
    {once:true}
  );

  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );

  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );

  video.addEventListener(
    "error",
    () => {

      const error =
        video.error;

      let message =
        "Safari could not play this source.";

      if(error){

        switch(error.code){

          case MediaError.MEDIA_ERR_ABORTED:
            message =
              "Playback was aborted.";
            break;

          case MediaError.MEDIA_ERR_NETWORK:
            message =
              "The video server or network rejected the media request.";
            break;

          case MediaError.MEDIA_ERR_DECODE:
            message =
              "Safari received the source but could not decode its video format or codec.";
            break;

          case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:
            message =
              "Safari does not support the returned media format, MIME type, or source URL.";
            break;

        }

      }

      showPlayerError(message);

    }
  );

}


/* ============================================================
   EMBEDDED PROVIDER PLAYER
============================================================ */

function openEmbeddedPlayer(stream){

  const url =
    String(
      stream.playerFrameUrl || ""
    ).trim();

  if(!url){

    showPlayerError(
      "No provider player URL was returned."
    );

    return;

  }

  openModal(`

    <div class="sheet-header">

      <h2>PROVIDER PLAYER</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <div
        style="
          width:100%;
          aspect-ratio:16/9;
          background:#000;
        ">

        <iframe
          src="${escapeHTML(url)}"
          style="
            width:100%;
            height:100%;
            border:0;
          "
          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "
          allowfullscreen>
        </iframe>

      </div>

      <div class="player-status ready">

        Provider player loaded.

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

}


/* ============================================================
   PLAYER ERRORS
============================================================ */

function showPlayerError(message){

  const status =
    $("playerStatus");

  if(!status){
    return;
  }

  status.textContent =
    message;

  status.className =
    "player-status error";

}


/* ============================================================
   NEXT SOURCE
============================================================ */

function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No browser-playable sources were detected."
    );

    return;

  }

  let next =
    currentPlayerIndex + 1;

  if(
    next >=
    currentPlayableStreams.length
  ){

    next = 0;

  }

  currentPlayerIndex =
    next;

  const stream =
    currentPlayableStreams[next];

  if(hasPlayerFrame(stream)){

    openEmbeddedPlayer(stream);

  }
  else{

    playDirectStream(stream);

  }

}


/* ============================================================
   SHOW SOURCES
============================================================ */

function showSourcesAgain(){

  openModal(`

    <div class="sheet-header">

      <h2>SOURCES</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    ${
      currentStreams.length
        ?
        currentStreams
          .map(renderSource)
          .join("")
        :
        `
          <div class="empty">
            No sources available.
          </div>
        `
    }

  `);

}


/* ============================================================
   SETTINGS
============================================================ */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>SAUVE SETTINGS</h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>

    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"
        placeholder="Paste your stream manifest">

    </div>

    <div class="notice">

      Your manifest addresses are stored
      locally in this browser.

      <br><br>

      SAUVE does not bypass DRM,
      authentication, CORS, or provider
      restrictions.

    </div>

    <br>

    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);

}

function saveSettings(){

  const metadata =
    $("metadataURL")
      .value
      .trim();

  const stream =
    $("streamURL")
      .value
      .trim();

  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;

  }

  state.metadata =
    metadata;

  state.stream =
    stream;

  localStorage.setItem(
    "sauve_metadata",
    metadata
  );

  localStorage.setItem(
    "sauve_stream",
    stream
  );

  closeModal();

  location.reload();

}


/* ============================================================
   UI
============================================================ */

function focusSearch(){

  const input =
    $("searchInput");

  if(input){

    input.focus();

    input.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });

  }

}

function goHome(){

  location.reload();

}

function openModal(html){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}

function closeModal(){

  const video =
    $("sauveVideo");

  if(video){

    try{
      video.pause();
    }
    catch(e){}

    video.removeAttribute("src");

    video.load();

  }

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}

$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );

$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );

$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        performSearch();

      }

    }
  );


/* ============================================================
   START
============================================================ */

loadHome();

</script>

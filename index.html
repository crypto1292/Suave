<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#160b27;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --muted:#a999b0;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;

  background:
    radial-gradient(circle at 50% -10%,rgba(138,77,255,.35),transparent 36%),
    radial-gradient(circle at 0 45%,rgba(255,22,216,.13),transparent 30%),
    radial-gradient(circle at 100% 55%,rgba(25,234,255,.10),transparent 30%),
    #05030b;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:100;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    14px;

  background:rgba(5,3,11,.94);

  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border-bottom:1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;

  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;

  font-style:italic;

  font-size:clamp(65px,18vw,115px);

  line-height:.78;

  letter-spacing:7px;

  transform:skewX(-7deg);

  color:#fff;

  text-shadow:
    0 0 4px #fff,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;

  text-align:center;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:4px;

  text-shadow:0 0 10px var(--cyan);
}

/* =========================
   SEARCH
========================= */

.searchbar{
  display:flex;
  gap:8px;

  max-width:900px;

  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;

  padding:14px;

  border-radius:8px;

  background:#0c0715;

  color:white;

  border:1px solid rgba(138,77,255,.45);

  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);

  box-shadow:0 0 18px rgba(255,22,216,.18);
}

.searchbar button{
  padding:0 18px;

  border:0;
  border-radius:8px;

  color:white;

  font-weight:900;

  background:linear-gradient(135deg,var(--pink),var(--purple));
}

/* =========================
   MAIN
========================= */

main{
  width:100%;
  max-width:1500px;

  margin:auto;

  padding:16px 16px 105px;
}

/* =========================
   NETFLIX STYLE HERO
========================= */

.hero{
  position:relative;

  min-height:clamp(430px,62vh,650px);

  overflow:hidden;

  display:flex;
  align-items:flex-end;

  padding:clamp(25px,5vw,65px);

  border-radius:18px;

  border:1px solid rgba(255,22,216,.25);

  background:
    radial-gradient(circle at 75% 35%,rgba(25,234,255,.13),transparent 25%),
    radial-gradient(circle at 70% 75%,rgba(255,22,216,.20),transparent 32%),
    linear-gradient(110deg,#090511,#190c2e,#07121e);
}

.hero-poster{
  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  opacity:.45;

  display:none;
}

.hero:before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      90deg,
      rgba(5,3,11,.99),
      rgba(5,3,11,.78) 45%,
      rgba(5,3,11,.15) 80%
    ),
    linear-gradient(
      0deg,
      rgba(5,3,11,.98),
      transparent 55%
    );
}

.hero:after{
  content:"";

  position:absolute;
  inset:0;

  opacity:.08;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(255,255,255,.18) 4px
    );
}

.hero-content{
  position:relative;
  z-index:3;

  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);

  font-size:10px;

  font-weight:900;

  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;

  font-family:Impact,Haettenschweiler,sans-serif;

  font-size:clamp(46px,9vw,95px);

  line-height:.85;

  text-transform:uppercase;

  text-shadow:0 0 20px rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;

  line-height:1.6;

  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;

  gap:10px;

  margin-top:20px;
}

.primary,
.secondary{
  padding:13px 18px;

  border-radius:8px;

  font-weight:900;
}

.primary{
  border:0;

  color:white;

  background:linear-gradient(135deg,var(--pink),var(--purple));

  box-shadow:0 0 18px rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);

  background:rgba(25,234,255,.04);

  border:1px solid rgba(25,234,255,.38);
}

/* =========================
   NETFLIX RAILS
========================= */

.netflix-rail{
  margin:34px 0;
}

.rail-heading{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:13px;
}

.rail-heading h2{
  margin:0;

  font-family:Impact,Haettenschweiler,sans-serif;

  font-size:25px;

  letter-spacing:1px;
}

.rail-heading span{
  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;
}

.rail{
  display:flex;

  gap:13px;

  overflow-x:auto;

  overflow-y:hidden;

  padding:3px 2px 12px;

  scroll-snap-type:x proximity;

  scrollbar-width:none;
}

.rail::-webkit-scrollbar{
  display:none;
}

.rail-card{
  position:relative;

  flex:0 0 145px;

  width:145px;

  overflow:hidden;

  border:0;

  padding:0;

  border-radius:9px;

  background:#11091e;

  color:white;

  text-align:left;

  scroll-snap-align:start;
}

.rail-card:hover{
  box-shadow:
    0 0 20px rgba(255,22,216,.25);

  outline:1px solid rgba(255,22,216,.55);
}

.rail-poster{
  display:block;

  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;

  background:#171027;
}

.rail-gradient{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:45%;

  background:linear-gradient(
    transparent,
    rgba(0,0,0,.95)
  );
}

.rail-info{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:11px;
}

.rail-title{
  font-size:12px;

  font-weight:900;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.rail-meta{
  margin-top:4px;

  color:#c8bacf;

  font-size:9px;
}

.rail-badge{
  position:absolute;

  top:7px;
  left:7px;

  padding:4px 6px;

  border-radius:4px;

  color:#fff;

  background:rgba(255,22,216,.82);

  font-size:7px;

  font-weight:900;

  letter-spacing:1px;
}

@media(min-width:700px){

  .rail-card{
    flex-basis:190px;
    width:190px;
  }

}

/* =========================
   SECTIONS
========================= */

section{
  margin:32px 0;
}

.heading{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:15px;
  padding-bottom:10px;

  border-bottom:1px solid rgba(255,22,216,.18);
}

.heading h2{
  margin:0;

  font-family:Impact,Haettenschweiler,sans-serif;

  font-size:25px;
}

.heading span{
  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;
}

.empty{
  padding:28px 5px;

  color:var(--muted);

  font-size:13px;
}

.notice{
  padding:16px;

  border-radius:9px;

  background:rgba(255,22,216,.045);

  border:1px solid rgba(255,22,216,.17);

  color:#c8bacf;

  line-height:1.6;

  font-size:12px;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:13px;
}

.card{
  padding:0;

  overflow:hidden;

  text-align:left;

  color:white;

  background:linear-gradient(180deg,#170d27,#0d0717);

  border:1px solid rgba(255,255,255,.08);

  border-radius:10px;
}

.card:hover{
  border-color:rgba(255,22,216,.55);

  box-shadow:0 0 18px rgba(255,22,216,.12);
}

.poster{
  display:block;

  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;

  background:#171027;
}

.card-info{
  padding:11px;
}

.card-title{
  font-size:14px;

  font-weight:850;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.card-sub{
  margin-top:5px;

  color:var(--muted);

  font-size:10px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  z-index:500;

  display:none;

  align-items:flex-end;

  background:rgba(0,0,0,.86);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{
  display:flex;
}

.sheet{
  width:100%;

  max-height:95vh;

  overflow:auto;

  padding:
    20px
    18px
    calc(30px + env(safe-area-inset-bottom));

  border-radius:22px 22px 0 0;

  background:
    radial-gradient(
      circle at 50% 0,
      rgba(138,77,255,.18),
      transparent 40%
    ),
    #0c0718;

  border-top:1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;

  font-family:Impact,Haettenschweiler,sans-serif;

  font-size:27px;
}

.close{
  width:40px;
  height:40px;

  border-radius:50%;

  background:#170d27;

  color:var(--cyan);

  border:1px solid rgba(25,234,255,.3);

  font-size:22px;
}

/* =========================
   DETAILS
========================= */

.details{
  display:grid;

  grid-template-columns:105px 1fr;

  gap:16px;
}

.details img{
  width:105px;

  aspect-ratio:2/3;

  object-fit:cover;

  border-radius:8px;
}

.details p{
  color:#c3b5cb;

  line-height:1.55;

  font-size:13px;
}

.meta{
  color:var(--cyan);

  font-size:10px;

  letter-spacing:1px;

  margin-bottom:7px;
}

/* =========================
   SEASONS / EPISODES
========================= */

.season-select{
  width:100%;

  padding:13px;

  margin-top:20px;

  border-radius:8px;

  background:#080510;

  color:white;

  border:1px solid rgba(138,77,255,.4);

  outline:none;
}

.episode-list{
  margin-top:18px;
}

.episode{
  display:flex;

  gap:12px;

  width:100%;

  padding:12px;

  margin-bottom:9px;

  border-radius:9px;

  border:1px solid rgba(255,255,255,.08);

  background:#120a20;

  color:white;

  text-align:left;
}

.episode:hover{
  border-color:var(--cyan);
}

.episode-number{
  width:34px;
  height:34px;

  flex:0 0 34px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:7px;

  color:var(--cyan);

  background:rgba(25,234,255,.08);

  font-weight:900;
}

.episode-title{
  font-weight:900;

  font-size:12px;
}

.episode-desc{
  margin-top:4px;

  color:#8f8298;

  font-size:10px;

  line-height:1.4;
}

/* =========================
   SOURCES
========================= */

.source{
  width:100%;

  margin-top:9px;

  padding:14px;

  text-align:left;

  color:white;

  border-radius:9px;

  background:linear-gradient(100deg,#150c29,#0d0819);

  border:1px solid rgba(25,234,255,.15);
}

.source:hover{
  border-color:var(--cyan);

  box-shadow:0 0 16px rgba(25,234,255,.14);
}

.source:disabled{
  opacity:.45;

  cursor:not-allowed;
}

.source-top{
  display:flex;

  align-items:center;

  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:var(--cyan);

  background:rgba(25,234,255,.08);
}

.source-name{
  font-weight:900;
}

.provider{
  margin-top:4px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:1px;

  text-transform:uppercase;
}

.badges{
  margin-top:8px;
}

.badge{
  display:inline-block;

  padding:4px 7px;

  margin-right:5px;

  border-radius:5px;

  background:rgba(255,22,216,.10);

  color:#ff7be4;

  font-size:8px;

  font-weight:900;

  letter-spacing:.7px;
}

.badge.good{
  background:rgba(66,255,176,.10);

  color:var(--green);
}

.badge.warning{
  background:rgba(255,212,90,.10);

  color:var(--yellow);
}

.source-desc{
  margin-top:7px;

  color:#91859b;

  font-size:10px;
}

/* =========================
   PLAYER
========================= */

.player-shell{
  position:relative;

  width:100%;

  overflow:hidden;

  border-radius:12px;

  background:#000;

  border:1px solid rgba(25,234,255,.25);

  box-shadow:0 0 30px rgba(25,234,255,.08);
}

video{
  display:block;

  width:100%;

  height:auto;

  max-height:70vh;

  background:#000;
}

iframe{
  display:block;

  width:100%;
  height:100%;

  border:0;

  background:#000;
}

.iframe-player{
  width:100%;

  aspect-ratio:16/9;

  background:#000;
}

.player-status{
  padding:11px 13px;

  background:#0e0818;

  border-top:1px solid rgba(255,255,255,.07);

  color:#aaa;

  font-size:11px;
}

.player-status.ready{
  color:var(--green);
}

.player-status.error{
  color:var(--red);
}

.player-controls{
  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-top:12px;
}

.player-button{
  padding:10px 13px;

  border-radius:7px;

  color:white;

  background:#170d27;

  border:1px solid rgba(255,255,255,.1);

  font-weight:800;

  font-size:11px;
}

.player-button.primary{
  background:linear-gradient(135deg,var(--pink),var(--purple));

  border:0;
}

/* =========================
   SETTINGS
========================= */

.field{
  margin:18px 0;
}

.field label{
  display:block;

  margin-bottom:8px;

  color:var(--cyan);

  font-size:9px;

  font-weight:900;

  letter-spacing:2px;

  text-transform:uppercase;
}

.field input{
  width:100%;

  padding:13px;

  border-radius:7px;

  background:#080510;

  color:white;

  border:1px solid rgba(138,77,255,.3);

  outline:none;
}

/* =========================
   NAV
========================= */

.nav{
  position:fixed;

  z-index:400;

  left:0;
  right:0;
  bottom:0;

  height:76px;

  padding-bottom:env(safe-area-inset-bottom);

  display:flex;

  align-items:center;

  justify-content:space-around;

  background:rgba(8,5,17,.96);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-top:1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;

  background:none;

  color:#766a80;

  font-size:9px;

  letter-spacing:1px;
}

.nav button span{
  display:block;

  font-size:22px;

  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);

  text-shadow:0 0 10px var(--pink);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  .grid{
    grid-template-columns:
      repeat(5,minmax(0,1fr));
  }

  .details{
    grid-template-columns:190px 1fr;
  }

  .details img{
    width:190px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">SAUVE</div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">

    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">

    <button id="searchButton">
      SEARCH
    </button>

  </div>

</header>


<main id="main">

  <div class="hero" id="hero">

    <img
      id="heroPoster"
      class="hero-poster"
      alt="">

    <div class="hero-content">

      <div class="hero-kicker">
        SAUVE ORIGINAL EXPERIENCE
      </div>

      <h1 id="heroTitle">
        CINEMA<br>
        AFTER DARK
      </h1>

      <p id="heroDescription">
        Your neon-retro home for movies
        and television. Browse your AIO
        metadata catalog, explore titles,
        select seasons and episodes, and
        find available stream sources.
      </p>

      <div class="hero-buttons">

        <button
          class="primary"
          onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button
          class="secondary"
          onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>

    </div>

  </div>


  <div id="homeRails">

    <div class="empty">
      Loading SAUVE…
    </div>

  </div>


  <section id="searchSection" style="display:none">

    <div class="heading">

      <h2>SEARCH</h2>

      <span id="searchLabel">
        RESULTS
      </span>

    </div>

    <div id="searchResults"></div>

  </section>

</main>


<nav class="nav">

  <button
    class="active"
    onclick="goHome()">

    <span>⌂</span>
    HOME

  </button>

  <button
    onclick="focusSearch()">

    <span>⌕</span>
    SEARCH

  </button>

  <button
    onclick="openSettings()">

    <span>⚙</span>
    SETTINGS

  </button>

</nav>


<div
  class="modal"
  id="modal">

  <div
    class="sheet"
    id="sheet">
  </div>

</div>


<script>

/* ============================================================
   CONFIG
============================================================ */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const state = {

  metadata:
    localStorage.getItem(
      "sauve_metadata"
    ) ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem(
      "sauve_stream"
    ) ||
    ""

};

let currentStreams = [];

let currentPlayableStreams = [];

let currentPlayerIndex = 0;

let currentTitleType = "";

let currentTitleId = "";

let currentSeriesMeta = null;


/* ============================================================
   HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value=""){

  return String(value)
    .replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[c])
    );

}

function normalizeManifest(url){

  return String(url || "")
    .trim()
    .replace(
      /\/manifest\.json\/?$/i,
      ""
    );

}

function addonRoot(url){

  return normalizeManifest(url) + "/";
}

async function fetchJSON(url){

  const response =
    await fetch(
      url,
      {
        method:"GET",
        headers:{
          Accept:"application/json"
        },
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " + response.status
    );

  }

  return response.json();

}


/* ============================================================
   METADATA
============================================================ */

async function getManifest(){

  return fetchJSON(
    state.metadata
  );

}

function supportsExtra(
  catalog,
  name
){

  return Array.isArray(
    catalog.extra
  ) &&
  catalog.extra.some(
    extra =>
      typeof extra === "string"
        ? extra === name
        : extra &&
          extra.name === name
  );

}

function getSearchCatalogs(
  manifest
){

  const catalogs =
    Array.isArray(
      manifest.catalogs
    )
      ? manifest.catalogs
      : [];

  return catalogs.filter(
    catalog =>
      catalog &&
      catalog.id &&
      catalog.type &&
      supportsExtra(
        catalog,
        "search"
      )
  );

}

function makeExtraProps(
  values
){

  return Object.entries(
    values
  )
  .filter(
    ([,value]) =>
      value !== undefined &&
      value !== null &&
      String(value).length
  )
  .map(
    ([key,value]) =>
      key +
      "=" +
      encodeURIComponent(
        String(value)
      )
  )
  .join("&");

}

function buildCatalogURL(
  catalog,
  extra={}
){

  let url =
    addonRoot(
      state.metadata
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );

  const props =
    makeExtraProps(
      extra
    );

  if(props){

    url += "/" + props;

  }

  return url + ".json";

}

async function loadHome(){

  const rails =
    $("homeRails");

  try{

    const manifest =
      await getManifest();

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    const movies =
      catalogs.filter(
        c =>
          c &&
          c.type === "movie"
      );

    const series =
      catalogs.filter(
        c =>
          c &&
          c.type === "series"
      );

    const selected = [];

    if(movies[0]){
      selected.push(movies[0]);
    }

    if(series[0]){
      selected.push(series[0]);
    }

    if(!selected.length){

      rails.innerHTML = `
        <div class="notice">
          No movie or television catalogs
          were advertised by your metadata
          addon.
        </div>
      `;

      return;

    }

    const responses =
      await Promise.allSettled(
        selected.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog
              )
            )
        )
      );

    let movieMetas = [];
    let seriesMetas = [];

    responses.forEach(
      (result,index) => {

        if(
          result.status !==
          "fulfilled"
        ){

          return;

        }

        const metas =
          result.value.metas ||
          [];

        if(
          selected[index].type ===
          "movie"
        ){

          movieMetas =
            dedupeMetas(
              metas
            );

        }

        if(
          selected[index].type ===
          "series"
        ){

          seriesMetas =
            dedupeMetas(
              metas
            );

        }

      }
    );

    const all =
      [
        ...movieMetas,
        ...seriesMetas
      ];

    setHero(
      all
    );

    rails.innerHTML = `

      ${renderRail(
        "TRENDING NOW",
        all,
        "TRENDING"
      )}

      ${renderRail(
        "MOVIES",
        movieMetas,
        "FILM"
      )}

      ${renderRail(
        "TELEVISION",
        seriesMetas,
        "SERIES"
      )}

    `;

  }
  catch(error){

    rails.innerHTML = `
      <div class="notice">
        <strong>
          METADATA ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}
      </div>
    `;

  }

}

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();

  if(!query){

    focusSearch();

    return;

  }

  $("searchSection").style.display =
    "block";

  $("homeRails").style.display =
    "none";

  $("searchLabel").textContent =
    query.toUpperCase();

  $("searchResults").innerHTML = `
    <div class="empty">
      Searching…
    </div>
  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  try{

    const manifest =
      await getManifest();

    const catalogs =
      getSearchCatalogs(
        manifest
      );

    if(!catalogs.length){

      throw new Error(
        "No searchable catalogs were advertised by the metadata manifest."
      );

    }

    const responses =
      await Promise.allSettled(
        catalogs.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog,
                {
                  search:query
                }
              )
            )
        )
      );

    const metas = [];

    responses.forEach(
      result => {

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );

    const results =
      dedupeMetas(
        metas
      );

    $("searchResults").innerHTML =
      results.length
        ? renderGrid(results)
        : `
          <div class="notice">
            No results found for
            <strong>
              ${escapeHTML(query)}
            </strong>.
          </div>
        `;

  }
  catch(error){

    $("searchResults").innerHTML = `
      <div class="notice">

        <strong>
          SEARCH FAILED
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>
    `;

  }

}

function dedupeMetas(
  metas
){

  const seen =
    new Set();

  return metas.filter(
    item => {

      const key =
        String(
          item.type || ""
        ) +
        "|" +
        String(
          item.id || ""
        );

      if(
        seen.has(key)
      ){

        return false;

      }

      seen.add(key);

      return true;

    }
  );

}

/* ============================================================
   SERIES SUPPORT
============================================================ */

/*
  This is the important change for TV.

  A series title normally returns:
    meta.videos

  Each video represents an episode and has
  its own ID.

  We therefore request streams using:

  stream/series/<episode-id>.json

  rather than trying to request streams
  using the parent series ID.
*/

function getVideos(
  meta
){

  if(
    !Array.isArray(
      meta.videos
    )
  ){

    return [];

  }

  return meta.videos;

}


function getSeasons(
  videos
){

  const seasons =
    new Map();

  videos.forEach(
    episode => {

      const season =
        Number(
          episode.season ??
          episode.seasonNumber ??
          1
        );

      if(
        !seasons.has(season)
      ){

        seasons.set(
          season,
          []
        );

      }

      seasons
        .get(season)
        .push(
          episode
        );

    }
  );

  return seasons;

}


async function loadSeriesEpisodes(
  meta,
  type,
  id
){

  const container =
    $("seriesControls");

  const videos =
    getVideos(
      meta
    );

  if(!videos.length){

    container.innerHTML = `

      <div class="notice">

        This metadata addon did not return
        episode information for this series.

        <br><br>

        The series itself was found, but
        there are no episode IDs available
        to request stream sources.

      </div>

    `;

    return;

  }

  const seasons =
    getSeasons(
      videos
    );

  const seasonNumbers =
    [...seasons.keys()]
      .sort(
        (a,b) => a-b
      );

  const firstSeason =
    seasonNumbers[0];

  container.innerHTML = `

    <select
      id="seasonSelect"
      class="season-select">

      ${seasonNumbers.map(
        season =>
          `<option value="${season}">
            Season ${season}
          </option>`
      ).join("")}

    </select>

    <div
      id="episodeList"
      class="episode-list">
    </div>

  `;

  $("seasonSelect")
    .addEventListener(
      "change",
      () => {

        renderEpisodes(
          seasons,
          Number(
            $("seasonSelect").value
          )
        );

      }
    );

  renderEpisodes(
    seasons,
    firstSeason
  );

}


function renderEpisodes(
  seasons,
  seasonNumber
){

  const episodes =
    seasons.get(
      seasonNumber
    ) || [];

  episodes.sort(
    (a,b) =>
      Number(
        a.episode ??
        a.number ??
        0
      ) -
      Number(
        b.episode ??
        b.number ??
        0
      )
  );

  $("episodeList").innerHTML = `

    ${episodes.map(
      episode => {

        const episodeId =
          episode.id ||
          episode.videoId ||
          "";

        const number =
          episode.episode ??
          episode.number ??
          "?";

        return `

          <button
            class="episode"
            onclick="
              selectEpisode(
                '${encodeURIComponent(
                  episodeId
                )}'
              )
            ">

            <div class="episode-number">
              ${escapeHTML(number)}
            </div>

            <div>

              <div class="episode-title">

                ${escapeHTML(
                  episode.title ||

async function loadEpisodeSources(
  episodeId
){

  if(!state.stream){

    openSettings();

    return;

  }

  const url =
    buildStreamURL(
      "series",
      episodeId
    );

  const data =
    await fetchJSON(
      url
    );

  currentStreams =
    Array.isArray(
      data.streams
    )
      ? data.streams
      : [];

  currentStreams.sort(
    (a,b) =>
      compatibilityScore(b) -
      compatibilityScore(a)
  );

  currentPlayableStreams =
    currentStreams.filter(
      isPlayableCandidate
    );

  openModal(`

    <div class="sheet-header">

      <h2>

        onclick="closeModal()">

      ${currentPlayableStreams.length}

      detected.

    <div style="margin-top:18px">

/* ============================================================
   STREAM URL
============================================================ */

function buildStreamURL(
  type,
  id
){

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(type) +
    "/" +
    encodeURIComponent(id) +
    ".json"
  );

}


/* ============================================================
   STREAM IDENTIFICATION
============================================================ */

function getStreamURL(
  stream
){

  return String(
    stream?.url ||
    ""
  ).trim();

}

function isNotWebReady(
  stream
){

  return Boolean(
    stream
      ?.behaviorHints
      ?.notWebReady
  );

}

function isPlayerFrame(
  stream
){

  return Boolean(
    stream?.playerFrameUrl
  );

}

function isExternal(
  stream
){

  return Boolean(
    stream?.externalUrl
  );

}

function isHLS(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    type.includes("mpegurl") ||
    type.includes("m3u8") ||
    url.includes(".m3u8")
  );

}

function isMP4(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    type.includes("mp4") ||
    url.includes(".mp4")
  );

}

function isWebM(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    type.includes("webm") ||
    url.includes(".webm")
  );

}

function isPlayableCandidate(
  stream
){

  if(
    isPlayerFrame(stream)
  ){

    return true;

  }

  if(
    isExternal(stream)
  ){

    return false;

  }

  if(
    isHLS(stream) ||
    isMP4(stream) ||
    isWebM(stream)
  ){

    return true;

  }

  return false;

}


/* ============================================================
   PROVIDER
============================================================ */

function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  const providers = [
    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"
  ];

  for(
    const name
    of providers
  ){

    if(
      text.includes(name)
    ){

      return name;

    }

  }

  return "stream source";

}


/* ============================================================
   SCORE
============================================================ */

function compatibilityScore(
  stream
){

  let score = 0;

  if(
    isMP4(stream)
  ){

    score += 80;

  }

  if(
    isHLS(stream)
  ){

    score += 75;

  }

  if(
    isWebM(stream)
  ){

    score += 70;

  }

  if(
    isPlayerFrame(stream)
  ){

    score += 65;

  }

  if(
    isExternal(stream)
  ){

    score -= 100;

  }

  return score;

}


/* ============================================================
   SOURCE UI
============================================================ */

function renderSource(
  stream,
  index
){

  const playable =
    isPlayableCandidate(
      stream
    );

  let format =
    "SOURCE";

  if(
    isMP4(stream)
  ){

    format =
      "MP4";

  }
  else if(
    isHLS(stream)
  ){

    format =
      "HLS";

  }
  else if(
    isWebM(stream)
  ){

    format =
      "WEBM";

  }
  else if(
    isPlayerFrame(stream)
  ){

    format =
      "PLAYER";

  }
  else if(
    isExternal(stream)
  ){

    format =
      "EXTERNAL";

  }

  return `

    <button
      class="source"
      ${
        playable
          ? `onclick="playSource(${index})"`
          : `disabled`
      }>

      <div class="source-top">

        <div class="source-icon">

          ${
            playable
              ? "▶"
              : "×"
          }

        </div>

        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>

          <div class="provider">

            ${escapeHTML(
              providerName(
                stream
              )
            )}

          </div>

        </div>

      </div>

      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : ""}
        ">

          ${format}

        </span>

        ${
          isNotWebReady(stream)

            ?

            `<span class="badge warning">
              NOT WEB READY
            </span>`

            :

            `<span class="badge good">
              WEB READY
            </span>`
        }

        ${
          stream.quality
            ?
            `<span class="badge">
              ${escapeHTML(
                stream.quality
              )}
            </span>`
            :
            ""
        }

      </div>

      <div class="source-desc">

        ${
          isNotWebReady(stream)

            ?

            "Provider marked this source not web-ready. SAUVE will still attempt compatible playback."

            :

          isExternal(stream)

            ?

            "External destination — not a direct media source."

            :

          playable

            ?

            "Tap to attempt playback inside SAUVE."

            :

            "This source does not expose a recognized browser media URL."
        }

      </div>

    </button>

  `;

}


/* ============================================================
   MOVIE SOURCES
============================================================ */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }

  $("sources").innerHTML = `
    <div class="empty">
      Loading stream sources…
    </div>
  `;

  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );

    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];

    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );

    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );

    $("sources").innerHTML = `

      <div class="heading">

        <h2>
          SOURCES
        </h2>

        <span>
          ${currentStreams.length}
        </span>

      </div>

      <div class="notice">

        <strong>
          ${currentPlayableStreams.length}
        </strong>
        compatible source(s) detected.

      </div>

      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    $("sources").innerHTML = `

      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* ============================================================
   PLAY
============================================================ */

function playSource(
  index
){

  const stream =
    currentStreams[index];

  if(!stream){

    return;

  }

  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );

  if(
    currentPlayerIndex < 0
  ){

    currentPlayerIndex = 0;

  }

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;

  }

  playDirectStream(
    stream
  );

}


function playDirectStream(
  stream
){

  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>

      <div
        id="playerStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

  const video =
    $("sauveVideo");

  const status =
    $("playerStatus");

  const url =
    getStreamURL(
      stream
    );

  if(!url){

    showPlayerError(
      "No direct media URL was returned."
    );

    return;

  }

  video.src =
    url;

  video.addEventListener(
    "loadedmetadata",
    () => {

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {
      once:true
    }
  );

  video.addEventListener(
    "playing",
    () => {

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );

  video.addEventListener(
    "waiting",
    () => {

      status.textContent =
        "Buffering…";

    }
  );

  video.addEventListener(
    "error",
    () => {

      showPlayerError(
        "Safari could not decode or access this source."
      );

    }
  );

  video.load();

}


function openEmbeddedPlayer(
  stream
){

  const url =
    String(
      stream.playerFrameUrl ||
      ""
    ).trim();

  if(!url){

    showPlayerError(
      "No player URL was returned."
    );

    return;

  }

  openModal(`

    <div class="sheet-header">

      <h2>
        ${escapeHTML(
          stream.name ||
          "PLAYER"
        )}
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="player-shell">

      <div class="iframe-player">

        <iframe
          src="${escapeHTML(url)}"
          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "
          allowfullscreen>
        </iframe>

      </div>

      <div
        class="player-status ready">

        Provider player loaded inside SAUVE.

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

}


function showPlayerError(
  message
){

  const status =
    $("playerStatus");

  if(status){

    status.textContent =
      message;

    status.className =
      "player-status error";

  }

}


function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;

  }

  let next =
    currentPlayerIndex + 1;

  if(
    next >=
    currentPlayableStreams.length
  ){

    next = 0;

  }

  currentPlayerIndex =
    next;

  const stream =
    currentPlayableStreams[
      next
    ];

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }

}


function showSourcesAgain(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SOURCES
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    ${
      currentStreams.length

        ?

        currentStreams
          .map(
            renderSource
          )
          .join("")

        :

        `
        <div class="empty">
          No sources available.
        </div>
        `
    }

  `);

}


/* ============================================================
   SETTINGS
============================================================ */

function openSettings(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SAUVE SETTINGS
      </h2>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="field">

      <label>
        AIO Metadata Manifest
      </label>

      <input
        id="metadataURL"
        value="${escapeHTML(
          state.metadata
        )}">

    </div>

    <div class="field">

      <label>
        Stream Manifest
      </label>

      <input
        id="streamURL"
        value="${escapeHTML(
          state.stream
        )}"
        placeholder="Paste your stream manifest">

    </div>

    <div class="notice">

      Your manifest addresses are stored
      locally on this device.

      <br><br>

      SAUVE does not bypass DRM,
      authentication, CORS restrictions,
      or provider playback restrictions.

    </div>

    <br>

    <button
      class="primary"
      onclick="saveSettings()">

      ✓ SAVE SETTINGS

    </button>

  `);

}


function saveSettings(){

  const metadata =
    $("metadataURL")
      .value
      .trim();

  const stream =
    $("streamURL")
      .value
      .trim();

  if(!metadata){

    alert(
      "Enter your metadata manifest."
    );

    return;

  }

  state.metadata =
    metadata;

  state.stream =
    stream;

  localStorage.setItem(
    "sauve_metadata",
    metadata
  );

  localStorage.setItem(
    "sauve_stream",
    stream
  );

  closeModal();

  location.reload();

}


/* ============================================================
   UI
============================================================ */

function focusSearch(){

  $("searchInput")
    .focus();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function goHome(){

  $("searchSection").style.display =
    "none";

  $("homeRails").style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}


function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}


$("modal")
  .addEventListener(
    "click",
    event => {

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );


$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );


$("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* ============================================================
   START
============================================================ */

loadHome();

</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SAUVE Cinema Television</title>

<style>
:root{
  --bg:#05030b;
  --panel:#0d0718;
  --panel2:#150b25;
  --pink:#ff16d8;
  --purple:#8a4dff;
  --cyan:#19eaff;
  --yellow:#ffd45a;
  --green:#42ffb0;
  --red:#ff5577;
  --text:#fff;
  --muted:#9d91a6;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#05030b;
}

body{
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% -10%,rgba(138,77,255,.38),transparent 35%),
    radial-gradient(circle at 0 30%,rgba(255,22,216,.12),transparent 30%),
    radial-gradient(circle at 100% 50%,rgba(25,234,255,.10),transparent 30%),
    #05030b;
}

button,input{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}

header{
  position:sticky;
  top:0;
  z-index:100;
  padding:calc(10px + env(safe-area-inset-top)) 14px 14px;
  background:rgba(5,3,11,.94);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border-bottom:1px solid rgba(255,22,216,.18);
}

.logo{
  text-align:center;
  font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
  font-style:italic;
  font-size:clamp(68px,19vw,120px);
  line-height:.78;
  letter-spacing:7px;
  transform:skewX(-7deg);
  color:white;
  text-shadow:
    0 0 4px white,
    0 0 9px var(--pink),
    0 0 20px var(--pink),
    0 0 45px var(--purple),
    6px 5px 0 rgba(25,234,255,.55);
}

.logo-sub{
  margin-top:14px;
  text-align:center;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 0 10px var(--cyan);
}

.searchbar{
  display:flex;
  gap:8px;
  max-width:900px;
  margin:18px auto 0;
}

.searchbar input{
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:8px;
  background:#0c0715;
  color:white;
  border:1px solid rgba(138,77,255,.45);
  outline:none;
}

.searchbar input:focus{
  border-color:var(--pink);
  box-shadow:0 0 18px rgba(255,22,216,.18);
}

.searchbar button{
  padding:0 18px;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:900;
  background:linear-gradient(135deg,var(--pink),var(--purple));
}

main{
  width:100%;
  max-width:1500px;
  margin:auto;
  padding:16px 16px 110px;
}

.hero{
  position:relative;
  min-height:clamp(400px,58vh,620px);
  overflow:hidden;
  display:flex;
  align-items:flex-end;
  padding:clamp(25px,5vw,60px);
  border-radius:18px;
  border:1px solid rgba(255,22,216,.25);
  background:
    radial-gradient(circle at 75% 30%,rgba(25,234,255,.18),transparent 25%),
    radial-gradient(circle at 75% 75%,rgba(255,22,216,.25),transparent 35%),
    linear-gradient(110deg,#090511,#190c2e,#07121e);
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(5,3,11,.98),rgba(5,3,11,.72) 48%,rgba(5,3,11,.05));
}

.hero:after{
  content:"";
  position:absolute;
  inset:0;
  opacity:.08;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.18) 4px);
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:720px;
}

.hero-kicker{
  color:var(--cyan);
  font-size:10px;
  font-weight:900;
  letter-spacing:3px;
}

.hero h1{
  margin:15px 0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:clamp(46px,9vw,95px);
  line-height:.85;
  text-transform:uppercase;
  text-shadow:0 0 20px rgba(255,22,216,.35);
}

.hero p{
  color:#c7b9ce;
  line-height:1.6;
  font-size:14px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.primary,.secondary{
  padding:13px 18px;
  border-radius:8px;
  font-weight:900;
}

.primary{
  border:0;
  color:white;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  box-shadow:0 0 18px rgba(255,22,216,.25);
}

.secondary{
  color:var(--cyan);
  background:rgba(25,234,255,.04);
  border:1px solid rgba(25,234,255,.38);
}

.catalog-section{
  margin:30px 0 0;
}

.catalog-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:9px;
  border-bottom:1px solid rgba(255,22,216,.15);
}

.catalog-title{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:25px;
  letter-spacing:1px;
}

.catalog-label{
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
}

.row{
  display:flex;
  gap:13px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:3px 1px 12px;
  scroll-snap-type:x proximity;
  scrollbar-width:none;
}

.row::-webkit-scrollbar{display:none}

.poster-card{
  position:relative;
  flex:0 0 145px;
  overflow:hidden;
  border:0;
  padding:0;
  text-align:left;
  color:white;
  background:#10091c;
  border-radius:8px;
  scroll-snap-align:start;
  box-shadow:0 7px 22px rgba(0,0,0,.32);
  transition:transform .18s ease,box-shadow .18s ease;
}

.poster-card:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 12px 30px rgba(255,22,216,.20);
}

.poster-card img{
  display:block;
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  background:#171027;
}

.poster-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:38px 9px 9px;
  background:linear-gradient(transparent,rgba(0,0,0,.94));
}

.poster-name{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.poster-year{
  margin-top:3px;
  color:#bdb0c6;
  font-size:9px;
}

.poster-type{
  position:absolute;
  top:7px;
  left:7px;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,.72);
  color:var(--cyan);
  font-size:7px;
  font-weight:900;
  letter-spacing:1px;
}

.poster-score{
  position:absolute;
  top:7px;
  right:7px;
  padding:4px 6px;
  border-radius:4px;
  background:rgba(0,0,0,.78);
  color:var(--yellow);
  font-size:8px;
  font-weight:900;
}

.poster-badges{
  position:absolute;
  left:7px;
  bottom:42px;
  display:flex;
  gap:4px;
  flex-wrap:wrap;
}

.mini-badge{
  padding:3px 5px;
  border-radius:4px;
  background:rgba(25,234,255,.12);
  color:var(--cyan);
  font-size:6px;
  font-weight:900;
}

.empty{
  padding:28px 5px;
  color:var(--muted);
  font-size:13px;
}

.loading-row{
  display:flex;
  gap:13px;
  overflow:hidden;
}

.loading-card{
  flex:0 0 145px;
  aspect-ratio:2/3;
  border-radius:8px;
  background:linear-gradient(100deg,#10091c 30%,#211333 45%,#10091c 60%);
  background-size:300% 100%;
  animation:shimmer 1.4s infinite;
}

@keyframes shimmer{
  from{background-position:100% 0}
  to{background-position:-100% 0}
}

.notice{
  padding:16px;
  border-radius:9px;
  background:rgba(255,22,216,.045);
  border:1px solid rgba(255,22,216,.17);
  color:#c8bacf;
  line-height:1.6;
  font-size:12px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.modal.open{display:flex}

.sheet{
  width:100%;
  max-height:95vh;
  overflow:auto;
  padding:20px 18px calc(30px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;
  background:
    radial-gradient(circle at 50% 0,rgba(138,77,255,.18),transparent 40%),
    #0c0718;
  border-top:1px solid rgba(255,22,216,.35);
}

.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;
  font-family:Impact,Haettenschweiler,sans-serif;
  font-size:27px;
}

.close{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#170d27;
  color:var(--cyan);
  border:1px solid rgba(25,234,255,.3);
  font-size:22px;
}

.details{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:16px;
}

.details img{
  width:105px;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:8px;
}

.details p{
  color:#c3b5cb;
  line-height:1.55;
  font-size:13px;
}

.meta{
  color:var(--cyan);
  font-size:10px;
  letter-spacing:1px;
  margin-bottom:7px;
}

.source{
  width:100%;
  margin-top:9px;
  padding:14px;
  text-align:left;
  color:white;
  border-radius:9px;
  background:linear-gradient(100deg,#150c29,#0d0819);
  border:1px solid rgba(25,234,255,.15);
}

.source:hover{
  border-color:var(--cyan);
  box-shadow:0 0 16px rgba(25,234,255,.14);
}

.source-top{
  display:flex;
  align-items:center;
  gap:12px;
}

.source-icon{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border-radius:50%;
  color:var(--cyan);
  background:rgba(25,234,255,.08);
}

.source-name{font-weight:900}

.provider{
  margin-top:4px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

.badges{margin-top:8px}

.badge{
  display:inline-block;
  padding:4px 7px;
  margin-right:5px;
  border-radius:5px;
  background:rgba(255,22,216,.10);
  color:#ff7be4;
  font-size:8px;
  font-weight:900;
  letter-spacing:.7px;
}

.badge.good{
  background:rgba(66,255,176,.10);
  color:var(--green);
}

.badge.warning{
  background:rgba(255,212,90,.10);
  color:var(--yellow);
}

.badge.blue{
  background:rgba(25,234,255,.10);
  color:var(--cyan);
}

.source-desc{
  margin-top:7px;
  color:#91859b;
  font-size:10px;
}

.player-shell{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:12px;
  background:#000;
  border:1px solid rgba(25,234,255,.25);
  box-shadow:0 0 30px rgba(25,234,255,.08);
}

video{
  display:block;
  width:100%;
  max-height:70vh;
  background:#000;
}

.iframe-player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

iframe{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

.player-status{
  padding:11px 13px;
  background:#0e0818;
  border-top:1px solid rgba(255,255,255,.07);
  color:#aaa;
  font-size:11px;
}

.player-status.ready{color:var(--green)}
.player-status.error{color:var(--red)}

.player-controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.player-button{
  padding:10px 13px;
  border-radius:7px;
  color:white;
  background:#170d27;
  border:1px solid rgba(255,255,255,.1);
  font-weight:800;
  font-size:11px;
}

.player-button.primary{
  background:linear-gradient(135deg,var(--pink),var(--purple));
  border:0;
}

.field{margin:18px 0}

.field label{
  display:block;
  margin-bottom:8px;
  color:var(--cyan);
  font-size:9px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.field input{
  width:100%;
  padding:13px;
  border-radius:7px;
  background:#080510;
  color:white;
  border:1px solid rgba(138,77,255,.3);
  outline:none;
}

.field textarea{
  width:100%;
  min-height:100px;
  padding:13px;
  border-radius:7px;
  resize:vertical;
  background:#080510;
  color:white;
  border:1px solid rgba(138,77,255,.3);
  outline:none;
}

.settings-list{
  margin-top:10px;
}

.saved-list{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  background:#120a20;
  border:1px solid rgba(255,22,216,.13);
}

.saved-list-name{
  min-width:0;
  font-size:11px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.saved-list-url{
  margin-top:3px;
  color:#7d7187;
  font-size:8px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.delete-list{
  flex:none;
  width:32px;
  height:32px;
  border:1px solid rgba(255,85,119,.25);
  background:rgba(255,85,119,.07);
  color:var(--red);
  border-radius:7px;
}

.nav{
  position:fixed;
  z-index:400;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(8,5,17,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,22,216,.18);
}

.nav button{
  border:0;
  background:none;
  color:#766a80;
  font-size:9px;
  letter-spacing:1px;
}

.nav button span{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

.nav button.active{
  color:var(--pink);
  text-shadow:0 0 10px var(--pink);
}

.section-error{
  margin-top:10px;
  padding:12px;
  border-radius:8px;
  background:rgba(255,85,119,.06);
  border:1px solid rgba(255,85,119,.16);
  color:#caaeb8;
  font-size:10px;
}

@media(min-width:700px){
  .poster-card{flex-basis:180px}
  .loading-card{flex-basis:180px}
  .details{grid-template-columns:190px 1fr}
  .details img{width:190px}
  .hero{min-height:580px}
}
</style>
</head>

<body>

<header>
  <div class="logo">SAUVE</div>

  <div class="logo-sub">
    CINEMA • TELEVISION • AFTER DARK
  </div>

  <div class="searchbar">
    <input
      id="searchInput"
      type="search"
      autocomplete="off"
      placeholder="Search movies & television">
    <button id="searchButton">SEARCH</button>
  </div>
</header>

<main id="main">

  <div class="hero">
    <div class="hero-content">

      <div class="hero-kicker">
        WELCOME TO SAUVE
      </div>

      <h1>
        CINEMA<br>
        AFTER DARK
      </h1>

      <p>
        Discover movies and television,
        browse your catalogs and MDBList
        collections, then open a title to
        find its available sources.
      </p>

      <div class="hero-buttons">

        <button class="primary" onclick="focusSearch()">
          ⌕ SEARCH
        </button>

        <button class="secondary" onclick="openSettings()">
          ⚙ SETTINGS
        </button>

      </div>
    </div>
  </div>

  <div id="catalogContainer">
    <div class="empty">Loading SAUVE…</div>
  </div>

</main>

<nav class="nav">

  <button class="active" onclick="goHome()">
    <span>⌂</span>
    HOME
  </button>

  <button onclick="focusSearch()">
    <span>⌕</span>
    SEARCH
  </button>

  <button onclick="openSettings()">
    <span>⚙</span>
    SETTINGS
  </button>

</nav>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>

/* ============================================================
   SAUVE CONFIG
============================================================ */

const DEFAULT_METADATA =
"https://aiometadatafortheweebs.midnightignite.me/stremio/af628b15-a8b0-4c65-bf0c-f8e1e502f96f/manifest.json";

const state = {

  metadata:
    localStorage.getItem("sauve_metadata") ||
    DEFAULT_METADATA,

  stream:
    localStorage.getItem("sauve_stream") ||
    "",

  mdblistKey:
    localStorage.getItem("sauve_mdblist_key") ||
    "",

  mdblistLists:
    loadMDBLists()

};

let currentStreams = [];
let currentPlayableStreams = [];
let currentPlayerIndex = 0;


/* ============================================================
   BASIC HELPERS
============================================================ */

function $(id){
  return document.getElementById(id);
}

function escapeHTML(value=""){
  return String(value)
    .replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));
}

function safeURL(value=""){
  try{
    const u = new URL(String(value));
    if(
      u.protocol === "http:" ||
      u.protocol === "https:"
    ){
      return u.href;
    }
  }catch(e){}
  return "";
}

function normalizeManifest(url){
  return String(url || "")
    .trim()
    .replace(/\/manifest\.json\/?$/i,"");
}

function addonRoot(url){
  return normalizeManifest(url) + "/";
}

async function fetchJSON(url,options={}){
  const response =
    await fetch(url,{
      method:"GET",
      headers:{
        Accept:"application/json",
        ...(options.headers || {})
      },
      cache:"no-store"
    });

  if(!response.ok){
    throw new Error(
      "HTTP " + response.status
    );
  }

  return response.json();
}


/* ============================================================
   MDBLIST STORAGE
============================================================ */

function loadMDBLists(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          "sauve_mdblist_lists"
        ) || "[]"
      );

    return Array.isArray(saved)
      ? saved
      : [];

  }catch(e){

    return [];

  }

}

function saveMDBLists(){

  localStorage.setItem(
    "sauve_mdblist_lists",
    JSON.stringify(
      state.mdblistLists
    )
  );

}


/* ============================================================
   MDBLIST URL PARSING
============================================================ */

function normalizeMDBListURL(url){

  let value =
    String(url || "")
      .trim();

  if(!value){
    return "";
  }

  if(
    !/^https?:\/\//i.test(value)
  ){

    value =
      "https://" +
      value;

  }

  try{

    const parsed =
      new URL(value);

    if(
      !parsed.hostname
        .toLowerCase()
        .includes("mdblist.com")
    ){

      return "";

    }

    parsed.hash = "";

    /*
      Remove API/json suffixes so the
      same list can be identified cleanly.
    */

    parsed.pathname =
      parsed.pathname
        .replace(
          /\/json\/?$/i,
          ""
        )
        .replace(
          /\/+$/,""
        );

    return parsed.href;

  }catch(e){

    return "";

  }

}


function parseMDBListPath(url){

  try{

    const parsed =
      new URL(
        normalizeMDBListURL(url)
      );

    const parts =
      parsed.pathname
        .split("/")
        .filter(Boolean);

    const index =
      parts.indexOf("lists");

    if(index < 0){
      return null;
    }

    const after =
      parts.slice(index + 1);

    if(!after.length){
      return null;
    }

    /*
      Supported:

      /lists/username/listname
      /lists/official/...
      /lists/share/...
    */

    return {
      parts:after,
      username:
        after.length >= 2
          ? after[0]
          : "",
      slug:
        after.length >= 2
          ? after.slice(1).join("/")
          : after[0]
    };

  }catch(e){

    return null;

  }

}


/* ============================================================
   MDBLIST API HELPERS
============================================================ */

function mdblistHeaders(){

  if(!state.mdblistKey){
    return {};
  }

  return {
    Authorization:
      "Bearer " +
      state.mdblistKey
  };

}

function mdblistQuery(extra={}){

  const params =
    new URLSearchParams();

  Object.entries(extra)
    .forEach(
      ([key,value])=>{

        if(
          value !== undefined &&
          value !== null &&
          String(value).length
        ){

          params.set(
            key,
            value
          );

        }

      }
    );

  /*
    MDBList still supports API key
    authentication. We put it in the
    query only when the user has chosen
    to save one locally.
  */

  if(state.mdblistKey){
    params.set(
      "apikey",
      state.mdblistKey
    );
  }

  const text =
    params.toString();

  return text
    ? "?" + text
    : "";

}


/*
  Attempt several current/public MDBList
  routes. This makes the list loader
  resilient to whether the supplied URL
  represents a user list, official list,
  or shared list.
*/

async function fetchMDBListItems(
  listURL
){

  const parsed =
    parseMDBListPath(
      listURL
    );

  if(!parsed){
    throw new Error(
      "That does not look like a valid MDBList list URL."
    );
  }

  const encodedParts =
    parsed.parts
      .map(
        encodeURIComponent
      );

  const candidates = [];

  /*
    Direct list URL JSON.

    MDBList lists have historically
    exposed JSON forms and these are useful
    as a fallback.
  */

  candidates.push(
    normalizeMDBListURL(
      listURL
    ) + "/json" +
    mdblistQuery({
      limit:100
    })
  );

  /*
    API list routes.

    The current MDBList API uses list
    item endpoints and cursor pagination.
  */

  if(
    parsed.parts[0] === "official"
  ){

    const officialSlug =
      parsed.parts
        .slice(1)
        .join("/");

    candidates.push(
      "https://api.mdblist.com/lists/official/" +
      officialSlug +
      "/items" +
      mdblistQuery({
        limit:100
      })
    );

    candidates.push(
      "https://api.mdblist.com/lists/official/" +
      officialSlug +
      mdblistQuery({
        limit:100
      })
    );

  }
  else if(
    parsed.parts[0] === "share"
  ){

    const token =
      parsed.parts
        .slice(1)
        .join("/");

    candidates.push(
      "https://api.mdblist.com/lists/share/" +
      token +
      "/items" +
      mdblistQuery({
        limit:100
      })
    );

    candidates.push(
      "https://api.mdblist.com/lists/share/" +
      token +
      mdblistQuery({
        limit:100
      })
    );

  }
  else if(
    parsed.username &&
    parsed.slug
  ){

    /*
      Some MDBList API versions resolve
      the user list through the list URL.
    */

    candidates.push(
      "https://api.mdblist.com/lists/user/" +
      encodeURIComponent(
        parsed.username
      ) +
      "/" +
      parsed.slug +
      "/items" +
      mdblistQuery({
        limit:100
      })
    );

    candidates.push(
      "https://api.mdblist.com/lists/user/" +
      encodeURIComponent(
        parsed.username
      ) +
      "/" +
      parsed.slug +
      mdblistQuery({
        limit:100
      })
    );

    /*
      User API lookup can return the
      user's lists and lets us resolve the
      numeric list ID if available.
    */

    candidates.push(
      "https://api.mdblist.com/lists/user" +
      mdblistQuery()
    );

  }

  let lastError =
    "MDBList did not return data.";

  for(
    const candidate
    of candidates
  ){

    try{

      const data =
        await fetchJSON(
          candidate,
          {
            headers:
              mdblistHeaders()
          }
        );

      const normalized =
        normalizeMDBResponse(
          data
        );

      if(
        normalized.items.length
      ){

        return {
          ...normalized,
          requestURL:candidate
        };

      }

      /*
        A valid empty response is still
        useful, but continue trying other
        representations before giving up.
      */

    }catch(error){

      lastError =
        error.message ||
        lastError;

    }

  }

  throw new Error(
    lastError +
    " Try opening the MDBList URL in MDBList first and make sure the list is public or that your API key has access."
  );

}


/* ============================================================
   NORMALIZE MDBLIST RESPONSES
============================================================ */

function normalizeMDBResponse(
  data
){

  let items = [];
  let title = "";
  let mediaType = "";

  if(
    Array.isArray(data)
  ){

    items =
      data;

  }
  else if(
    data &&
    Array.isArray(
      data.items
    )
  ){

    items =
      data.items;

  }
  else if(
    data &&
    Array.isArray(
      data.results
    )
  ){

    items =
      data.results;

  }
  else if(
    data &&
    Array.isArray(
      data.metas
    )
  ){

    items =
      data.metas;

  }
  else if(
    data &&
    data.data &&
    Array.isArray(
      data.data
    )
  ){

    items =
      data.data;

  }
  else if(
    data &&
    data.list &&
    Array.isArray(
      data.list.items
    )
  ){

    items =
      data.list.items;

  }
  else if(
    data &&
    data.list &&
    Array.isArray(
      data.list.results
    )
  ){

    items =
      data.list.results;

  }

  if(data){

    title =
      data.name ||
      data.title ||
      data.list?.name ||
      data.list?.title ||
      "";

    mediaType =
      data.mediatype ||
      data.media_type ||
      data.type ||
      data.list?.mediatype ||
      "";

  }

  return {
    title,
    mediaType,
    items:
      items
        .map(
          normalizeMDBItem
        )
        .filter(
          item =>
            item.id ||
            item.name
        )
  };

}


/* ============================================================
   MDB ITEM NORMALIZATION
============================================================ */

function normalizeMDBItem(
  item
){

  const obj =
    item || {};

  const nested =
    obj.movie ||
    obj.show ||
    obj.meta ||
    obj.media ||
    obj.title_data ||
    {};

  const combined =
    {
      ...nested,
      ...obj
    };

  const ids =
    combined.ids ||
    combined.id ||
    {};

  let type =
    combined.type ||
    combined.mediatype ||
    combined.media_type ||
    "";

  type =
    String(type)
      .toLowerCase();

  if(
    type === "series" ||
    type === "tv" ||
    type === "show"
  ){

    type =
      "series";

  }
  else if(
    type === "movie"
  ){

    type =
      "movie";

  }

  const imdb =
    combined.imdb_id ||
    combined.imdb ||
    ids.imdb ||
    "";

  const tmdb =
    combined.tmdb_id ||
    combined.tmdb ||
    ids.tmdb ||
    "";

  const tvdb =
    combined.tvdb_id ||
    combined.tvdb ||
    ids.tvdb ||
    "";

  const id =
    combined.id ||
    (
      imdb
        ? imdb
        : tmdb
          ? "tmdb:" + tmdb
          : tvdb
            ? "tvdb:" + tvdb
            : ""
    );

  let poster =
    combined.poster ||
    combined.poster_url ||
    combined.image ||
    combined.poster_path ||
    combined.images?.poster ||
    "";

  /*
    Convert a TMDb poster path into a
    usable public image URL when MDBList
    supplies only /abc123.jpg.
  */

  if(
    poster &&
    String(poster).startsWith("/")
  ){

    poster =
      "https://image.tmdb.org/t/p/w500" +
      poster;

  }

  const name =
    combined.title ||
    combined.name ||
    combined.original_title ||
    combined.original_name ||
    "Untitled";

  const release =
    combined.release_date ||
    combined.first_air_date ||
    combined.released ||
    combined.releaseInfo ||
    "";

  const year =
    String(
      release || ""
    ).slice(0,4);

  const score =
    combined.score ??
    combined.imdb_rating ??
    combined.rating ??
    combined.tmdb_rating ??
    "";

  return {

    id:String(id || ""),

    type:
      type ||
      inferMediaType(
        combined
      ),

    name:String(name),

    poster:String(poster || ""),

    year,

    score,

    imdb,

    tmdb,

    tvdb,

    description:
      combined.description ||
      combined.overview ||
      "",

    raw:combined

  };

}


function inferMediaType(
  item
){

  const value =
    String(
      item.mediatype ||
      item.media_type ||
      ""
    ).toLowerCase();

  if(
    value.includes("show") ||
    value.includes("tv") ||
    value.includes("series")
  ){

    return "series";

  }

  return "movie";

}


/* ============================================================
   POSTER FALLBACK
============================================================ */

function posterFallback(
  item
){

  /*
    If MDBList didn't return artwork,
    try TMDb's public image path if the
    item itself contains one.
  */

  if(item.poster){
    return item.poster;
  }

  const raw =
    item.raw || {};

  const path =
    raw.poster_path ||
    raw.images?.poster_path ||
    "";

  if(path){

    return (
      "https://image.tmdb.org/t/p/w500" +
      path
    );

  }

  return "";

}

        )}

  }

}


/* ============================================================
   MDB POSTER
============================================================ */

function renderMDBPoster(
  item
){

  const type =
    item.type ||
    "movie";

  const id =
    item.id ||
    item.imdb ||
    item.tmdb ||
    "";

  const encodedType =
    encodeURIComponent(
      type
    );

  const encodedID =
    encodeURIComponent(
      id
    );

  const poster =
    posterFallback(
      item
    );

  const score =
    item.score !== "" &&
    item.score !== null &&
    item.score !== undefined
      ? Number(item.score)
          ? Number(item.score)
              .toFixed(1)
          : String(item.score)
      : "";

  const typeLabel =
    type === "series"
      ? "TV"
      : "MOVIE";

  return `

    <button
      class="poster-card"
      onclick="openMDBTitle(
        '${encodedType}',
        '${encodedID}',
        '${encodeURIComponent(
          item.name
        )}',
        '${encodeURIComponent(
          poster
        )}',
        '${encodeURIComponent(
          item.year || ""
        )}',
        '${encodeURIComponent(
          item.description || ""
        )}'
      )">

      ${
        poster

          ?

          `
            <img
              src="${escapeHTML(
                safeURL(
                  poster
                )
              )}"
              loading="lazy"
              alt="${escapeHTML(
                item.name
              )}"
              onerror="
                this.style.opacity='.18'
              ">
          `

          :

          `
            <div
              style="
                width:100%;
                aspect-ratio:2/3;
                display:flex;
                align-items:center;
                justify-content:center;
                background:
                  radial-gradient(
                    circle,
                    #28143b,
                    #0c0715
                  );
                color:#75647d;
                font-size:10px;
                font-weight:900;
                text-align:center;
                padding:12px;
              ">

              ${escapeHTML(
                item.name
              )}

            </div>
          `
      }

      <div class="poster-type">
        ${typeLabel}
      </div>

      ${
        score

          ?

          `
            <div class="poster-score">
              ★ ${escapeHTML(
                score
              )}
            </div>
          `

          :

          ""
      }

      <div class="poster-overlay">

        <div class="poster-name">
          ${escapeHTML(
            item.name
          )}
        </div>

        <div class="poster-year">
          ${escapeHTML(
            item.year || ""
          )}
        </div>

      </div>

    </button>

  `;

}


/* ============================================================
   MDB TITLE -> EXISTING SOURCE SYSTEM
============================================================ */

function openMDBTitle(
  encodedType,
  encodedID,
  encodedName,
  encodedPoster,
  encodedYear,
  encodedDescription
){

  const type =
    decodeURIComponent(
      encodedType
    );

  const id =
    decodeURIComponent(
      encodedID
    );

  const name =
    decodeURIComponent(
      encodedName
    );

  const poster =
    decodeURIComponent(
      encodedPoster
    );

  const year =
    decodeURIComponent(
      encodedYear
    );

  const description =
    decodeURIComponent(
      encodedDescription
    );

  /*
    MDBList commonly gives us an IMDb
    ID. Your existing stream addon can
    generally consume that ID directly.
  */

  openTitleDirect(
    type,
    id,
    {
      name,
      poster,
      year,
      description
    }
  );

}

}


/* ============================================================
   STANDARD CATALOG SYSTEM
============================================================ */

function supportsSearch(catalog){

  if(
    !Array.isArray(
      catalog.extra
    )
  ){

    return false;

  }

  return catalog.extra.some(
    extra =>
      typeof extra === "string"
        ? extra === "search"
        : extra &&
          extra.name === "search"
  );

}

function makeExtraProps(values){

  return Object.entries(values)
    .filter(
      ([,value]) =>
        value !== undefined &&
        value !== null &&
        String(value).length
    )
    .map(
      ([key,value]) =>
        key +
        "=" +
        encodeURIComponent(
          String(value)
        )
    )
    .join("&");

}

function buildCatalogURL(
  catalog,
  extra={}
){

  let url =
    addonRoot(
      state.metadata
    ) +
    "catalog/" +
    encodeURIComponent(
      catalog.type
    ) +
    "/" +
    encodeURIComponent(
      catalog.id
    );

  const props =
    makeExtraProps(extra);

  if(props){
    url += "/" + props;
  }

  return url + ".json";

}

function prettyCatalogName(
  catalog
){

  const raw =
    String(
      catalog.name ||
      catalog.id ||
      "CATALOG"
    );

  const lower =
    raw.toLowerCase();

  const mappings = [
    ["netflix","NETFLIX"],
    ["disney+","DISNEY+"],
    ["disney","DISNEY+"],
    ["apple tv","APPLE TV+"],
    ["apple","APPLE TV+"],
    ["hbo","HBO"],
    ["max","MAX"],
    ["hulu","HULU"],
    ["prime","PRIME VIDEO"],
    ["amazon","PRIME VIDEO"],
    ["paramount","PARAMOUNT+"],
    ["peacock","PEACOCK"],
    ["marvel","MARVEL"],
    ["dc","DC"],
    ["popular","POPULAR"],
    ["trending","TRENDING"],
    ["featured","FEATURED"],
    ["top","TOP PICKS"],
    ["new","NEW RELEASES"]
  ];

  for(
    const [needle,label]
    of mappings
  ){

    if(
      lower.includes(
        needle
      )
    ){

      return label;

    }

  }

  return raw.toUpperCase();

}

function catalogPriority(
  catalog
){

  const name =
    String(
      catalog.name ||
      catalog.id ||
      ""
    ).toLowerCase();

  const priority = [
    "featured",
    "trending",
    "popular",
    "netflix",
    "disney",
    "apple",
    "hbo",
    "max",
    "hulu",
    "prime",
    "amazon",
    "paramount",
    "peacock",
    "marvel",
    "dc",
    "top",
    "new"
  ];

  const index =
    priority.findIndex(
      word =>
        name.includes(word)
    );

  return index < 0
    ? 999
    : index;

}

async function loadHome(){

  const container =
    $("catalogContainer");

  container.innerHTML = `

    <section class="catalog-section">

      <div class="catalog-heading">

        <h2 class="catalog-title">
          YOUR CINEMA
        </h2>

        <span class="catalog-label">
          LOADING
        </span>

      </div>

      <div class="loading-row">

        ${Array.from(
          {length:8},
          () =>
            `<div class="loading-card"></div>`
        ).join("")}

      </div>

    </section>

  `;

  /*
    Start MDBList separately.

    This is important:
    if MDBList is slow or unavailable,
    your main metadata catalog is not
    held hostage by it.
  */

  const mdbPromise =
    loadAllMDBLists();

  const metadataPromise =
    loadMetadataCatalogs();

  await Promise.allSettled([
    metadataPromise,
    mdbPromise
  ]);

}


/* ============================================================
   METADATA CATALOGS
============================================================ */

async function loadMetadataCatalogs(){

  const container =
    $("catalogContainer");

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    if(!catalogs.length){

      container.innerHTML = `

        <div class="notice">

          Your metadata addon did not
          advertise any catalogs.

        </div>

      `;

      return;

    }

    const usable =
      catalogs
        .filter(
          catalog =>
            catalog &&
            catalog.id &&
            catalog.type
        )
        .sort(
          (a,b) =>
            catalogPriority(a) -
            catalogPriority(b)
        );

    const selected =
      usable.slice(
        0,
        30
      );

    const results =
      await Promise.allSettled(
        selected.map(
          async catalog => {

            const data =
              await fetchJSON(
                buildCatalogURL(
                  catalog
                )
              );

            return {
              catalog,
              metas:
                Array.isArray(
                  data.metas
                )
                  ? data.metas
                  : []
            };

          }
        )
      );

    let html = "";

    results.forEach(
      result => {

        if(
          result.status !==
          "fulfilled"
        ){
          return;
        }

        const {
          catalog,
          metas
        } =
          result.value;

        if(
          !metas.length
        ){
          return;
        }

        html +=
          renderCatalogRow(
            catalog,
            metas
          );

      }
    );

    /*
      Replace the loading block only
      after metadata is finished.

      MDBList is loaded separately below,
      so its rows can then be appended.
    */

    if(html){

      const old =
        container.querySelector(
          ".loading-row"
        );

      if(old){

        const loadingSection =
          old.closest(
            ".catalog-section"
          );

        if(
          loadingSection
        ){

          loadingSection.remove();

        }

      }

      container.insertAdjacentHTML(
        "afterbegin",
        html
      );

    }
    else{

      const loading =
        container.querySelector(
          ".loading-row"
        );

      if(loading){

        loading
          .closest(
            ".catalog-section"
          )
          ?.remove();

      }

    }

  }
  catch(error){

    const loading =
      container.querySelector(
        ".loading-row"
      );

    if(loading){

      loading
        .closest(
          ".catalog-section"
        )
        ?.remove();

    }

    container.insertAdjacentHTML(
      "afterbegin",
      `

        <div class="notice">

          Metadata catalogs could not be
          loaded.

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `
    );

  }

}


/* ============================================================
   MDBLIST HOME
============================================================ */

async function loadAllMDBLists(){

  if(
    !state.mdblistLists.length
  ){

    return;

  }

  /*
    Load lists one at a time to avoid
    hammering MDBList and to make the UI
    remain responsive.
  */

  for(
    const list

function dedupeMetas(
  metas
){

  const seen =
    new Set();

  return metas.filter(
    item => {

      const key =
        String(
          item.type ||
          ""
        ) +
        "|" +
        String(
          item.id ||
          ""
        );

      if(
        seen.has(key)
      ){

        return false;

      }

      seen.add(key);

      return true;

    }
  );

}

/* ============================================================
   STREAM SYSTEM
============================================================ */

function buildStreamURL(
  type,
  id
){

  return (
    addonRoot(
      state.stream
    ) +
    "stream/" +
    encodeURIComponent(
      type
    ) +
    "/" +
    encodeURIComponent(
      id
    ) +
    ".json"
  );

}

function getStreamURL(
  stream
){

  return String(
    stream?.url ||
    ""
  ).trim();

}

function isPlayerFrame(
  stream
){

  return Boolean(
    stream?.playerFrameUrl
  );

}

function isExternal(
  stream
){

  return Boolean(
    stream?.externalUrl
  );

}

function isNotWebReady(
  stream
){

  return Boolean(
    stream?.behaviorHints
      ?.notWebReady
  );

}

function isHLS(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".m3u8") ||
    type.includes("m3u8") ||
    type.includes("mpegurl")
  );

}

function isMP4(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".mp4") ||
    type.includes("mp4")
  );

}

function isWebM(
  stream
){

  const url =
    getStreamURL(
      stream
    ).toLowerCase();

  const type =
    String(
      stream?.type ||
      ""
    ).toLowerCase();

  return (
    url.includes(".webm") ||
    type.includes("webm")
  );

}

function isPlayableCandidate(
  stream
){

  if(
    isPlayerFrame(stream)
  ){
    return true;
  }

  if(
    isExternal(stream)
  ){
    return false;
  }

  return (
    isMP4(stream) ||
    isHLS(stream) ||
    isWebM(stream)
  );

}

function providerName(
  stream
){

  const text =
    [
      stream.name,
      stream.title,
      stream.description,
      stream.url
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  const providers = [
    "2peckle",
    "vidking",
    "vidfast",
    "vidlink",
    "vidplay",
    "streamwish",
    "filemoon",
    "megacloud"
  ];

  for(
    const name
    of providers
  ){

    if(
      text.includes(name)
    ){

      return name;

    }

  }

  return "stream source";

}

function compatibilityScore(
  stream
){

  let score = 0;

  if(isMP4(stream)) score += 100;
  if(isHLS(stream)) score += 90;
  if(isWebM(stream)) score += 80;
  if(isPlayerFrame(stream)) score += 70;
  if(isExternal(stream)) score -= 100;

  return score;

}


/* ============================================================
   SOURCE BADGES
============================================================ */

function renderSource(
  stream,
  index
){

  const playable =
    isPlayableCandidate(
      stream
    );

  let format =
    "SOURCE";

  if(isMP4(stream)){
    format="MP4";
  }
  else if(isHLS(stream)){
    format="HLS";
  }
  else if(isWebM(stream)){
    format="WEBM";
  }
  else if(isPlayerFrame(stream)){
    format="PLAYER";
  }
  else if(isExternal(stream)){
    format="EXTERNAL";
  }

  return `

    <button
      class="source"
      ${
        playable
          ? `onclick="playSource(${index})"`
          : `onclick="explainSource(${index})"`
      }>

      <div class="source-top">

        <div class="source-icon">
          ${playable ? "▶" : "!"}
        </div>

        <div>

          <div class="source-name">

            ${escapeHTML(
              stream.name ||
              stream.title ||
              "SOURCE"
            )}

          </div>

          <div class="provider">

            ${escapeHTML(
              providerName(
                stream
              )
            )}

          </div>

        </div>

      </div>

      <div class="badges">

        <span class="
          badge
          ${playable ? "good" : "warning"}
        ">

          ${format}

        </span>

        ${
          isNotWebReady(stream)

            ?

            `
              <span class="badge warning">
                NOT WEB READY
              </span>
            `

            :

            `
              <span class="badge good">
                WEB READY
              </span>
            `
        }

        ${
          stream.quality

            ?

            `
              <span class="badge blue">
                ${escapeHTML(
                  stream.quality
                )}
              </span>
            `

            :
            ""
        }

        ${
          stream.resolution

            ?

            `
              <span class="badge blue">
                ${escapeHTML(
                  stream.resolution
                )}
              </span>
            `

            :
            ""
        }

        ${
          stream.behaviorHints?.proxyHeaders
            ?

            `
              <span class="badge blue">
                PROXY
              </span>
            `

            :
            ""
        }

      </div>

      <div class="source-desc">

        ${
          isExternal(stream)

            ?

            "External destination — SAUVE cannot treat this as a direct video file."

            :

          isNotWebReady(stream)

            ?

            "Provider marked this source as not web-ready. SAUVE has not automatically disabled it."

            :

          playable

            ?

            "Tap to attempt playback inside SAUVE."

            :

            "This source does not expose a browser-compatible media URL."
        }

      </div>

    </button>

  `;

}


/* ============================================================
   FIND SOURCES
============================================================ */

async function findSources(
  type,
  id
){

  if(!state.stream){

    openSettings();

    return;

  }

  $("sources").innerHTML = `

    <div class="empty">
      Loading stream sources…
    </div>

  `;

  try{

    const data =
      await fetchJSON(
        buildStreamURL(
          type,
          id
        )
      );

    currentStreams =
      Array.isArray(
        data.streams
      )
        ? data.streams
        : [];

    if(
      !currentStreams.length
    ){

      $("sources").innerHTML = `

        <div class="notice">

          No stream sources were returned
          for this title.

        </div>

      `;

      return;

    }

    currentStreams.sort(
      (a,b) =>
        compatibilityScore(b) -
        compatibilityScore(a)
    );

    currentPlayableStreams =
      currentStreams.filter(
        isPlayableCandidate
      );

    $("sources").innerHTML = `

      <div class="catalog-heading">

        <h2 class="catalog-title">
          SOURCES
        </h2>

        <span class="catalog-label">
          ${currentStreams.length}
        </span>

      </div>

      <div class="notice">

        <strong>
          ${currentPlayableStreams.length}
        </strong>
        potentially compatible source(s).

        <br><br>

        Your original SAUVE badge information
        remains attached to each source.

      </div>

      ${currentStreams
        .map(
          renderSource
        )
        .join("")}

    `;

  }
  catch(error){

    $("sources").innerHTML = `

      <div class="notice">

        <strong>
          STREAM ERROR
        </strong>

        <br><br>

        ${escapeHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* ============================================================
   SOURCE ACTIONS
============================================================ */

function explainSource(
  index
){

  const stream =
    currentStreams[index];

  if(!stream){
    return;
  }

  if(
    isExternal(stream)
  ){

    alert(
      "This source is an external destination rather than a direct media stream."
    );

    return;

  }

  alert(
    "SAUVE could not identify a browser-compatible video URL for this source."
  );

}

function playSource(
  index
){

  const stream =
    currentStreams[index];

  if(!stream){
    return;
  }

  currentPlayerIndex =
    currentPlayableStreams.indexOf(
      stream
    );

  if(
    currentPlayerIndex < 0
  ){
    currentPlayerIndex=0;
  }

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

    return;

  }

  playDirectStream(
    stream
  );

}

function playDirectStream(
  stream
){

  openModal(`

    <div class="sheet-header">

      <h2>
        NOW PLAYING
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div class="player-shell">

      <video
        id="sauveVideo"
        controls
        playsinline
        webkit-playsinline
        preload="metadata">
      </video>

      <div
        id="playerStatus"
        class="player-status">

        Preparing playback…

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        ▶ TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

  const video =
    $("sauveVideo");

  const status =
    $("playerStatus");

  const url =
    getStreamURL(
      stream
    );

  if(!url){

    showPlayerError(
      "No direct media URL was returned."
    );

    return;

  }

  video.src =
    url;

  video.addEventListener(
    "loadedmetadata",
    ()=>{

      status.textContent =
        "Ready — press play";

      status.className =
        "player-status ready";

    },
    {once:true}
  );

  video.addEventListener(
    "playing",
    ()=>{

      status.textContent =
        "Playing";

      status.className =
        "player-status ready";

    }
  );

  video.addEventListener(
    "waiting",
    ()=>{

      status.textContent =
        "Buffering…";

    }
  );

  video.addEventListener(
    "error",
    ()=>{

      showPlayerError(
        "Safari could not decode or access this video source."
      );

    }
  );

  video.load();

}

function openEmbeddedPlayer(
  stream
){

  const url =
    safeURL(
      stream.playerFrameUrl
    );

  if(!url){

    showPlayerError(
      "No player URL was returned."
    );

    return;

  }

  openModal(`

    <div class="sheet-header">

      <h2>
        ${escapeHTML(
          stream.name ||
          "PLAYER"
        )}
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>

    <div class="player-shell">

      <div class="iframe-player">

        <iframe
          src="${escapeHTML(url)}"
          allow="
            autoplay;
            fullscreen;
            picture-in-picture;
            encrypted-media
          "
          allowfullscreen>
        </iframe>

      </div>

      <div class="player-status ready">

        Provider player loaded inside SAUVE.

      </div>

    </div>

    <div class="player-controls">

      <button
        class="player-button primary"
        onclick="tryNextSource()">

        TRY NEXT SOURCE

      </button>

      <button
        class="player-button"
        onclick="showSourcesAgain()">

        SOURCES

      </button>

    </div>

  `);

}

function showPlayerError(
  message
){

  const status =
    $("playerStatus");

  if(status){

    status.textContent =
      message;

    status.className =
      "player-status error";

  }

}

function tryNextSource(){

  if(
    !currentPlayableStreams.length
  ){

    showPlayerError(
      "No compatible sources were detected."
    );

    return;

  }

  let next =
    currentPlayerIndex + 1;

  if(
    next >=
    currentPlayableStreams.length
  ){

    next=0;

  }

  currentPlayerIndex =
    next;

  const stream =
    currentPlayableStreams[
      next
    ];

  if(
    isPlayerFrame(stream)
  ){

    openEmbeddedPlayer(
      stream
    );

  }
  else{

    playDirectStream(
      stream
    );

  }

}

function showSourcesAgain(){

  openModal(`

    <div class="sheet-header">

      <h2>
        SOURCES
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>

    ${
      currentStreams.length

        ?

        currentStreams
          .map(
            renderSource
          )
          .join("")

        :

        `
          <div class="empty">
            No sources available.
          </div>
        `
    }

  `);

}

async function performSearch(){

  const query =
    $("searchInput")
      .value
      .trim();

  if(!query){

    focusSearch();
    return;

  }

  $("main").innerHTML = `

    <div class="hero">

      <div class="hero-content">

        <div class="hero-kicker">
          SAUVE SEARCH
        </div>

        <h1>
          ${escapeHTML(query)}
        </h1>

        <p>
          Searching movies and television…
        </p>

      </div>

    </div>

    <div
      id="searchResults"
      class="empty">

      Searching…

    </div>

  `;

  try{

    const manifest =
      await fetchJSON(
        state.metadata
      );

    const catalogs =
      Array.isArray(
        manifest.catalogs
      )
        ? manifest.catalogs
        : [];

    const searchable =
      catalogs.filter(
        supportsSearch
      );

    if(!searchable.length){

      throw new Error(
        "No searchable catalogs were advertised by the metadata addon."
      );

    }

    const responses =
      await Promise.allSettled(
        searchable.map(
          catalog =>
            fetchJSON(
              buildCatalogURL(
                catalog,
                {
                  search:query
                }
              )
            )
        )
      );

    const metas=[];

    responses.forEach(
      result=>{

        if(
          result.status ===
          "fulfilled"
        ){

          metas.push(
            ...(result.value.metas || [])
          );

        }

      }
    );

    const results =
      dedupeMetas(
        metas
      );

    $("searchResults")
      .outerHTML =

      results.length

        ?

        `

        <section>

          <div class="catalog-heading">

            <h2 class="catalog-title">
              RESULTS
            </h2>

            <span class="catalog-label">
              ${results.length}
            </span>

          </div>

          <div class="row">

            ${results
              .map(
                renderPosterCard
              )
              .join("")}

          </div>

        </section>

        `

        :

        `

        <div class="notice">

          No results found for
          <strong>
            ${escapeHTML(query)}
          </strong>.

        </div>

        `;

  }
  catch(error){

    $("searchResults")
      .outerHTML = `

        <div class="notice">

          <strong>
            SEARCH FAILED
          </strong>

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

  }

}

function addMDBListFromSettings(){

  const input =
    $("mdbListURL");

  if(!input){
    return;
  }

  const url =
    normalizeMDBListURL(
      input.value
    );

  if(!url){

    alert(
      "Enter a valid MDBList URL."
    );

    return;

  }

  const parsed =
    parseMDBListPath(
      url
    );

  let defaultName =
    "MDBList";

  if(parsed){

    if(
      parsed.username &&
      parsed.slug
    ){

      defaultName =
        parsed.slug
          .replace(
            /[-_]+/g,
            " "
          )
          .replace(
            /\b\w/g,
            c =>
              c.toUpperCase()
          );

    }

  }

  const exists =
    state.mdblistLists.some(
      list =>
        list.url === url
    );

  if(exists){

    alert(
      "That MDBList is already added."
    );

    return;

  }

  const name =
    prompt(
      "Name this row:",
      defaultName
    );

  if(name === null){
    return;
  }

  state.mdblistLists.push({
    name:
      name.trim() ||
      defaultName,
    url
  });

  saveMDBLists();

  input.value="";

  renderSavedMDBLists();

}


function renderSavedMDBLists(){

  const box =
    $("savedMDBLists");

  if(!box){
    return;
  }

  if(
    !state.mdblistLists.length
  ){

    box.innerHTML = `

      <div class="empty">

        No MDBList rows added yet.

      </div>

    `;

    return;

  }

  box.innerHTML = `

    <div
      style="
        color:var(--cyan);
        font-size:9px;
        font-weight:900;
        letter-spacing:2px;
        margin-top:20px;
        margin-bottom:8px;
      ">

      YOUR MDBLIST ROWS

    </div>

    ${state.mdblistLists
      .map(
        (list,index)=>`

          <div class="saved-list">

            <div style="min-width:0">

              <div class="saved-list-name">

                ${escapeHTML(
                  list.name
                )}

              </div>

              <div class="saved-list-url">

                ${escapeHTML(
                  list.url
                )}

              </div>

            </div>

            <button
              class="delete-list"
              onclick="deleteMDBList(${index})">

              ×

            </button>

          </div>

        `
      )
      .join("")}

  `;

}


function deleteMDBList(
  index
){

  if(
    index < 0 ||
    index >=
    state.mdblistLists.length
  ){

    return;

  }

  state.mdblistLists.splice(
    index,
    1
  );

  saveMDBLists();

  renderSavedMDBLists();

}


/* ============================================================
   UI
============================================================ */

function focusSearch(){

  $("searchInput")
    .focus();

}

function goHome(){

  location.reload();

}

function openModal(
  html
){

  $("sheet").innerHTML =
    html;

  $("modal")
    .classList
    .add("open");

}

function closeModal(){

  $("modal")
    .classList
    .remove("open");

  $("sheet").innerHTML =
    "";

}

$("modal")
  .addEventListener(
    "click",
    event=>{

      if(
        event.target.id ===
        "modal"
      ){

        closeModal();

      }

    }
  );

$("searchButton")
  .addEventListener(
    "click",
    performSearch
  );

$("searchInput")
  .addEventListener(
    "keydown",
    event=>{

      if(
        event.key ===
        "Enter"
      ){

        performSearch();

      }

    }
  );


/* ============================================================
   START
============================================================ */

loadHome();

</script>
